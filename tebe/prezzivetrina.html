<!DOCTYPE html>
<html lang="it" data-negozio="tebe">
<head>
  <meta charset="UTF-8">
  <script src="../assets/js/negozi.js?v=20261010-52"></script>
  <!-- tema CHIARO / SCURO scelto nella dashboard (colori nella scheda del negozio) -->
  <script src="../assets/js/theme.js?v=20261010-52"></script>
  <link rel="stylesheet" href="../assets/css/chiudi-pagina.css?v=20261010-52">
  <link rel="stylesheet" href="../assets/css/torna-al-menu.css?v=20261010-52">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/font-arial.css?v=20261010-52">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
  <title>Prezzi Vetrina</title>
  <link rel="stylesheet" href="../assets/css/pannello.css?v=20261010-52">
  <script defer src="../assets/js/campi-prezzo.js?v=20261010-52"></script>

  <style>
    /* Font locali da assets/fonts */
    @font-face {
      font-family: 'Nevis';
      src: url('../assets/fonts/Nevis%20Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }

    @font-face {
      font-family: 'Bodoni Std';
      src: url('../assets/fonts/BodoniStd-BoldItalic.otf') format('opentype');
      font-weight: bold;
      font-style: italic;
    }

    :root {
      --bg: var(--interface-page);
      --sidebar: var(--interface-sunken);
      --card: var(--interface-surface);
      --border: var(--interface-border);
      --accent: var(--interface-accent);
      --accent-hover: var(--interface-accent-bright);
      --text: var(--interface-text);
      --text-muted: var(--interface-muted);
      --gold: var(--interface-accent);
      /* Marrone di stampa dei cartellini vetrina (dal layout di riferimento) */
      --print-brown: #4f3c16;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; display: flex; height: 100vh; overflow: auto; }

    /* --- SIDEBAR --- */
    aside { width: 360px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 1.5rem 1rem 8rem; display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
    .brand-title { font-family: 'Cinzel', serif; font-size: 1.05rem; letter-spacing: 3px; color: var(--gold); margin-bottom: 1rem; text-align: center; font-weight: 600; text-transform: uppercase; }

    .tabs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; margin-bottom: 1.2rem; }
    .tab-item { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.2rem; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; cursor: pointer; transition: all 0.2s; }
    .tab-item:hover { border-color: var(--gold); }
    .tab-item.active { border-color: var(--gold); background: rgba(180, 139, 55, 0.15); }
    .tab-item span { font-size: 0.7rem; font-weight: 700; cursor: pointer; color: var(--text); }
    .tab-item input[type="checkbox"] { accent-color: var(--gold); cursor: pointer; }

    .editor-section { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; }
    .editor-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); margin-bottom: 0.8rem; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }

    /* I due riquadri (Modifica Pagina, con le Fasce Prezzo che valgono per tutta la pagina, e Modifica
       Colonna) seguono il pannello standard (../assets/css/pannello.css), come Prezzi Vetrina di Luxury:
       qui solo ciò che è proprio di questa pagina. L'ultimo elemento di un riquadro non aggiunge spazio sotto. */
    .editor-title + .panel-block > .form-group:first-child { margin-top: 1rem; }
    .editor-section > .panel-block:last-child > :last-child { margin-bottom: 0; }
    .editor-section .panel-block + .panel-block { margin-top: 0; }
    #editorPanel { padding-bottom: 1.25rem; }
    .editor-section .btn-print { margin-top: 0.35rem; }


    /* --- PREVIEW MAIN --- */
    main { flex: 1; min-width: 0; padding: 1.5rem; overflow: auto; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; background: var(--border); -webkit-overflow-scrolling: touch; }

    /* Contenitore del foglio (lo zoom della vista telefono sta qui, non sul foglio) */
    .sheet-wrap { position: relative; flex-shrink: 0; margin-top: 12px; }

    /* Foglio A4 verticale: 3 colonne × 8 righe di cartellini da 709 × 354 px a 300 dpi
       (60,03 × 29,97 mm), distanziati di 58 px (4,91 mm), come nel layout di riferimento. */
    .a4-portrait {
      width: 210mm;
      height: 297mm;
      flex-shrink: 0;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: grid;
      grid-template-columns: repeat(3, 60.03mm);
      grid-template-rows: repeat(8, 29.97mm);
      gap: 4.91mm;
      justify-content: center;
      align-content: center;
    }

    /* CARTELLINO: bordo marrone sottile, contenuto allineato in basso a destra */
    .cartellino {
      width: 60.03mm;
      height: 29.97mm;
      border: 0.42mm solid var(--print-brown);
      padding: 1.5mm 1.9mm 1.7mm;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      text-align: right;
      background: #fff;
      color: var(--print-brown);
      overflow: hidden;
    }

    .cartellino.disabled { opacity: 0.15; filter: grayscale(1); }

    /* Prezzo in Nevis Bold: cifre 25,33 pt, simbolo euro 18 pt (0,7106 em) */
    .price {
      font-family: 'Nevis', Arial, sans-serif;
      font-weight: bold;
      font-size: 25.33pt;
      line-height: 1;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
    }

    .price .currency { font-size: 0.7106em; margin-right: 0.06em; }

    /* Testo descrittivo in Bodoni Std Bold Italic 15,19 pt */
    .desc {
      font-family: 'Bodoni Std', serif;
      font-weight: bold;
      font-style: italic;
      font-size: 15.19pt;
      line-height: 1.1;
      margin-top: 0.9mm;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
    }

    /* NAVIGAZIONE */

    @media (max-width: 1100px) {
      .app-close-btn { width: 44px; height: 44px; font-size: 1.4rem; }
      main { align-items: flex-start; }
    }

    /* REGOLA DI STAMPA */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      html, body {
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
      }
      body { background: none; display: block; }
      aside { display: none !important; }
      main {
        padding: 0;
        background: none;
        margin: 0;
        display: block;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
      }
      .a4-portrait {
        box-shadow: none;
        margin: 0;
        page-break-after: avoid;
        page-break-inside: avoid;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .cartellino.disabled { visibility: hidden; opacity: 0; }
      .app-close-btn, .floating-nav-box { display: none !important; }
      .sheet-wrap { margin: 0; }
    }

  </style>

<body data-layout="prezzi">
  <a href="index.html?store=tebe" class="app-close-btn" title="Chiudi">✕</a>

  <div class="floating-nav-box">
    <div class="floating-nav-title">TEBE</div>
    <a href="index.html?store=tebe" class="floating-nav-btn">← Torna al Menu Principale</a>
  </div>

  <aside>
    <div class="brand-title">PREZZI VETRINA</div>

    <div class="editor-section">
      <div class="editor-title">Modifica Pagina</div>

      <!-- Riquadro a parte perché vale per tutta la pagina, non per la colonna in modifica -->
      <div class="panel-block">
        <div class="form-group">
          <div data-fasce-prezzo data-select-id="pricePreset" data-on-change="applyPricePreset"></div>
        </div>
      </div>
    </div>

    <div class="tabs-grid" id="tabs-container"></div>

    <div class="editor-section" id="editorPanel">
      <div class="editor-title" id="editor-header">Modifica Colonna 1</div>

      <!-- Blocco 3: campi della colonna (niente Blocco 1/2: non ci sono selettori né brand in questa pagina) -->
      <div class="panel-block">
        <div class="form-group">
          <label for="inp-price">Prezzo</label>
          <input data-prezzo type="text" id="inp-price" placeholder="30,00" inputmode="decimal" oninput="updateCurrentColumn()">
        </div>

        <div class="form-group">
          <label class="section-label" for="descriptionPreset">Promozioni</label>
          <div class="preset-select">
            <select id="descriptionPreset" onchange="applyDescriptionPreset()" data-testi-pronti="Promozioni" data-testi-senza-gruppi>
              <option value="">-- Seleziona Promozione --</option>
            </select>
          </div>
          <label for="inp-desc">Testo Libero</label>
          <input type="text" id="inp-desc" placeholder="-- Testo Libero --" oninput="updateCurrentColumn()">
        </div>
      </div>

      <!-- Blocco 4: stampa -->
      <div class="panel-block">
        <button type="button" class="btn-print" onclick="printCards()">STAMPA FOGLIO A4</button>
      </div>
    </div>

  </aside>

  <main>
    <div class="sheet-wrap">
      <div class="a4-portrait" id="printable-grid"></div>
    </div>
  </main>

  <script src="../assets/js/fasce-prezzo.js?v=20261010-52"></script>
  <script src="../assets/js/testi-pronti.js?v=20261010-52"></script>
  <script>
    // 24 cartellini in 3 colonne × 8 righe. Si lavora per colonne: gli 8 cartellini di una colonna
    // hanno lo stesso prezzo e testo, e ogni colonna si può escludere dalla stampa.
    // Le Fasce prezzo invece cambiano il prezzo di tutta la pagina.
    const COLUMN_COUNT = 3;
    const ROW_COUNT = 8;
    const columnsData = Array.from({ length: COLUMN_COUNT }, () => ({
      enabled: true,
      price: '30,00',
      desc: 'Special Deal'
    }));

    let currentColumnIdx = 0;

    function init() {
      renderTabs();
      renderGrid();
      loadEditorData();
      // Il ridimensionamento dei testi va rifatto quando i font locali sono caricati.
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(fitAllCards);
      }
    }

    // Linguette delle colonne: il clic seleziona la colonna da modificare, la casella la esclude dalla stampa.
    function renderTabs() {
      const container = document.getElementById('tabs-container');
      container.innerHTML = '';
      columnsData.forEach((column, index) => {
        const item = document.createElement('div');
        item.className = `tab-item ${index === currentColumnIdx ? 'active' : ''}`;
        item.onclick = (e) => {
          if (e.target.type !== 'checkbox') {
            currentColumnIdx = index;
            renderTabs();
            loadEditorData();
          }
        };

        const name = document.createElement('span');
        name.textContent = `Colonna ${index + 1}`;
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = column.enabled;
        checkbox.title = 'Stampa questa colonna';
        checkbox.onchange = () => toggleColumnEnabled(index, checkbox.checked);
        item.append(name, checkbox);
        container.appendChild(item);
      });
    }

    function createElement(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function renderGrid() {
      const grid = document.getElementById('printable-grid');
      grid.innerHTML = '';

      // La griglia si riempie per righe: il cartellino i sta nella colonna i % 3.
      for (let index = 0; index < COLUMN_COUNT * ROW_COUNT; index++) {
        const column = columnsData[index % COLUMN_COUNT];
        const el = createElement('div', `cartellino ${!column.enabled ? 'disabled' : ''}`);

        const price = createElement('div', 'price');
        if (column.price) {
          price.append(createElement('span', 'currency', '€'), createElement('span', 'amount', column.price));
        }

        el.append(price, createElement('div', 'desc', column.desc));
        grid.appendChild(el);
      }

      fitAllCards();
    }

    // Riduce il corpo del testo finché non entra nella larghezza del cartellino.
    function fitText(el, maxPt, minPt) {
      if (!el) return;
      let size = maxPt;
      el.style.fontSize = `${size}pt`;
      while (size > minPt && el.scrollWidth > el.clientWidth + 0.5) {
        size -= 0.5;
        el.style.fontSize = `${size}pt`;
      }
    }

    // Allinea a destra l'inchiostro, non la larghezza del carattere: lo spazio vuoto a destra
    // dell'ultima cifra (Nevis) e la sporgenza del corsivo (Bodoni) vengono compensati,
    // così l'ultimo zero del prezzo cade esattamente sopra l'ultima lettera del testo.
    const measureContext = document.createElement('canvas').getContext('2d');

    function resetInkAlignment(el) {
      if (!el) return;
      el.style.marginRight = '0px';
      el.style.paddingRight = '0px';
    }

    function alignInkRight(el) {
      if (!el) return;
      resetInkAlignment(el);
      const text = el.textContent;
      if (!text) return;
      const style = getComputedStyle(el.lastElementChild || el);
      measureContext.font = `${style.fontStyle} ${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
      const lastChar = text.trimEnd().slice(-1);
      const metrics = measureContext.measureText(lastChar);
      const rightGap = metrics.width - metrics.actualBoundingBoxRight;
      // Spazio vuoto: il riquadro sborda a destra. Sporgenza del corsivo: il riquadro si allarga,
      // così l'inchiostro non viene tagliato dall'overflow nascosto.
      if (rightGap > 0) {
        el.style.marginRight = `${-rightGap}px`;
      } else {
        el.style.paddingRight = `${-rightGap}px`;
      }
    }

    function fitAllCards() {
      document.querySelectorAll('.cartellino').forEach(card => {
        resetInkAlignment(card.querySelector('.price'));
        resetInkAlignment(card.querySelector('.desc'));
        fitText(card.querySelector('.price'), 25.33, 14);
        fitText(card.querySelector('.desc'), 15.19, 8);
        alignInkRight(card.querySelector('.price'));
        alignInkRight(card.querySelector('.desc'));
      });
    }

    function printCards() {
      const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      fontsReady
        .then(() => {
          fitAllCards();
          window.print();
        })
        .catch(error => console.error('Preparazione della stampa fallita.', error));
    }

    function loadEditorData() {
      const column = columnsData[currentColumnIdx];
      document.getElementById('editor-header').textContent = `Modifica Colonna ${currentColumnIdx + 1}`;
      document.getElementById('inp-price').value = column.price;
      document.getElementById('inp-desc').value = column.desc;
    }

    function updateCurrentColumn() {
      const column = columnsData[currentColumnIdx];
      column.price = document.getElementById('inp-price').value;
      column.desc = document.getElementById('inp-desc').value;
      renderGrid();
    }

    // La fascia scelta imposta lo stesso prezzo su tutte le colonne insieme.
    function applyPricePreset() {
      const select = document.getElementById('pricePreset');
      if (!select.value) return;
      columnsData.forEach(column => { column.price = select.value; });
      document.getElementById('inp-price').value = select.value;
      select.value = '';
      renderGrid();
    }

    // Il testo scelto riempie il campo libero, che resta modificabile a mano.
    function applyDescriptionPreset() {
      const preset = document.getElementById('descriptionPreset').value;
      if (preset) {
        document.getElementById('inp-desc').value = preset;
        document.getElementById('descriptionPreset').value = '';
        updateCurrentColumn();
      }
    }

    function toggleColumnEnabled(index, enabled) {
      columnsData[index].enabled = enabled;
      renderGrid();
    }

    init();
  </script>
  <script src="../assets/js/cursore.js?v=20261010-52"></script>
  <script>
    // Cursore: sopra la colonna selezionata (sul suo primo cartellino) quando si sceglie una linguetta,
    // sopra o di lato a prezzo e testo del primo cartellino della colonna quando si usano i campi.
    const firstCardOfColumn = () => document.querySelectorAll('#printable-grid .cartellino')[currentColumnIdx];
    const inFirstCard = selector => () => firstCardOfColumn()?.querySelector(selector);

    Cursore.create({
      panel: 'aside',
      watch: '#printable-grid',
      clip: 'main',
      // ogni triangolo resta nel suo cartellino e non copre prezzo e testo
      scope: target => target?.closest('.cartellino'),
      obstacles: target => target?.closest('.cartellino')?.querySelectorAll('.price, .desc') || [],
      rules: [
        { controls: '.tab-item', target: firstCardOfColumn, placement: 'above', gap: 3.2 * 96 / 25.4 },
        // Fasce prezzo cambia tutte le colonne: un triangolo sopra ciascuna colonna, come per le linguette
        { controls: '#pricePreset', target: () => [...document.querySelectorAll('#printable-grid .cartellino')].slice(0, COLUMN_COUNT), placement: 'above', gap: 3.2 * 96 / 25.4 },
        { controls: '#inp-price', target: inFirstCard('.price') },
        { controls: '#descriptionPreset, #inp-desc', target: inFirstCard('.desc') }
      ]
    }).point({ target: firstCardOfColumn, placement: 'above', gap: 3.2 * 96 / 25.4 });
  </script>
  <script src="../assets/js/strumenti-stampa.js?v=20261010-52" data-panel="#editorPanel" data-sheet="#printable-grid"></script>
  <script defer src="../assets/js/stampa-ios.js?v=20261010-52"></script>
</body>
