  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Sfondo principale UI */
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f6f1;
      padding: 20px;
      display: flex;
      gap: 20px;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    /* Contenitore Pannelli di Sinistra */

    /* Pannelli di Controllo */


    /* SELETTORE MODALITA' */



    /* Pannello che comincia con un selettore: un poco di spazio in più sopra il selettore
       (i margini si sommano a quello del titolo: vale il maggiore) */
    .controls h2 + .mode-switch, .controls h2 + .card-selector { margin-top: 1rem; }

    /* Spazi regolari nel pannello (come Cartelli Semplici): 0,35rem tra etichetta e campo, 0,8rem tra
       un campo e l'etichetta successiva, tra i gruppi, sotto titolo e selettore e prima del tasto di stampa */


    /* Titoli dei menu a discesa e dei campi con frecce: come le altre etichette, nell'oro dei
       pulsanti sotto il pannello */



    .price-range-select {
      position: relative;
    }

    .price-range-control select {
      appearance: none;
      margin-bottom: 0;
      padding-right: 2rem;
      border: none;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .price-range-control select:focus {
      border: none;
      box-shadow: none;
    }

    .price-range-control {
      position: relative;
      border: 1px solid var(--pannello-bordo);
      border-radius: 4px;
      background-color: var(--pannello-campo);
      overflow: hidden;
    }

    .price-range-control:focus-within {
      border-color: var(--pannello-oro);
      box-shadow: 0 0 4px var(--pannello-alone);
    }

    .price-range-control::after {
      content: '▼';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-left: 1px solid var(--pannello-bordo);
      background: var(--pannello-riquadro);
      color: var(--pannello-oro);
      font-size: 0.6rem;
      line-height: 1;
      pointer-events: none;
    }






    .price-inputs-row {
      display: flex;
      gap: 6px;
    }

    .price-inputs-row .form-group { flex: 1; margin-bottom: 0; }

    /* CAMPO PERCENTUALE con frecce sempre visibili */
    .percent-input-wrapper {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--pannello-bordo);
      border-radius: 4px;
      background-color: var(--pannello-campo);
      overflow: hidden;
    }

    .percent-input-wrapper:focus-within {
      border-color: var(--pannello-oro);
      box-shadow: 0 0 4px var(--pannello-alone);
    }

    .percent-input-wrapper input#discountValue {
      flex: 1 1 auto;
      width: auto;
      text-align: left;
      border: none;
      background: transparent;
      padding: 0.45rem 0 0.45rem 0.45rem;
      -moz-appearance: textfield;
    }

    .percent-input-wrapper input#discountValue:focus {
      outline: none;
      box-shadow: none;
    }

    .percent-input-wrapper input#discountValue::-webkit-outer-spin-button,
    .percent-input-wrapper input#discountValue::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .percent-input-wrapper .percent-stepper {
      flex: 0 0 1.6rem;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--pannello-bordo);
      overflow: hidden;
    }

    .percent-input-wrapper .percent-stepper button {
      flex: 1;
      border: none;
      border-bottom: 1px solid var(--pannello-bordo);
      background: var(--pannello-riquadro);
      color: var(--pannello-oro);
      cursor: pointer;
      font-size: 0.6rem;
      line-height: 1;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .percent-input-wrapper .percent-stepper button:last-child { border-bottom: none; }

    .percent-input-wrapper .percent-stepper button:hover {
      background: var(--pannello-riquadro-hover);
      color: var(--pannello-oro-chiaro);
    }

    /* PULSANTE STAMPA */


    /* FOGLIO STAMPA */
    .print-sheet {
      position: relative;
      z-index: 1;
      width: 210mm;
      height: 297mm;
      background: white;
      box-shadow: 0 20px 60px rgba(40,34,28,.18);
      padding: 14.56mm 0 0 0; /* Bordo/distanziatore superiore identico */
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    /* CARTELLO OUTLET — dimensioni 210mm x 118.35mm */
    .card {
      width: 210mm;
      height: 118.35mm;
      border: 0.34mm solid #9d9490;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .card-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3.808mm;
      transform: translateY(-6mm);
    }

    #cardBottom {
      border-bottom: none;
      transform: rotate(180deg);
    }

    .brand-logo-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46mm;
      height: 20mm;
      flex-shrink: 0;
    }

    .brand-logo {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 8mm;
    }

    .price-old {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 400;
      font-size: 35.69pt;
      color: #1a1a1a;
      line-height: 1;
      white-space: nowrap;
      letter-spacing: -0.05em;
      text-decoration-line: line-through;
      text-decoration-color: #cc9e25;
      text-decoration-thickness: 2px;
    }

    .price-percent {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 400;
      font-size: 35.69pt;
      color: #cc9e25;
      line-height: 1;
      white-space: nowrap;
      letter-spacing: -0.05em;
    }

    .desc-text {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 400;
      font-size: 28.55pt;
      color: #1a1a1a;
      line-height: 1;
      white-space: nowrap;
      text-align: center;
      letter-spacing: -0.05em;
    }

    .desc-text.long-text {
      font-size: 23pt;
    }

    .price-final {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 400;
      font-size: 105.8pt;
      color: #1a1a1a;
      line-height: 1;
      white-space: nowrap;
      letter-spacing: -0.05em;
    }

    /* NAVIGAZIONE UI */

    @page {
      size: A4 portrait;
      margin: 0mm !important;
    }

    @media print {
      html, body {
        width: 210mm;
        height: 297mm !important;
        max-height: 297mm !important;
        background: white !important;
        padding: 0 !important;
        margin: 0 !important;
        overflow: hidden !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .sidebar, .app-close-btn, .floating-nav-box { display: none !important; }

      .print-sheet {
        box-shadow: none;
        margin: 0 auto !important;
        padding: 14.56mm 0 0 0 !important; /* Mantenuta la stessa misura anche in stampa */
        width: 210mm;
        height: 297mm !important;
        max-height: 297mm !important;
        page-break-after: avoid !important;
        page-break-before: avoid !important;
        page-break-inside: avoid !important;
        break-after: avoid !important;
        break-before: avoid !important;
        break-inside: avoid !important;
        overflow: hidden !important;
      }

      .brand-logo, .price-percent, .price-old {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }

    @media screen and (max-width: 760px) and (pointer: coarse) {
      body { align-items: center; flex-direction: column; gap: 14px; overflow-x: hidden; padding: 20px 20px 84px; }
      .sidebar { width: 100%; max-width: 560px; order: 1; }
      .app-close-btn { right: 18px; }
      .print-sheet { zoom: 1; margin: 0 auto; order: 3; }
      /* Su schermi stretti il pulsante Made in Italy si stacca dal pannello
         e resta sopra il foglio, incolonnato con il tasto di chiusura. */
      body .made-in-italy-btn {
        position: relative;
        z-index: 5;
        order: 2;
        align-self: flex-end;
        margin: 0 -2px -48px auto;
        right: auto;
        bottom: auto;
        left: auto;
        top: 8px;
        transform: none;
      }
      body .made-in-italy-btn:hover,
      body .made-in-italy-btn.is-active {
        transform: scale(1.06);
      }
    }

    @media screen and (max-width: 760px) and (pointer: coarse) {
      body {
        align-items: center;
        flex-direction: column;
        gap: 12px;
        overflow-x: hidden;
        padding: 12px 12px 24px;
      }

      .sidebar { width: 100%; max-width: 560px; }
      .controls { width: 100%; }
      .form-group input, .form-group select { font-size: 16px; }
      .mode-switch button { min-height: 44px; }
      .print-sheet { zoom: 0.75; margin: 0 auto; }
      body .made-in-italy-btn { margin-right: -4px; }
      .app-close-btn { top: 10px; right: 4px; width: 44px; height: 44px; }
      .floating-nav-box { display: none; }
    }

    @media screen and (max-width: 680px) and (pointer: coarse) { .print-sheet { zoom: 0.64; } }
    @media screen and (max-width: 530px) and (pointer: coarse) { .print-sheet { zoom: 0.53; } }
    @media screen and (max-width: 420px) and (pointer: coarse) { .print-sheet { zoom: 0.40; } }
    @media screen and (max-width: 360px) and (pointer: coarse) { .print-sheet { zoom: 0.34; } }

    @media screen and (max-width: 760px) and (pointer: coarse) {
      .controls { padding: 12px 12px 12px; }
      .controls h1, .controls h2 {
        font-size: 0.95rem;
        padding-bottom: 12px;
        margin-bottom: 0.55rem;
      }
      /* Pannello piu' compatto: su cellulare pannello e foglio devono
         stare in poco piu' di una schermata. */
      .form-group, .preset-select, .mode-switch { margin-bottom: 0.55rem; }
      .form-group label, .section-label {
        font-size: 0.68rem;
        margin-bottom: 0.18rem;
      }
      .form-group input, .form-group select, .preset-select select {
        padding: 6px 8px;
      }
      .mode-switch button, .row-selector button, .card-selector button {
        min-height: 36px;
        padding: 6px;
        font-size: 0.64rem;
      }
      .btn-print { margin-top: 0; padding: 9px; }
      .controls h2 + .mode-switch, .controls h2 + .card-selector { margin-top: 0.7rem; }
    }
  </style>

<body>

  <!-- Pulsanti e Riquadri Navigazione UI -->
  <a href="index.html?store=tebe" class="app-close-btn" title="Chiudi e torna all'index">✕</a>

  <div class="floating-nav-box">
    <div class="floating-nav-title">TEBE</div>
    <a href="index.html?store=tebe" class="floating-nav-btn">
      ← Torna al Menu Principale
    </a>
  </div>

  <div class="sidebar">
    <div class="controls">
      <h2>Cartello Brand</h2>

      <div class="mode-switch">
        <button type="button" class="active" id="modeDoppia" onclick="switchMode('doppia')">Doppia Cifra</button>
        <button type="button" id="modeDescrizione" onclick="switchMode('descrizione')">Descrizione Articolo</button>
      </div>

      <div class="form-group">
        <label class="section-label" for="brandSelect">BRAND</label>
        <div class="preset-select">
          <select id="brandSelect" onchange="updateBrand()">
            <option value="">-- Seleziona Brand --</option>
          </select>
        </div>
      </div>

      <div class="form-group" id="customBrandGroup">
        <label for="customBrandSelect">Loghi personalizzati</label>
        <div class="preset-select">
          <select id="customBrandSelect" onchange="updateCustomBrand()">
            <option value="">-- Seleziona Logo Personalizzato --</option>
          </select>
        </div>
      </div>

      <div id="priceRowGroup">
        <div class="form-group">
          <label>Prezzo Originario</label>
          <input type="text" id="oldPrice" value="59,80" placeholder="es. 59,80" oninput="updateCard()">
        </div>

        <div class="form-group">
          <label class="section-label" for="discountValue">Percentuale Sconto</label>
          <div class="percent-input-wrapper">
            <input type="number" id="discountValue" value="50" min="1" max="99" oninput="updateCard()">
            <div class="percent-stepper">
              <button type="button" aria-label="Aumenta percentuale" onclick="stepDiscount(1)">▲</button>
              <button type="button" aria-label="Diminuisci percentuale" onclick="stepDiscount(-1)">▼</button>
            </div>
          </div>
        </div>
      </div>

      <div class="form-group" id="descGroup" style="display: none;">
        <label class="section-label" for="descPreset">Promozione</label>
        <div class="preset-select">
          <select id="descPreset" onchange="applyDescPreset()" data-testi-pronti="Promozioni" data-testi-senza-gruppi>
            <option value="">-- Seleziona un testo --</option>
          </select>
        </div>
        <label for="descFree">Testo Libero</label>
        <input type="text" id="descFree" value="" placeholder="-- Testo Libero --" oninput="updateCard()">
      </div>

      <div class="form-group price-range-select" id="priceRangeGroup">
        <label class="section-label" for="priceRange">Fasce Prezzo</label>
        <div class="price-range-control">
          <select id="priceRange" onchange="applyPriceRange()" data-fasce-prezzo>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Prezzo Finale</label>
        <input type="text" id="newPrice" value="29,90" placeholder="es. 29,90" oninput="updateCard()">
      </div>

      <button class="btn-print" onclick="printCards()">Stampa Cartello (A4)</button>
    </div>
  </div>

  <!-- AREA STAMPA A4 -->
  <div class="print-sheet" id="printSheet">
    <div class="card" id="cardTop">
      <div class="card-content">
        <div class="brand-logo-box">
          <img class="brand-logo" id="brandLogoTop" alt="Brand selezionato">
        </div>
        <div id="middleRowTop"></div>
        <div class="price-final" id="finalPriceTop">€ 29,90</div>
      </div>
    </div>

    <div class="card" id="cardBottom">
      <div class="card-content">
        <div class="brand-logo-box">
          <img class="brand-logo" id="brandLogoBottom" alt="Brand selezionato">
        </div>
        <div id="middleRowBottom"></div>
        <div class="price-final" id="finalPriceBottom">€ 29,90</div>
      </div>
    </div>
  </div>

  <script src="../assets/js/fasce-prezzo.js?v=20261008-11"></script>
  <script src="../assets/js/testi-pronti.js?v=20261008-11"></script>
  <script src="../assets/js/madeinitaly.js?v=20261008-11" data-automatico></script>
  <script>

    function cleanBrandName(fileName) {
      return fileName.replace(/\.[^.]+$/, '').replace(/([a-z])([A-Z])/g, '$1 $2');
    }

    // Loghi personalizzati: la lista di TEBE gestita da loghi-personalizzati.js (IndexedDB).
    function readCustomLogos() {
      return LoghiPersonalizzati.elenco().filter(logo => logo && logo.id && logo.name && logo.data);
    }

    function loadCustomBrandSelect() {
      const select = document.getElementById('customBrandSelect');
      const customLogos = readCustomLogos();
      customLogos
        .slice()
        .sort((first, second) => first.name.localeCompare(second.name, 'it', { sensitivity: 'base' }))
        .forEach(logo => {
          const option = document.createElement('option');
          option.value = logo.id;
          option.textContent = `★ ${logo.name}`;
          select.appendChild(option);
        });
    }

    function updateCustomBrand() {
      const customLogoId = document.getElementById('customBrandSelect').value;
      const customLogo = readCustomLogos().find(logo => logo.id === customLogoId);
      const brandSelect = document.getElementById('brandSelect');

      if (!customLogo) {
        if (!brandSelect.value) {
          const { priorityFiles, remainingFiles } = getSortedLogoFiles();
          const orderedFiles = [...priorityFiles, ...remainingFiles];
          if (orderedFiles.length > 0) brandSelect.value = orderedFiles[0];
        }
        updateBrand();
        return;
      }

      brandSelect.value = '';
      PrintLogoColors.getBrandLogoSrc(customLogo.data, '', '', 'gold').then(source => {
        updateLogoElements(source, customLogo.name);
      }).catch(error => {
        console.error('Caricamento del logo personalizzato fallito.', error);
      });
    }

    function loadBrandSelect() {
      const select = document.getElementById('brandSelect');
      const { priorityFiles, remainingFiles } = getSortedLogoFiles();
      const orderedFiles = [...priorityFiles, ...remainingFiles];

      orderedFiles.forEach(fileName => {
        appendBrandOption(select, fileName, cleanBrandName(fileName), priorityFiles.includes(fileName));
      });

      if (orderedFiles.length > 0) {
        select.value = orderedFiles[0];
      }
      updateBrand();
    }

    function updateLogoElements(source, brandName) {
      const logoElements = [document.getElementById('brandLogoTop'), document.getElementById('brandLogoBottom')];
      logoElements.forEach(logo => {
        logo.src = source;
        logo.alt = brandName;
      });
    }

    function updateBrand() {
      const fileName = document.getElementById('brandSelect').value;
      document.getElementById('customBrandSelect').value = '';

      if (!fileName) {
        updateLogoElements('', 'Nessun brand selezionato');
        [document.getElementById('brandLogoTop'), document.getElementById('brandLogoBottom')].forEach(logo => {
          logo.removeAttribute('src');
        });
        return;
      }

      PrintLogoColors.getBrandLogoSrc('', fileName, '', 'gold').then(source => {
        updateLogoElements(source, cleanBrandName(fileName));
      }).catch(error => {
        console.error('Caricamento del logo brand fallito.', error);
      });
    }

    function printCards() {
      PrintLogoColors.prepareForPrint('.brand-logo')
        .then(() => window.print())
        .catch(error => console.error('Preparazione della stampa fallita.', error));
    }

    function formatDiscount(value) {
      const numeric = value.toString().replace(/[^0-9]/g, '').trim();
      return '-' + (numeric || '50') + '%';
    }

    function stepDiscount(delta) {
      const input = document.getElementById('discountValue');
      const min = parseInt(input.min, 10);
      const max = parseInt(input.max, 10);
      let val = parseInt(input.value, 10);
      if (isNaN(val)) val = min;
      val = Math.min(max, Math.max(min, val + delta));
      input.value = val;
      updateCard();
    }

    function applyDescPreset() {
      const preset = document.getElementById('descPreset').value;
      document.getElementById('descFree').value = preset;
      updateCard();
    }

    function parsePrice(value) {
      const normalized = value.replace(',', '.').replace(/[^0-9.]/g, '');
      const price = Number.parseFloat(normalized);
      return Number.isFinite(price) ? price : 0;
    }

    function formatPrice(value) {
      return value.toFixed(2).replace('.', ',');
    }

    function applyPriceRange() {
      const selectedPrice = document.getElementById('priceRange').value;
      if (!selectedPrice) {
        updateCard();
        return;
      }

      document.getElementById('newPrice').value = selectedPrice;

      if (document.getElementById('modeDoppia').classList.contains('active')) {
        const discount = Number.parseInt(document.getElementById('discountValue').value, 10) || 50;
        const oldPrice = parsePrice(selectedPrice) / (1 - discount / 100);
        document.getElementById('oldPrice').value = formatPrice(oldPrice);
      }

      updateCard();
    }

    function switchMode(mode) {
      const isDoppia = mode === 'doppia';
      const priceRangeGroup = document.getElementById('priceRangeGroup');
      const priceRowGroup = document.getElementById('priceRowGroup');
      const descGroup = document.getElementById('descGroup');
      document.getElementById('modeDoppia').classList.toggle('active', isDoppia);
      document.getElementById('modeDescrizione').classList.toggle('active', !isDoppia);
      priceRowGroup.style.display = isDoppia ? 'block' : 'none';
      descGroup.style.display = isDoppia ? 'none' : 'block';

      if (isDoppia) {
        priceRowGroup.parentNode.insertBefore(priceRangeGroup, priceRowGroup);
      } else {
        descGroup.parentNode.insertBefore(priceRangeGroup, descGroup.nextElementSibling);
      }

      updateCard();
    }

    function updateCard() {
      const isDoppia = document.getElementById('modeDoppia').classList.contains('active');
      const oldPrice = document.getElementById('oldPrice').value;
      const newPrice = document.getElementById('newPrice').value;
      const discount = formatDiscount(document.getElementById('discountValue').value);
      const descText = document.getElementById('descFree').value || 'Descrizione Articolo';
      const longDescription = [
        'Vera Pelle • Genuine Leather',
        'Made in Italy • Genuine Leather',
        'Fino ad esaurimento scorte'
      ].includes(descText);

      let middleHtml;
      if (isDoppia) {
        middleHtml = `<div class="price-row"><span class="price-old">€ ${oldPrice}</span><span class="price-percent">${discount}</span></div>`;
      } else {
        middleHtml = `<div class="desc-text${longDescription ? ' long-text' : ''}">${descText}</div>`;
      }

      document.getElementById('middleRowTop').innerHTML = middleHtml;
      document.getElementById('middleRowBottom').innerHTML = middleHtml;
      document.getElementById('finalPriceTop').textContent = `€ ${newPrice}`;
      document.getElementById('finalPriceBottom').textContent = `€ ${newPrice}`;
    }

    loadBrandSelect();
    LoghiPersonalizzati.pronto.then(loadCustomBrandSelect);
    switchMode('doppia');
  </script>
