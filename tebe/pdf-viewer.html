<!DOCTYPE html>
<html lang="it" data-negozio="tebe">
<head>
  <meta charset="UTF-8">
  <script src="../assets/js/negozi.js?v=20261010-53"></script>
  <!-- tema CHIARO / SCURO scelto nella dashboard (colori nella scheda del negozio) -->
  <script src="../assets/js/theme.js?v=20261010-53"></script>
  <link rel="stylesheet" href="../assets/css/chiudi-pagina.css?v=20261010-53">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizzatore PDF · TEBE</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: var(--interface-page);
      --card: var(--interface-surface);
      --border: var(--interface-border);
      --accent: var(--interface-accent);
      --accent-hover: var(--interface-accent-bright);
      --text: var(--interface-text);
      --muted: var(--interface-muted);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 68px;
      padding: 0.8rem 1.5rem;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 18px rgba(50,43,36,.06);
    }

    .brand {
      color: var(--accent);
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .document-title {
      position: absolute;
      left: 50%;
      max-width: 45%;
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.4px;
      text-align: center;
      text-overflow: ellipsis;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    .viewer-actions { display: flex; gap: 0.6rem; }
    .viewer-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--accent);
      border-radius: 5px;
      background: var(--accent);
      color: var(--bg);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }

    .viewer-btn:hover { background: var(--accent-hover); color: #fffdfa; transform: translateY(-1px); }

    .pdf-stage {
      flex: 1;
      min-height: 0;
      padding: 1rem;
      background: var(--border);
    }

    #pdf-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #fff;
    }

    .error-message {
      display: none;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 700px) {
      .viewer-header {
        min-height: 60px;
        padding: 0.6rem 0.75rem;
      }

      .brand { font-size: 0.9rem; letter-spacing: 1px; }
      .document-title { display: none; }
      .viewer-btn { min-height: 40px; padding: 0.5rem 0.65rem; font-size: 0.72rem; }
      .app-close-btn { top: 0.6rem; right: 0.6rem; width: 44px; height: 44px; font-size: 1.4rem; }
      .pdf-stage { padding: 0.5rem; }
      .desktop-only { display: none; }
    }
  </style>
</head>
<body>
  <header class="viewer-header">
    <div class="brand">TEBE</div>
    <div class="document-title" id="document-title">Visualizzatore PDF</div>
    <div class="viewer-actions">
      <a href="index.html?store=tebe" class="app-close-btn app-close-btn--pdf" title="Chiudi e torna al menu" aria-label="Chiudi e torna al menu">✕</a>
    </div>
  </header>

  <main class="pdf-stage">
    <iframe id="pdf-frame" title="Visualizzatore del documento PDF"></iframe>
    <div class="error-message" id="error-message">Documento PDF non disponibile.</div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const filePath = params.get('file');
    const frame = document.getElementById('pdf-frame');
    const title = document.getElementById('document-title');
    const errorMessage = document.getElementById('error-message');

    // Chi arriva dalla dashboard OPHILYA torna in OPHILYA alla chiusura.
    if (params.get('store') === 'ophilya') {
      document.querySelector('.app-close-btn').href = 'index.html?store=ophilya';
    }

    const isMobile = window.matchMedia('(max-width: 700px)').matches;

    if (filePath && isMobile) {
      window.location.replace(filePath);
    } else if (filePath) {
      const fileName = filePath.split('/').pop() || 'Documento PDF';
      title.textContent = fileName.replace(/\.pdf$/i, '').replace(/[_-]/g, ' ');
      frame.src = filePath;
      frame.addEventListener('error', () => {
        frame.style.display = 'none';
        errorMessage.style.display = 'flex';
      });
    } else {
      frame.style.display = 'none';
      errorMessage.style.display = 'flex';
    }
  </script>
</body>
</html>
