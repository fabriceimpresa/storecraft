<!DOCTYPE html>
<html lang="it" data-negozio="tebe">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="../assets/css/chiudi-pagina.css?v=20261008-25">
  <link rel="stylesheet" href="../assets/css/torna-al-menu.css?v=20261008-25">

  <link rel="stylesheet" href="../assets/css/font-arial.css?v=20261008-25">

  <script src="../assets/js/logos.js?v=20261008-25"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Sfondo principale UI */
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f6f1;
      padding: 20px;
      display: flex;
      gap: 20px;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    /* Contenitore Pannelli di Sinistra */

    /* Pannelli di Controllo */


    /* Pannello che comincia con un selettore: un poco di spazio in più sopra il selettore
       (i margini si sommano a quello del titolo: vale il maggiore) */
    .controls h2 + .mode-switch, .controls h2 + .card-selector { margin-top: 1rem; }

    /* Spazi regolari nel pannello (come Cartelli Semplici): 0,35rem tra etichetta e campo, 0,8rem tra
       un campo e l'etichetta successiva, tra i gruppi, sotto titolo e selettore e prima del tasto di stampa */


    /* Titoli dei menu a discesa e dei campi con frecce: come le altre etichette, nell'oro dei
       pulsanti sotto il pannello */








    /* SELETTORE MODALITA' (stile identico al toggle usato in cartelli_sale.html / index.html) */



    /* PULSANTE STAMPA */


    /* FOGLIO STAMPA */
    .print-sheet {
      position: relative;
      z-index: 1;
      width: 210mm;
      height: 297mm;
      background: white;
      box-shadow: 0 20px 60px rgba(40,34,28,.18);
      padding: 14.56mm 0 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    /* CARTELLO PERCENTUALE — dimensioni precise 1240px x 699px (150dpi -> 210mm x 118.35mm) */
    .card {
      width: 210mm;
      height: 118.35mm;
      border: 0.34mm solid #9d9490;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    /* Il secondo cartello è lo stesso contenuto, capovolto: i bordi devono coincidere in un'unica linea
       (rimuoviamo il bordo che, dopo la rotazione di 180°, finirebbe a contatto con il cartello superiore,
       lasciando intatto il bordo esterno inferiore necessario per il ritaglio) */
    #cardBottom {
      border-bottom: none;
      transform: rotate(180deg);
    }

    .card-fields {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Quando é attiva la modalità Standard (nessuna descrizione), tutti i campi si alzano leggermente */
    .card.standard-mode .card-fields {
      transform: translateY(-5%);
    }

    .card-desc {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translate(-13px, -6px);
      transition: max-height 0.35s ease, opacity 0.3s ease, transform 0.3s ease, margin 0.35s ease;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 400;
      font-size: 25.2pt;
      color: #1a1a1a;
      text-align: center;
      white-space: nowrap;
      letter-spacing: -0.05em;
    }

    .card-desc.active {
      max-height: 40mm;
      opacity: 1;
      transform: translate(-13px, 0);
      margin-bottom: 3.5mm;
    }

    .discount-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5mm;
    }

    .fino-al-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5mm;
    }

    .fino-al-label {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      font-size: 17.98pt;
      letter-spacing: -0.05em;
      color: #cc9e25;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .minus-bar {
      width: 21.46mm;
      height: 4.85mm;
      background-color: #cc9e25;
    }

    .percent-text {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 400;
      font-size: 158pt;
      letter-spacing: -0.05em;
      color: #cc9e25;
      line-height: 1;
      white-space: nowrap;
    }

    /* LOGO BRAND (ufficiale o personalizzato, sempre colore oro) mostrato sopra la percentuale.
       Il contenitore ha una dimensione fissa uguale per tutti i brand: l'immagine si adatta
       dentro mantenendo le proporzioni, così l'area occupata non cambia mai da un logo all'altro. */
    .card-brand-logo-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46mm;
      height: 20mm;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: scale(0.85) translateY(6px);
      transition: max-height 0.35s ease, opacity 0.3s ease, transform 0.3s ease, margin 0.35s ease;
    }

    .card-brand-logo-box.active {
      max-height: 20mm;
      opacity: 1;
      transform: scale(1) translateY(0);
      margin-bottom: 1.5mm;
    }

    .card-brand-logo {
      max-width: 100%;
      max-height: 20mm;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .card-logo {
      width: 45mm;
      height: auto;
      display: block;
      margin-top: 5.5mm;
    }

    /* NAVIGAZIONE UI */

    @page {
      size: A4 portrait;
      margin: 0mm !important;
    }

    @media print {
      html, body {
        width: 210mm;
        height: 297mm !important;
        max-height: 297mm !important;
        background: white !important;
        padding: 0 !important;
        margin: 0 !important;
        overflow: hidden !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .sidebar, .app-close-btn, .floating-nav-box { display: none !important; }

      .print-sheet {
        box-shadow: none;
        margin: 0 auto !important;
        padding: 14.56mm 0 0 0 !important;
        width: 210mm;
        height: 297mm !important;
        max-height: 297mm !important;
        page-break-after: avoid !important;
        page-break-before: avoid !important;
        page-break-inside: avoid !important;
        break-after: avoid !important;
        break-before: avoid !important;
        break-inside: avoid !important;
        overflow: hidden !important;
      }

      .fino-al-label, .percent-text, .minus-bar {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }

    @media screen and (max-width: 760px) and (pointer: coarse) {
      body { align-items: center; flex-direction: column; gap: 14px; overflow-x: hidden; padding: 20px 20px 84px; }
      .sidebar { width: 100%; max-width: 560px; order: 1; }
      .app-close-btn { right: 18px; }
      .print-sheet { zoom: 1; margin: 0 auto; order: 3; }
      /* Su schermi stretti il pulsante Made in Italy si stacca dal pannello
         e resta sopra il foglio, incolonnato con il tasto di chiusura. */
      body .made-in-italy-btn {
        position: relative;
        z-index: 5;
        order: 2;
        align-self: flex-end;
        margin: 0 -2px -48px auto;
        right: auto;
        bottom: auto;
        left: auto;
        top: 8px;
        transform: none;
      }
      body .made-in-italy-btn:hover,
      body .made-in-italy-btn.is-active {
        transform: scale(1.06);
      }
    }

    @media screen and (max-width: 760px) and (pointer: coarse) {
      body {
        align-items: center;
        flex-direction: column;
        gap: 12px;
        overflow-x: hidden;
        padding: 12px 12px 24px;
      }

      .sidebar { width: 100%; max-width: 560px; }
      .controls { width: 100%; }
      .form-group input, .form-group select { font-size: 16px; }
      .print-sheet { zoom: 0.75; margin: 0 auto; }
      body .made-in-italy-btn { margin-right: -4px; }
      .app-close-btn { top: 10px; right: 4px; width: 44px; height: 44px; }
      .floating-nav-box { display: none; }
    }

    @media screen and (max-width: 680px) and (pointer: coarse) { .print-sheet { zoom: 0.64; } }
    @media screen and (max-width: 530px) and (pointer: coarse) { .print-sheet { zoom: 0.53; } }
    @media screen and (max-width: 420px) and (pointer: coarse) { .print-sheet { zoom: 0.40; } }
    @media screen and (max-width: 360px) and (pointer: coarse) { .print-sheet { zoom: 0.34; } }

    @media screen and (max-width: 760px) and (pointer: coarse) {
      .controls { padding: 12px 12px 12px; }
      .controls h1, .controls h2 {
        font-size: 0.95rem;
        padding-bottom: 12px;
        margin-bottom: 0.55rem;
      }
      /* Pannello piu' compatto: su cellulare pannello e foglio devono
         stare in poco piu' di una schermata. */
      .form-group, .preset-select, .mode-switch { margin-bottom: 0.55rem; }
      .form-group label, .section-label {
        font-size: 0.68rem;
        margin-bottom: 0.18rem;
      }
      .form-group input, .form-group select, .preset-select select {
        padding: 6px 8px;
      }
      .mode-switch button, .row-selector button, .card-selector button {
        min-height: 36px;
        padding: 6px;
        font-size: 0.64rem;
      }
      .btn-print { margin-top: 0; padding: 9px; }
      .controls h2 + .mode-switch, .controls h2 + .card-selector { margin-top: 0.7rem; }
    }
  </style>
  <link rel="stylesheet" href="../assets/css/madeinitaly.css?v=20261008-25">
  <link rel="stylesheet" href="../assets/css/strumenti-stampa.css?v=20261008-25">
  <link rel="stylesheet" href="../assets/css/cursore.css?v=20261008-25">

</head>
<body>

  <!-- Pulsanti e Riquadri Navigazione UI -->
  <a href="index.html?store=tebe" class="app-close-btn" title="Chiudi e torna all'index">✕</a>

  <div class="floating-nav-box">
    <div class="floating-nav-title">TEBE</div>
    <a href="index.html?store=tebe" class="floating-nav-btn">
      ← Torna al Menu Principale
    </a>
  </div>

  <div class="sidebar">
    <div class="controls">
      <h2>Cartello Percentuale</h2>

      <div class="mode-switch">
        <button type="button" class="active" id="modeStandard" onclick="switchMode('standard')">STANDARD</button>
        <button type="button" id="modeDescrizione" onclick="switchMode('descrizione')">DESCRIZIONE<br>ARTICOLO</button>
        <button type="button" id="modeBrand" onclick="switchMode('brand')">AGGIUNGI<br>BRAND</button>
      </div>

      <div id="brandFieldsGroup" style="display: none;">
        <div class="form-group">
          <label class="section-label" for="brandSelect">BRAND</label>
          <div class="preset-select">
            <select id="brandSelect" onchange="updateBrand()">
              <option value="">-- Seleziona Brand --</option>
            </select>
          </div>
        </div>

        <div class="form-group" id="customBrandGroup">
          <label for="customBrandSelect">Loghi personalizzati</label>
          <div class="preset-select">
            <select id="customBrandSelect" onchange="updateCustomBrand()">
              <option value="">-- Seleziona Logo Personalizzato --</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="section-label" for="discountValue">Percentuale Sconto</label>
        <div class="percent-input-wrapper">
          <input data-percentuale type="number" id="discountValue" value="50" min="1" max="99" oninput="updateCard()">
          <div class="percent-stepper">
            <button type="button" aria-label="Aumenta percentuale" onclick="stepDiscount(1)">▲</button>
            <button type="button" aria-label="Diminuisci percentuale" onclick="stepDiscount(-1)">▼</button>
          </div>
        </div>
      </div>

      <div class="form-group" id="descGroup" style="display: none;">
        <label class="section-label" for="descPreset">Promozione</label>
        <div class="preset-select">
          <select id="descPreset" onchange="applyDescPreset()" data-testi-pronti="Promozioni" data-testi-senza-gruppi>
            <option value="">-- Seleziona un testo --</option>
            <option data-voce-propria value="Sconto alla Cassa">Sconto alla Cassa</option>
          </select>
        </div>
        <label for="descValue">Testo Libero</label>
        <input type="text" id="descValue" value="Sconto alla Cassa" oninput="updateCard()">
      </div>

      <button class="btn-print" onclick="printCards()">Stampa Cartello (A4)</button>
    </div>
  </div>

  <!-- AREA STAMPA A4 -->
  <div class="print-sheet" id="printSheet">
    <div class="card standard-mode" id="cardTop">
      <div class="card-fields">
        <div class="card-desc" id="descDisp">Sconto alla Cassa</div>
        <div class="card-brand-logo-box" id="brandLogoBoxTop">
          <img class="card-brand-logo" id="brandLogoTop" alt="">
        </div>
        <div class="discount-row">
          <div class="fino-al-group">
            <div class="fino-al-label">FINO AL</div>
            <div class="minus-bar"></div>
          </div>
          <div class="percent-text" id="percentDispTop">50%</div>
        </div>
        <img class="card-logo" src="../assets/img/tebe/footer_tebe.png" alt="TEBE">
      </div>
    </div>

    <div class="card standard-mode" id="cardBottom">
      <div class="card-fields">
        <div class="card-desc" id="descDispBottom">Sconto alla Cassa</div>
        <div class="card-brand-logo-box" id="brandLogoBoxBottom">
          <img class="card-brand-logo" id="brandLogoBottom" alt="">
        </div>
        <div class="discount-row">
          <div class="fino-al-group">
            <div class="fino-al-label">FINO AL</div>
            <div class="minus-bar"></div>
          </div>
          <div class="percent-text" id="percentDispBottom">50%</div>
        </div>
        <img class="card-logo" src="../assets/img/tebe/footer_tebe.png" alt="TEBE">
      </div>
    </div>
  </div>

  <script src="../assets/js/testi-pronti.js?v=20261008-25"></script>
  <script src="../assets/js/madeinitaly.js?v=20261008-25" data-automatico></script>
  <script>
    let isDescriptionActive = false;
    let brandSectionActive = false;

    function formatDiscount(value) {
      // L'utente scrive solo il numero: il simbolo "%" viene generato automaticamente
      // (il segno "-" è già rappresentato dal rettangolo grafico "FINO AL").
      const numeric = value.toString().replace(/[^0-9]/g, '').trim();
      return (numeric || '50') + '%';
    }

    function stepDiscount(delta) {
      const input = document.getElementById('discountValue');
      const min = parseInt(input.min, 10);
      const max = parseInt(input.max, 10);
      let val = parseInt(input.value, 10);
      if (isNaN(val)) val = min;
      val = Math.min(max, Math.max(min, val + delta));
      input.value = val;
      updateCard();
    }

    function updateCard() {
      const discountValue = document.getElementById('discountValue').value;
      const descValue = document.getElementById('descValue').value;
      const displayDiscount = formatDiscount(discountValue);

      document.getElementById('percentDispTop').textContent = displayDiscount;
      document.getElementById('percentDispBottom').textContent = displayDiscount;
      document.getElementById('descDisp').textContent = descValue;
      document.getElementById('descDispBottom').textContent = descValue;
    }

    function applyDescPreset() {
      const preset = document.getElementById('descPreset').value;
      document.getElementById('descValue').value = preset;
      updateCard();
    }

    function hasSelectedBrandLogo() {
      return brandSectionActive && (
        Boolean(document.getElementById('brandSelect').value) ||
        Boolean(document.getElementById('customBrandSelect').value)
      );
    }

    // La descrizione resta visibile se la modalità descrizione è attiva e non
    // c'è un logo effettivamente selezionato, anche con la sezione brand aperta.
    function updateFieldsMode() {
      const cardTop = document.getElementById('cardTop');
      const cardBottom = document.getElementById('cardBottom');
      const descriptionVisible = isDescriptionActive && !hasSelectedBrandLogo();

      document.getElementById('descDisp').classList.toggle('active', descriptionVisible);
      document.getElementById('descDispBottom').classList.toggle('active', descriptionVisible);
      cardTop.classList.toggle('standard-mode', !descriptionVisible);
      cardBottom.classList.toggle('standard-mode', !descriptionVisible);
    }

    // Tre modalità esclusive: Standard, Descrizione Articolo, Aggiungi Brand.
    function switchMode(mode) {
      isDescriptionActive = mode === 'descrizione';
      brandSectionActive = mode === 'brand';

      document.getElementById('modeStandard').classList.toggle('active', mode === 'standard');
      document.getElementById('modeDescrizione').classList.toggle('active', isDescriptionActive);
      document.getElementById('modeBrand').classList.toggle('active', brandSectionActive);
      document.getElementById('descGroup').style.display = isDescriptionActive ? 'block' : 'none';
      document.getElementById('brandFieldsGroup').style.display = brandSectionActive ? 'block' : 'none';

      if (!brandSectionActive) {
        updateLogoElements('', '');
        return;
      }

      const brandSelect = document.getElementById('brandSelect');
      const customBrandSelect = document.getElementById('customBrandSelect');
      if (!brandSelect.value && !customBrandSelect.value) {
        brandSelect.value = getDefaultBrandFile();
      }
      if (customBrandSelect.value) {
        updateCustomBrand();
      } else {
        updateBrand();
      }
    }

    function getCurrentMode() {
      if (brandSectionActive) return 'brand';
      return isDescriptionActive ? 'descrizione' : 'standard';
    }

    // Hook del tema Made in Italy: alla disattivazione torna la modalità precedente, brand compreso.
    window.captureTemaItaliaState = function captureTemaItaliaState() {
      return { mode: getCurrentMode() };
    };

    window.restoreTemaItaliaState = function restoreTemaItaliaState(state) {
      switchMode(state.mode);
    };

    // ----- BRAND (ufficiale o personalizzato), sempre in colore oro -----

    function cleanBrandName(fileName) {
      return fileName.replace(/\.[^.]+$/, '').replace(/([a-z])([A-Z])/g, '$1 $2');
    }

    // Loghi personalizzati: la lista di TEBE gestita da loghi-personalizzati.js (IndexedDB).
    function readCustomLogos() {
      return LoghiPersonalizzati.elenco().filter(logo => logo && logo.id && logo.name && logo.data);
    }

    function loadBrandSelect() {
      const select = document.getElementById('brandSelect');
      const { priorityFiles, remainingFiles } = getSortedLogoFiles();
      const orderedFiles = [...priorityFiles, ...remainingFiles];

      orderedFiles.forEach(fileName => {
        appendBrandOption(select, fileName, cleanBrandName(fileName), priorityFiles.includes(fileName));
      });
    }

    function getDefaultBrandFile() {
      const orderedFiles = getOrderedLogoFiles();
      return orderedFiles.find(fileName => fileName.toLowerCase().startsWith('269')) || orderedFiles[0] || '';
    }

    function loadCustomBrandSelect() {
      const select = document.getElementById('customBrandSelect');
      const customLogos = readCustomLogos();
      customLogos
        .slice()
        .sort((first, second) => first.name.localeCompare(second.name, 'it', { sensitivity: 'base' }))
        .forEach(logo => {
          const option = document.createElement('option');
          option.value = logo.id;
          option.textContent = `★ ${logo.name}`;
          select.appendChild(option);
        });
    }

    function updateLogoElements(source, brandName) {
      const pairs = [
        { img: document.getElementById('brandLogoTop'), box: document.getElementById('brandLogoBoxTop') },
        { img: document.getElementById('brandLogoBottom'), box: document.getElementById('brandLogoBoxBottom') }
      ];
      pairs.forEach(({ img, box }) => {
        if (source) {
          img.src = source;
          img.alt = brandName;
          box.classList.add('active');
        } else {
          box.classList.remove('active');
          img.removeAttribute('src');
          img.alt = '';
        }
      });
      updateFieldsMode();
    }

    function updateBrand() {
      const fileName = document.getElementById('brandSelect').value;
      document.getElementById('customBrandSelect').value = '';

      if (!brandSectionActive || !fileName) {
        updateLogoElements('', '');
        return;
      }

      updateFieldsMode();

      PrintLogoColors.getBrandLogoSrc('', fileName, '', 'gold').then(source => {
        updateLogoElements(source, cleanBrandName(fileName));
      }).catch(error => {
        console.error('Caricamento del logo brand fallito.', error);
      });
    }

    function updateCustomBrand() {
      const customLogoId = document.getElementById('customBrandSelect').value;
      const customLogo = readCustomLogos().find(logo => logo.id === customLogoId);
      const brandSelect = document.getElementById('brandSelect');

      if (!customLogo) {
        updateBrand();
        return;
      }

      brandSelect.value = '';

      if (!brandSectionActive) {
        updateLogoElements('', '');
        return;
      }

      updateFieldsMode();

      PrintLogoColors.getBrandLogoSrc(customLogo.data, '', '', 'gold').then(source => {
        updateLogoElements(source, customLogo.name);
      }).catch(error => {
        console.error('Caricamento del logo personalizzato fallito.', error);
      });
    }

    function printCards() {
      PrintLogoColors.prepareForPrint('.card-brand-logo, .card-logo')
        .then(() => window.print())
        .catch(error => console.error('Preparazione della stampa fallita.', error));
    }

    updateCard();
    loadBrandSelect();
    LoghiPersonalizzati.pronto.then(loadCustomBrandSelect);
  </script>
  <script src="../assets/js/cursore.js?v=20261008-25"></script>
  <script>
    // Cursore: indica sulla metà superiore del cartello l'elemento legato al campo in uso.
    Cursore.create({
      panel: '.controls',
      watch: '#printSheet',
      scope: '#cardTop',
      obstacles: '#cardTop .card-desc, #cardTop .card-brand-logo, #cardTop .fino-al-label, #cardTop .percent-text, #cardTop .card-logo',
      rules: [
        { controls: '#modeStandard, #discountValue, button[onclick^="stepDiscount"]', target: '#percentDispTop' },
        { controls: '#modeDescrizione, #descPreset, #descValue', target: '#descDisp' },
        { controls: '#modeBrand, #brandSelect, #customBrandSelect', target: '#brandLogoTop' }
      ]
    });
  </script>
  <script src="../assets/js/strumenti-stampa.js?v=20261008-25"></script>
</body>
</html>
