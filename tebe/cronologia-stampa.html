<!DOCTYPE html>
<html lang="it" data-negozio="tebe">
<head>
  <meta charset="UTF-8">
  <script src="../assets/js/negozi.js?v=20261028-2"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronologia di Stampa · TEBE</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/chiudi-pagina.css?v=20261028-2">
  <style>
    /* Cronologia di stampa del negozio (assets/js/cronologia-stampa.js): le stampe degli ultimi 7 giorni dalle pagine di
       cartelli, cartellini e promo stagionali, divise per giorno, da rivedere, ristampare a misura reale, rimettere nella
       lista di stampa o eliminare. Caratteri del visualizzatore PDF (Cinzel e Plus Jakarta Sans), colori del tema
       (--interface-*: theme.css per Luxury, scheda del negozio per TEBE e OPHILYA). Classi cr-, per non prendere le
       regole generiche del tema chiaro. */
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--interface-page, #121110);
      color: var(--interface-text, #f4f1ea);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Intestazione come il visualizzatore PDF: STORE // CRAFT a sinistra, titolo al centro, ✕ a destra */
    .cr-testata {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 68px;
      padding: 0.8rem 1.5rem;
      background: var(--interface-sidebar, #181715);
      border-bottom: 1px solid var(--interface-accent, #d4a373);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    }
    .cr-marchio { color: var(--interface-accent, #d4a373); font-family: 'Cinzel', serif; font-size: 1.15rem; letter-spacing: 2px; white-space: nowrap; }
    .cr-titolo {
      position: absolute;
      left: 50%;
      margin: 0;
      color: var(--interface-muted, #8c857b);
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.4px;
      white-space: nowrap;
      transform: translateX(-50%);
    }
    .cr-chiudi-posto { width: 40px; height: 40px; }

    /* Barra dei filtri e delle informazioni */
    .cr-barra {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem 1.5rem;
      width: 100%;
      max-width: 1450px;
      margin: 0 auto;
      padding: 1.4rem 1.5rem 0.4rem;
    }
    .cr-filtri { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .cr-filtro {
      padding: 0.5rem 0.95rem;
      border: 1px solid var(--interface-border, #2e2b27);
      border-radius: 999px;
      background: transparent;
      color: var(--interface-muted, #8c857b);
      font: 600 0.74rem 'Plus Jakarta Sans', sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    }
    .cr-filtro:hover { border-color: var(--interface-accent, #d4a373); color: var(--interface-text, #f4f1ea); }
    .cr-filtro[aria-pressed="true"] { border-color: var(--interface-accent, #d4a373); background: var(--interface-accent, #d4a373); color: #121110; }
    .cr-filtro .cr-numero { margin-left: 0.35rem; opacity: 0.7; font-weight: 500; }
    .cr-info { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1rem; color: var(--interface-muted, #8c857b); font-size: 0.8rem; }
    .cr-svuota {
      padding: 0.5rem 0.9rem;
      border: 1px solid var(--interface-accent, #d4a373);
      border-radius: 5px;
      background: transparent;
      color: var(--interface-accent, #d4a373);
      font: 700 0.72rem 'Plus Jakarta Sans', sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .cr-svuota:hover:not(:disabled) { background: var(--interface-accent, #d4a373); color: #121110; }
    .cr-svuota:disabled { opacity: 0.4; cursor: default; }

    /* Stampe divise per giorno */
    .cr-elenco { width: 100%; max-width: 1450px; margin: 0 auto; padding: 0.6rem 1.5rem 3rem; }
    .cr-giorno { margin-top: 1.6rem; }
    .cr-giorno-titolo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 0.9rem;
      color: var(--interface-accent, #d4a373);
      font: 500 0.95rem 'Cinzel', serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .cr-giorno-titolo::after { content: ''; flex: 1; height: 1px; background: var(--interface-border, #2e2b27); }
    .cr-griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
    .cr-scheda {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--interface-border, #2e2b27);
      border-radius: 8px;
      background: var(--interface-surface, #1e1d1a);
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .cr-scheda:hover { border-color: var(--interface-accent, #d4a373); transform: translateY(-1px); }
    .cr-scheda:focus-visible, .cr-filtro:focus-visible, .cr-svuota:focus-visible, .cr-comando:focus-visible { outline: 2px solid var(--interface-accent-bright, #e5ba73); outline-offset: 2px; }
    .cr-miniatura {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
      padding: 8px;
      border-radius: 4px;
      background: var(--interface-control, #0a0908);
    }
    .cr-miniatura img { display: block; max-width: 100%; max-height: 100%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); }
    .cr-nome { overflow: hidden; font-size: 0.82rem; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .cr-dettagli { display: flex; justify-content: space-between; gap: 6px; color: var(--interface-muted, #8c857b); font-size: 0.72rem; }
    .cr-tipo { color: var(--interface-accent, #d4a373); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    .cr-vuota { max-width: 460px; margin: 4rem auto; color: var(--interface-muted, #8c857b); font-size: 0.95rem; line-height: 1.6; text-align: center; }
    .cr-vuota strong { display: block; margin-bottom: 0.4rem; color: var(--interface-accent, #d4a373); font: 500 1rem 'Cinzel', serif; letter-spacing: 0.16em; text-transform: uppercase; }

    /* Anteprima di una stampa, al centro sopra un velo */
    .cr-velo {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(10, 9, 8, 0.78);
      backdrop-filter: blur(3px);
    }
    .cr-velo[hidden] { display: none; }
    .cr-finestra {
      display: flex;
      gap: 24px;
      width: min(1100px, 100%);
      max-height: 100%;
      padding: 20px;
      border: 1px solid var(--interface-accent, #d4a373);
      border-radius: 10px;
      background: var(--interface-surface, #1e1d1a);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    .cr-foglio { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 12px; border-radius: 6px; background: var(--interface-control, #0a0908); }
    .cr-foglio img { display: block; max-width: 100%; max-height: calc(100vh - 110px); background: #fff; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); }
    .cr-lato { flex: 0 0 250px; display: flex; flex-direction: column; gap: 0.7rem; }
    .cr-lato h2 { margin: 0 0 0.2rem; color: var(--interface-accent, #d4a373); font: 500 1.05rem/1.35 'Cinzel', serif; letter-spacing: 0.08em; }
    .cr-righe { margin: 0 0 0.4rem; color: var(--interface-muted, #8c857b); font-size: 0.8rem; line-height: 1.6; }
    .cr-righe a { color: var(--interface-accent, #d4a373); }
    .cr-comando {
      width: 100%;
      min-height: 40px;
      padding: 10px;
      border: 1px solid var(--interface-accent, #d4a373);
      border-radius: 5px;
      background: var(--interface-accent, #d4a373);
      color: #121110;
      font: 700 0.76rem 'Plus Jakarta Sans', sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .cr-comando:hover:not(:disabled) { filter: brightness(1.08); }
    .cr-comando:disabled { opacity: 0.45; cursor: default; }
    .cr-comando.cr-stampa { border-color: #96382b; background: #96382b; color: #fff; }
    .cr-comando.cr-contorno { background: transparent; color: var(--interface-accent, #d4a373); }
    .cr-comando.cr-contorno:hover { background: var(--interface-accent, #d4a373); color: #121110; filter: none; }
    .cr-spazio { flex: 1; }
    .cr-esito { min-height: 1.2em; color: var(--interface-accent-bright, #e5ba73); font-size: 0.76rem; text-align: center; }

    .cr-cornice-stampa { position: fixed; width: 0; height: 0; border: 0; visibility: hidden; }

    /* Selezione di più stampe (22 ottobre 2026): il pulsante SELEZIONA PIÙ STAMPE porta la cronologia nel modo della
       cronologia delle etichette DYMO: un tocco sceglie la stampa (pallino con la spunta) invece di aprirla, sotto ogni
       stampa scelta le copie da ristampare (1–99) e ✕ per eliminarla, in fondo il conto, AGGIUNGI A LISTA e RISTAMPA */
    .cr-scegli[aria-pressed="true"] { background: var(--interface-accent, #d4a373); color: #121110; }
    .cr-scheda.cr-con-scelta { padding: 0; gap: 0; cursor: default; }
    .cr-scheda.cr-con-scelta:hover { transform: none; }
    .cr-scheda.scelta { border-color: var(--interface-accent, #d4a373); box-shadow: 0 0 0 1px var(--interface-accent, #d4a373); }
    .cr-tocca {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 10px 6px;
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .cr-miniatura { position: relative; }
    .cr-spunta {
      position: absolute;
      top: 7px;
      left: 7px;
      width: 20px;
      height: 20px;
      border: 2px solid var(--interface-accent, #d4a373);
      border-radius: 50%;
      background: rgba(10, 9, 8, 0.55);
    }
    .cr-scheda.scelta .cr-spunta { background: var(--interface-accent, #d4a373); }
    .cr-scheda.scelta .cr-spunta::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 1px;
      width: 5px;
      height: 10px;
      border: solid #121110;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .cr-sotto { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 42px; padding: 0 10px 8px; }
    .cr-suggerimento { color: var(--interface-muted, #8c857b); font-size: 0.72rem; }
    .cr-copie { display: flex; align-items: center; gap: 8px; color: var(--interface-accent, #d4a373); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .cr-quante { display: inline-flex; align-items: stretch; height: 30px; border: 1px solid var(--interface-border, #2e2b27); border-radius: 5px; overflow: hidden; }
    .cr-quante input {
      width: 38px;
      border: none;
      background: var(--interface-control, #0a0908);
      color: var(--interface-text, #f4f1ea);
      font: 600 0.85rem Arial, sans-serif;
      text-align: center;
      appearance: textfield;
      -moz-appearance: textfield;
    }
    .cr-quante input::-webkit-inner-spin-button, .cr-quante input::-webkit-outer-spin-button { margin: 0; -webkit-appearance: none; }
    .cr-passo { width: 28px; border: none; background: var(--interface-sidebar, #181715); color: var(--interface-accent, #d4a373); font: 700 0.95rem Arial, sans-serif; cursor: pointer; }
    .cr-passo:hover { background: var(--interface-accent, #d4a373); color: #121110; }
    .cr-togli {
      width: 28px;
      height: 28px;
      border: 1px solid var(--interface-border, #2e2b27);
      border-radius: 50%;
      background: transparent;
      color: var(--interface-muted, #8c857b);
      font: 700 0.75rem Arial, sans-serif;
      cursor: pointer;
    }
    .cr-togli:hover { border-color: #96382b; background: #96382b; color: #fff; }
    .cr-tocca:focus-visible, .cr-passo:focus-visible, .cr-togli:focus-visible, .cr-ristampa-scelte:focus-visible { outline: 2px solid var(--interface-accent-bright, #e5ba73); outline-offset: 2px; }
    .cr-piede {
      position: sticky;
      bottom: 0;
      z-index: 9;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem 1.5rem calc(0.8rem + env(safe-area-inset-bottom, 0px));
      background: var(--interface-sidebar, #181715);
      border-top: 1px solid var(--interface-border, #2e2b27);
    }
    .cr-piede[hidden] { display: none; }
    /* con poche stampe il piede resta in fondo alla finestra */
    body:has(.cr-piede:not([hidden])) { min-height: 100vh; }
    body:has(.cr-piede:not([hidden])) .cr-elenco { flex: 1 0 auto; }
    .cr-conto { color: var(--interface-text, #f4f1ea); font-size: 0.85rem; font-weight: 600; }
    .cr-esito-scelte { flex: 1; color: var(--interface-accent-bright, #e5ba73); font-size: 0.8rem; text-align: right; }
    .cr-ristampa-scelte {
      min-width: 200px;
      min-height: 44px;
      padding: 0 1.2rem;
      border: none;
      border-radius: 5px;
      background: #96382b;
      color: #fff;
      font: 700 0.85rem 'Plus Jakarta Sans', sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .cr-ristampa-scelte:hover:not(:disabled) { background: #7a2d22; }
    .cr-ristampa-scelte:disabled, .cr-piede .cr-svuota:disabled { opacity: 0.45; cursor: default; }
    .cr-piede .cr-svuota { min-height: 44px; }

    /* Telefono e finestre strette: due stampe per riga, anteprima a tutto schermo con i comandi sotto */
    @media (max-width: 760px) {
      .cr-testata { min-height: 60px; padding: 0.6rem 0.75rem; }
      .cr-marchio { font-size: 0.9rem; letter-spacing: 1px; }
      .cr-titolo { position: static; transform: none; font-size: 0.85rem; }
      .cr-barra, .cr-elenco { padding-left: 12px; padding-right: 12px; }
      .cr-griglia { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .cr-velo { padding: 0; }
      .cr-finestra { flex-direction: column; gap: 12px; height: 100%; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); border: 0; border-radius: 0; }
      .cr-foglio { flex: 1 1 auto; min-height: 0; }
      .cr-foglio img { max-height: 100%; }
      .cr-lato { flex: 0 0 auto; }
      .cr-comando { min-height: 44px; }
      .cr-piede { flex-wrap: wrap; padding-left: 12px; padding-right: 12px; }
      .cr-esito-scelte { order: 3; flex-basis: 100%; text-align: left; }
      .cr-ristampa-scelte { flex: 1; min-width: 0; }
    }
/* Tema chiaro: ombre corte e nette, più solide che sfumate (regola delle ombre nel tema chiaro, 11 ottobre 2026) */    :root[data-interface-theme="light"] .cr-testata { box-shadow: 0 1px 3px rgba(40, 34, 28, .14); }    :root[data-interface-theme="light"] .cr-miniatura img { box-shadow: 0 1px 3px rgba(40, 34, 28, .26); }    :root[data-interface-theme="light"] .cr-foglio img { box-shadow: 0 2px 6px rgba(40, 34, 28, .24); }    :root[data-interface-theme="light"] .cr-finestra { box-shadow: 0 4px 10px rgba(40, 34, 28, .26); }    :root[data-interface-theme="light"] .cr-spunta { background: rgba(255, 253, 250, 0.8); }
  </style>
  <script src="../assets/js/theme.js?v=20261028-2"></script>

<body data-layout="cronologia">
  <header class="cr-testata">
    <div class="cr-marchio">STORE // CRAFT</div>
    <h1 class="cr-titolo">Cronologia di Stampa</h1>
    <div class="cr-chiudi-posto">
      <a href="index.html" class="app-close-btn app-close-btn--pdf" title="Chiudi e torna al menu" aria-label="Chiudi e torna al menu">✕</a>
    </div>
  </header>

  <div class="cr-barra">
    <div class="cr-filtri" role="group" aria-label="Filtra le stampe" id="filtri"></div>
    <div class="cr-info">
      <span id="info"></span>
      <button type="button" class="cr-svuota cr-scegli" id="scegli" aria-pressed="false">Seleziona più stampe</button>
      <button type="button" class="cr-svuota" id="tutte" hidden>Seleziona tutte</button>
      <button type="button" class="cr-svuota" id="svuota">Svuota cronologia</button>
    </div>
  </div>

  <div class="cr-elenco" id="elenco"></div>

  <div class="cr-piede" id="piede" hidden>
    <span class="cr-conto" id="conto"></span>
    <span class="cr-esito-scelte" id="esitoScelte" role="status"></span>
    <button type="button" class="cr-svuota" id="inListaScelte">Aggiungi a lista</button>
    <button type="button" class="cr-ristampa-scelte" id="ristampaScelte">Ristampa</button>
  </div>

  <div class="cr-velo" id="velo" hidden>
    <div class="cr-finestra" role="dialog" aria-modal="true" aria-labelledby="anteprimaTitolo">
      <div class="cr-foglio" id="anteprimaFoglio"></div>
      <div class="cr-lato">
        <h2 id="anteprimaTitolo"></h2>
        <p class="cr-righe" id="anteprimaRighe"></p>
        <button type="button" class="cr-comando cr-stampa" id="ristampa">Stampa (.PDF)</button>
        <button type="button" class="cr-comando" id="inLista">Aggiungi a lista di stampa</button>
        <button type="button" class="cr-comando cr-contorno" id="elimina">Elimina dalla cronologia</button>
        <div class="cr-esito" id="esito" role="status"></div>
        <div class="cr-spazio"></div>
        <button type="button" class="cr-comando cr-contorno" id="chiudiAnteprima">Chiudi</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/lista-stampa.js?v=20261028-2"></script>
  <script src="../assets/js/cronologia-stampa.js?v=20261028-2"></script>
  <script>
    // Pagina della cronologia di stampa del negozio (../assets/js/cronologia-stampa.js): uguale nei tre negozi, cambia
    // solo data-negozio.
    const TIPI = [['tutte', 'Tutte'], ['cartelli', 'Cartelli'], ['cartellini', 'Cartellini'], ['promo', 'Promo']];
    const NOMI_TIPO = { cartelli: 'Cartello', cartellini: 'Cartellini', promo: 'Promo' };
    let stampe = [];
    let filtro = 'tutte';
    let aperta = null;          // stampa nell'anteprima (con la foto grande)
    let ultimoFuoco = null;
    let indirizzi = [];
    // selezione di più stampe, come la cronologia delle etichette DYMO: id → copie da ristampare
    let scegli = false;
    const selezione = new Map();
    const limitaCopie = valore => Math.min(99, Math.max(1, Math.round(Number(valore)) || 1));

    const nodo = (tag, classe, testo) => {
      const n = document.createElement(tag);
      if (classe) n.className = classe;
      if (testo !== undefined) n.textContent = testo;
      return n;
    };
    const nomeStampa = stampa => stampa.title.replace(/ · .*$/, '').replace(/ \/\/ .*$/, '');
    const ora = tempo => new Date(tempo).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    const megabyte = byte => `${(byte / 1048576).toLocaleString('it-IT', { maximumFractionDigits: 1 })} MB`;

    // Titolo del giorno: OGGI, IERI, poi il giorno della settimana con la data
    function titoloGiorno(tempo) {
      const giorno = new Date(tempo); giorno.setHours(0, 0, 0, 0);
      const oggi = new Date(); oggi.setHours(0, 0, 0, 0);
      const differenza = Math.round((oggi - giorno) / 86400000);
      const data = giorno.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
      return differenza === 0 ? `Oggi · ${data}` : differenza === 1 ? `Ieri · ${data}` : data;
    }

    function indirizzo(blob) {
      const url = URL.createObjectURL(blob);
      indirizzi.push(url);
      return url;
    }

    async function carica() {
      stampe = await CronologiaStampa.elenco();
      [...selezione.keys()].forEach(id => { if (!stampe.some(s => s.id === id)) selezione.delete(id); });
      disegna();
    }

    function disegna() {
      indirizzi.forEach(url => URL.revokeObjectURL(url));
      indirizzi = [];
      // filtri con il numero di stampe
      const conta = tipo => tipo === 'tutte' ? stampe.length : stampe.filter(s => s.tipo === tipo).length;
      document.getElementById('filtri').replaceChildren(...TIPI.map(([tipo, nome]) => {
        const pulsante = nodo('button', 'cr-filtro', nome);
        pulsante.type = 'button';
        pulsante.setAttribute('aria-pressed', String(tipo === filtro));
        pulsante.append(nodo('span', 'cr-numero', String(conta(tipo))));
        pulsante.addEventListener('click', () => { filtro = tipo; disegna(); });
        return pulsante;
      }));
      document.getElementById('svuota').disabled = !stampe.length;
      const pulsanteScegli = document.getElementById('scegli');
      pulsanteScegli.setAttribute('aria-pressed', String(scegli));
      pulsanteScegli.textContent = scegli ? 'Fine selezione' : 'Seleziona più stampe';
      pulsanteScegli.disabled = !stampe.length && !scegli;
      const tutte = document.getElementById('tutte');
      tutte.hidden = !scegli;
      tutte.disabled = !visibili().length;
      tutte.textContent = visibili().length && visibili().every(s => selezione.has(s.id)) ? 'Deseleziona tutte' : 'Seleziona tutte';
      document.getElementById('piede').hidden = !scegli;
      aggiornaPiede();
      const info = document.getElementById('info');
      info.textContent = `ultimi 7 giorni · ${stampe.length === 1 ? '1 stampa' : `${stampe.length} stampe`}`;
      CronologiaStampa.spazio().then(byte => { if (byte !== null) info.textContent += ` · ${megabyte(byte)} usati nel browser`; });

      const elenco = document.getElementById('elenco');
      if (!visibili().length) {
        const vuota = nodo('div', 'cr-vuota');
        vuota.append(nodo('strong', '', 'Nessuna stampa'),
          stampe.length ? 'Nessuna stampa di questo tipo negli ultimi 7 giorni.'
            : 'Qui compaiono da sole le stampe degli ultimi 7 giorni fatte dalle pagine di cartelli, cartellini e promo stagionali.');
        elenco.replaceChildren(vuota);
        return;
      }
      // per giorno, dal più recente
      const giorni = new Map();
      visibili().forEach(stampa => {
        const chiave = new Date(stampa.stampataIl).toDateString();
        if (!giorni.has(chiave)) giorni.set(chiave, []);
        giorni.get(chiave).push(stampa);
      });
      elenco.replaceChildren(...[...giorni.values()].map(gruppo => {
        const sezione = nodo('section', 'cr-giorno');
        const griglia = nodo('div', 'cr-griglia');
        griglia.append(...gruppo.map(stampa => scegli ? schedaDaScegliere(stampa) : schedaStampa(stampa)));
        sezione.append(nodo('h2', 'cr-giorno-titolo', titoloGiorno(gruppo[0].stampataIl)), griglia);
        return sezione;
      }));
    }

    // Contenuto della scheda: miniatura, nome, tipo e ora
    function contenutoScheda(stampa, contenitore) {
      const miniatura = nodo('div', 'cr-miniatura');
      const img = document.createElement('img');
      img.src = indirizzo(stampa.thumb);
      img.alt = '';
      miniatura.append(img);
      const dettagli = nodo('div', 'cr-dettagli');
      dettagli.append(nodo('span', 'cr-tipo', NOMI_TIPO[stampa.tipo] || stampa.tipo),
        nodo('span', '', `${ora(stampa.stampataIl)}${stampa.volte > 1 ? ` · ${stampa.volte} volte` : ''}`));
      contenitore.append(miniatura, nodo('div', 'cr-nome', nomeStampa(stampa)), dettagli);
      return miniatura;
    }

    // Scheda normale: un clic apre l'anteprima
    function schedaStampa(stampa) {
      const scheda = nodo('button', 'cr-scheda');
      scheda.type = 'button';
      scheda.setAttribute('aria-label', `${nomeStampa(stampa)}, stampata alle ${ora(stampa.stampataIl)}`);
      contenutoScheda(stampa, scheda);
      scheda.addEventListener('click', () => apriAnteprima(stampa.id));
      return scheda;
    }

    // Scheda nella selezione di più stampe: un tocco la sceglie; scelta, sotto le copie da ristampare e ✕
    function schedaDaScegliere(stampa) {
      const scelta = selezione.has(stampa.id);
      const scheda = nodo('div', `cr-scheda cr-con-scelta${scelta ? ' scelta' : ''}`);
      const tocca = nodo('button', 'cr-tocca');
      tocca.type = 'button';
      tocca.setAttribute('aria-pressed', String(scelta));
      tocca.setAttribute('aria-label', `${nomeStampa(stampa)}, stampata alle ${ora(stampa.stampataIl)}${scelta ? ', selezionata' : ''}`);
      const spunta = nodo('span', 'cr-spunta');
      spunta.setAttribute('aria-hidden', 'true');
      contenutoScheda(stampa, tocca).append(spunta);
      tocca.addEventListener('click', () => {
        if (selezione.has(stampa.id)) selezione.delete(stampa.id); else selezione.set(stampa.id, 1);
        disegna();
      });
      scheda.append(tocca);

      const sotto = nodo('div', 'cr-sotto');
      if (scelta) {
        const copie = nodo('label', 'cr-copie');
        copie.append('Copie');
        const meno = nodo('button', 'cr-passo', '−');
        meno.type = 'button';
        meno.setAttribute('aria-label', 'Una copia in meno');
        const campo = document.createElement('input');
        campo.type = 'number';
        campo.min = '1';
        campo.max = '99';
        campo.inputMode = 'numeric';
        campo.value = String(selezione.get(stampa.id));
        campo.setAttribute('aria-label', `Copie da ristampare di ${nomeStampa(stampa)}`);
        const piu = nodo('button', 'cr-passo', '+');
        piu.type = 'button';
        piu.setAttribute('aria-label', 'Una copia in più');
        const imposta = valore => { const v = limitaCopie(valore); campo.value = String(v); selezione.set(stampa.id, v); aggiornaPiede(); };
        campo.addEventListener('input', () => { if (campo.value !== '') { selezione.set(stampa.id, limitaCopie(campo.value)); aggiornaPiede(); } });
        campo.addEventListener('change', () => imposta(campo.value));
        meno.addEventListener('click', () => imposta(limitaCopie(campo.value) - 1));
        piu.addEventListener('click', () => imposta(limitaCopie(campo.value) + 1));
        const gruppo = nodo('span', 'cr-quante');
        gruppo.append(meno, campo, piu);
        copie.append(gruppo);
        sotto.append(copie);
      } else {
        sotto.append(nodo('span', 'cr-suggerimento', 'tocca per sceglierla'));
      }
      const togli = nodo('button', 'cr-togli', '✕');
      togli.type = 'button';
      togli.title = 'Elimina dalla cronologia';
      togli.setAttribute('aria-label', `Elimina ${nomeStampa(stampa)} dalla cronologia`);
      togli.addEventListener('click', async () => {
        if (!confirm(`Eliminare «${nomeStampa(stampa)}» delle ${ora(stampa.stampataIl)} dalla cronologia di stampa?`)) return;
        await CronologiaStampa.elimina(stampa.id);
        selezione.delete(stampa.id);
        carica();
      });
      sotto.append(togli);
      scheda.append(sotto);
      return scheda;
    }

    // Stampe visibili con il filtro scelto
    const visibili = () => stampe.filter(s => filtro === 'tutte' || s.tipo === filtro);

    function aggiornaPiede() {
      const n = selezione.size;
      const copie = [...selezione.values()].reduce((somma, c) => somma + c, 0);
      document.getElementById('conto').textContent = n
        ? `${n} ${n === 1 ? 'stampa' : 'stampe'} · ${copie} ${copie === 1 ? 'foglio' : 'fogli'} in tutto`
        : 'Tocca le stampe da ristampare';
      const ristampa = document.getElementById('ristampaScelte');
      ristampa.disabled = !n;
      ristampa.textContent = n ? `Ristampa (${copie})` : 'Ristampa';
      document.getElementById('inListaScelte').disabled = !n;
    }

    function cambiaModo(acceso) {
      scegli = acceso;
      selezione.clear();
      document.getElementById('esitoScelte').textContent = '';
      disegna();
    }

    function selezionaTutte() {
      const tutte = visibili();
      if (tutte.length && tutte.every(s => selezione.has(s.id))) tutte.forEach(s => selezione.delete(s.id));
      else tutte.forEach(s => { if (!selezione.has(s.id)) selezione.set(s.id, 1); });
      disegna();
    }

    // Le stampe scelte, complete della foto grande, ognuna ripetuta per le sue copie
    async function fogliScelti() {
      const scelte = stampe.filter(s => selezione.has(s.id));
      const complete = await Promise.all(scelte.map(s => CronologiaStampa.stampa(s.id)));
      return scelte.flatMap((s, i) => complete[i] ? Array(selezione.get(s.id)).fill(complete[i]) : []);
    }

    // Ristampa delle stampe scelte: un solo PDF a misura reale, come Stampa (.PDF) dell'anteprima
    async function ristampaScelte() {
      if (!selezione.size) return;
      const esito = document.getElementById('esitoScelte');
      const ids = [...selezione.keys()];
      const fogli = await fogliScelti();
      if (!fogli.length) return carica();
      const nomeFile = fogli.length === 1 ? `${nomeStampa(fogli[0])}.pdf` : 'cronologia.pdf';
      await stampaFogli(fogli, nomeFile, esito);
      for (const id of ids) await CronologiaStampa.ristampata(id);
      selezione.clear();
      carica();
    }

    async function inListaScelte() {
      if (!selezione.size) return;
      const esito = document.getElementById('esitoScelte');
      try {
        let totale = 0;
        for (const foglio of await fogliScelti()) totale = await ListaStampa.addPage(foglio);
        esito.textContent = `Aggiunte alla lista di stampa (${totale} ${totale === 1 ? 'pagina' : 'pagine'})`;
        selezione.clear();
        disegna();
      } catch (error) {
        console.error('Aggiunta alla lista di stampa non riuscita.', error);
        esito.textContent = 'Non è stato possibile aggiungerle alla lista di stampa.';
      }
    }

    // ----- Anteprima di una stampa -----
    let urlAnteprima = '';
    async function apriAnteprima(id) {
      aperta = await CronologiaStampa.stampa(id);
      if (!aperta) return carica();
      ultimoFuoco = document.activeElement;
      if (urlAnteprima) URL.revokeObjectURL(urlAnteprima);
      urlAnteprima = URL.createObjectURL(aperta.jpeg);
      const img = document.createElement('img');
      img.src = urlAnteprima;
      img.alt = nomeStampa(aperta);
      document.getElementById('anteprimaFoglio').replaceChildren(img);
      document.getElementById('anteprimaTitolo').textContent = nomeStampa(aperta);
      const righe = document.getElementById('anteprimaRighe');
      const pagina = document.createElement('a');
      pagina.href = aperta.page;
      pagina.textContent = 'apri la pagina ↗';
      righe.replaceChildren(
        `${NOMI_TIPO[aperta.tipo] || aperta.tipo} · foglio ${Math.round(aperta.mmWidth)} × ${Math.round(aperta.mmHeight)} mm`,
        document.createElement('br'),
        `stampata ${new Date(aperta.stampataIl).toLocaleString('it-IT', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}`,
        aperta.volte > 1 ? ` · ${aperta.volte} volte` : '',
        document.createElement('br'),
        pagina);
      document.getElementById('esito').textContent = '';
      document.getElementById('velo').hidden = false;
      document.getElementById('ristampa').focus();
    }

    function chiudiAnteprima() {
      document.getElementById('velo').hidden = true;
      document.getElementById('anteprimaFoglio').replaceChildren();
      aperta = null;
      ultimoFuoco?.focus?.();
    }

    // Stampa del foglio a misura reale: sul computer da un riquadro nascosto (come la lista di stampa), su iPhone e iPad
    // con il menu Condividi
    async function ristampa() {
      if (!aperta) return;
      const foglio = aperta;
      CronologiaStampa.ristampata(aperta.id).then(carica);
      await stampaFogli([foglio], `${nomeStampa(foglio)}.pdf`, document.getElementById('esito'));
    }

    // Sul computer i fogli si stampano a misura esatta, al 100%, come dalla pagina (ListaStampa.stampaFogli), senza
    // passare dal lettore di PDF, che proporrebbe di rimpicciolirli; su iPhone e iPad il PDF con il menu Condividi
    async function stampaFogli(fogli, nomeFile, esito) {
      if (ListaStampa.isIos()) { ListaStampa.offerPdf(ListaStampa.buildPdf(fogli), nomeFile); return; }
      esito.textContent = 'Preparazione della stampa…';
      try {
        await ListaStampa.stampaFogli(fogli);
        esito.textContent = '';
      } catch (error) {
        console.error('Preparazione della stampa non riuscita.', error);
        esito.textContent = 'Non è stato possibile preparare la stampa.';
      }
    }

    async function inLista() {
      if (!aperta) return;
      const esito = document.getElementById('esito');
      try {
        const totale = await ListaStampa.addPage(aperta);
        esito.textContent = `Aggiunta alla lista di stampa (${totale} ${totale === 1 ? 'pagina' : 'pagine'})`;
      } catch (error) {
        console.error('Aggiunta alla lista di stampa non riuscita.', error);
        esito.textContent = 'Non è stato possibile aggiungerla alla lista di stampa.';
      }
    }

    async function elimina() {
      if (!aperta || !confirm(`Eliminare «${nomeStampa(aperta)}» dalla cronologia di stampa?`)) return;
      await CronologiaStampa.elimina(aperta.id);
      chiudiAnteprima();
      carica();
    }

    async function svuota() {
      if (!stampe.length || !confirm('Svuotare la cronologia di stampa? Tutte le stampe degli ultimi 7 giorni verranno eliminate.')) return;
      await CronologiaStampa.svuota();
      selezione.clear();
      carica();
    }

    document.getElementById('svuota').addEventListener('click', svuota);
    document.getElementById('scegli').addEventListener('click', () => cambiaModo(!scegli));
    document.getElementById('tutte').addEventListener('click', selezionaTutte);
    document.getElementById('ristampaScelte').addEventListener('click', ristampaScelte);
    document.getElementById('inListaScelte').addEventListener('click', inListaScelte);
    document.getElementById('ristampa').addEventListener('click', ristampa);
    document.getElementById('inLista').addEventListener('click', inLista);
    document.getElementById('elimina').addEventListener('click', elimina);
    document.getElementById('chiudiAnteprima').addEventListener('click', chiudiAnteprima);
    document.getElementById('velo').addEventListener('click', evento => { if (evento.target.id === 'velo') chiudiAnteprima(); });
    document.addEventListener('keydown', evento => {
      if (evento.key !== 'Escape') return;
      if (!document.getElementById('velo').hidden) chiudiAnteprima();
      else if (scegli) cambiaModo(false);
    });
    // la pagina resta aperta mentre si stampa dalle altre: tornando in primo piano si rilegge la cronologia
    document.addEventListener('visibilitychange', () => { if (!document.hidden && !aperta) carica(); });

    carica().catch(error => {
      console.error('Lettura della cronologia di stampa non riuscita.', error);
      document.getElementById('info').textContent = 'Non è stato possibile leggere la cronologia di stampa.';
    });
  </script>
</body>
</html>
