  <style>
    /* Bodoni del sito: dichiarato come nei Cartellini (senza font-display: swap) */
    @font-face {
      font-family: "Bodoni Std";
      src: url("../assets/fonts/BodoniStd.otf") format("opentype");
      font-style: normal;
      font-weight: 400;
    }

    @font-face {
      font-family: "Bodoni Std";
      src: url("../assets/fonts/BodoniStd-Italic.otf") format("opentype");
      font-style: italic;
      font-weight: 400;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      padding: 20px;
      background: var(--interface-page);
      color: var(--interface-text);
      font-family: Arial, sans-serif;
    }




    /* Il pannello segue il pannello standard (../assets/css/pannello.css): blocchi, selettori, menu e campi comuni.
       Qui solo ciò che è proprio della pagina: le etichette della riga dei prezzi su una riga sola (come Outlet) e,
       più sotto, i due gruppi Articolo sinistro / destro del DOPPIO ARTICOLO. */
    .form-row .form-group label { white-space: nowrap; }

    .print-sheet {
      position: relative;
      width: 210mm;
      height: 297mm;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 20px 60px rgba(40, 34, 28, 0.18);
    }

    .print-sheet .card {
      position: absolute;
      left: 33.56mm;
      width: 142.83mm;
      height: 101.43mm;
      overflow: hidden;
      border: 0.34mm solid #c99a27;
      background: #fff;
      color: #231f20;
      text-align: center;
    }

    .card-content {
      position: absolute;
      inset: 0;
      transform: scale(0.94);
      transform-origin: center;
    }

    #cardTop {
      top: 23.98mm;
    }

    #cardBottom {
      bottom: 23.98mm;
    }

    .card-title {
      position: absolute;
      top: 17mm;
      left: 2mm;
      width: calc(100% - 4mm);
      font-family: "Bodoni Std", "Bodoni MT", serif;
      font-size: 27pt;
      font-style: italic;
      font-weight: 400;
      letter-spacing: -0.025em;
      line-height: 1.15;
      white-space: nowrap;
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition: top 0.4s ease, opacity 0.35s ease, transform 0.4s ease, visibility 0.4s;
    }

    .card-title.is-long-description {
      font-size: 21pt;
    }

    .card-title .separator {
      color: #c99a27;
    }

    .card-title .description-tail {
      color: #231f20;
    }

    .card.is-made-in-italy .card-title {
      color: #231f20;
      transition: color 0.35s ease;
    }

    .card.is-made-in-italy .card-title .separator {
      color: #c99a27;
    }

    .card.is-made-in-italy .card-title .description-tail {
      color: #231f20;
    }

    .card-content .paletto-made-in-italy-flag {
      position: absolute;
      top: 9.5mm;
      left: 50%;
      width: 7mm;
      height: auto;
      border: 0;
      box-shadow: none;
      object-fit: contain;
      transform: translateX(-50%);
    }

    /* madeinitaly.css ruota di 180° le bandierine di #cardBottom (nei cartelli bifacciali la metà inferiore è
       capovolta); nei Paletti i due cartelli sono indipendenti e dritti, quindi la bandierina resta dritta */
    #cardBottom .card-content .paletto-made-in-italy-flag {
      transform: translateX(-50%);
    }

    .card.is-made-in-italy .card-title {
      top: 24.5mm;
    }

    .card.is-made-in-italy .card-price {
      top: 37mm;
    }

    .card.is-made-in-italy .card-logo {
      top: 75mm;
    }

    .card-price {
      position: absolute;
      top: 31mm;
      left: 1mm;
      width: calc(100% - 2mm);
      font-family: "Bodoni Std", "Bodoni MT", serif;
      font-size: 102.67pt;
      font-weight: 400;
      letter-spacing: -0.05em;
      line-height: 1;
      white-space: nowrap;
      transition: top 0.4s ease;
    }

    .card-price-row {
      position: absolute;
      top: 17mm;
      left: 2mm;
      width: calc(100% - 4mm);
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 7mm;
      font-family: "Bodoni Std", "Bodoni MT", serif;
      font-size: 28pt;
      font-weight: 400;
      letter-spacing: -0.05em;
      line-height: 1;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-5mm);
      transition: opacity 0.35s ease, transform 0.4s ease, visibility 0.4s;
    }

    .price-old {
      color: #231f20;
      text-decoration-line: line-through;
      text-decoration-color: #c99a27;
      text-decoration-thickness: 0.6mm;
    }

    .price-percent {
      color: #c99a27;
    }

    .card.is-double-price .card-price-row {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .card.is-double-price .card-title {
      opacity: 0;
      visibility: hidden;
      transform: translateY(-5mm);
    }

    .dual-items,
    .dual-divider {
      display: none;
    }

    .card.is-double-article .card-content > .card-title,
    .card.is-double-article .card-content > .card-price-row,
    .card.is-double-article .card-content > .card-price {
      display: none;
    }

    .card.is-double-article .dual-items {
      position: absolute;
      top: 26mm;
      left: 50%;
      width: 108%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      transform: translateX(-50%);
    }

    .card.is-double-article .dual-item {
      position: relative;
      min-width: 0;
      height: 38mm;
    }

    .card.is-double-article .dual-item-title {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      overflow: hidden;
      font-family: "Bodoni Std", "Bodoni MT", serif;
      font-size: 14pt;
      font-style: italic;
      font-weight: 400;
      letter-spacing: -0.025em;
      line-height: 1.15;
      white-space: nowrap;
      text-overflow: clip;
    }

    .card.is-double-article .dual-item-title.is-long-description {
      font-size: 11pt;
    }

    .card.is-double-article .dual-item-price {
      position: absolute;
      top: 8mm;
      left: 0;
      width: 100%;
      overflow: hidden;
      font-family: "Bodoni Std", "Bodoni MT", serif;
      font-size: 70pt;
      font-weight: 400;
      letter-spacing: -0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    .card.is-double-article.is-article-double-price .dual-item-title {
      display: none;
    }

    .card.is-double-article .dual-item-price-row {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: none;
      align-items: baseline;
      justify-content: center;
      gap: 3mm;
      font-family: "Bodoni Std", "Bodoni MT", serif;
      font-size: 17pt;
      letter-spacing: -0.05em;
      line-height: 1;
      white-space: nowrap;
      text-align: center;
    }

    .card.is-double-article.is-article-double-price .dual-item-price-row {
      display: flex;
    }

    .card.is-double-article.is-article-double-price .dual-item-price {
      top: 8mm;
      font-size: 70pt;
    }

    .card.is-double-article .dual-divider {
      position: absolute;
      top: 36mm;
      left: 50%;
      height: 24mm;
      display: block;
      border-left: 0.7mm solid #c99a27;
      transform: translateX(-50%);
    }

    .article-fields {
      padding-top: 0.65rem;
      border-top: 1px solid var(--pannello-bordo);
    }

    .article-fields h2 {
      margin-bottom: 0.35rem;
      color: var(--pannello-oro-chiaro);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .article-fields [data-article-fields="double"] {
      display: none;
    }

    #doubleArticleFields.is-double-price [data-article-fields="standard"] {
      display: none;
    }

    #doubleArticleFields.is-double-price [data-article-fields="double"] {
      display: block;
    }

    .card-logo {
      position: absolute;
      top: 70mm;
      left: 50%;
      width: 45mm;
      height: auto;
      transform: translateX(-50%);
      transition: top 0.4s ease;
    }

    .cut-line {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      border-top: 0.2mm dashed #aaa;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html,
      body {
        width: 210mm;
        height: 297mm !important;
        max-height: 297mm !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        background: #fff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .sidebar,
      .app-close-btn,
      .floating-nav-box {
        display: none !important;
      }

      .print-sheet {
        width: 210mm;
        height: 297mm !important;
        max-height: 297mm !important;
        margin: 0 auto !important;
        overflow: hidden !important;
        box-shadow: none;
        page-break-after: avoid !important;
      }
    }

  </style>

<body data-layout="cartelli">
  <a href="index.html?store=tebe" class="app-close-btn" title="Chiudi e torna all'indice">✕</a>

  <div class="floating-nav-box">
    <div class="floating-nav-title">TEBE</div>

  <aside class="sidebar">
    <div class="controls">
      <h1>Paletto</h1>

      <!-- Blocco 1: selettori e pulsanti -->
      <div class="panel-block">
        <!-- selettore pronto comune; id selectTop / selectBottom usati anche da vista telefono e cursore -->
        <div id="cardSelector" data-selettore-cartello data-first-button-id="selectTop" data-second-button-id="selectBottom" data-on-change="selectCardIndex"></div>

        <!-- selettore comune (selettore.js): modalità del cartello -->
        <div data-selettore id="modeSelector" data-on-change="setMode" aria-label="Seleziona la modalità del cartello">
          <button value="standard" id="standardMode" class="active">STANDARD</button>
          <button value="double" id="doublePriceMode">DOPPIO<br>PREZZO</button>
          <button value="doubleArticle" id="doubleArticleMode">DOPPIO<br>ARTICOLO</button>
        </div>
      </div>

      <!-- Blocco 2 omesso: il cartello non ha brand né claim -->

      <!-- Blocco 3: campi del cartello, secondo la modalità -->
      <div class="panel-block">
        <div id="standardFields">
          <div class="form-group">
            <label class="section-label" for="descriptionPreset">Promozioni</label>
            <div class="preset-select">
              <select id="descriptionPreset" onchange="applyDescriptionPreset()" data-testi-pronti="Promozioni" data-testi-senza-gruppi>
                <option value="">-- Seleziona Promozione --</option>
              </select>
            </div>
            <label for="description">Testo Libero</label>
            <input id="description" type="text" value="Vera Pelle • Genuine Leather" placeholder="-- Testo Libero --" oninput="updateDescription()">
          </div>

          <div class="form-group">
            <label for="price">Prezzo</label>
            <input data-prezzo id="price" type="text" value="29,90" placeholder="29,90" inputmode="decimal" oninput="updateCards()">
          </div>
        </div>

        <div id="doublePriceFields" hidden>
          <div class="form-row">
            <div class="form-group">
              <label for="oldPrice">Prezzo Originario</label>
              <input data-prezzo id="oldPrice" type="text" value="59,80" placeholder="59,80" inputmode="decimal" oninput="updateCards()">
            </div>
            <div class="form-group">
              <label for="discount">Sconto</label>
              <input data-percentuale id="discount" type="number" value="50" min="1" max="99" placeholder="50" oninput="updateCards()">
            </div>
            <div class="form-group">
              <label for="finalPrice">Prezzo Finale</label>
              <input data-prezzo id="finalPrice" type="text" value="29,90" placeholder="29,90" inputmode="decimal" oninput="updateCards()">
            </div>
          </div>
        </div>

        <div id="doubleArticleFields" hidden>
          <!-- selettore comune (selettore.js): prezzi dei due articoli -->
          <div data-selettore id="articleModeSelector" data-on-change="setArticlePriceMode" aria-label="Seleziona la modalità degli articoli">
            <button value="standard" id="articleStandardMode" class="active">DESCRIZIONE</button>
            <button value="double" id="articleDoublePriceMode">DOPPIO PREZZO</button>
          </div>
          <div class="article-fields">
            <h2>Articolo sinistro</h2>
            <div data-article-fields="standard">
              <div class="form-group">
                <label class="section-label" for="firstDescriptionPreset">Promozioni</label>
                <div class="preset-select">
                  <select id="firstDescriptionPreset" onchange="applyArticleDescriptionPreset('first')">
                    <option value="">-- Seleziona Promozione --</option>
                  </select>
                </div>
                <label for="firstDescription">Testo Libero</label>
                <input id="firstDescription" type="text" placeholder="-- Testo Libero --" oninput="updateArticleDescription('first')">
              </div>
              <div class="form-group">
                <label for="firstPrice">Prezzo</label>
                <input data-prezzo id="firstPrice" type="text" inputmode="decimal" oninput="updateCards()">
              </div>
            </div>
            <div data-article-fields="double">
              <div class="form-row">
                <div class="form-group">
                  <label for="firstOldPrice">Prezzo Originario</label>
                  <input data-prezzo id="firstOldPrice" type="text" inputmode="decimal" oninput="updateCards()">
                </div>
                <div class="form-group">
                  <label for="firstDiscount">Sconto</label>
                  <input data-percentuale id="firstDiscount" type="number" min="1" max="99" oninput="updateCards()">
                </div>
                <div class="form-group">
                  <label for="firstFinalPrice">Prezzo Finale</label>
                  <input data-prezzo id="firstFinalPrice" type="text" inputmode="decimal" oninput="updateCards()">
                </div>
              </div>
            </div>
          </div>
          <div class="article-fields">
            <h2>Articolo destro</h2>
            <div data-article-fields="standard">
              <div class="form-group">
                <label class="section-label" for="secondDescriptionPreset">Promozioni</label>
                <div class="preset-select">
                  <select id="secondDescriptionPreset" onchange="applyArticleDescriptionPreset('second')">
                    <option value="">-- Seleziona Promozione --</option>
                  </select>
                </div>
                <label for="secondDescription">Testo Libero</label>
                <input id="secondDescription" type="text" placeholder="-- Testo Libero --" oninput="updateArticleDescription('second')">
              </div>
              <div class="form-group">
                <label for="secondPrice">Prezzo</label>
                <input data-prezzo id="secondPrice" type="text" inputmode="decimal" oninput="updateCards()">
              </div>
            </div>
            <div data-article-fields="double">
              <div class="form-row">
                <div class="form-group">
                  <label for="secondOldPrice">Prezzo Originario</label>
                  <input data-prezzo id="secondOldPrice" type="text" inputmode="decimal" oninput="updateCards()">
                </div>
                <div class="form-group">
                  <label for="secondDiscount">Sconto</label>
                  <input data-percentuale id="secondDiscount" type="number" min="1" max="99" oninput="updateCards()">
                </div>
                <div class="form-group">
                  <label for="secondFinalPrice">Prezzo Finale</label>
                  <input data-prezzo id="secondFinalPrice" type="text" inputmode="decimal" oninput="updateCards()">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Blocco 4: stampa -->
      <div class="panel-block">
        <button class="btn-print" id="printBtn" type="button" onclick="window.print()">STAMPA CARTELLI</button>
      </div>
    </div>

    </article>
    <div class="cut-line" aria-hidden="true"></div>
  </main>

  <script>
    const cardStates = {
      top: {
        mode: 'standard', description: 'Vera Pelle • Genuine Leather', descriptionPreset: '', price: '29,90',
        oldPrice: '59,80', discount: '50', finalPrice: '29,90', articlePriceMode: 'standard',
        articles: {
          first: { description: 'Vera Pelle • Genuine Leather', descriptionPreset: '', price: '12,00', oldPrice: '24,00', discount: '50', finalPrice: '12,00' },
          second: { description: 'Vera Pelle • Genuine Leather', descriptionPreset: '', price: '15,00', oldPrice: '30,00', discount: '50', finalPrice: '15,00' }
        }
      },
      bottom: {
        mode: 'standard', description: 'Vera Pelle • Genuine Leather', descriptionPreset: '', price: '29,90',
        oldPrice: '59,80', discount: '50', finalPrice: '29,90', articlePriceMode: 'standard',
        articles: {
          first: { description: 'Vera Pelle • Genuine Leather', descriptionPreset: '', price: '12,00', oldPrice: '24,00', discount: '50', finalPrice: '12,00' },
          second: { description: 'Vera Pelle • Genuine Leather', descriptionPreset: '', price: '15,00', oldPrice: '30,00', discount: '50', finalPrice: '15,00' }
        }
      }
    };
    const longDescriptions = new Set([
      'Vera Pelle • Genuine Leather',
      'Made in Italy • Genuine Leather',
      'Fino ad esaurimento scorte'
    ]);
    const longDescriptionLengthThreshold = 'Fino ad esaurimento scorte'.length;
    const descriptionPreset = document.getElementById('descriptionPreset');
    const descriptionMaxLength = Math.max(
      ...Array.from(descriptionPreset.options, option => option.value.length)
    );
    for (const articleKey of ['first', 'second']) {
      const preset = document.getElementById(`${articleKey}DescriptionPreset`);
      for (const option of Array.from(descriptionPreset.options).slice(1)) {
        preset.add(new Option(option.textContent, option.value));
      }
      document.getElementById(`${articleKey}Description`).maxLength = descriptionMaxLength;
    }
    document.getElementById('description').maxLength = descriptionMaxLength;
    let activeCard = 'top';

    function formatPrice(value) {
      const amount = value.trim().replace(/[€\s]/g, '');
      return amount ? `€ ${amount}` : '€ 0,00';
    }

    function formatArticlePrice(value) {
      return value.trim().replace(/[€\s]/g, '') || '0,00';
    }

    function selectCard(card) {
      activeCard = card;
      SelettoreCartello.setActive(card === 'bottom' ? 'selectBottom' : 'selectTop');
      syncControls();
    }

    // Selettore pronto CARTELLO SUPERIORE / INFERIORE (selettore-cartello.js): 1 = superiore, 2 = inferiore.
    function selectCardIndex(cardIndex) {
      selectCard(cardIndex === 2 ? 'bottom' : 'top');
    }

    function setMode(mode) {
      const isTemaItaliaActive = document.querySelector('.made-in-italy-btn.is-active');
      if (
        mode !== 'standard' &&
        isTemaItaliaActive &&
        typeof window.deactivateTemaItalia === 'function'
      ) {
        window.deactivateTemaItalia();
      }

      const state = cardStates[activeCard];
      state.mode = mode;
      Selettore.attiva('modeSelector', mode);
      document.getElementById('standardFields').hidden = mode !== 'standard';
      document.getElementById('doublePriceFields').hidden = mode !== 'double';
      document.getElementById('doubleArticleFields').hidden = mode !== 'doubleArticle';
      renderCard(activeCard);
    }

    function setArticlePriceMode(mode) {
      const state = cardStates[activeCard];
      state.articlePriceMode = mode;
      Selettore.attiva('articleModeSelector', mode);
      document.getElementById('doubleArticleFields').classList.toggle('is-double-price', mode === 'double');
      renderCard(activeCard);
    }

    function applyDescriptionPreset() {
      document.getElementById('description').value = document.getElementById('descriptionPreset').value;
      updateCards();
    }

    function applyArticleDescriptionPreset(articleKey) {
      document.getElementById(`${articleKey}Description`).value =
        document.getElementById(`${articleKey}DescriptionPreset`).value;
      updateCards();
    }

    function updateDescription() {
      document.getElementById('descriptionPreset').value = '';
      updateCards();
    }

    function updateArticleDescription(articleKey) {
      document.getElementById(`${articleKey}DescriptionPreset`).value = '';
      updateCards();
    }

    function syncControls() {
      const state = cardStates[activeCard];
      document.getElementById('description').value = state.description;
      document.getElementById('descriptionPreset').value = state.descriptionPreset;
      document.getElementById('price').value = state.price;
      document.getElementById('oldPrice').value = state.oldPrice;
      document.getElementById('discount').value = state.discount;
      document.getElementById('finalPrice').value = state.finalPrice;
      Selettore.attiva('modeSelector', state.mode);
      document.getElementById('standardFields').hidden = state.mode !== 'standard';
      document.getElementById('doublePriceFields').hidden = state.mode !== 'double';
      document.getElementById('doubleArticleFields').hidden = state.mode !== 'doubleArticle';
      Selettore.attiva('articleModeSelector', state.articlePriceMode);
      document.getElementById('doubleArticleFields').classList.toggle('is-double-price', state.articlePriceMode === 'double');
      for (const articleKey of ['first', 'second']) {
        const articleState = state.articles[articleKey];
        document.getElementById(`${articleKey}Description`).value = articleState.description;
        document.getElementById(`${articleKey}DescriptionPreset`).value = articleState.descriptionPreset;
        document.getElementById(`${articleKey}Price`).value = articleState.price;
        document.getElementById(`${articleKey}OldPrice`).value = articleState.oldPrice;
        document.getElementById(`${articleKey}Discount`).value = articleState.discount;
        document.getElementById(`${articleKey}FinalPrice`).value = articleState.finalPrice;
      }
    }

    function updateCards() {
      const state = cardStates[activeCard];
      state.description = document.getElementById('description').value.trim();
      state.descriptionPreset = document.getElementById('descriptionPreset').value;
      state.price = document.getElementById('price').value;
      state.oldPrice = document.getElementById('oldPrice').value;
      state.discount = document.getElementById('discount').value;
      state.finalPrice = document.getElementById('finalPrice').value;
      for (const articleKey of ['first', 'second']) {
        const articleState = state.articles[articleKey];
        articleState.description = document.getElementById(`${articleKey}Description`).value.trim();
        articleState.descriptionPreset = document.getElementById(`${articleKey}DescriptionPreset`).value;
        articleState.price = document.getElementById(`${articleKey}Price`).value;
        articleState.oldPrice = document.getElementById(`${articleKey}OldPrice`).value;
        articleState.discount = document.getElementById(`${articleKey}Discount`).value;
        articleState.finalPrice = document.getElementById(`${articleKey}FinalPrice`).value;
      }
      renderCard(activeCard);
    }

    function renderDescription(title, description) {
      const normalizedDescription = description.trim();
      title.classList.toggle(
        'is-long-description',
        longDescriptions.has(normalizedDescription) || normalizedDescription.length >= longDescriptionLengthThreshold
      );
      const descriptionParts = description.split(/\s+•\s+/);
      title.replaceChildren();
      title.append(document.createTextNode(descriptionParts[0]));
      if (descriptionParts.length > 1) {
        const separator = document.createElement('span');
        separator.className = 'separator';
        separator.textContent = ' · ';
        title.append(separator);
        const descriptionTail = document.createElement('span');
        descriptionTail.className = 'description-tail';
        descriptionTail.textContent = descriptionParts.slice(1).join(' • ');
        title.append(descriptionTail);
      }
    }

    function renderCard(cardName) {
      const state = cardStates[cardName];
      const card = document.getElementById(cardName === 'top' ? 'cardTop' : 'cardBottom');
      const isDoublePrice = state.mode === 'double';
      const isDoubleArticle = state.mode === 'doubleArticle';

      card.classList.toggle('is-double-price', isDoublePrice);
      card.classList.toggle('is-double-article', isDoubleArticle);
      card.classList.toggle('is-article-double-price', isDoubleArticle && state.articlePriceMode === 'double');
      renderDescription(card.querySelector('.card-content > .card-title'), state.description);
      for (const [index, articleKey] of ['first', 'second'].entries()) {
        const articleState = state.articles[articleKey];
        const item = card.querySelectorAll('.dual-item')[index];
        renderDescription(item.querySelector('.dual-item-title'), articleState.description);
        item.querySelector('.dual-item-price').textContent =
          formatArticlePrice(state.articlePriceMode === 'double' ? articleState.finalPrice : articleState.price);
        item.querySelector('.price-old').textContent = formatArticlePrice(articleState.oldPrice);
        item.querySelector('.price-percent').textContent = `-${articleState.discount || '0'}%`;
      }
      card.querySelector('.card-price').textContent = formatPrice(isDoublePrice ? state.finalPrice : state.price);
      card.querySelector('.card-content > .card-price-row .price-old').textContent = formatPrice(state.oldPrice);
      card.querySelector('.card-content > .card-price-row .price-percent').textContent = `-${state.discount || '0'}%`;
    }

    window.applyTemaItaliaDescription = function applyTemaItaliaDescription() {
      for (const cardName of ['top', 'bottom']) {
        cardStates[cardName].mode = 'standard';
        cardStates[cardName].description = 'Made in Italy';
        cardStates[cardName].descriptionPreset = 'Made in Italy';
        document.getElementById(cardName === 'top' ? 'cardTop' : 'cardBottom')
          .classList.add('is-made-in-italy');
        renderCard(cardName);
      }
      syncControls();
    };

    window.captureTemaItaliaState = function captureTemaItaliaState() {
      return {
        activeCard,
        cards: {
          top: { ...cardStates.top },
          bottom: { ...cardStates.bottom }
        }
      };
    };

    window.restoreTemaItaliaState = function restoreTemaItaliaState(state) {
      if (!state || !state.cards || !state.cards.top || !state.cards.bottom) {
        console.error('Impossibile ripristinare lo stato precedente del cartello Paletto.');
        return;
      }
      Object.assign(cardStates.top, state.cards.top);
      Object.assign(cardStates.bottom, state.cards.bottom);
      activeCard = state.activeCard === 'bottom' ? 'bottom' : 'top';
      document.getElementById('cardTop').classList.remove('is-made-in-italy');
      document.getElementById('cardBottom').classList.remove('is-made-in-italy');
      SelettoreCartello.setActive(activeCard === 'bottom' ? 'selectBottom' : 'selectTop');
      renderCard('top');
      renderCard('bottom');
      syncControls();
    };

    syncControls();
    updateCards();
    renderCard('bottom');
  </script>
  <script src="../assets/js/cursore.js?v=20261009-25"></script>
  <script>
    // Cursore: sopra il cartello scelto (superiore/inferiore) e sugli elementi legati al campo in uso.
    const activePalettoCard = () => document.getElementById(activeCard === 'bottom' ? 'cardBottom' : 'cardTop');
    const inPaletto = selector => () => activePalettoCard()?.querySelector(selector);

    // doppio prezzo: sopra prezzo originale e sconto il cursore sta un po' più in alto (punta a 2 mm)
    const DOUBLE_PRICE_GAP = 2 * 96 / 25.4;
    Cursore.create({
      panel: '.controls',
      watch: '.print-sheet',
      scope: activePalettoCard,
      obstacles: () => activePalettoCard()?.querySelectorAll('.card-title, .price-old, .price-percent, .card-price, .dual-item-price, .card-logo, .paletto-made-in-italy-flag') || [],
      rules: [
        { controls: '#selectTop, #selectBottom', target: activePalettoCard, placement: 'above' },
        { controls: '#standardMode, #price', target: inPaletto('.card-price') },
        { controls: '#doublePriceMode', target: inPaletto('.card-price-row'), gap: DOUBLE_PRICE_GAP },
        { controls: '#doubleArticleMode, #articleStandardMode, #articleDoublePriceMode', target: inPaletto('.dual-items') },
        { controls: '#descriptionPreset, #description', target: inPaletto('.card-content > .card-title') },
        { controls: '#oldPrice', target: inPaletto('.card-price-row .price-old'), gap: DOUBLE_PRICE_GAP },
        { controls: '#discount', target: inPaletto('.card-price-row .price-percent'), gap: DOUBLE_PRICE_GAP },
        { controls: '#finalPrice', target: inPaletto('.card-price') },
        { controls: '#firstDescriptionPreset, #firstDescription', target: inPaletto('.dual-item:nth-child(1) .dual-item-title') },
        { controls: '#firstPrice, #firstFinalPrice', target: inPaletto('.dual-item:nth-child(1) .dual-item-price') },
        { controls: '#firstOldPrice', target: inPaletto('.dual-item:nth-child(1) .price-old'), gap: DOUBLE_PRICE_GAP },
        { controls: '#firstDiscount', target: inPaletto('.dual-item:nth-child(1) .price-percent'), gap: DOUBLE_PRICE_GAP },
        { controls: '#secondDescriptionPreset, #secondDescription', target: inPaletto('.dual-item:nth-child(2) .dual-item-title') },
        { controls: '#secondPrice, #secondFinalPrice', target: inPaletto('.dual-item:nth-child(2) .dual-item-price') },
        { controls: '#secondOldPrice', target: inPaletto('.dual-item:nth-child(2) .price-old'), gap: DOUBLE_PRICE_GAP },
        { controls: '#secondDiscount', target: inPaletto('.dual-item:nth-child(2) .price-percent'), gap: DOUBLE_PRICE_GAP }
      ]
    });
  </script>
  <script src="../assets/js/strumenti-stampa.js?v=20261009-25"></script>
  <script defer src="../assets/js/stampa-ios.js?v=20261009-25"></script>
