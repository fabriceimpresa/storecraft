<!DOCTYPE html>
<html lang="it" data-negozio="ophilya">
<head>
  <meta charset="UTF-8">
  <script src="../assets/js/negozi.js?v=20261022-03"></script>
  <!-- tema CHIARO / SCURO scelto nella dashboard (colori nella scheda del negozio) -->
  <script src="../assets/js/theme.js?v=20261022-03"></script>
  <link rel="stylesheet" href="../assets/css/chiudi-pagina.css?v=20261022-03">
  <!-- caratteri e aspetto della Cronologia di Stampa, comuni alle pagine dei loghi personali dei tre negozi -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/loghi-personali.css?v=20261022-03">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestisci Lista · OPHILYA</title>
  <script src="../assets/js/loghi-personalizzati.js?v=20261022-03"></script>
</head>
<body data-layout="loghi">

  <header class="lp-testata">
    <div class="lp-marchio">STORE // CRAFT</div>
    <h1 class="lp-titolo">Gestisci Lista</h1>
    <div class="lp-chiudi-posto">
      <a href="index.html?store=ophilya" class="app-close-btn app-close-btn--pdf" title="Chiudi e torna al menu" aria-label="Chiudi e torna al menu">✕</a>
    </div>
  </header>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
      <div class="modal-warning-icon">⚠</div>
      <p class="modal-message" id="confirmModalMessage"></p>
      <div class="modal-actions" id="modalActionsContainer"></div>
    </div>
  </div>

  <div class="container">
    <h2 class="lp-parte">Backup della lista</h2>

    <div class="backup-actions">
      <button type="button" class="btn-backup btn-export" onclick="exportCustomLogos()">⬇ ESPORTA LOGHI</button>
      <button type="button" class="btn-backup btn-import" onclick="document.getElementById('importFileInput').click()">⬆ IMPORTA LOGHI</button>
      <button type="button" class="btn-backup btn-clear" style="margin-left: auto;" onclick="clearCustomLogos()"><span style="font-size:1.3em;">⊘</span> CANCELLA LOGHI</button>
      <input type="file" id="importFileInput" accept="application/json,.json" style="display:none;" onchange="importCustomLogos(this.files[0]); this.value = '';">
    </div>

    <!-- ELENCO LOGHI GIÀ AGGIUNTI CON ANTEPRIMA E MODIFICA -->
    <div class="saved-list">
      <div class="saved-list-header">
        <h2>La tua Lista Personale<span class="list-store" data-nome-negozio></span></h2>
        <div class="sort-actions">
          <button type="button" class="btn-sort" id="sortAlphabetical" onclick="setLogoSortOrder('alphabetical')">A-Z</button>
          <button type="button" class="btn-sort active" id="sortChronological" onclick="setLogoSortOrder('chronological')">Data creazione</button>
        </div>
      </div>
      <p class="sort-hint" id="dragHint">Trascina l'icona ⠿ per riordinare manualmente i loghi.</p>
      <div id="customLogosContainer"></div>
    </div>
  </div>

  <script>
    let logoSortOrder = 'chronological';
    let pendingConfirmResolve = null;

    // La lista è quella del negozio della pagina (loghi-personalizzati.js); se il salvataggio non riesce lo si dice
    // e la lista resta com'era.
    async function saveLogoList(logos) {
      try {
        await LoghiPersonalizzati.salva(logos);
        return true;
      } catch (error) {
        console.error('Salvataggio dei loghi personali fallito.', error);
        alert('Salvataggio dei loghi personali non riuscito: ' + (error && error.message ? error.message : error));
        return false;
      }
    }

    // Il backup porta il nome del negozio, così importandolo in un altro negozio la pagina lo dice.
    function exportCustomLogos() {
      const logos = LoghiPersonalizzati.elenco();
      const backup = {
        version: 1,
        negozio: LoghiPersonalizzati.negozio,
        exportedAt: new Date().toISOString(),
        logos
      };
      const file = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const downloadUrl = URL.createObjectURL(file);
      const link = document.createElement('a');

      link.href = downloadUrl;
      link.download = `storecraft-loghi-personali-${LoghiPersonalizzati.negozio}.json`;
      link.click();
      URL.revokeObjectURL(downloadUrl);
    }

    function showConfirmModal(message, mode = 'clear-all') {
      return new Promise(resolve => {
        document.getElementById('confirmModalMessage').textContent = message;
        const actionsContainer = document.getElementById('modalActionsContainer');
        actionsContainer.replaceChildren();

        const addButton = (label, className, onClick) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `modal-btn ${className}`;
          button.textContent = label;
          button.addEventListener('click', onClick);
          actionsContainer.appendChild(button);
        };

        if (mode === 'import') {
          addButton('Annulla', 'modal-btn-backup', () => closeConfirmModal(false));
          addButton('Unisci', 'modal-btn-import-custom', () => closeConfirmModal('unisci'));
          addButton('Sostituisci Lista', 'modal-btn-confirm', () => closeConfirmModal('sostituisci'));
        } else if (mode === 'delete-single') {
          addButton('Annulla', 'modal-btn-cancel', () => closeConfirmModal(false));
          addButton('Cancella logo', 'modal-btn-confirm', () => closeConfirmModal(true));
        } else {
          addButton('Annulla', 'modal-btn-cancel', () => closeConfirmModal(false));
          addButton('⬇ Backup', 'modal-btn-backup', exportCustomLogos);
          addButton('Cancella Loghi', 'modal-btn-confirm', () => closeConfirmModal(true));
        }

        document.getElementById('confirmModal').classList.add('active');
        pendingConfirmResolve = resolve;
      });
    }

    function closeConfirmModal(result) {
      document.getElementById('confirmModal').classList.remove('active');
      if (pendingConfirmResolve) {
        pendingConfirmResolve(result);
        pendingConfirmResolve = null;
      }
    }

    async function clearCustomLogos() {
      const logos = LoghiPersonalizzati.elenco();
      if (logos.length === 0) {
        alert('Non ci sono loghi personali da rimuovere.');
        return;
      }

      const confirmed = await showConfirmModal('Vuoi rimuovere tutti i loghi personali salvati? Esporta prima un backup per poterli ripristinare.');
      if (confirmed && await saveLogoList([])) {
        renderSavedLogos();
      }
    }

    // Importazione di un backup: Unisci aggiunge i loghi del backup che non sono già nella lista (stesso id),
    // Sostituisci Lista mette il backup al posto di tutta la lista. Un backup di un altro negozio va confermato.
    function importCustomLogos(file) {
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(event) {
        let backup;

        try {
          backup = JSON.parse(event.target.result);
        } catch {
          alert('Il file selezionato non e un backup JSON valido.');
          return;
        }

        if (!backup || backup.version !== 1 || !Array.isArray(backup.logos) || !backup.logos.every(isValidCustomLogo)) {
          alert('Il file selezionato non contiene un backup di Loghi Storecraft valido.');
          return;
        }

        const negozio = LoghiPersonalizzati.nomeNegozio(LoghiPersonalizzati.negozio);
        const altroNegozio = backup.negozio && backup.negozio !== LoghiPersonalizzati.negozio
          ? `Attenzione: questo backup è del negozio ${LoghiPersonalizzati.nomeNegozio(backup.negozio)} e lo stai importando nella lista di ${negozio}. `
          : '';
        const choice = await showConfirmModal(
          `${altroNegozio}Unisci aggiunge i ${backup.logos.length} loghi del backup che non sono già nella lista di ${negozio}; Sostituisci Lista cancella la lista attuale e la sostituisce con il backup.`,
          'import'
        );
        if (!choice) {
          return;
        }

        let logos = backup.logos;
        let added = logos.length;
        if (choice === 'unisci') {
          const current = LoghiPersonalizzati.elenco();
          const ids = new Set(current.map(logo => logo.id));
          const nuovi = backup.logos.filter(logo => !ids.has(logo.id));
          added = nuovi.length;
          logos = current.concat(nuovi);
        }
        if (!await saveLogoList(logos)) return;
        renderSavedLogos();
        alert(choice === 'unisci'
          ? `Loghi personali uniti: ${added} aggiunti.`
          : 'Loghi personali importati con successo.');
      };
      reader.readAsText(file);
    }

    function isValidCustomLogo(logo) {
      return logo
        && typeof logo.id === 'string'
        && typeof logo.name === 'string'
        && typeof logo.data === 'string'
        && logo.data.startsWith('data:image/');
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    function renderSavedLogos() {
      const container = document.getElementById('customLogosContainer');
      const logos = LoghiPersonalizzati.elenco();
      const sortedLogos = logos.map((item, index) => ({ item, index }));

      if (logoSortOrder === 'alphabetical') {
        sortedLogos.sort((first, second) => first.item.name.localeCompare(second.item.name, 'it', { sensitivity: 'base' }));
      }

      document.getElementById('sortAlphabetical').classList.toggle('active', logoSortOrder === 'alphabetical');
      document.getElementById('sortChronological').classList.toggle('active', logoSortOrder === 'chronological');

      if (logos.length === 0) {
        container.innerHTML = '<p class="lp-vuota">Nessun logo personale salvato.</p>';
        return;
      }

      container.innerHTML = sortedLogos.map(({ item, index }) => `
        <div class="saved-item drag-enabled" draggable="true" data-index="${index}">
          <span class="drag-handle" title="Trascina per riordinare">⠿</span>
          <div class="saved-item-preview">
            <img src="${item.data}" alt="${escapeHtml(item.name)}">
          </div>
          <div class="saved-item-details">
            <input type="text" id="editName_${index}" value="${escapeHtml(item.name)}">
          </div>
          <div class="saved-item-actions">
            <button class="btn-update" onclick="updateLogoName(${index})">Aggiorna Nome</button>
            <button class="btn-delete" onclick="deleteLogo(${index})">Elimina</button>
          </div>
        </div>
      `).join('');

      attachDragHandlers(container);
    }

    function attachDragHandlers(container) {
      let draggedItem = null;

      container.querySelectorAll('.saved-item[draggable="true"]').forEach(item => {
        item.addEventListener('dragstart', (event) => {
          draggedItem = item;
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', item.dataset.index);
          setTimeout(() => item.classList.add('dragging'), 0);
        });

        item.addEventListener('dragend', () => {
          item.classList.remove('dragging');
          draggedItem = null;
          container.querySelectorAll('.saved-item').forEach(el => el.classList.remove('drag-over-top', 'drag-over-bottom'));
        });

        item.addEventListener('dragover', (event) => {
          event.preventDefault();
          event.stopPropagation();
          event.dataTransfer.dropEffect = 'move';
          if (item === draggedItem) return;

          const isBelowMiddle = isPointerBelowMiddle(item, event.clientY);
          item.classList.toggle('drag-over-bottom', isBelowMiddle);
          item.classList.toggle('drag-over-top', !isBelowMiddle);
        });

        item.addEventListener('dragleave', (event) => {
          if (!item.contains(event.relatedTarget)) {
            item.classList.remove('drag-over-top', 'drag-over-bottom');
          }
        });

        item.addEventListener('drop', (event) => {
          event.preventDefault();
          event.stopPropagation();
          const droppedBelowMiddle = isPointerBelowMiddle(item, event.clientY);
          item.classList.remove('drag-over-top', 'drag-over-bottom');

          const fromIndex = parseInt(event.dataTransfer.getData('text/plain'), 10);
          const targetIndex = parseInt(item.dataset.index, 10);
          if (Number.isNaN(fromIndex) || Number.isNaN(targetIndex) || fromIndex === targetIndex) return;

          reorderCustomLogos(fromIndex, targetIndex, droppedBelowMiddle);
        });
      });

      // Copre lo spazio vuoto sotto l'ultimo elemento: se il rilascio avviene lì,
      // il logo trascinato viene spostato in fondo alla lista.
      container.addEventListener('dragover', (event) => {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
        container.querySelectorAll('.saved-item').forEach(el => el.classList.remove('drag-over-top', 'drag-over-bottom'));

        const items = container.querySelectorAll('.saved-item[draggable="true"]');
        const lastItem = items[items.length - 1];
        if (lastItem) {
          lastItem.classList.add('drag-over-bottom');
        }
      });

      container.addEventListener('drop', (event) => {
        event.preventDefault();
        container.querySelectorAll('.saved-item').forEach(el => el.classList.remove('drag-over-top', 'drag-over-bottom'));

        const fromIndex = parseInt(event.dataTransfer.getData('text/plain'), 10);
        if (Number.isNaN(fromIndex)) return;

        moveCustomLogoToEnd(fromIndex);
      });
    }

    function isPointerBelowMiddle(item, pointerY) {
      const bounds = item.getBoundingClientRect();
      return pointerY > bounds.top + bounds.height / 2;
    }

    async function reorderCustomLogos(fromIndex, targetIndex, insertAfter) {
      const logos = LoghiPersonalizzati.elenco();
      if (fromIndex < 0 || fromIndex >= logos.length || targetIndex < 0 || targetIndex >= logos.length) return;

      const [movedLogo] = logos.splice(fromIndex, 1);
      let insertIndex = targetIndex > fromIndex ? targetIndex - 1 : targetIndex;
      if (insertAfter) insertIndex += 1;

      logos.splice(insertIndex, 0, movedLogo);
      if (!await saveLogoList(logos)) return;
      // Il drag-and-drop riordina l'ordine reale (data creazione): se l'utente
      // trascina mentre è in vista alfabetica, passiamo automaticamente a
      // "Data creazione" così l'ordine manuale appena impostato resta visibile.
      logoSortOrder = 'chronological';
      renderSavedLogos();
    }

    async function moveCustomLogoToEnd(fromIndex) {
      const logos = LoghiPersonalizzati.elenco();
      if (fromIndex < 0 || fromIndex >= logos.length) return;

      const [movedLogo] = logos.splice(fromIndex, 1);
      logos.push(movedLogo);
      if (!await saveLogoList(logos)) return;
      logoSortOrder = 'chronological';
      renderSavedLogos();
    }

    function setLogoSortOrder(sortOrder) {
      logoSortOrder = sortOrder;
      renderSavedLogos();
    }

    async function updateLogoName(index) {
      const newName = document.getElementById(`editName_${index}`).value.trim();
      if (!newName) {
        alert("Il nome non può essere vuoto!");
        return;
      }

      const logos = LoghiPersonalizzati.elenco();
      logos[index] = { ...logos[index], name: newName.toUpperCase() };
      if (await saveLogoList(logos)) renderSavedLogos();
    }

    async function deleteLogo(index) {
      const confirmed = await showConfirmModal("Sei sicuro di voler eliminare questo logo personale?", 'delete-single');
      if (confirmed) {
        const logos = LoghiPersonalizzati.elenco();
        logos.splice(index, 1);
        if (await saveLogoList(logos)) renderSavedLogos();
      }
    }

    // La lista si mostra quando è pronta e si aggiorna se cambia in un'altra scheda.
    window.onload = () => LoghiPersonalizzati.pronto.then(renderSavedLogos);
    window.addEventListener('loghipersonalizzati', renderSavedLogos);
  </script>
</body>
</html>
