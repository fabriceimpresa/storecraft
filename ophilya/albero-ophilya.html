<!DOCTYPE html>
<html lang="it" data-negozio="ophilya">
<head>
  <meta charset="UTF-8">
  <script src="../assets/js/negozi.js?v=20261022-05"></script>
  <!-- modulo sorgente, scritto a codice partendo da TEBE (non è un clone: non si cancella dalle utilità) -->
  <meta name="storecraft-derivata" content="tebe/albero.html">
  <!-- tema CHIARO / SCURO scelto nella dashboard (colori nella scheda del negozio) -->
  <script src="../assets/js/theme.js?v=20261022-05"></script>
  <link rel="stylesheet" href="../assets/css/chiudi-pagina.css?v=20261022-05">
  <link rel="stylesheet" href="../assets/css/torna-al-menu.css?v=20261022-05">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/font-arial.css?v=20261022-05">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
  <title>Albero Accessori · OPHILYA</title>
  <link rel="stylesheet" href="../assets/css/pannello.css?v=20261022-05">
  <script defer src="../assets/js/campi-prezzo.js?v=20261022-05"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      gap: 20px;
      justify-content: center;
      padding: 20px;
      position: relative;
      background: var(--interface-page);
      color: var(--interface-text);
      font-family: Arial, sans-serif;
    }




    /* Il pannello segue il pannello standard (../assets/css/pannello.css): blocchi, selettori, menu e campi comuni. */

    .preview-area {
      flex: 0 0 210mm;
      width: 210mm;
      display: flex;
      align-items: flex-start;
      overflow: auto;
    }

    .print-sheet {
      position: relative;
      width: 210mm;
      height: 297mm;
      flex: 0 0 auto;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 2px 6px rgba(40, 34, 28, .24);
    }

    /* Cartellino OPHILYA da 192 × 98 mm, piegato a soffietto come i cartelli in morsa di TEBE: fronte e retro
       attaccati al centro dell'A4 (la piega cade a metà foglio); il retro è ruotato di 180° e, piegato, si legge dritto */
    .tree-sign {
      position: absolute;
      left: 9mm;
      width: 192mm;
      height: 98mm;
      overflow: hidden;
      border: 0.25mm solid #8f8983;
      background: #fff;
      text-align: center;
    }

    .tree-sign:nth-child(1) { top: 50.5mm; }
    .tree-sign:nth-child(2) {
      top: 148.5mm;
      /* la linea della piega è il bordo inferiore del fronte: niente doppia linea */
      border-bottom: none;
      transform: rotate(180deg);
    }

    .sign-description {
      position: absolute;
      top: 14.92mm;
      right: 3mm;
      left: 3mm;
      overflow: hidden;
      color: #000;
      font: 400 24.48pt/1.1 Arial, Helvetica, sans-serif;
      letter-spacing: -0.05em;
      text-overflow: clip;
      white-space: nowrap;
    }

    .sign-price {
      position: absolute;
      top: 27.62mm;
      right: 2mm;
      left: 2mm;
      overflow: hidden;
      color: #000;
      font: 400 76.7pt/1 Arial, Helvetica, sans-serif;
      letter-spacing: -0.05em;
      white-space: nowrap;
    }

    /* logo alla stessa distanza dal bordo alto di prima (fondo del logo a 63,11 mm dall'alto) */
    .sign-logo {
      position: absolute;
      bottom: 34.89mm;
      left: 50%;
      /* logo OPHILYA oro, un poco più grande del logo TEBE di Albero Accessori */
      width: 31mm;
      height: auto;
      object-fit: contain;
      transform: translateX(-50%);
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html, body {
        width: 210mm;
        height: 297mm !important;
        max-height: 297mm !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        background: #fff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      body { display: block; }
      .sidebar, .app-close-btn, .floating-nav-box { display: none !important; }

      .preview-area {
        display: block;
        width: 210mm;
        height: 297mm;
        overflow: hidden;
      }

      .print-sheet {
        width: 210mm;
        height: 297mm !important;
        margin: 0;
        box-shadow: none;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
      }
    }

    @media (max-width: 760px) {
      body { padding: 12px; }
      .sidebar { flex-basis: 300px; }
      .preview-area { padding-bottom: 12px; }
    }

  </style>
  <link rel="stylesheet" href="../assets/css/strumenti-stampa.css?v=20261022-05">
  <link rel="stylesheet" href="../assets/css/cursore.css?v=20261022-05">
  <link rel="stylesheet" href="../assets/css/menu-cascata.css?v=20261022-05">
  <script defer src="../assets/js/menu-cascata.js?v=20261022-05"></script>
  <link rel="stylesheet" href="../assets/css/responsive.css?v=20261022-05">
  <script defer src="../assets/js/responsive.js?v=20261022-05"></script>
</head>
<body data-layout="cartelli">
  <a href="index.html?store=ophilya" class="app-close-btn" title="Chiudi e torna al menu principale">✕</a>

  <div class="floating-nav-box">
    <div class="floating-nav-title">OPHILYA</div>
    <a href="index.html?store=ophilya" class="floating-nav-btn">← Torna al Menu Principale</a>
  </div>

  <aside class="sidebar">
    <section class="controls" aria-labelledby="pageTitle">
      <h1 id="pageTitle">Albero Accessori</h1>

      <!-- Blocco 1 omesso: fronte e retro dello stesso cartellino, niente CARTELLO SUPERIORE / INFERIORE -->

      <!-- Blocco 2 omesso: il cartellino non ha brand né claim -->

      <!-- Blocco 3: campi del cartellino (testo e prezzo, uguali su fronte e retro) -->
      <div class="panel-block">
        <div class="form-group">
          <label class="section-label" for="descPreset">TESTI PRONTI</label>
          <div class="preset-select">
            <select id="descPreset" class="ready-text-complete" onchange="applyDescPreset()" data-testi-pronti="Promozioni,Articoli">
              <option value="" class="ready-text-placeholder">-- Seleziona Testo Pronto --</option>
            </select>
          </div>
          <label for="descriptionInput">Testo Libero</label>
          <input id="descriptionInput" type="text" value="Foulard" maxlength="37" placeholder="-- Testo Libero --" oninput="updateActiveSign()">
        </div>

        <div class="form-group">
          <label for="priceInput">Prezzo</label>
          <input data-prezzo id="priceInput" type="text" inputmode="decimal" value="10,00" placeholder="10,00" maxlength="20" oninput="updateActiveSign()">
        </div>
      </div>

      <!-- Blocco 4: stampa -->
      <div class="panel-block">
        <button class="btn-print" id="printBtn" type="button" onclick="window.print()">STAMPA CARTELLO</button>
      </div>
    </section>
  </aside>

  <main class="preview-area">
    <div class="print-sheet" aria-label="Anteprima del foglio A4 con il cartellino, fronte e retro">
      <section class="tree-sign" aria-label="Fronte">
        <div class="sign-description" id="descriptionPreview0">Foulard</div>
        <div class="sign-price" id="pricePreview0">€ 10,00</div>
        <img class="sign-logo" src="../assets/img/ophilya/footerophilya.png" alt="OPHILYA">
      </section>
      <section class="tree-sign" aria-label="Retro">
        <div class="sign-description" id="descriptionPreview1">Foulard</div>
        <div class="sign-price" id="pricePreview1">€ 10,00</div>
        <img class="sign-logo" src="../assets/img/ophilya/footerophilya.png" alt="OPHILYA">
      </section>
    </div>
  </main>

  <script src="../assets/js/testi-pronti.js?v=20261022-05"></script>
  <script>
    // Fronte e retro mostrano lo stesso testo e lo stesso prezzo (il retro è ruotato di 180° nel foglio).
    function updateActiveSign() {
      const description = document.getElementById('descriptionInput').value;
      const price = document.getElementById('priceInput').value;
      for (const i of [0, 1]) {
        document.getElementById(`descriptionPreview${i}`).textContent = description;
        document.getElementById(`pricePreview${i}`).textContent = `€ ${price}`;
      }
    }

    // Testi Pronti (lo stesso menu di Cartellini TEBE: articoli e testi promo) scrive il testo nel campo libero.
    function applyDescPreset() {
      const preset = document.getElementById('descPreset').value;
      if (preset) document.getElementById('descriptionInput').value = preset;
      updateActiveSign();
    }
  </script>
  <script src="../assets/js/cursore.js?v=20261022-05"></script>
  <script>
    // Cursore: sul fronte, sopra o di lato a testo e prezzo quando si usano i campi.
    const frontSign = () => document.querySelector('.tree-sign');

    Cursore.create({
      panel: '.controls',
      watch: '.print-sheet',
      scope: frontSign,
      obstacles: () => frontSign()?.querySelectorAll('.sign-description, .sign-price, .sign-logo') || [],
      rules: [
        { controls: '#descPreset, #descriptionInput', target: () => document.getElementById('descriptionPreview0') },
        { controls: '#priceInput', target: () => document.getElementById('pricePreview0') }
      ]
    });
  </script>
  <script src="../assets/js/strumenti-stampa.js?v=20261022-05"></script>
  <script defer src="../assets/js/stampa-ios.js?v=20261022-05"></script>
</body>
</html>
