<!DOCTYPE html>
<html lang="it" data-negozio="ophilya">
<head>
  <meta charset="UTF-8">
  <script src="../assets/js/negozi.js?v=20261009-34"></script>
  <!-- tema CHIARO / SCURO scelto nella dashboard (colori nella scheda del negozio) -->
  <script src="../assets/js/theme.js?v=20261009-34"></script>
  <link rel="stylesheet" href="../assets/css/chiudi-pagina.css?v=20261009-34">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/font-arial.css?v=20261009-34">
  <title>Creatore Loghi · OPHILYA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--interface-page);
      color: var(--interface-text);
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--interface-surface);
      border: 1px solid var(--interface-border);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(40,34,28,.1);
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--interface-accent-bright);
      border-bottom: 2px solid var(--interface-accent);
      padding-bottom: 8px;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .upload-box {
      border: 2px dashed var(--interface-accent);
      border-radius: 6px;
      padding: 25px;
      text-align: center;
      background: var(--interface-page);
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.2s, border-color 0.2s;
    }

    .upload-box.dragover {
      background: var(--interface-sunken);
      border-color: var(--interface-accent-bright);
    }

    .upload-box:hover { background: var(--interface-sunken); }
    .upload-box input { display: none; }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 5px;
      color: var(--interface-muted);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--interface-border);
      border-radius: 4px;
      background-color: var(--interface-page);
      color: var(--interface-text);
    }

    .preview-section {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      background: var(--interface-sunken);
      padding: 15px;
      border-radius: 6px;
      align-items: center;
      justify-content: space-around;
    }

    .preview-box {
      text-align: center;
    }

    .preview-box p {
      font-size: 0.8rem;
      color: var(--interface-muted);
      margin-bottom: 8px;
    }

    .preview-card {
      width: 200px;
      height: 100px;
      background: #ffffff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border: 1px solid var(--interface-border);
    }

    .preview-card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .btn-save {
      width: 100%;
      background-color: var(--interface-accent);
      color: #fffdfa;
      border: 1px solid var(--interface-accent);
      padding: 10px;
      font-weight: 400;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn-save:hover { background-color: var(--interface-accent-bright); }

    /* LISTA LOGHI SALVATI */
    .saved-list {
      margin-top: 30px;
    }

    .saved-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .saved-list-header h2 {
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--interface-accent-bright);
    }

    .sort-actions {
      display: flex;
      gap: 6px;
    }

    .btn-sort {
      background: var(--interface-page);
      border: 1px solid var(--interface-accent);
      border-radius: 3px;
      color: var(--interface-accent-bright);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 6px 8px;
    }

    .btn-sort:hover,
    .btn-sort.active {
      background: var(--interface-accent);
      color: #fffdfa;
    }

    .saved-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--interface-page);
      padding: 10px 15px;
      border-radius: 4px;
      margin-bottom: 10px;
      border-left: 3px solid var(--interface-accent);
      gap: 15px;
    }

    .saved-item-preview {
      width: 80px;
      height: 40px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      padding: 4px;
      flex-shrink: 0;
      border: 1px solid var(--interface-border);
    }

    .saved-item-preview img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .saved-item-details {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .saved-item-details input {
      padding: 4px 8px;
      background: var(--interface-surface);
      border: 1px solid var(--interface-border);
      color: var(--interface-text);
      border-radius: 3px;
      font-size: 0.9rem;
      width: 100%;
      max-width: 250px;
    }

    .saved-item-actions {
      display: flex;
      gap: 8px;
    }

    .btn-update {
      background: #43586b;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-update:hover { background: #344654; }

    .btn-delete {
      background: #96382b;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-delete:hover { background: #7a2d22; }
    @media screen and (max-width: 600px) and (pointer: coarse) {
      body { padding: 64px 12px 16px; }
      .container { padding: 16px; }
      h1 { font-size: 1rem; letter-spacing: 1.2px; }
      .app-close-btn { top: 10px; right: 10px; width: 44px; height: 44px; z-index: 20; }
      .upload-box { padding: 18px 12px; }
      .preview-section { flex-direction: column; gap: 14px; }
      .preview-card { width: min(200px, 100%); max-width: 100%; }
      .saved-list-header { align-items: flex-start; flex-direction: column; }
      .sort-actions, .saved-item-actions, .backup-actions { flex-wrap: wrap; }
      .saved-item { align-items: flex-start; gap: 10px; padding: 10px; }
      .saved-item-actions > *, .sort-actions > *, .backup-actions > * { min-height: 44px; }
      .saved-item-preview { align-self: center; }
    }
  </style>
  <style>
    /* Negozio della lista, accanto al titolo (scritto da loghi-personalizzati.js) */
    .saved-list-header h2 .list-store { white-space: nowrap; }
  </style>
  <script src="../assets/js/loghi-personalizzati.js?v=20261009-34"></script>
</head>
<body>

  <a href="index.html?store=ophilya" class="app-close-btn" title="Torna all'index" aria-label="Chiudi e torna al menu principale">✕</a>

  <div class="container">
    <h1>AGGIUNGI LOGO BRAND PERSONALIZZATO</h1>

    <!-- AREA UPLOAD CON DRAG AND DROPPING CORRETTO -->
    <div class="upload-box" id="dropZone" onclick="document.getElementById('fileInput').click()">
      📂 <strong>Clicca o Trascina qui l'immagine del Logo</strong>
      <p style="font-size:0.9rem; color:var(--interface-muted); margin-top:5px;">(Funziona con sfondi Bianchi o Neri)</p>
      <input type="file" id="fileInput" accept="image/*" onchange="processImage(this.files[0])">
    </div>

    <!-- IMPOSTAZIONI E INPUT -->
    <div class="form-group">
      <label>Nome del Brand:</label>
      <input type="text" id="brandNameInput" placeholder="Es. NIKE, ZARA, MIO BRAND" oninput="this.value = this.value.toUpperCase()" style="text-transform: uppercase;">
    </div>


    <!-- ANTEPRIMA RISULTATO -->
    <div class="preview-section" id="previewArea" style="display:none;">
      <div class="preview-box">
        <p>Anteprima su Cartello</p>
        <div class="preview-card">
          <img id="processedPreview" src="" alt="Anteprima Logo">
        </div>
      </div>
    </div>

    <button class="btn-save" id="btnSave" style="display:none;" onclick="saveCustomLogo()">💾 SALVA NEI BRAND PERSONALIZZATI</button>

    <div style="margin-top: 20px;  margin-bottom: 20px;"></div>
    <!-- ELENCO LOGHI GIÀ AGGIUNTI CON ANTEPRIMA E MODIFICA -->
    <div class="saved-list">
      <div class="saved-list-header">
        <h2>La tua Lista Personale<span class="list-store" data-nome-negozio></span> <a href="gestisci_lista.html" class="btn-sort btn-manage"><span style="font-size:2em; line-height:1;">⚙</span></a></h2>
        <div class="sort-actions">
          <button type="button" class="btn-sort" id="sortAlphabetical" onclick="setLogoSortOrder('alphabetical')">A-Z</button>
          <button type="button" class="btn-sort active" id="sortChronological" onclick="setLogoSortOrder('chronological')">Data creazione</button>
        </div>
      </div>
      <div id="customLogosContainer"></div>
    </div>
  </div>

  <script>
    let processedBase64 = "";
    let rawImage = null;
    let logoSortOrder = 'chronological';

    // Configurazione eventi Drag and Drop
    const dropZone = document.getElementById('dropZone');

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('dragover');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files && files.length > 0) {
        processImage(files[0]);
      }
    }, false);

    function processImage(file) {
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        rawImage = new Image();
        rawImage.onload = function() {
          runColorToAlpha();
        };
        rawImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function runColorToAlpha() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = rawImage.width;
      canvas.height = rawImage.height;

      ctx.drawImage(rawImage, 0, 0);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      const topLeftR = data[0], topLeftG = data[1], topLeftB = data[2];
      const avgBrightness = (topLeftR + topLeftG + topLeftB) / 3;
      const finalMode = avgBrightness > 127 ? 'white' : 'black';

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        const brightness = (r + g + b) / 3;

        if (finalMode === 'black') {
          if (brightness < 60) {
            data[i + 3] = 0;
          } else {
            data[i] = 0;     
            data[i + 1] = 0; 
            data[i + 2] = 0; 
          }
        } else {
          if (brightness > 200) {
            data[i + 3] = 0;
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);
      processedBase64 = canvas.toDataURL('image/png');

      document.getElementById('processedPreview').src = processedBase64;
      document.getElementById('previewArea').style.display = 'flex';
      document.getElementById('btnSave').style.display = 'block';
    }

    // La lista dei loghi personalizzati è quella del negozio (loghi-personalizzati.js); se il salvataggio non riesce
    // lo si dice e la lista resta com'era.
    async function saveLogoList(logos) {
      try {
        await LoghiPersonalizzati.salva(logos);
        return true;
      } catch (error) {
        console.error('Salvataggio dei loghi personalizzati fallito.', error);
        alert('Salvataggio dei loghi personalizzati non riuscito: ' + (error && error.message ? error.message : error));
        return false;
      }
    }

    async function saveCustomLogo() {
      const nameInput = document.getElementById('brandNameInput').value.trim();
      if (!nameInput) {
        alert("Inserisci un nome per il brand prima di salvare!");
        return;
      }

      const existingLogos = LoghiPersonalizzati.elenco();
      existingLogos.push({
        id: 'custom_' + Date.now(),
        name: nameInput.toUpperCase(),
        data: processedBase64
      });

      if (!await saveLogoList(existingLogos)) return;
      
      document.getElementById('brandNameInput').value = '';
      document.getElementById('previewArea').style.display = 'none';
      document.getElementById('btnSave').style.display = 'none';
      rawImage = null;

      renderSavedLogos();
    }


    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    function renderSavedLogos() {
      const container = document.getElementById('customLogosContainer');
      const logos = LoghiPersonalizzati.elenco();
      const sortedLogos = logos.map((item, index) => ({ item, index }));

      if (logoSortOrder === 'alphabetical') {
        sortedLogos.sort((first, second) => first.item.name.localeCompare(second.item.name, 'it', { sensitivity: 'base' }));
      }

      document.getElementById('sortAlphabetical').classList.toggle('active', logoSortOrder === 'alphabetical');
      document.getElementById('sortChronological').classList.toggle('active', logoSortOrder === 'chronological');
      
      if (logos.length === 0) {
        container.innerHTML = '<p style="font-size:0.8rem; color:var(--interface-muted);">Nessun logo personalizzato salvato.</p>';
        return;
      }

      container.innerHTML = sortedLogos.map(({ item, index }) => `
        <div class="saved-item">
          <div class="saved-item-preview">
            <img src="${item.data}" alt="${escapeHtml(item.name)}">
          </div>
          <div class="saved-item-details">
            <input type="text" id="editName_${index}" value="${escapeHtml(item.name)}">
          </div>
          <div class="saved-item-actions">
            <button class="btn-update" onclick="updateLogoName(${index})">Aggiorna Nome</button>
            <button class="btn-delete" onclick="deleteLogo(${index})">Elimina</button>
          </div>
        </div>
      `).join('');
    }

    function setLogoSortOrder(sortOrder) {
      logoSortOrder = sortOrder;
      renderSavedLogos();
    }

    async function updateLogoName(index) {
      const newName = document.getElementById(`editName_${index}`).value.trim();
      if (!newName) {
        alert("Il nome non può essere vuoto!");
        return;
      }

      const logos = LoghiPersonalizzati.elenco();
      logos[index] = { ...logos[index], name: newName.toUpperCase() };
      if (await saveLogoList(logos)) renderSavedLogos();
    }

    async function deleteLogo(index) {
      if (confirm("Sei sicuro di voler eliminare questo logo personalizzato?")) {
        const logos = LoghiPersonalizzati.elenco();
        logos.splice(index, 1);
        if (await saveLogoList(logos)) renderSavedLogos();
      }
    }

    // La lista si mostra quando è pronta e si aggiorna se cambia in un'altra scheda.
    window.onload = () => LoghiPersonalizzati.pronto.then(renderSavedLogos);
    window.addEventListener('loghipersonalizzati', renderSavedLogos);
  </script>
</body>
</html>
