<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <script src="assets/js/negozi.js?v=20261008-57"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STORE // CRAFT</title>
  <!-- Splash page: scelta del punto vendita alla prima apertura della giornata (punto-vendita.js).
       Se oggi è già stato scelto un negozio si va subito alla sua dashboard, tranne quando si arriva dalla voce HOME
       del menu di sistema (index.html?scegli), che chiede di scegliere di nuovo. Si vedono solo i negozi installati in
       questa copia (assets/negozi/installati.js); con un solo negozio la scelta si salta sempre. -->
  <script src="assets/js/punto-vendita.js?v=20261008-57"></script>
  <script>
    if (PuntoVendita.unico()) {
      PuntoVendita.ricorda(PuntoVendita.unico());
      location.replace(PuntoVendita.dashboard(PuntoVendita.unico()));
    } else if (PuntoVendita.sceltoOggi() && !new URLSearchParams(location.search).has('scegli')) {
      location.replace(PuntoVendita.dashboard(PuntoVendita.sceltoOggi()));
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121110;
      --frame: #8f6a1f;          /* oro scuro della cornice */
      --frame-soft: rgba(143, 106, 31, 0.35);
      --gold: #b48b37;           /* oro dei cartelli Luxury */
      --gold-light: #e5ba73;
      --text-muted: #6f6a62;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 32px 16px;
      color: #fff;
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      background:
        radial-gradient(ellipse at center, rgba(180, 139, 55, 0.07) 0%, rgba(18, 17, 16, 0) 60%),
        var(--bg);
    }

    /* Cornice doppia: linea oro scuro e, all'interno, un filetto più tenue */
    .splash-frame {
      position: relative;
      width: min(760px, 100%);
      padding: 56px 48px 52px;
      border: 1px solid var(--frame);
      text-align: center;
      animation: comparsa 0.9s ease-out both;
    }

    .splash-frame::before {
      content: '';
      position: absolute;
      inset: 7px;
      border: 1px solid var(--frame-soft);
      pointer-events: none;
    }

    /* STORE // CRAFT in oro, come nella barra laterale della dashboard */
    .splash-brand {
      display: block;
      width: 170px;
      height: auto;
      margin: 0 auto;
      filter: brightness(0) saturate(100%) invert(73%) sepia(29%) saturate(836%) hue-rotate(352deg) brightness(91%) contrast(87%);
      opacity: 0.9;
    }

    .splash-title {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 34px auto 30px;
      max-width: 520px;
      color: var(--gold-light);
      font-family: 'Cinzel', serif;
      font-weight: 500;
      font-size: 0.78rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .splash-title::before,
    .splash-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--frame-soft);
    }

    .store-list {
      display: grid;
      /* una colonna per negozio installato (--negozi, scritto dallo script in fondo alla pagina) */
      grid-template-columns: repeat(var(--negozi, 3), 1fr);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .store-list li + li {
      border-left: 1px solid var(--frame-soft);
    }

    .store-choice {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      height: 120px;
      padding: 0 18px;
      border: 0;
      background: none;
      cursor: pointer;
      font: inherit;
    }

    /* Loghi in bianco: i file sono neri (TEBE, OPHILYA) o già bianchi (Luxury) */
    .store-choice img {
      display: block;
      max-width: 100%;
      filter: brightness(0) invert(1);
      opacity: 0.88;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    /* larghezza del logo: quella della scheda del negozio (logoSplashLarghezza), scritta dallo script */
    .store-choice img { width: 150px; }

    .store-choice::after {
      content: '';
      width: 0;
      height: 1px;
      background: var(--gold);
      transition: width 0.25s ease;
    }

    .store-choice:not(:disabled):hover img,
    .store-choice:focus-visible img {
      opacity: 1;
      transform: scale(1.04);
    }

    .store-choice:not(:disabled):hover::after,
    .store-choice:focus-visible::after {
      width: 40px;
    }

    .store-choice:focus-visible {
      outline: 1px solid var(--gold);
      outline-offset: -6px;
    }

    .store-choice:disabled {
      cursor: default;
    }

    .store-choice:disabled img {
      opacity: 0.28;
    }

    .store-soon {
      color: var(--text-muted);
      font-size: 0.6rem;
      letter-spacing: 0.24em;
    }

    .store-choice:disabled::after {
      display: none;
    }

    .splash-footer {
      color: var(--text-muted);
      font-size: 0.66rem;
      line-height: 1.7;
      letter-spacing: 0.04em;
      text-align: center;
      opacity: 0.8;
      animation: comparsa 0.9s 0.2s ease-out both;
    }

    @keyframes comparsa {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-frame, .splash-footer { animation: none; }
      .store-choice img, .store-choice::after { transition: none; }
    }

    /* Telefono: negozi uno sotto l'altro */
    @media (max-width: 600px) {
      .splash-frame { padding: 40px 22px 32px; }
      .splash-brand { width: 140px; }
      .splash-title { margin: 28px auto 16px; gap: 10px; font-size: 0.6rem; letter-spacing: 0.16em; white-space: normal; }
      .store-list { grid-template-columns: 1fr; }
      .store-list li + li { border-left: 0; border-top: 1px solid var(--frame-soft); }
      .store-choice { height: 96px; }
    }
  </style>
</head>
<body>
  <main class="splash-frame">
    <img class="splash-brand" src="assets/img/storecraftlogo.png" alt="STORE // CRAFT">
    <h1 class="splash-title">Seleziona il tuo punto vendita</h1>
    <!-- I negozi installati (logo dalla scheda del negozio) li aggiunge lo script in fondo alla pagina -->
    <ul class="store-list"></ul>
  </main>

  <footer class="splash-footer">
    © 2026 STORE // CRAFT · Developed by Fabrizio Notte<br>
    Marchi e loghi appartengono ai rispettivi proprietari
  </footer>

  <script>
    // Un pulsante per ogni negozio installato, con il logo della sua scheda. I negozi già nella struttura si aprono;
    // gli altri restano visibili con IN ARRIVO.
    const lista = document.querySelector('.store-list');
    lista.style.setProperty('--negozi', Object.keys(PuntoVendita.NEGOZI).length);
    Object.entries(PuntoVendita.NEGOZI).forEach(([negozio, dati]) => {
      const voce = document.createElement('li');
      const button = document.createElement('button');
      button.className = 'store-choice';
      button.type = 'button';
      button.dataset.negozio = negozio;
      const logo = document.createElement('img');
      logo.src = dati.logo;
      logo.alt = dati.nome;
      logo.style.width = `${dati.larghezzaLogo}px`;
      button.append(logo);
      voce.append(button);
      lista.append(voce);
      if (dati.pronto) {
        button.addEventListener('click', () => PuntoVendita.scegli(negozio));
        return;
      }
      button.disabled = true;
      button.setAttribute('aria-label', `${dati.nome}, in arrivo`);
      const soon = document.createElement('span');
      soon.className = 'store-soon';
      soon.textContent = 'IN ARRIVO';
      button.append(soon);
    });
  </script>
</body>
</html>
