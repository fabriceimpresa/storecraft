<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<!-- Sorgente di assets/img/legenda.png (legenda dei posti dei loghi di promo_multibrand). Per rigenerarla: aprila e fotografala a 1200 x 735 px, per esempio con Edge: msedge --headless --hide-scrollbars --window-size=1200,735 --screenshot=legenda.png legenda-sorgente.html -->
<style>
  @font-face { font-family: 'Nevis Project'; src: url('../fonts/Nevis Bold.ttf') format('truetype'); font-weight: 700; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 735px; background: #ffffff; overflow: hidden; }
  body { padding: 26px 34px; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Nevis Project', Arial, sans-serif; }
  .tint { filter: brightness(0) saturate(100%) invert(14%) sepia(95%) saturate(6932%) hue-rotate(357deg) brightness(92%) contrast(114%); }

  .board { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 104px 104px; gap: 14px 26px; }
  .slot { position: relative; display: flex; align-items: center; justify-content: center; border: 3px dashed #c9c2b6; border-radius: 10px; padding: 8px 10px 8px 96px; }
  .slot img { max-width: 100%; max-height: 64px; object-fit: contain; }

  /* numero del posto: grande e tondo, nell'oro dei cartelli (#b48b37) con il numero bianco */
  .num { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 76px; height: 76px; border-radius: 50%;
         background: #b48b37; color: #ffffff; font-family: Arial, sans-serif; font-weight: 700; font-size: 50px;
         display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #ffffff, 0 0 0 5px #b48b37; }

  .banner { height: 190px; background: #e00000; color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 150px; letter-spacing: -0.05em; line-height: 1; }

  .bottom { display: grid; grid-template-columns: 350px 1fr 350px; gap: 26px; height: 150px; }
  .bottom .slot { height: 100%; }
  .bottom .slot img { max-height: 96px; }
  .middle { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .middle .sec { color: #e00000; font-size: 54px; letter-spacing: -0.05em; line-height: .95; text-transform: uppercase; }
  .middle .small { background: #e00000; color: #fff; font-size: 32px; white-space: nowrap; letter-spacing: -0.05em; padding: 6px 18px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="board">
    <div class="slot"><span class="num">1</span><img class="tint" src="../logos/PINKO.png" alt=""></div>
    <div class="slot"><span class="num">2</span><img class="tint" src="../logos/EMMAANDGAIA.png" alt=""></div>
    <div class="slot"><span class="num">3</span><img class="tint" src="../logos/MEIMEIJ.png" alt=""></div>
    <div class="slot"><span class="num">4</span><img class="tint" src="../logos/BCBG.png" alt=""></div>
    <div class="slot"><span class="num">5</span><img class="tint" src="../logos/CHIARABONI.png" alt=""></div>
    <div class="slot"><span class="num">6</span><img class="tint" src="../logos/WEILIZHENG.png" alt=""></div>
  </div>
  <div class="banner">50% + 50%</div>
  <div class="bottom">
    <div class="slot"><span class="num">7</span><img class="tint" src="../logos/HAVEONE.png" alt=""></div>
    <div class="middle"><div class="sec">Winter Sale</div><div class="small">On selected items</div></div>
    <div class="slot"><span class="num">8</span><img class="tint" src="../logos/CALVINKLEIN.png" alt=""></div>
  </div>
</body>
</html>
