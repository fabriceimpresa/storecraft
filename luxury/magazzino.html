  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Sfondo principale UI, come le altre pagine dei cartelli */
    body {
      font-family: Arial, sans-serif;
      background-color: #212529;
      padding: 20px;
      display: flex;
      gap: 20px;
      justify-content: safe center;   /* con la finestra stretta la pagina scorre invece di tagliare il pannello */
      align-items: flex-start;
      min-height: 100vh;
      position: relative;
    }

    /* Il pannello segue il pannello standard (../assets/css/pannello.css); qui solo ciò che è proprio della pagina. */

    /* Brand stagionali prioritari evidenziati nel menu Brand */
    .form-group select option.priority-brand-option {
      background-color: #2e2b27;
      color: #e5ba73;
      font-weight: bold;
    }

    /* Selettore della freccia: le frecce un poco più grandi della scritta NESSUNA */
    .arrow-switch button[data-arrow]:not([data-arrow="none"]) { font-size: 1.15rem; line-height: 1; }



    /* FOGLIO ANTEPRIMA */
    .a4-sheet {
      width: 210mm;
      min-height: 297mm;
      height: 297mm;
      background: #ffffff;
      color: #000000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      position: relative;
      flex-shrink: 0;
      transition: height 0.2s ease, min-height 0.2s ease;
    }

    .a4-sheet.single-mode {
      height: 148.5mm !important;
      min-height: 148.5mm !important;
    }

    .cartello-box {
      flex: 1;
      height: 148.5mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 25px 30px 20px 30px;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    .cartello-box:nth-child(2) {
      border-top: 2px dashed #bbb;
    }

    .a4-sheet.single-mode .cartello-box {
      border-bottom: 2px dashed #bbb;
    }

    .brand-area {
      height: 130px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .brand-area img {
      max-width: 420px;
      max-height: 125px;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .brand-area .brand-text-fallback {
      font-family: 'Cinzel', serif;
      font-size: 56px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #000;
      text-align: center;
      line-height: 1;
    }

    /* Posti dei loghi: uno solo, o due affiancati con + AGGIUNGI 2° BRAND */
    .brand-slot {
      flex: 0 0 100%;
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-slot.bis { display: none; }
    .has-2-brands .brand-slot { flex-basis: 50%; }
    .has-2-brands .brand-slot.bis { display: flex; }
    .has-2-brands .brand-area img { max-width: 92%; }
    .has-2-brands .brand-area .brand-text-fallback { font-size: 40px; }

    /* 2° brand acceso ma non ancora scelto: scritta SELEZIONA 2º BRAND nello stesso colore del cursore */
    .brand-area .brand-text-fallback.is-placeholder,
    .has-2-brands .brand-area .brand-text-fallback.is-placeholder {
      font-size: 33px;
      letter-spacing: 1.5px;
      line-height: 1.15;
      color: var(--cursore-colore, #96382b);
    }

    /* Logo e freccia restano fermi: è il testo che si adatta allo spazio tra loro (vedi fitText) */
    .brand-area,
    .arrow-area { flex-shrink: 0; }

    .content-area {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      width: 100%;
      padding: 5px 0;
    }

    .content-area p {
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      font-weight: 800;
      color: #000000;
      text-transform: uppercase;
      line-height: 1.15;
      letter-spacing: 0.5px;
      white-space: pre-line;
    }

    .arrow-area {
      height: 105px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;   /* freccia un poco più vicina al testo */
    }

    /* Unica eccezione: con 4 righe di testo la freccia scende un poco poco */
    .cartello-box.has-4-lines .arrow-area { margin-bottom: 12px; }

    .arrow-svg {
      fill: #000000;
      width: 105px;
      height: 105px;
    }



    @media print {
      @page {
        size: A4 portrait;
        margin: 0 !important;
      }

      html, body {
        width: 210mm !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        overflow: hidden !important;
        display: block !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .sidebar, .floating-nav-box {
        display: none !important;
      }

      .a4-sheet {
        width: 210mm !important;
        height: 297mm !important;
        box-shadow: none !important;
        margin: 0 auto !important;
        page-break-inside: avoid !important;
        page-break-after: avoid !important;
        break-after: avoid !important;
        overflow: hidden !important;
      }

      .a4-sheet.single-mode {
        height: 148.5mm !important;
        min-height: 148.5mm !important;
        max-height: 148.5mm !important;
        page-break-inside: avoid !important;
        page-break-after: avoid !important;
        break-after: avoid !important;
      }

      .cartello-box:nth-child(2) {
        border-top: 1px dashed #aaa !important;
      }

      .a4-sheet.single-mode .cartello-box {
        border-bottom: 1px dashed #aaa !important;
      }
    }

  <script>
    const MAX_TEXT_LINES = 4;

    const SVG_ARROWS = {
      right: `<svg class="arrow-svg" viewBox="0 0 24 24"><path d="M3 8h10V3l9 9-9 9v-5H3V8z"/></svg>`,
      left: `<svg class="arrow-svg" viewBox="0 0 24 24"><path d="M21 8H11V3l-9 9 9 9v-5h10V8z"/></svg>`,
      down: `<svg class="arrow-svg" viewBox="0 0 24 24"><path d="M8 3v10H3l9 9 9-9h-5V3H8z"/></svg>`,
      up: `<svg class="arrow-svg" viewBox="0 0 24 24"><path d="M8 21V11H3l9-9 9 9h-5v10H8z"/></svg>`,
      none: ``
    };

    // Stato dei due cartelli: il pannello mostra e modifica quello scelto con CARTELLO SUPERIORE / INFERIORE.
    function createCardState(values) {
      return {
        brand: '', customBrand: '',          // brand principale: file ufficiale o logo personalizzato (data URL)
        brandBis: '', customBrandBis: '',    // secondo brand, visibile con + AGGIUNGI 2° BRAND
        twoBrands: false,
        text: '', fontSize: 61, arrow: 'right',
        ...values
      };
    }

    const cards = {
      1: createCardState({ brand: 'MEIMEIJ.png', text: 'PANTALONI\nGIACCHE', fontSize: 61 }),
      2: createCardState({ brand: 'PINKO.png', text: 'GIACCHE / TOP\nPANTALONI / GONNE\nVESTITI', fontSize: 61 })
    };
    let currentCard = 1;
    let sheetMode = 'double';
    let linkedCards = false;   // casella COPIA SU ALTRO CARTELLO

    // Con la casella spuntata (e il foglio intero) ogni modifica vale per tutti e due i cartelli.
    function setField(field, value) {
      const targets = linkedCards && sheetMode === 'double' ? [1, 2] : [currentCard];
      targets.forEach(cardIndex => { cards[cardIndex][field] = value; });
    }

    function cleanBrandName(filename) {
      return filename.replace(/\.(png|jpg|jpeg|webp|svg)$/i, '').replace(/[-_]/g, ' ');
    }

    function readCustomLogos() {
      try {
        const logos = LoghiPersonalizzati.elenco();
        return Array.isArray(logos) ? logos.filter(logo => logo && logo.name && logo.data) : [];
      } catch (error) {
        console.error('Lettura dei loghi personalizzati fallita.', error);
        return [];
      }
    }

    function addPlaceholder(select, text) {
      const option = document.createElement('option');
      option.value = '';
      option.textContent = text;
      select.replaceChildren(option);
    }

    function loadLocalLogos() {
      const { priorityFiles, remainingFiles } = getSortedLogoFiles();
      ['brandSelect', 'brandSelectBis'].forEach(id => {
        const select = document.getElementById(id);
        addPlaceholder(select, '-- Seleziona Brand --');
        select.firstChild.className = 'brand-placeholder';   // placeholder testuale del menu BRAND
        // Brand prioritari (stagionali) mostrati per primi ed evidenziati, poi il resto in ordine alfabetico
        [...priorityFiles, ...remainingFiles].forEach(fileName => {
          appendBrandOption(select, fileName, cleanBrandName(fileName), priorityFiles.includes(fileName));
        });
      });

      const customLogos = readCustomLogos();
      ['customBrandSelect', 'customBrandSelectBis'].forEach(id => {
        const select = document.getElementById(id);
        addPlaceholder(select, '-- Seleziona Logo Personalizzato --');
        customLogos.forEach(logo => {
          const option = document.createElement('option');
          option.value = logo.data;
          option.textContent = '★ ' + logo.name;
          select.appendChild(option);
        });
      });

      syncPanel();
      renderCards();
    }

    // Scegliere un brand ufficiale azzera il logo personalizzato dello stesso posto, e viceversa.
    function onOfficialBrandChange(slot) {
      const suffix = slot === 'brandBis' ? 'Bis' : '';
      const custom = slot === 'brandBis' ? 'customBrandBis' : 'customBrand';
      setField(slot, document.getElementById('brandSelect' + suffix).value);
      setField(custom, '');
      document.getElementById('customBrandSelect' + suffix).value = '';
      renderCards();
    }

    function onCustomBrandChange(slot) {
      const suffix = slot === 'brandBis' ? 'Bis' : '';
      const custom = slot === 'brandBis' ? 'customBrandBis' : 'customBrand';
      setField(custom, document.getElementById('customBrandSelect' + suffix).value);
      setField(slot, '');
      document.getElementById('brandSelect' + suffix).value = '';
      renderCards();
    }

    function onFieldInput(field, value) {
      setField(field, value);
      renderCards();
    }

    // Area Testo: il cartello accetta al massimo 4 righe, le righe in più vengono tolte.
    function onTextInput(textarea) {
      const lines = textarea.value.split('\n');
      if (lines.length > MAX_TEXT_LINES) {
        textarea.value = lines.slice(0, MAX_TEXT_LINES).join('\n');
      }
      onFieldInput('text', textarea.value);
    }

    function setArrow(direction) {
      setField('arrow', direction);
      syncPanel();
      renderCards();
    }

    function setActive(activeId, ids) {
      ids.forEach(id => document.getElementById(id).classList.toggle('active', id === activeId));
    }

    // Riporta nel pannello i valori del cartello scelto.
    function syncPanel() {
      const state = cards[currentCard];
      document.getElementById('brandSelect').value = state.brand;
      document.getElementById('customBrandSelect').value = state.customBrand;
      document.getElementById('brandSelectBis').value = state.brandBis;
      document.getElementById('customBrandSelectBis').value = state.customBrandBis;
      document.getElementById('labelText').value = state.text;
      // la barra mostra la misura sul cartello (con 4 righe può essere quella imposta dal limitatore)
      document.getElementById('textSize').value = state.shownSize ?? state.fontSize;
      Selettore.attiva('arrowSwitch', state.arrow);

      SelettoreCartello.setActive('selectCard' + currentCard);
      SecondBrandToggle.setState('secondBrandBtn', state.twoBrands);
      document.getElementById('brandBisGroup').hidden = !state.twoBrands;
      // con il doppio brand i campi del primo brand si chiamano BRAND 1 e Loghi Personalizzati 1
      document.getElementById('brandLabel').textContent = state.twoBrands ? 'BRAND 1' : 'BRAND';
      document.getElementById('customBrandLabel').textContent = state.twoBrands ? 'Loghi Personalizzati 1' : 'Loghi Personalizzati';

      document.getElementById('linkCards').checked = linkedCards;
      document.getElementById('linkCardsRow').hidden = sheetMode === 'single';
    }

    function selectCard(cardIndex) {
      if (sheetMode === 'single' && cardIndex === 2) return;
      currentCard = cardIndex;
      syncPanel();
    }

    // + AGGIUNGI 2° BRAND accende e spegne il secondo brand del cartello in modifica.
    function toggleSecondBrand() {
      setField('twoBrands', !cards[currentCard].twoBrands);
      syncPanel();
      renderCards();
    }

    // Spuntando la casella i valori del cartello in modifica vanno anche sull'altro;
    // togliendo la spunta il cartello sovrascritto torna ai valori che aveva prima.
    let overwrittenCard = null;   // { cardIndex, state } salvato alla spunta

    function setLinkedCards(isLinked) {
      linkedCards = isLinked;
      if (isLinked) {
        const otherCard = currentCard === 1 ? 2 : 1;
        overwrittenCard = { cardIndex: otherCard, state: { ...cards[otherCard] } };
        cards[otherCard] = { ...cards[currentCard] };
      } else if (overwrittenCard) {
        cards[overwrittenCard.cardIndex] = overwrittenCard.state;
        overwrittenCard = null;
      }
      renderCards();
      syncPanel();
    }

    // 2 CARTELLI stampa i due cartelli sul foglio A4, 1 CARTELLO solo il superiore (mezzo A4).
    function setSheetMode(mode) {
      sheetMode = mode;
      const isSingle = mode === 'single';
      document.getElementById('printBtn').textContent = isSingle ? 'STAMPA CARTELLO' : 'STAMPA CARTELLI';
      document.getElementById('a4Sheet').classList.toggle('single-mode', isSingle);
      document.getElementById('cartelloBox2').style.display = isSingle ? 'none' : 'flex';
      SelettoreCartello.setLowerDisabled(isSingle);
      document.getElementById('sheetModeSelect').value = mode;
      if (isSingle && currentCard === 2) currentCard = 1;
      syncPanel();
    }

    // Logo di un posto ('' il primo, 'Bis' il secondo): il file del brand, oppure la scritta BRAND se manca.
    function renderLogo(cardIndex, suffix) {
      const state = cards[cardIndex];
      const brand = state['brand' + suffix];
      const customBrand = state['customBrand' + suffix];
      const imgElem = document.getElementById('logoImg' + cardIndex + suffix);
      const fallbackElem = document.getElementById('logoFallback' + cardIndex + suffix);

      if (customBrand || brand) {
        PrintLogoColors.setBrandLogoSrc('logoImg' + cardIndex + suffix, customBrand, brand, '', 'black');
        imgElem.style.display = 'block';
        fallbackElem.style.display = 'none';
      } else {
        imgElem.style.display = 'none';
        fallbackElem.style.display = 'block';
      }
      // senza logo: BRAND al primo posto, SELEZIONA 2º BRAND (in rosso, su due righe) al secondo
      const isPlaceholder = suffix === 'Bis' && !customBrand && !brand;
      fallbackElem.classList.toggle('is-placeholder', isPlaceholder);
      if (isPlaceholder) {
        fallbackElem.replaceChildren('SELEZIONA', document.createElement('br'), '2º BRAND');
      } else if (!customBrand && !brand) {
        fallbackElem.textContent = 'BRAND';
      }
    }

    function onLogoError(cardIndex, suffix) {
      const imgElem = document.getElementById('logoImg' + cardIndex + suffix);
      const fallbackElem = document.getElementById('logoFallback' + cardIndex + suffix);
      if (!imgElem.getAttribute('src')) return;
      imgElem.style.display = 'none';
      fallbackElem.textContent = cleanBrandName(cards[cardIndex]['brand' + suffix] || 'BRAND');
      fallbackElem.style.display = 'block';
    }

    function renderCard(cardIndex) {
      const state = cards[cardIndex];
      document.getElementById('cartelloBox' + cardIndex).classList.toggle('has-2-brands', state.twoBrands);
      renderLogo(cardIndex, '');
      renderLogo(cardIndex, 'Bis');

      const textElem = document.getElementById('textContent' + cardIndex);
      textElem.textContent = state.text || 'INSERISCI TESTO';
      textElem.style.fontSize = state.fontSize + 'px';
      document.getElementById('arrowArea' + cardIndex).innerHTML = SVG_ARROWS[state.arrow] || '';
      document.getElementById('cartelloBox' + cardIndex).classList.toggle('has-4-lines', countTextLines(state.text) >= MAX_TEXT_LINES);
      fitText(cardIndex, textElem);
    }

    // Limitatore della quarta riga. Fino a 3 righe testo e Dimensione Testo sono liberi. Con 4 righe, se il testo non
    // entra tra logo e freccia (es. carattere al massimo), logo e freccia restano fermi e il carattere scende da solo,
    // un pixel alla volta, fino alla misura che entra; la barra mostra quella misura. La misura scelta dall'utente
    // resta in fontSize: togliendo la quarta riga il testo torna grande come prima.
    function countTextLines(text) {
      return text.replace(/\n+$/, '').split('\n').length;
    }

    function fitText(cardIndex, textElem) {
      const state = cards[cardIndex];
      const area = textElem.parentElement;
      const slider = document.getElementById('textSize');
      let size = state.fontSize;
      if (countTextLines(state.text) >= MAX_TEXT_LINES && area.clientHeight) {   // clientHeight 0: cartello nascosto (1 CARTELLO)
        const minSize = Number(slider.min);
        const style = getComputedStyle(area);
        const available = area.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
        while (size > minSize && textElem.offsetHeight > available) {
          size -= 1;
          textElem.style.fontSize = size + 'px';
        }
      }
      state.shownSize = size;
      if (cardIndex === currentCard) slider.value = size;
    }

    function renderCards() {
      renderCard(1);
      renderCard(2);
    }

    window.onload = () => {
      LoghiPersonalizzati.pronto.then(loadLocalLogos);   // menu pronti con la lista dei loghi personalizzati
      // il testo si misura con il carattere vero: appena è caricato si ricontrolla che entri
      document.fonts.ready.then(renderCards);
    };
  </script>
  <script src="../assets/js/cursore.js?v=20261010-53"></script>



  <script>
    // Cursore: indica sul cartello in modifica l'elemento legato al campo in uso.
    const activeCard = () => document.getElementById('cartelloBox' + currentCard);
    const inActiveCard = selector => () => activeCard().querySelector(selector);
    const cardOf = target => target.closest('.cartello-box');
    // Logo visibile di un posto: l'immagine o, se manca, la scritta BRAND.
    const logoOf = slotSelector => {
      const slot = activeCard().querySelector(slotSelector);
      return [...slot.children].find(child => child.style.display !== 'none');
    };

    Cursore.create({
      panel: '.controls',
      watch: '#a4Sheet',
      scope: cardOf,
      obstacles: target => cardOf(target).querySelectorAll('.brand-area img, .brand-text-fallback, .content-area p, .arrow-svg'),
      rules: [
        { controls: '#selectCard1, #selectCard2', target: activeCard, placement: 'above' },
        // + AGGIUNGI 2° BRAND: acceso indica tutti e due i loghi (il cursore si sdoppia), spento solo il primo
        { controls: '#secondBrandBtn', target: () => cards[currentCard].twoBrands
            ? [logoOf('.brand-slot:not(.bis)'), logoOf('.brand-slot.bis')]
            : [logoOf('.brand-slot:not(.bis)')], placement: 'above' },
        { controls: '#brandSelect, #customBrandSelect', target: () => logoOf('.brand-slot:not(.bis)'), placement: 'above' },
        { controls: '#brandSelectBis, #customBrandSelectBis', target: () => logoOf('.brand-slot.bis'), placement: 'above' },
        { controls: '#labelText, #textSize', target: inActiveCard('.content-area p') },
        // Freccia: indica la freccia, o il suo spazio vuoto con NESSUNA
        { controls: '#arrowSwitch', target: () => activeCard().querySelector('.arrow-svg') || activeCard().querySelector('.arrow-area') }
      ]
    });
  </script>
  <script src="../assets/js/copia-cartello.js?v=20261010-53"></script>
  <script src="../assets/js/strumenti-stampa.js?v=20261010-53" data-sheet="#a4Sheet"></script>
