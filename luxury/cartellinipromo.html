  <style>
    /* Definizione Font Locali Bodoni Std da assets/fonts */
    @font-face {
      font-family: 'Bodoni Std';
      src: url('../assets/fonts/BodoniStd.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Bodoni Std';
      src: url('../assets/fonts/BodoniStd-Italic.otf') format('opentype');
      font-weight: normal;
      font-style: italic;
    }

    @font-face {
      font-family: 'Bodoni Std';
      src: url('../assets/fonts/BodoniStd.otf') format('opentype');
      font-weight: bold;
      font-style: normal;
    }

    :root {
      --bg: #121110;
      --sidebar: #181715;
      --card: #1e1d1a;
      --border: #2e2b27;
      --accent: #b48b37;
      --accent-hover: #c99c43;
      --text: #f4f1ea;
      --text-muted: #8c857b;
      --gold: #b48b37;
      --sale-red: #d90429;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; display: flex; height: 100vh; overflow: auto; }

    /* --- SIDEBAR --- */
    aside { width: 360px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 1.5rem 1rem 3rem; display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
    /* titolo come quello del pannello standard (Cinzel 600 oro, maiuscolo) */
    .brand-title { font-family: 'Cinzel', serif; font-size: 1.1rem; letter-spacing: 1.5px; color: #d4a373; margin-bottom: 1rem; text-align: center; font-weight: 600; text-transform: uppercase; }

    .tabs-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; margin-bottom: 1.2rem; }
    .tab-item { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.2rem; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; cursor: pointer; transition: all 0.2s; }
    .tab-item:hover { border-color: var(--gold); }
    .tab-item.active { border-color: var(--gold); background: rgba(180, 139, 55, 0.15); }
    .tab-item label { font-size: 0.7rem; font-weight: 700; cursor: pointer; color: var(--text); }
    .tab-item input[type="checkbox"] { accent-color: var(--gold); cursor: pointer; }

    .editor-section { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; }
    .editor-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #d4a373; margin-bottom: 0.8rem; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }

    /* Il riquadro "Modifica Cartellino" segue il pannello standard (../assets/css/pannello.css), diviso nei quattro
       blocchi; qui solo ciò che è proprio dei cartellini. Come in TEBE il riquadro che comincia con un selettore ha
       1rem sopra il selettore, e l'ultimo elemento (il tasto di stampa) non aggiunge spazio sotto. */
    .editor-title + .panel-block > .mode-switch:first-child { margin-top: 1rem; }
    .editor-section > .panel-block:last-child > :last-child { margin-bottom: 0; }
    /* Nei cartellini i blocchi non hanno lo spazio in più dei cartelli: tra un blocco e l'altro c'è lo stesso spazio
       che c'è tra i campi (0,65rem), così il menu resta compatto e semplice. */
    .editor-section .panel-block + .panel-block { margin-top: 0; }
    /* sotto il selettore PREZZO ORIGINARIO / DESCRIZIONE ARTICOLO lo stesso spazio che c'è sopra, tra la linea del titolo e il selettore (1rem) */
    .editor-section .panel-block > .mode-switch:last-child { margin-bottom: 1rem; }
    /* sotto il tasto di stampa lo stesso spazio che si vede in alto tra il bordo del riquadro e le lettere del titolo (20 px) */
    #editorPanel { padding-bottom: 1.25rem; }
    /* il tasto di stampa un poco più staccato dai campi (0,65rem + 0,35rem = 1rem) */
    .editor-section .btn-print { margin-top: 0.35rem; }

    /* Riga Prezzo Originario / Sconto: etichette su una riga sola, Sconto (due cifre) un poco più stretto */
    .form-row .form-group label { white-space: nowrap; }
    #origGroup { flex: 1.15; }
    #discountGroup { flex: 0.85; }

    /* Brand stagionali prioritari evidenziati nel menu BRAND */
    .form-group select option.priority-brand-option { background-color: #2e2b27; color: #e5ba73; font-weight: bold; }

    /* --- PREVIEW MAIN --- */
    main { flex: 1; min-width: 0; padding: 1.5rem; overflow: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0908; -webkit-overflow-scrolling: touch; }

    /* Griglia Foglio A4 Landscape */
    .a4-landscape {
      width: 282mm;
      height: 196mm;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      padding: 5mm 16mm;
      gap: 3mm 0mm;
      transform-origin: top center;
    }

    /* CARTELLINO SALDI */
    .cartellino {
      border: 8px solid #000000;
      box-sizing: border-box;
      padding: 2.5mm 1.5mm 1.5mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      background: #fff;
      color: #000;
      overflow: hidden;
      position: relative;
      width: 59.5mm;
      justify-self: center;
      height: 100%;
    }
    .cartellino.disabled { opacity: 0.15; filter: grayscale(1); }
    .sheet-wrap { position: relative; flex-shrink: 0; }

    /* Brand Logo in alto (colore già applicato via canvas dal JS, vedi renderGrid) */
    .brand-box { height: 19mm; display: flex; align-items: center; justify-content: center; width: 100%; margin-top: 0.5mm; flex-shrink: 0; transform: translateY(-1mm); }
    .brand-box img { 
      max-height: 100%; 
      max-width: 90%; 
      object-fit: contain; 
    }
    .brand-box .brand-text-fallback { font-family: 'Bodoni Std', serif; font-size: 16pt; font-weight: bold; color: var(--sale-red); text-transform: uppercase; letter-spacing: 0.8px; }
    .cartellino.is-black-event .brand-text-fallback { color: #b48b37; }

    /* Blocco centrale */
    .card-body-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      margin: 0.5mm 0;
      gap: 0.8mm;
      transform: translateY(-2.5mm);   /* un poco più in alto: il Prezzo Finale a 42pt arrivava troppo vicino al footer */
    }

    /* Prezzo Originario Barrato in Bodoni Std Roman */
    .orig-price-row,
    .article-placeholder {
      min-height: 9mm;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .orig-price-row {
      gap: 2.5mm;
    }
    .orig-price-box {
      font-family: 'Bodoni Std', serif;
      font-weight: normal;
      font-size: 18pt;
      color: #000;
      line-height: 1.1;
      display: inline-block;
      white-space: nowrap;
      transform: translateY(1mm);
    }
    .orig-price-row.has-discount .orig-price-box {
      transform: translateY(0);
      animation: shift-original-price 0.3s ease-out both;
    }
    .orig-price-box .strike-line {
      text-decoration: line-through;
      text-decoration-color: #d90429;
      text-decoration-thickness: 2.5px;
    }
    .cartellino.is-black-event .strike-line {
      text-decoration-color: #b48b37;
    }
    .discount-rate {
      color: var(--sale-red);
      font-family: 'Bodoni Std', serif;
      font-size: 18pt;
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
      animation: reveal-discount-rate 0.3s ease-out both;
    }
    .article-placeholder {
      padding-bottom: 0.5mm;
    }
    .article-desc {
      font-family: 'Bodoni Std', serif;
      font-style: italic;
      font-size: 18pt;
      color: #000;
      line-height: 1.1;
      margin: 0;
      text-transform: none;
      transform: translateY(0.6mm);
    }
    .cartellino.is-black-event .discount-rate { color: var(--gold); }
    @keyframes shift-original-price {
      from { transform: translate(5mm, 0); }
      to { transform: translate(0, 0); }
    }
    @keyframes reveal-discount-rate {
      from { opacity: 0; transform: translateX(4mm); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Riquadro Rosso Saldi - Testi Ingranditi e in Bold */
    .sale-banner-box {
      background: var(--sale-red);
      color: #ffffff;
      width: 98%;
      height: 18mm;
      padding: 1.8mm 0.5mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 0px;
      margin: 1mm 0;
    }
    .sale-banner-box.is-black-event {
      background: #000000;
    }
    .sale-banner-title {
      font-family: 'Bodoni Std', serif;
      font-weight: 700;
      font-style: normal;
      font-size: 15pt;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      line-height: 1.05;
      margin-bottom: 0.5mm;
    }
    .sale-banner-title:only-child,
    .sale-banner-sub:only-child {
      margin-bottom: 0;
      font-size: 23pt;
    }
    .sale-banner-sub {
      font-family: 'Bodoni Std', serif;
      font-weight: 700;
      font-style: normal;
      font-size: 22pt;
      line-height: 1.05;
      white-space: nowrap;
    }

    /* Prezzo Finale in Bodoni Std Roman Ingrandito */
    .final-price {
      font-family: 'Bodoni Std', serif;
      font-weight: normal;
      font-size: 42pt;
      color: #000;
      line-height: 0.95;
      letter-spacing: -0.04em;
      white-space: nowrap;
    }

    /* Logo Aziendale Rosso in basso */
    .card-footer-logo { height: 20mm; display: flex; align-items: center; justify-content: center; width: 100%; padding-bottom: 0.5mm; flex-shrink: 0; }
    .card-footer-logo img { max-height: 100%; max-width: 98%; object-fit: contain; }
    /* logocartellini.png (oro, BLACK FRIDAY / BLACK WEEK) ha pochissimo margine interno rispetto a loghinored.png
       (rosso): a parità di riquadro risulterebbe molto più grande e troppo vicino al bordo del cartellino */
    .cartellino.is-black-event .card-footer-logo img { max-height: 82%; }

    /* NAVIGAZIONE */

    /* REGOLA DI STAMPA */


    @media print {
      html, body {
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
      }
      body { background: none; display: block; }
      aside { display: none !important; }
      main {
        padding: 0;
        background: none;
        margin: 0;
        display: block;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
      }
      .a4-landscape { 
        box-shadow: none; 
        margin: 0 auto; 
        width: 282mm !important; 
        height: 196mm !important; 
        max-height: 196mm !important;
        page-break-after: avoid;
        page-break-inside: avoid;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .cartellino.disabled { visibility: hidden; opacity: 0; }
      .floating-nav-box { display: none !important; }
      @page { 
        size: A4 landscape; 
        margin: 4mm;
      }
    }

    @media (max-width: 1100px) {
      main { align-items: flex-start; justify-content: flex-start; }
      .a4-landscape { flex: 0 0 auto; }
    }

  </style>

<body data-layout="cartellini">
  <a href="index.html" class="app-close-btn" title="Chiudi" aria-label="Chiudi e torna al menu principale">✕</a>

  <div class="floating-nav-box">
    <div class="floating-nav-title">STORE // CRAFT</div>
    <a href="index.html" class="floating-nav-btn">← Torna al Menu Principale</a>
  </div>

  <aside>
    <div class="brand-title">CARTELLINI PROMO</div>

    <div class="tabs-grid" id="tabs-container"></div>

    <div class="editor-section" id="editorPanel">
      <div class="editor-title" id="editor-header">Modifica Cartellino #1</div>

      <!-- Blocco 1: selettori e pulsanti -->
      <div class="panel-block">
        <!-- selettore comune (selettore.js) -->
        <div data-selettore id="cardModeSelector" data-on-change="onCardModeChange" aria-label="Seleziona la modalità del cartellino">
          <button value="orig" id="modeOrig" class="active">PREZZO<br>ORIGINARIO</button>
          <button value="desc" id="modeDesc">DESCRIZIONE<br>ARTICOLO</button>
        </div>
        <button type="button" class="btn-toggle" id="discountBtn" aria-pressed="false" onclick="toggleDiscount()">+ AGGIUNGI SCONTISTICA</button>
      </div>

      <!-- Blocco 2: brand (ufficiali e personalizzati) -->
      <div class="panel-block">
        <div class="form-group" data-menu-brand-cartellini></div>
      </div>

      <!-- Blocco 3: campi del cartellino (prezzo originario e sconto, o descrizione; fascia promozionale; prezzo finale) -->
      <div class="panel-block">
        <div class="form-row" id="origRow">
          <div class="form-group" id="origGroup">
            <label for="inp-orig">Prezzo Originario</label>
            <div class="input-affix">
              <span class="affix">€</span>
              <input data-prezzo type="text" id="inp-orig" inputmode="decimal" placeholder="99,00" oninput="onPriceInput(this, 'priceOrig')">
            </div>
          </div>
          <div class="form-group" id="discountGroup" hidden>
            <label for="discountValue">Sconto</label>
            <div class="input-affix">
              <input data-percentuale type="number" id="discountValue" min="1" max="99" placeholder="50" oninput="onDiscountInput()">
              <span class="affix">%</span>
            </div>
          </div>
        </div>

        <div class="form-group" id="descriptionGroup" hidden>
          <label class="section-label" for="descPreset">Articoli</label>
          <div class="preset-select">
            <select id="descPreset" data-testi-pronti="Articoli" onchange="applyDescPreset()">
              <option value="">-- Seleziona un articolo --</option>
            </select>
          </div>
          <label for="inp-desc">Testo Libero</label>
          <input type="text" id="inp-desc" placeholder="-- Testo Libero --" oninput="onFieldInput('desc', this.value)">
        </div>

        <div class="form-group">
          <label class="section-label" for="inp-sale-title">Stagionalità / Evento</label>
          <div class="preset-select">
            <select id="inp-sale-title" onchange="handleSaleTitleChange()">
              <option value="">— LASCIA IL CAMPO VUOTO —</option>
              <option value="SUMMER SALE">SUMMER SALE</option>
              <option value="WINTER SALE">WINTER SALE</option>
              <option value="SPECIAL SALE">SPECIAL SALE</option>
              <option value="SPRING SALE">SPRING SALE</option>
              <option value="BLACK FRIDAY">BLACK FRIDAY</option>
              <option value="BLACK WEEK">BLACK WEEK</option>
              <option value="LAST WEEK">LAST WEEK</option>
              <option value="X-MAS SALE">X-MAS SALE</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="section-label" for="promoPreset">Promozione</label>
          <div class="preset-select">
            <select id="promoPreset" onchange="applyPromoPreset()">
              <option value="">— LASCIA IL CAMPO VUOTO —</option>
              <option value="50% + 50%">50% + 50%</option>
              <option value="UP TO -70%">UP TO -70%</option>
              <option value="EXTRA DISCOUNT">EXTRA DISCOUNT</option>
              <option value="OUTLET PRICE">OUTLET PRICE</option>
              <option value="FINAL PRICE">FINAL PRICE</option>
            </select>
          </div>
          <label for="inp-sale-sub">Testo Libero</label>
          <input type="text" id="inp-sale-sub" placeholder="-- Testo Libero --" oninput="onFieldInput('saleSub', this.value)">
        </div>

        <div class="form-group">
          <label for="inp-final">Prezzo Finale</label>
          <div class="input-affix">
            <span class="affix">€</span>
            <input data-prezzo type="text" id="inp-final" inputmode="decimal" placeholder="150,00" oninput="onPriceInput(this, 'priceFinal')">
          </div>
        </div>
      </div>

      <!-- Blocco 4: stampa -->
      <div class="panel-block">
        <button type="button" class="btn-print" onclick="window.print()">STAMPA FOGLIO A4</button>
      </div>
    </div>
  </aside>

  <main>
    <div class="sheet-wrap">
      <div class="a4-landscape" id="printable-grid"></div>
    </div>

  <script src="../assets/js/menu-brand-cartellini.js?v=20261010-50"></script>
  <script>
    const LOGO_PATH = "../assets/logos/luxury/";

    function cleanBrandName(filename) {
      if (!filename) return '';
      return filename.replace(/\.(png|jpg|jpeg|webp|svg)$/i, '').replace(/[-_]/g, ' ');
    }

    function getLogoFilename(brand) {
      if (!brand) return '';
      if (typeof LOGO_FILES !== 'undefined' && Array.isArray(LOGO_FILES)) {
        const found = LOGO_FILES.find(f => 
          f.toLowerCase() === brand.toLowerCase() || 
          cleanBrandName(f).toLowerCase() === brand.toLowerCase().replace(/[-_]/g, ' ')
        );
        if (found) return found;
      }
      return brand.includes('.') ? brand : `${brand}.png`;
    }

    // Stato dei cartellini: priceOrig/sconto e desc sono mostrati in alternativa, secondo withDesc
    // (PREZZO ORIGINARIO / DESCRIZIONE ARTICOLO); withDiscount accende la sola fascetta -XX% accanto al prezzo barrato.
    const cardsData = [
      { id: 1, enabled: true, brand: 'DIXIE.png', customLogoUrl: '', priceOrig: '99,00', withDiscount: false, sconto: '50', saleTitle: 'SUMMER SALE', saleSub: '50% + 50%', priceFinal: '24,70', withDesc: false, desc: 'Giacca' },
      { id: 2, enabled: true, brand: 'PINKO.png', customLogoUrl: '', priceOrig: '350,00', withDiscount: false, sconto: '50', saleTitle: 'SUMMER SALE', saleSub: '50% + 50%', priceFinal: '150,00', withDesc: false, desc: 'Giacca' },
      { id: 3, enabled: true, brand: 'FELEPPA.png', customLogoUrl: '', priceOrig: '210,00', withDiscount: false, sconto: '50', saleTitle: 'WINTER SALE', saleSub: '50% + 50%', priceFinal: '73,50', withDesc: false, desc: 'Giacca' },
      { id: 4, enabled: true, brand: 'GAELLE.png', customLogoUrl: '', priceOrig: '120,00', withDiscount: false, sconto: '50', saleTitle: 'SUMMER SALE', saleSub: '50% + 50%', priceFinal: '30,00', withDesc: false, desc: 'Giacca' },
      { id: 5, enabled: true, brand: 'WEILIZHENG.png', customLogoUrl: '', priceOrig: '180,00', withDiscount: false, sconto: '50', saleTitle: 'SPECIAL SALE', saleSub: '50% + 50%', priceFinal: '72,00', withDesc: false, desc: 'Giacca' },
      { id: 6, enabled: true, brand: 'HAVEONE.png', customLogoUrl: '', priceOrig: '89,00', withDiscount: false, sconto: '50', saleTitle: 'SUMMER SALE', saleSub: '50% + 50%', priceFinal: '22,25', withDesc: false, desc: 'Giacca' },
      { id: 7, enabled: true, brand: 'MEIMEIJ.png', customLogoUrl: '', priceOrig: '260,00', withDiscount: false, sconto: '50', saleTitle: 'WINTER SALE', saleSub: '50% + 50%', priceFinal: '65,00', withDesc: false, desc: 'Giacca' },
      { id: 8, enabled: true, brand: 'TWINSET.png', customLogoUrl: '', priceOrig: '190,00', withDiscount: false, sconto: '50', saleTitle: 'SUMMER SALE', saleSub: '50% + 50%', priceFinal: '47,50', withDesc: false, desc: 'Giacca' }
    ];

    let currentCardIdx = 0;

    function init() {
      renderTabs();
      renderGrid();
      loadEditorData();
    }

    function renderTabs() {
      const container = document.getElementById('tabs-container');
      container.replaceChildren();
      cardsData.forEach((card, index) => {
        const item = document.createElement('div');
        item.className = `tab-item ${index === currentCardIdx ? 'active' : ''}`;
        item.onclick = (e) => {
          if (e.target.type !== 'checkbox') {
            currentCardIdx = index;
            renderTabs();
            loadEditorData();
          }
        };

        // Linguetta costruita con nodi DOM: numero del cartellino e casella che lo esclude dalla stampa.
        const label = document.createElement('label');
        label.textContent = `#${card.id}`;
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = card.enabled;
        checkbox.onchange = () => toggleCardEnabled(index, checkbox.checked);
        item.append(label, checkbox);
        container.appendChild(item);
      });
    }

    function renderGrid() {
      const grid = document.getElementById('printable-grid');
      grid.replaceChildren();

      cardsData.forEach((card) => {
        const el = document.createElement('div');
        const isBlackEvent = ['BLACK WEEK', 'BLACK FRIDAY'].includes(card.saleTitle);
        el.className = `cartellino ${!card.enabled ? 'disabled' : ''} ${isBlackEvent ? 'is-black-event' : ''}`;
        el.id = `card-view-${card.id}`;

        // Cartellino costruito con nodi DOM: il testo dell'utente va con textContent.
        const node = (tag, className, text) => {
          const element = document.createElement(tag);
          if (className) element.className = className;
          if (text !== undefined) element.textContent = text;
          return element;
        };

        // Logo del brand; senza logo, o se il file non si carica, il nome del brand
        const brandDisplayName = cleanBrandName(card.brand);
        const brandBox = node('div', 'brand-box');
        if (card.customLogoUrl || card.brand) {
          const logo = node('img');
          logo.alt = brandDisplayName;
          if (!card.customLogoUrl) logo.onerror = () => logo.replaceWith(node('div', 'brand-text-fallback', brandDisplayName));
          logo.src = card.customLogoUrl || getLogoSource(getLogoFilename(card.brand));
          brandBox.append(logo);
        } else {
          brandBox.append(node('div', 'brand-text-fallback', brandDisplayName));
        }

        const center = node('div', 'card-body-center');
        if (card.withDesc) {
          const article = node('div', 'article-placeholder');
          article.append(node('div', 'article-desc', formatDescriptionText(card.desc)));
          center.append(article);
        } else {
          const origRow = node('div', `orig-price-row ${card.withDiscount ? 'has-discount' : ''}`);
          const origBox = node('div', 'orig-price-box');
          origBox.append(node('span', 'strike-line', `€ ${card.priceOrig || '0,00'}`));
          origRow.append(origBox);
          if (card.withDiscount && card.sconto) origRow.append(node('span', 'discount-rate', `-${card.sconto}%`));
          center.append(origRow);
        }

        const banner = node('div', `sale-banner-box ${isBlackEvent ? 'is-black-event' : ''}`);
        if (card.saleTitle) banner.append(node('div', 'sale-banner-title', card.saleTitle));
        if (card.saleSub) banner.append(node('div', 'sale-banner-sub', card.saleSub));
        center.append(banner, node('div', 'final-price', `€ ${card.priceFinal || '0,00'}`));

        const footer = node('div', 'card-footer-logo');
        const footerLogo = node('img');
        footerLogo.alt = 'Luxury Outlet';
        footerLogo.onerror = () => { footerLogo.style.display = 'none'; };
        footerLogo.src = `../assets/img/luxury/${isBlackEvent ? 'logocartellini.png' : 'loghinored.png'}`;
        footer.append(footerLogo);

        el.append(brandBox, center, footer);

        grid.appendChild(el);

        // Ricolora il logo brand via canvas (bianco/oro a seconda dell'evento)
        // così sia lo schermo sia la stampa mostrano sempre il colore corretto,
        // senza dipendere dai filtri CSS ignorati da Safari in stampa.
        if (card.customLogoUrl || card.brand) {
          const brandColor = isBlackEvent ? 'gold' : 'red';
          const officialFile = card.customLogoUrl ? '' : getLogoFilename(card.brand);
          PrintLogoColors.getBrandLogoSrc(card.customLogoUrl, officialFile, '', brandColor).then(src => {
            const imgEl = el.querySelector('.brand-box img');
            if (imgEl && src) imgEl.src = src;
          });
        }
      });

      fitSaleBannerText();
    }

    function fitSaleBannerText() {
      document.querySelectorAll('.sale-banner-title, .sale-banner-sub').forEach((element) => {
        const isSingleLine = element.parentElement.children.length === 1;
        const maximumSize = (isSingleLine ? 28 : element.classList.contains('sale-banner-sub') ? 22 : 15) * (96 / 72);
        const minimumSize = 10 * (96 / 72);
        const maximumWidth = element.parentElement.clientWidth * 0.82;
        const style = getComputedStyle(element);
        const context = document.createElement('canvas').getContext('2d');
        let fontSize = maximumSize;

        while (fontSize > minimumSize) {
          context.font = `${style.fontStyle} ${style.fontWeight} ${fontSize}px ${style.fontFamily}`;
          if (context.measureText(element.textContent).width <= maximumWidth) {
            break;
          }
          fontSize -= 0.5;
        }
        element.style.fontSize = `${fontSize}px`;
      });
    }

    function setToggle(id, isActive, onText, offText) {
      const button = document.getElementById(id);
      button.classList.toggle('active', isActive);
      button.setAttribute('aria-pressed', String(isActive));
      button.textContent = isActive ? onText : offText;
    }

    // Riporta nel pannello i valori del cartellino scelto con le linguette.
    function loadEditorData() {
      const card = cardsData[currentCardIdx];
      document.getElementById('editor-header').textContent = `Modifica Cartellino #${card.id}`;

      // con un logo personalizzato il menu BRAND resta su "-- Seleziona Brand --" (il brand di prima resta salvato)
      document.getElementById('brandSelect').value = card.customLogoUrl ? '' : getLogoFilename(card.brand);
      document.getElementById('customBrandSelect').value = card.customLogoUrl || '';

      document.getElementById('inp-orig').value = card.priceOrig;
      document.getElementById('discountValue').value = card.sconto;

      document.getElementById('descPreset').value = '';
      document.getElementById('inp-desc').value = card.desc;

      document.getElementById('inp-sale-title').value = card.saleTitle;
      document.getElementById('promoPreset').value = '';
      document.getElementById('inp-sale-sub').value = card.saleSub;

      document.getElementById('inp-final').value = card.priceFinal;

      syncMode();
    }

    // PREZZO ORIGINARIO: prezzo barrato ed eventuale fascetta sconto; DESCRIZIONE ARTICOLO: il testo al loro posto.
    function syncMode() {
      const card = cardsData[currentCardIdx];
      Selettore.attiva('cardModeSelector', card.withDesc ? 'desc' : 'orig');
      document.getElementById('origRow').hidden = card.withDesc;
      document.getElementById('descriptionGroup').hidden = !card.withDesc;
      document.getElementById('discountBtn').hidden = card.withDesc;
      document.getElementById('discountGroup').hidden = !card.withDiscount;
      setToggle('discountBtn', card.withDiscount, 'SCONTISTICA ATTIVA', '+ AGGIUNGI SCONTISTICA');
    }

    // Clic sul selettore comune PREZZO ORIGINARIO / DESCRIZIONE ARTICOLO (selettore.js).
    function onCardModeChange(value) {
      setDescriptionMode(value === 'desc');
    }

    function setDescriptionMode(isDesc) {
      const card = cardsData[currentCardIdx];
      card.withDesc = isDesc;
      // passando a una modalità con i campi vuoti, valori di partenza come prima
      if (isDesc && !card.desc) card.desc = 'Giacca';
      if (!isDesc && !card.priceOrig) card.priceOrig = '99,00';
      loadEditorData();
      renderGrid();
    }

    // + AGGIUNGI SCONTISTICA: accanto al prezzo originario barrato compare la fascetta -XX%.
    function toggleDiscount() {
      const card = cardsData[currentCardIdx];
      card.withDiscount = !card.withDiscount;
      if (card.withDiscount && !card.sconto) card.sconto = '50';
      loadEditorData();
      renderGrid();
    }

    function onFieldInput(field, value) {
      cardsData[currentCardIdx][field] = value;
      renderGrid();
    }

    // Scegliere un brand ufficiale toglie il logo personalizzato; scegliendo un logo personalizzato il brand di prima
    // resta salvato e torna togliendo il logo personalizzato.
    function onOfficialBrandChange() {
      const card = cardsData[currentCardIdx];
      card.brand = document.getElementById('brandSelect').value;
      card.customLogoUrl = '';
      document.getElementById('customBrandSelect').value = '';
      renderGrid();
    }

    function onCustomBrandChange() {
      const card = cardsData[currentCardIdx];
      card.customLogoUrl = document.getElementById('customBrandSelect').value;
      document.getElementById('brandSelect').value = card.customLogoUrl ? '' : getLogoFilename(card.brand);
      renderGrid();
    }

    // L'articolo scelto riempie il Testo Libero, che resta modificabile a mano (come in TEBE).
    function applyDescPreset() {
      const preset = document.getElementById('descPreset').value;
      if (!preset) return;
      document.getElementById('inp-desc').value = preset;
      onFieldInput('desc', preset);
    }

    // La promozione scelta riempie il Testo Libero della fascia colorata, che resta modificabile a mano.
    function applyPromoPreset() {
      const preset = document.getElementById('promoPreset').value;
      if (!preset) return;
      document.getElementById('inp-sale-sub').value = preset;
      onFieldInput('saleSub', preset);
    }

    // Con BLACK FRIDAY / BLACK WEEK la fascia mostra solo il titolo, più grande: la Promozione si svuota.
    function handleSaleTitleChange() {
      const saleTitle = document.getElementById('inp-sale-title').value;
      cardsData[currentCardIdx].saleTitle = saleTitle;
      if (['BLACK WEEK', 'BLACK FRIDAY'].includes(saleTitle)) {
        cardsData[currentCardIdx].saleSub = '';
        document.getElementById('promoPreset').value = '';
        document.getElementById('inp-sale-sub').value = '';
      }
      renderGrid();
    }


    function onPriceInput(input, field) {
      input.value = input.value.replace(/[^\d,.]/g, '');
      onFieldInput(field, input.value);
    }


    // Sconto: un numero da 1 a 99, con il % fisso nel campo; sul cartellino diventa -50%.
    function onDiscountInput() {
      const digits = document.getElementById('discountValue').value.replace(/\D/g, '').slice(0, 2);
      onFieldInput('sconto', digits);
    }


    function formatDescriptionText(value) {
      const text = (value || '').trim();
      if (!text) return '';
      const normalized = text.toLowerCase();
      return normalized.charAt(0).toUpperCase() + normalized.slice(1);
    }

    function toggleCardEnabled(index, enabled) {
      cardsData[index].enabled = enabled;
      renderGrid();
    }

    function applySafariPrintFix() {
      const ua = navigator.userAgent;
      const isSafari = /^((?!chrome|android).)*safari/i.test(ua) && !/Edg|OPR|Brave/i.test(ua);
      if (!isSafari) return;

      const style = document.createElement('style');
      style.textContent = `
        @media print {
          /* Safari, a differenza di Chrome, spesso ignora la regola globale
             "@page { size: A4 landscape }" (parola chiave) e stampa in
             portrait di default: il foglio (282mm di larghezza) va quindi
             in overflow orizzontale e genera una seconda pagina fantasma
             vuota. Il foglio 282x196mm rientra già perfettamente nell'area
             stampabile di un A4 landscape (289x202mm con margine 4mm), per
             cui basta forzare l'orientamento corretto con dimensioni
             esplicite, senza scalare o tagliare nulla.
          */
          @page {
            size: 297mm 210mm;
            margin: 4mm;
          }
        }
      `;
      document.head.appendChild(style);
    }

    init();
    applySafariPrintFix();
  </script>
  <script src="../assets/js/cursore.js?v=20261010-50"></script>
  <script>
    // Cursore (come in Cartellini Vetrina): la linguetta lo porta sopra il cartellino scelto, i campi del pannello
    // sopra (o di lato) l'elemento del cartellino legato al campo in uso.
    const currentCardView = () => document.getElementById(`card-view-${cardsData[currentCardIdx].id}`);
    const inCurrentCard = selector => () => currentCardView()?.querySelector(selector);

    Cursore.create({
      panel: 'aside',
      watch: '#printable-grid',
      clip: 'main',
      sideGap: 96 / 25.4 + 5,   // nei cartellini di lato basta 1 mm + 5 px
      // di lato il cursore può uscire dal cartellino (restando sul foglio), purché non copra testi e loghi
      scope: '#printable-grid',
      obstacles: '#printable-grid .brand-box > *, #printable-grid .orig-price-box .strike-line, #printable-grid .discount-rate, #printable-grid .article-desc, #printable-grid .sale-banner-title, #printable-grid .sale-banner-sub, #printable-grid .final-price, #printable-grid .card-footer-logo img',
      rules: [
        { controls: '.tab-item', target: currentCardView, placement: 'above' },
        { controls: '#modeDesc, #descPreset, #inp-desc', target: inCurrentCard('.article-desc') },
        { controls: '#modeOrig, #inp-orig', target: inCurrentCard('.orig-price-box .strike-line') },
        { controls: '#discountBtn, #discountValue, #discountValue ~ .percent-stepper', target: inCurrentCard('.discount-rate') },
        { controls: '#brandSelect, #customBrandSelect', target: inCurrentCard('.brand-box > *') },
        { controls: '#inp-sale-title', target: inCurrentCard('.sale-banner-title') },
        { controls: '#promoPreset, #inp-sale-sub', target: inCurrentCard('.sale-banner-sub') },
        { controls: '#inp-final', target: inCurrentCard('.final-price') }
      ]
    }).point({ target: currentCardView, placement: 'above' });
  </script>
  <script src="../assets/js/strumenti-stampa.js?v=20261010-50" data-panel="#editorPanel" data-sheet="#printable-grid"></script>
</body>
