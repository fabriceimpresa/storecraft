  <style>
    @font-face {
      font-family: 'Bodoni Project';
      src: url('../assets/fonts/BodoniStd.otf') format('opentype');
      font-style: normal;
      font-weight: 400;
      font-display: block;
    }

    @font-face {
      font-family: 'Bodoni Project';
      src: url('../assets/fonts/BodoniStd-Italic.otf') format('opentype');
      font-style: italic;
      font-weight: 400;
      font-display: block;
    }

    /* Le scritte BLACK e FRIDAY non usano un carattere: sono tracciati ricavati da assets/fonts/Franklin Gothic.ttf
       (218 unità, stirati a 1000 di larghezza come il vecchio <text textLength="1000">). Su iPhone il testo SVG
       stirato con textLength usciva alto il doppio e tagliato, a schermo e nel PDF; i tracciati sono uguali ovunque. */

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Sfondo principale dell'applicazione UI */
    body {
      font-family: Arial, sans-serif;
      background-color: #212529;
      padding: 20px;
      display: flex;
      gap: 20px;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    /* Il pannello segue il pannello standard (../assets/css/pannello.css); qui solo ciò che è proprio della pagina. */

    /* Brand stagionali prioritari evidenziati nel menu Brand */
    .form-group select option.priority-brand-option {
      background-color: #2e2b27;
      color: #e5ba73;
      font-weight: bold;
    }

    /* FOGLIO A4 */
    .print-sheet {
      position: relative;
      z-index: 1;
      width: 210mm;
      height: 296mm;
      background-color: #ffffff !important;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      padding: 6mm 10mm;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* FILIGRANA HALFTONE */
    .print-sheet::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('../assets/img/luxury/halftone.png') !important;
      background-repeat: repeat !important;
      background-size: 800px auto !important;
      z-index: 1;
      pointer-events: none;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .print-sheet.double-mode {
      justify-content: space-between;
    }

    .print-sheet.single-mode #card1 {
      margin-bottom: 7mm;
    }

    /* ELEMENTI GRAFICI E TESTUALI */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 136mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
      background: transparent;
    }

    .card.disabled {
      display: none !important;
    }

    .cut-line {
      position: relative;
      z-index: 2;
      width: 100%;
      border-top: 1px dashed #bbb;
      margin: 1mm 0;
      flex-shrink: 0;
    }

    /* CONTENITORE CENTRALE BLACK FRIDAY */
    .bf-block {
      width: 168mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    /* SVG PER SCRITTE CORPOSE */
    .bf-svg-row {
      width: 100%;
      height: 42mm;
      display: block;
      margin: 0;
      overflow: visible;
    }

    /* RETTANGOLO NERO CENTRALE */
    .black-box {
      width: 100%;
      height: 38mm;
      background-color: #000000 !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4mm 0 0;
      margin: 1mm 0;
      flex-shrink: 0;
      overflow: hidden;
    }

    /* LATO SINISTRO CON LOGO / DESCRIZIONE E SCONTISTICA */
    .side-container {
      width: 44%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      padding-left: 0;
      transition: all 0.3s ease;
    }

    /* SPOSTAMENTO DEL 15% VERSO DESTRA PER LOGO O TESTO LIBERO */
    .side-brand-wrapper {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      height: 100%;
      padding-left: 15%;
      transition: all 0.3s ease;
    }

    .side-brand-wrapper img {
      max-width: 90%;
      max-height: 75%;
      object-fit: contain;
      transform: scale(0.95);
      transform-origin: left center;
      transition: all 0.3s ease;
    }

    .side-brand-wrapper .desc-text {
      display: none;
      font-family: 'Bodoni Project', 'Bodoni MT', Didot, serif;
      font-size: 2.8rem;
      font-weight: 400;
      color: #ffffff;
      text-align: left;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      transition: all 0.3s ease;
    }

    .card.has-desc .side-brand-wrapper img {
      display: none !important;
    }

    .card.has-desc .side-brand-wrapper .desc-text {
      display: block !important;
    }

    /* RIGA SCONTISTICA INFERIORE (NASCOSTA DI DEFAULT) */
    .discount-row {
      display: none;
      align-items: center;
      gap: 12px;
      width: 100%;
      color: #ffffff;
      opacity: 0;
      padding-left: 15%;
      transition: all 0.3s ease;
    }

    .discount-row .p-orig {
      font-family: 'Bodoni Project', 'Bodoni MT', Didot, serif;
      font-size: 1.8rem;
      font-weight: 400;
      white-space: nowrap;
    }

    .discount-row .p-disc {
      font-family: 'Bodoni Project', 'Bodoni MT', Didot, serif;
      font-style: italic;
      font-size: 2.1rem;
      font-weight: 700;
      white-space: nowrap;
    }

    /* STILI QUANDO LA SCONTISTICA E' ATTIVA */
    .card.has-discount .side-brand-wrapper {
      height: 50%;
      align-items: center;
      padding-bottom: 0;
    }

    .card.has-discount .side-brand-wrapper img {
      max-height: 85%;
      transform: scale(0.85);
      transform-origin: left center;
    }

    /* RIGA SCONTISTICA TRASLATA IN ALTO E PERFETTAMENTE ALLINEATA A SINISTRA (15%) */
    .card.has-discount .discount-row {
      display: flex;
      height: 50%;
      opacity: 1;
      transform: translateY(-8px);
      align-items: center;
      padding-left: 15%;
      padding-bottom: 0;
    }

    /* MODIFICA ESCLUSIVA: QUANDO SONO ATTIVE SIA DESCRIZIONE CHE SCONTISTICA */
    .card.has-desc.has-discount .side-brand-wrapper {
      transform: translateY(6px);
    }

    /* LATO DESTRO: PREZZO FINALE */
    .price-display {
      width: 56%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-family: 'Bodoni Project', 'Bodoni MT', Didot, serif;
      font-size: 7.0rem;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: -0.03em;
      line-height: 1;
      white-space: nowrap;
      text-align: right;
      overflow: hidden;
      flex-shrink: 0;
      padding-right: 2mm;
      /* Cifre (senza la coda della virgola) al centro del rettangolo nero. Lo spostamento lo calcola centraCifrePrezzo
         dalle misure del Bodoni sul dispositivo (Mac e Windows le leggono in modo diverso, uno spostamento fisso andava
         bene solo sul Mac); 0,12em è il valore di riserva. In em, così resta giusto anche quando adjustPriceFontSize
         rimpicciolisce il prezzo. */
      transform: translateY(var(--centra-cifre, 0.12em));
    }

    /* NAVIGAZIONE UI */


    @page {
      size: A4 portrait;
      margin: 0mm !important;
    }



    @media print {
      html, body {
        width: 210mm;
        height: 291mm !important;
        max-height: 291mm !important;
        background: white !important;
        padding: 0 !important;
        margin: 0 !important;
        overflow: hidden !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .sidebar, .floating-nav-box { display: none !important; }

      .print-sheet {
        box-shadow: none;
        margin: 0 auto !important;
        padding: 6mm 10mm;
        width: 210mm;
        height: 291mm !important;
        max-height: 291mm !important;
        background-color: #ffffff !important;
        page-break-after: avoid !important;
        page-break-before: avoid !important;
        page-break-inside: avoid !important;
        break-after: avoid !important;
        break-before: avoid !important;
        break-inside: avoid !important;
        overflow: hidden !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .black-box { 
        background-color: #000000 !important; 
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>

      <div class="panel-block">

      <div class="panel-block" id="brandBlock">

          <div class="preset-select">

      </div>

      <div class="panel-block">

          <label for="desc">Descrizione</label>
          <input type="text" id="desc" maxlength="20" placeholder="-- Descrizione --" oninput="onFieldInput('desc', this.value)">
        </div>

        <div class="form-row">
          <div class="form-group" id="origGroup" hidden>
            <label for="priceOrig">Prezzo Originario</label>
            <div class="input-affix">
              <span class="affix">€</span>
              <input data-prezzo type="text" id="priceOrig" inputmode="decimal" placeholder="130,00" oninput="onPriceInput(this, 'orig')">
            </div>
          </div>
          <div class="form-group" id="discountGroup" hidden>
            <label for="discount">Sconto</label>
            <div class="input-affix">
              <input data-percentuale type="number" id="discount" min="1" max="99" placeholder="60" oninput="onDiscountInput()">
              <span class="affix">%</span>
            </div>
          </div>
          <div class="form-group">
            <label for="price">Prezzo Finale</label>
            <div class="input-affix">
              <span class="affix">€</span>
              <input data-prezzo type="text" id="price" inputmode="decimal" placeholder="49,90" oninput="onPriceInput(this, 'price')">
            </div>
          </div>
        </div>
      </div>

      <!-- Blocco 4: stampa -->
      <div class="panel-block">
        <div id="linkCardsRow" data-copia-cartello data-checkbox-id="linkCards" data-on-change="setLinkedCards"></div>

        <div class="form-group">

              <option value="single">1 CARTELLO (Solo cartello superiore)</option>
            </select>
          </div>
        </div>

        <button type="button" class="btn-print" id="printBtn" onclick="window.print()">STAMPA CARTELLI</button>
      </div>
    </div>

  <script>
    const LOGO_PATH = "../assets/logos/luxury/";
    const DEFAULT_LOGO = "LUXURY_GOLD.png";

    // Stato dei due cartelli: il pannello mostra e modifica quello scelto con CARTELLO SUPERIORE / INFERIORE.
    function createCardState() {
      return {
        brand: '', customBrand: '',          // logo nel rettangolo nero: file ufficiale o logo personalizzato (data URL)
        withDesc: false, desc: 'Sciarpe',    // + AGGIUNGI DESCRIZIONE: il testo prende il posto del logo
        withDiscount: false,                 // + AGGIUNGI SCONTISTICA: prezzo originario e sconto sotto il logo
        orig: '130,00', disc: '60',
        price: '49,90'
      };
    }

    const cards = { 1: createCardState(), 2: createCardState() };
    let currentCard = 1;
    let sheetMode = 'double';
    let linkedCards = false;   // casella COPIA SU ALTRO CARTELLO

    // Con la casella spuntata (e il foglio intero) ogni modifica vale per tutti e due i cartelli.
    function setField(field, value) {
      const targets = linkedCards && sheetMode === 'double' ? [1, 2] : [currentCard];
      targets.forEach(cardIndex => { cards[cardIndex][field] = value; });
    }

    function cleanBrandName(filename) {
      return filename.replace(/\.(png|jpg|jpeg|webp|svg)$/i, '').replace(/[-_]/g, ' ');
    }

    function readCustomLogos() {
      try {
        const logos = LoghiPersonalizzati.elenco();
        return Array.isArray(logos) ? logos.filter(logo => logo && logo.name && logo.data) : [];
      } catch (error) {
        console.error('Lettura dei loghi personalizzati fallita.', error);
        return [];
      }
    }

    function addPlaceholder(select, text) {
      const option = document.createElement('option');
      option.value = '';
      option.textContent = text;
      select.replaceChildren(option);
    }

    function loadLocalLogos() {
      const select = document.getElementById('brandSelect');
      addPlaceholder(select, '-- Seleziona Brand --');
      select.firstChild.className = 'brand-placeholder';   // placeholder testuale del menu BRAND
      // Brand prioritari (stagionali) mostrati per primi ed evidenziati, poi il resto in ordine alfabetico
      const { priorityFiles, remainingFiles } = getSortedLogoFiles();
      [...priorityFiles, ...remainingFiles].forEach(fileName => {
        appendBrandOption(select, fileName, cleanBrandName(fileName), priorityFiles.includes(fileName));
      });

      const customSelect = document.getElementById('customBrandSelect');
      addPlaceholder(customSelect, '-- Seleziona Logo Personalizzato --');
      readCustomLogos().forEach(logo => {
        const option = document.createElement('option');
        option.value = logo.data;
        option.textContent = '★ ' + logo.name;
        customSelect.appendChild(option);
      });

      syncPanel();
      renderCards();
    }

    // Scegliere un brand ufficiale azzera il logo personalizzato, e viceversa.
    function onOfficialBrandChange() {
      setField('brand', document.getElementById('brandSelect').value);
      setField('customBrand', '');
      document.getElementById('customBrandSelect').value = '';
      renderCards();
    }

    function onCustomBrandChange() {
      setField('customBrand', document.getElementById('customBrandSelect').value);
      setField('brand', '');
      document.getElementById('brandSelect').value = '';
      renderCards();
    }

    function onFieldInput(field, value) {
      setField(field, value);
      renderCards();
    }


    function onPriceInput(input, field) {
      input.value = input.value.replace(/[^\d,.]/g, '');
      onFieldInput(field, input.value);
    }


    // Sconto: un numero da 1 a 99, con il % fisso nel campo; sul cartello diventa -60%.
    function onDiscountInput() {
      const digits = document.getElementById('discount').value.replace(/\D/g, '').slice(0, 2);
      onFieldInput('disc', digits);
    }


    function setActive(activeId, ids) {
      ids.forEach(id => document.getElementById(id).classList.toggle('active', id === activeId));
    }

    function setToggle(id, isActive, onText, offText) {
      const button = document.getElementById(id);
      button.classList.toggle('active', isActive);
      button.setAttribute('aria-pressed', String(isActive));
      button.textContent = isActive ? onText : offText;
    }

    // Riporta nel pannello i valori del cartello scelto.
    function syncPanel() {
      const state = cards[currentCard];
      document.getElementById('brandSelect').value = state.brand;
      document.getElementById('customBrandSelect').value = state.customBrand;
      document.getElementById('desc').value = state.desc;
      document.getElementById('priceOrig').value = state.orig;
      document.getElementById('discount').value = state.disc;
      document.getElementById('price').value = state.price;

      SelettoreCartello.setActive('selectCard' + currentCard);
      setToggle('descBtn', state.withDesc, 'DESCRIZIONE ATTIVA', '+ AGGIUNGI DESCRIZIONE');
      setToggle('discountBtn', state.withDiscount, 'SCONTISTICA ATTIVA', '+ AGGIUNGI SCONTISTICA');
      document.getElementById('brandBlock').hidden = state.withDesc;
      document.getElementById('descGroup').hidden = !state.withDesc;
      document.getElementById('origGroup').hidden = !state.withDiscount;
      document.getElementById('discountGroup').hidden = !state.withDiscount;

      document.getElementById('linkCards').checked = linkedCards;
      document.getElementById('linkCardsRow').hidden = sheetMode === 'single';
    }

    function selectCard(cardIndex) {
      if (sheetMode === 'single' && cardIndex === 2) return;
      currentCard = cardIndex;
      syncPanel();
    }

    // + AGGIUNGI DESCRIZIONE: nel rettangolo nero il testo prende il posto del logo (spento torna il logo).
    function toggleDescription() {
      setField('withDesc', !cards[currentCard].withDesc);
      syncPanel();
      renderCards();
    }

    // + AGGIUNGI SCONTISTICA: sotto il logo (o la descrizione) compaiono prezzo originario e sconto.
    function toggleDiscount() {
      setField('withDiscount', !cards[currentCard].withDiscount);
      syncPanel();
      renderCards();
    }

    // Spuntando la casella i valori del cartello in modifica vanno anche sull'altro;
    // togliendo la spunta il cartello sovrascritto torna ai valori che aveva prima.
    let overwrittenCard = null;   // { cardIndex, state } salvato alla spunta

    function setLinkedCards(isLinked) {
      linkedCards = isLinked;
      if (isLinked) {
        const otherCard = currentCard === 1 ? 2 : 1;
        overwrittenCard = { cardIndex: otherCard, state: { ...cards[otherCard] } };
        cards[otherCard] = { ...cards[currentCard] };
      } else if (overwrittenCard) {
        cards[overwrittenCard.cardIndex] = overwrittenCard.state;
        overwrittenCard = null;
      }
      renderCards();
      syncPanel();
    }

    // 2 CARTELLI stampa i due cartelli sul foglio A4, 1 CARTELLO solo il superiore.
    function setSheetMode(mode) {
      sheetMode = mode;
      const isSingle = mode === 'single';
      document.getElementById('printBtn').textContent = isSingle ? 'STAMPA CARTELLO' : 'STAMPA CARTELLI';
      const sheet = document.getElementById('printSheet');
      document.getElementById('card2').classList.toggle('disabled', isSingle);
      sheet.classList.toggle('single-mode', isSingle);
      sheet.classList.toggle('double-mode', !isSingle);
      SelettoreCartello.setLowerDisabled(isSingle);
      document.getElementById('sheetModeSelect').value = mode;
      if (isSingle && currentCard === 2) currentCard = 1;
      syncPanel();
    }

    /* SCALATURA DINAMICA FONT DEL PREZZO FINALE */
    function adjustPriceFontSize(priceEl, text) {
      const len = text.length;
      let fontSize = "7.0rem";

      if (len <= 7) {
        fontSize = "7.0rem";
      } else if (len <= 8) {
        fontSize = "6.0rem";
      } else if (len <= 10) {
        fontSize = "4.8rem";
      } else if (len <= 12) {
        fontSize = "4.0rem";
      } else {
        fontSize = "3.2rem";
      }

      priceEl.style.fontSize = fontSize;
    }

    /* Centra in altezza le cifre del prezzo nel rettangolo nero. Con line-height 1 la riga del prezzo è centrata nel
       rettangolo, ma dove cade la linea di base dipende dalle misure verticali del carattere, che Mac e Windows
       leggono in modo diverso: si misurano qui, sul dispositivo, la linea di base e l'altezza delle cifre del Bodoni
       (canvas, in proporzione al corpo) e si scrive lo spostamento in em nella variabile --centra-cifre. */
    function centraCifrePrezzo() {
      const SIZE = 100;
      const context = document.createElement('canvas').getContext('2d');
      context.font = `${SIZE}px 'Bodoni Project'`;
      const metrics = context.measureText('0123456789');
      if (!metrics.fontBoundingBoxAscent) return;   // browser senza queste misure: resta il valore di riserva
      const halfLeading = (SIZE - (metrics.fontBoundingBoxAscent + metrics.fontBoundingBoxDescent)) / 2;
      const baseline = halfLeading + metrics.fontBoundingBoxAscent;
      const inkCenter = baseline - (metrics.actualBoundingBoxAscent - metrics.actualBoundingBoxDescent) / 2;
      document.documentElement.style.setProperty('--centra-cifre', `${((SIZE / 2 - inkCenter) / SIZE).toFixed(4)}em`);
    }
    if (document.fonts && document.fonts.load) {
      document.fonts.load(`100px 'Bodoni Project'`, '0123456789').then(centraCifrePrezzo).catch(error => {
        console.error('Misura del carattere del prezzo non riuscita.', error);
      });
    }

    /* SCALATURA DINAMICA FONT DELLA DESCRIZIONE (più piccola con la scontistica) */
    function adjustDescFontSize(descEl, text, withDiscount) {
      const len = text.length;
      let baseSize = 2.8;

      if (len > 18) {
        baseSize = 1.3;
      } else if (len > 14) {
        baseSize = 1.6;
      } else if (len > 10) {
        baseSize = 2.0;
      } else if (len > 6) {
        baseSize = 2.4;
      } else {
        baseSize = 2.8;
      }

      if (withDiscount) {
        baseSize = baseSize * 0.72;
      }

      descEl.style.fontSize = baseSize + "rem";
    }

    function renderCard(cardIndex) {
      const state = cards[cardIndex];
      const card = document.getElementById('card' + cardIndex);
      card.classList.toggle('has-desc', state.withDesc);
      card.classList.toggle('has-discount', state.withDiscount);

      const priceDisplay = document.getElementById('priceDisplay' + cardIndex);
      const fullPrice = state.price ? '€ ' + state.price : '';
      priceDisplay.textContent = fullPrice;
      adjustPriceFontSize(priceDisplay, fullPrice);

      document.getElementById('pOrigDisplay' + cardIndex).textContent = state.orig ? '€ ' + state.orig : '';
      document.getElementById('pDiscDisplay' + cardIndex).textContent = state.disc ? '-' + state.disc + '%' : '';

      const descEl = document.getElementById('cardDesc' + cardIndex);
      descEl.textContent = state.desc;
      adjustDescFontSize(descEl, state.desc, state.withDiscount);

      PrintLogoColors.setBrandLogoSrc('cardLogo' + cardIndex, state.customBrand, state.brand, DEFAULT_LOGO, 'white');
    }

    function renderCards() {
      renderCard(1);
      renderCard(2);
    }

    // I menu si riempiono quando la lista dei loghi personalizzati del negozio è pronta (loghi-personalizzati.js).
    window.onload = () => LoghiPersonalizzati.pronto.then(loadLocalLogos);
  </script>
  <script src="../assets/js/cursore.js?v=20261010-45"></script>
  <script>
    // Cursore: indica sul cartello in modifica l'elemento legato al campo in uso.
    const activeCard = () => document.getElementById('card' + currentCard);
    const inActiveCardId = id => () => document.getElementById(id + currentCard);
    const cardOf = target => target.closest('.card');
    // Logo o descrizione: quello dei due che si vede nel rettangolo nero.
    const brandOrDesc = () => cards[currentCard].withDesc ? inActiveCardId('cardDesc')() : inActiveCardId('cardLogo')();

    Cursore.create({
      panel: '.controls',
      watch: '#printSheet',
      scope: cardOf,
      obstacles: target => cardOf(target).querySelectorAll('.bf-svg-row, .side-brand-wrapper img, .desc-text, .discount-row span, .price-display'),
      rules: [
        { controls: '#selectCard1, #selectCard2', target: activeCard },
        { controls: '#descBtn, #brandSelect, #customBrandSelect, #desc', target: brandOrDesc },
        { controls: '#discountBtn', target: () => cards[currentCard].withDiscount ? inActiveCardId('discountRow')() : brandOrDesc() },
        { controls: '#priceOrig', target: inActiveCardId('pOrigDisplay') },
        { controls: '#discount, #discount ~ .percent-stepper', target: inActiveCardId('pDiscDisplay') },
        { controls: '#price', target: inActiveCardId('priceDisplay') }
      ]
    });
  </script>
  <script src="../assets/js/copia-cartello.js?v=20261010-45"></script>
  <script src="../assets/js/strumenti-stampa.js?v=20261010-45"></script>
</body>
</html>
