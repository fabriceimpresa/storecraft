  <style>
    /* Definizione Font Locali Bodoni Std da assets/fonts */
    @font-face {
      font-family: 'Bodoni Std';
      src: url('../assets/fonts/BodoniStd.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Bodoni Std';
      src: url('../assets/fonts/BodoniStd-Italic.otf') format('opentype');
      font-weight: normal;
      font-style: italic;
    }

    @font-face {
      font-family: 'Bodoni Std';
      src: url('../assets/fonts/BodoniStd.otf') format('opentype');
      font-weight: bold;
      font-style: normal;
    }

    :root {
      --bg: #121110;
      --sidebar: #181715;
      --card: #1e1d1a;
      --border: #2e2b27;
      --accent: #b48b37;
      --accent-hover: #c99c43;
      --text: #f4f1ea;
      --text-muted: #8c857b;
      --gold: #b48b37;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; display: flex; height: 100vh; overflow: auto; }

    /* --- SIDEBAR --- */
    aside { width: 360px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 1.5rem 1rem 3rem; display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
    /* titolo come quello del pannello standard (Cinzel 600 oro, maiuscolo) */
    .brand-title { font-family: 'Cinzel', serif; font-size: 1.1rem; letter-spacing: 1.5px; color: #d4a373; margin-bottom: 1rem; text-align: center; font-weight: 600; text-transform: uppercase; }

    .tabs-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; margin-bottom: 1.2rem; }
    .tab-item { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.2rem; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; cursor: pointer; transition: all 0.2s; }
    .tab-item:hover { border-color: var(--gold); }
    .tab-item.active { border-color: var(--gold); background: rgba(180, 139, 55, 0.15); }
    .tab-item label { font-size: 0.7rem; font-weight: 700; cursor: pointer; color: var(--text); }
    .tab-item input[type="checkbox"] { accent-color: var(--gold); cursor: pointer; }

    .editor-section { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; }
    .editor-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #d4a373; margin-bottom: 0.8rem; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }

    /* Il riquadro "Modifica Cartellino" segue il pannello standard (../assets/css/pannello.css), diviso nei quattro
       blocchi; qui solo ciò che è proprio dei cartellini. Come in TEBE il riquadro che comincia con un selettore ha
       1rem sopra il selettore, e l'ultimo elemento (il tasto di stampa) non aggiunge spazio sotto. */
    .editor-title + .panel-block > .mode-switch:first-child { margin-top: 1rem; }
    .editor-section > .panel-block:last-child > :last-child { margin-bottom: 0; }
    /* Nei cartellini i blocchi non hanno lo spazio in più dei cartelli: tra un blocco e l'altro c'è lo stesso spazio
       che c'è tra i campi (0,65rem), così il menu resta compatto e semplice. */
    .editor-section .panel-block + .panel-block { margin-top: 0; }
    /* sotto il selettore MODALITÀ PROMO / DOPPIO PREZZO lo stesso spazio che c'è sopra, tra la linea del titolo e il selettore (1rem) */
    .editor-section .panel-block > .mode-switch:last-child { margin-bottom: 1rem; }
    /* sotto il tasto di stampa lo stesso spazio che si vede in alto tra il bordo del riquadro e le lettere del titolo (20 px) */
    #editorPanel { padding-bottom: 1.25rem; }
    /* il tasto di stampa un poco più staccato dai campi (0,65rem + 0,35rem = 1rem) */
    .editor-section .btn-print { margin-top: 0.35rem; }

    /* Riga dei prezzi (Prezzo Originario, Sconto, Prezzo Finale): etichette su una riga sola, così i tre campi stanno
       alla stessa altezza; Sconto (due cifre) un poco più stretto e Prezzo Originario un poco più largo. */
    .form-row .form-group label { white-space: nowrap; }
    #origGroup { flex: 1.15; }
    #discountGroup { flex: 0.85; }

    /* Brand stagionali prioritari evidenziati nel menu BRAND */
    .form-group select option.priority-brand-option { background-color: #2e2b27; color: #e5ba73; font-weight: bold; }

    /* --- PREVIEW MAIN --- */
    main { flex: 1; min-width: 0; padding: 1.5rem; overflow: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0908; -webkit-overflow-scrolling: touch; }

    /* Griglia Foglio A4 Landscape */
    .a4-landscape {
      width: 282mm;
      height: 196mm;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      padding: 5mm 16mm;
      gap: 3mm 0mm;
      transform-origin: top center;
    }

    /* CARTELLINO */
    .cartellino {
      border: 8px solid #000000;
      box-sizing: border-box;
      padding: 2.5mm 1.5mm 1.5mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      background: #fff;
      color: #000;
      overflow: hidden;
      position: relative;
      width: 59.5mm;
      justify-self: center;
      height: 100%;
    }
    .cartellino.disabled { opacity: 0.15; filter: grayscale(1); }
    .sheet-wrap { position: relative; flex-shrink: 0; }

    /* Brand Logo in alto */
    .brand-box { height: 21mm; display: flex; align-items: center; justify-content: center; width: 100%; margin-top: 0.5mm; flex-shrink: 0; }
    .brand-box img { max-height: 100%; max-width: 90%; object-fit: contain; }
    .brand-box .brand-text-fallback { font-family: 'Bodoni Std', serif; font-size: 16pt; font-weight: bold; color: var(--gold); text-transform: uppercase; letter-spacing: 0.8px; }

    /* Blocco centrale */
    .card-body-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 0.5mm 0;
    }

    /* Descrizione in corsivo Bodoni */
    .desc-box { font-family: 'Bodoni Std', serif; font-style: italic; font-size: 18pt; color: #000; margin-bottom: 1.5mm; line-height: 1.1; word-break: break-word; }

    .price-details-row { margin-bottom: 1mm; min-height: 5.5mm; display: flex; align-items: center; justify-content: center; }

    /* Prezzo barrato e percentuale sconto oro */
    .orig-discount { font-family: 'Bodoni Std', serif; font-style: italic; font-size: 13pt; color: #000; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
    .orig-discount .strike { text-decoration: line-through; }
    .orig-discount .badge-sconto { color: var(--gold); font-size: 13pt; font-weight: bold; font-style: normal; }
    .currency { font-family: inherit; font-weight: inherit; }

    /* Dicitura Oro */
    .preset-label { font-family: 'Bodoni Std', serif; font-size: 13.5pt; font-weight: bold; color: var(--gold); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }

    /* Prezzo Finale in Bodoni Std - Ingrandito a 42pt */
    .final-price { font-family: 'Bodoni Std', serif; font-weight: normal; font-size: 42pt; color: #000; line-height: 0.95; letter-spacing: -0.04em; white-space: nowrap; }

    /* Logo Aziendale in basso */
    .card-footer-logo { height: 22mm; display: flex; align-items: center; justify-content: center; width: 100%; padding-bottom: 0.5mm; flex-shrink: 0; }
    .card-footer-logo img { max-height: 100%; max-width: 98%; object-fit: contain; }

    /* NAVIGAZIONE */

    /* REGOLA DI STAMPA */


    @media print {
      html, body {
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
      }
      body { background: none; display: block; }
      aside { display: none !important; }
      main {
        padding: 0;
        background: none;
        margin: 0;
        display: block;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
      }
      .a4-landscape { 
        box-shadow: none; 
        margin: 0 auto; 
        width: 282mm !important; 
        height: 196mm !important; 
        max-height: 196mm !important;
        page-break-after: avoid;
        page-break-inside: avoid;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .cartellino.disabled { visibility: hidden; opacity: 0; }
      .floating-nav-box { display: none !important; }
      @page { 
        size: A4 landscape; 
        margin: 4mm;
      }
    }

    @media (max-width: 1100px) {
      main { align-items: flex-start; justify-content: flex-start; }
      .a4-landscape { flex: 0 0 auto; }
    }

  </style>

<body data-layout="cartellini">
  <a href="index.html" class="app-close-btn" title="Chiudi" aria-label="Chiudi e torna al menu principale">✕</a>

  <div class="floating-nav-box">
    <div class="floating-nav-title">STORE // CRAFT</div>
    <a href="index.html" class="floating-nav-btn">← Torna al Menu Principale</a>
  </div>

  <aside>
    <div class="brand-title">CARTELLINI VETRINA</div>

    <div class="tabs-grid" id="tabs-container"></div>

    <div class="editor-section" id="editorPanel">
      <div class="editor-title" id="editor-header">Modifica Cartellino #1</div>

      <!-- Blocco 1: selettori e pulsanti -->
      <div class="panel-block">
        <!-- selettore comune (selettore.js) -->
        <div data-selettore id="cardModeSelector" data-on-change="onCardModeChange" aria-label="Modalità del cartellino">
          <button value="promo" id="modePromo">MODALITÀ<br>PROMO</button>
          <button value="doppio" id="modeDoppioPrezzo" class="active">DOPPIO<br>PREZZO</button>
        </div>
      </div>

      <!-- Blocco 2: brand (ufficiali e personalizzati) -->
      <div class="panel-block">
        <div class="form-group" data-menu-brand-cartellini></div>
      </div>

      <!-- Blocco 3: campi del cartellino (descrizione e prezzi, secondo la modalità) -->
      <div class="panel-block">
        <div class="form-group">
          <label class="section-label" for="descPreset">Articoli</label>
          <div class="preset-select">
            <select id="descPreset" data-testi-pronti="Articoli" onchange="applyDescPreset()">
              <option value="">-- Seleziona un articolo --</option>
            </select>
          </div>
          <label for="inp-desc">Testo Libero</label>
          <input type="text" id="inp-desc" placeholder="-- Testo Libero --" oninput="onFieldInput('desc', this.value)">
        </div>

        <div class="form-group" id="presetGroup" hidden>
          <label class="section-label" for="inp-preset">Promozioni</label>
          <div class="preset-select">
            <select id="inp-preset" onchange="onFieldInput('presetText', this.value)" data-testi-pronti="Promozioni Cartellini" data-testi-senza-gruppi>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group" id="origGroup">
            <label for="inp-orig">Prezzo Originario</label>
            <div class="input-affix">
              <span class="affix">€</span>
              <input data-prezzo type="text" id="inp-orig" inputmode="decimal" placeholder="396,00" oninput="onPriceInput(this, 'priceOrig')">
            </div>
          </div>
          <div class="form-group" id="discountGroup">
            <label for="discountValue">Sconto</label>
            <div class="input-affix">
              <input data-percentuale type="number" id="discountValue" min="1" max="99" placeholder="50" oninput="onDiscountInput()">
              <span class="affix">%</span>
            </div>
          </div>
          <div class="form-group">
            <label for="inp-final">Prezzo Finale</label>
            <div class="input-affix">
              <span class="affix">€</span>
              <input data-prezzo type="text" id="inp-final" inputmode="decimal" placeholder="198,00" oninput="onPriceInput(this, 'priceFinal')">
            </div>
          </div>
        </div>
      </div>

      <!-- Blocco 4: stampa -->
      <div class="panel-block">
        <button type="button" class="btn-print" onclick="window.print()">STAMPA FOGLIO A4</button>
      </div>
    </div>
  </aside>

  <main>
    <div class="sheet-wrap">
      <div class="a4-landscape" id="printable-grid"></div>
    </div>
  </main>

  <script src="../assets/js/selettore.js?v=20261010-35"></script>
  <script src="../assets/js/menu-brand-cartellini.js?v=20261010-35"></script>
  <script>
    const LOGO_PATH = "../assets/logos/luxury/";

    function cleanBrandName(filename) {
      if (!filename) return '';
      return filename.replace(/\.(png|jpg|jpeg|webp|svg)$/i, '').replace(/[-_]/g, ' ');
    }

    function getLogoFilename(brand) {
      if (!brand) return '';
      if (typeof LOGO_FILES !== 'undefined' && Array.isArray(LOGO_FILES)) {
        const found = LOGO_FILES.find(f => 
          f.toLowerCase() === brand.toLowerCase() || 
          cleanBrandName(f).toLowerCase() === brand.toLowerCase().replace(/[-_]/g, ' ')
        );
        if (found) return found;
      }
      return brand.includes('.') ? brand : `${brand}.png`;
    }

    const cardsData = [
      { id: 1, enabled: true, brand: 'SKYWARD.png', customLogoUrl: '', desc: 'Giubbino', usePreset: false, priceOrig: '396,00', sconto: '50', presetText: '', priceFinal: '198,00' },
      { id: 2, enabled: true, brand: 'PINKO.png', customLogoUrl: '', desc: 'Pantalone', usePreset: true, priceOrig: '', sconto: '', presetText: 'SPECIAL DEAL', priceFinal: '40,00' },
      { id: 3, enabled: true, brand: 'PINKO.png', customLogoUrl: '', desc: 'Gonna', usePreset: true, priceOrig: '', sconto: '', presetText: 'WINTER SALE', priceFinal: '30,00' },
      { id: 4, enabled: true, brand: 'FELEPPA.png', customLogoUrl: '', desc: 'Giubbino', usePreset: false, priceOrig: '310,00', sconto: '55', presetText: '', priceFinal: '139,50' },
      { id: 5, enabled: true, brand: 'WEILIZHENG.png', customLogoUrl: '', desc: 'Top', usePreset: true, priceOrig: '', sconto: '', presetText: 'SPECIAL DEAL', priceFinal: '30,00' },
      { id: 6, enabled: true, brand: 'HAVEONE.png', customLogoUrl: '', desc: 'Abito', usePreset: true, priceOrig: '', sconto: '', presetText: 'SPECIAL DEAL', priceFinal: '30,00' },
      { id: 7, enabled: true, brand: 'MEIMEIJ.png', customLogoUrl: '', desc: 'Pantalone', usePreset: true, priceOrig: '', sconto: '', presetText: 'WINTER SALE', priceFinal: '30,00' },
      { id: 8, enabled: true, brand: 'FELEPPA.png', customLogoUrl: '', desc: 'Giubbino', usePreset: false, priceOrig: '310,00', sconto: '55', presetText: '', priceFinal: '139,50' }
    ];

    let currentCardIdx = 0;

    function init() {
      renderTabs();
      renderGrid();
      loadEditorData();
    }

    function renderTabs() {
      const container = document.getElementById('tabs-container');
      container.innerHTML = '';
      cardsData.forEach((card, index) => {
        const item = document.createElement('div');
        item.className = `tab-item ${index === currentCardIdx ? 'active' : ''}`;
        item.onclick = (e) => {
          if (e.target.type !== 'checkbox') {
            currentCardIdx = index;
            renderTabs();
            loadEditorData();
          }
        };

        item.innerHTML = `
          <label>#${card.id}</label>
          <input type="checkbox" ${card.enabled ? 'checked' : ''} onchange="toggleCardEnabled(${index}, this.checked)">
        `;
        container.appendChild(item);
      });
    }

    function renderGrid() {
      const grid = document.getElementById('printable-grid');
      grid.innerHTML = '';

      cardsData.forEach((card) => {
        const el = document.createElement('div');
        el.className = `cartellino ${!card.enabled ? 'disabled' : ''}`;
        el.id = `card-view-${card.id}`;

        const brandDisplayName = cleanBrandName(card.brand);
        let logoContent = `<div class="brand-text-fallback">${brandDisplayName}</div>`;

        if (card.customLogoUrl) {
          logoContent = `<img src="${card.customLogoUrl}" alt="${brandDisplayName}">`;
        } else if (card.brand) {
          const logoFile = getLogoFilename(card.brand);
          const logoSrc = getLogoSource(logoFile);
          logoContent = `<img src="${logoSrc}" onerror="this.outerHTML='<div class=\\'brand-text-fallback\\'>${brandDisplayName}</div>'" alt="${brandDisplayName}">`;
        }

        let subRowContent = '';
        if (card.usePreset) {
          subRowContent = `<div class="preset-label">${card.presetText}</div>`;
        } else {
          subRowContent = `
            <div class="orig-discount">
              ${card.priceOrig ? `<span class="strike"><span class="currency">€</span> ${card.priceOrig}</span>` : ''}
              ${card.sconto ? `<span class="badge-sconto">-${card.sconto}%</span>` : ''}
            </div>
          `;
        }

        el.innerHTML = `
          <div class="brand-box">${logoContent}</div>
          <div class="card-body-center">
            <div class="desc-box">${card.desc}</div>
            <div class="price-details-row">${subRowContent}</div>
            <div class="final-price"><span class="currency">€</span> ${card.priceFinal}</div>
          </div>
          <div class="card-footer-logo">
            <img src="../assets/img/luxury/logocartellini.png" onerror="this.style.display='none'" alt="Luxury Outlet">
          </div>
        `;

        grid.appendChild(el);

        // Ricolora il logo brand via canvas (oro), indipendente dal browser.
        if (card.customLogoUrl || card.brand) {
          const officialFile = card.customLogoUrl ? '' : getLogoFilename(card.brand);
          PrintLogoColors.getBrandLogoSrc(card.customLogoUrl, officialFile, '', 'gold').then(src => {
            const imgEl = el.querySelector('.brand-box img');
            if (imgEl && src) imgEl.src = src;
          });
        }
      });
    }

    // Riporta nel pannello i valori del cartellino scelto con le linguette.
    function loadEditorData() {
      const card = cardsData[currentCardIdx];
      document.getElementById('editor-header').textContent = `Modifica Cartellino #${card.id}`;

      // con un logo personalizzato il menu BRAND resta su "-- Seleziona Brand --" (il brand di prima resta salvato)
      document.getElementById('brandSelect').value = card.customLogoUrl ? '' : getLogoFilename(card.brand);
      document.getElementById('customBrandSelect').value = card.customLogoUrl || '';

      document.getElementById('descPreset').value = '';
      document.getElementById('inp-desc').value = card.desc;
      document.getElementById('inp-orig').value = card.priceOrig;
      document.getElementById('discountValue').value = card.sconto;
      document.getElementById('inp-preset').value = card.presetText || 'SPECIAL DEAL';
      document.getElementById('inp-final').value = card.priceFinal;

      syncMode();
    }

    // MODALITÀ PROMO: sotto la descrizione la scritta promozionale oro; DOPPIO PREZZO: prezzo originario barrato e sconto.
    // Clic sul selettore comune MODALITÀ PROMO / DOPPIO PREZZO (selettore.js).
    function onCardModeChange(value) {
      setCardMode(value === 'promo');
    }

    function setCardMode(usePreset) {
      const card = cardsData[currentCardIdx];
      card.usePreset = usePreset;
      // passando a una modalità con i campi vuoti, valori di partenza come prima
      if (usePreset) {
        if (!card.presetText) card.presetText = 'SPECIAL DEAL';
        if (!card.priceFinal) card.priceFinal = '40,00';
      } else {
        if (!card.priceOrig) card.priceOrig = '100,00';
        if (!card.sconto) card.sconto = '50';
        if (!card.priceFinal) card.priceFinal = '50,00';
      }
      loadEditorData();
      renderGrid();
    }

    // Mostra i pulsanti e i campi della modalità del cartellino scelto.
    function syncMode() {
      const usePreset = cardsData[currentCardIdx].usePreset;
      Selettore.attiva('cardModeSelector', usePreset ? 'promo' : 'doppio');
      document.getElementById('presetGroup').hidden = !usePreset;
      document.getElementById('origGroup').hidden = usePreset;
      document.getElementById('discountGroup').hidden = usePreset;
    }

    function onFieldInput(field, value) {
      cardsData[currentCardIdx][field] = value;
      renderGrid();
    }

    // Scegliere un brand ufficiale toglie il logo personalizzato; scegliendo un logo personalizzato il brand di prima
    // resta salvato e torna togliendo il logo personalizzato.
    function onOfficialBrandChange() {
      const card = cardsData[currentCardIdx];
      card.brand = document.getElementById('brandSelect').value;
      card.customLogoUrl = '';
      document.getElementById('customBrandSelect').value = '';
      renderGrid();
    }

    function onCustomBrandChange() {
      const card = cardsData[currentCardIdx];
      card.customLogoUrl = document.getElementById('customBrandSelect').value;
      document.getElementById('brandSelect').value = card.customLogoUrl ? '' : getLogoFilename(card.brand);
      renderGrid();
    }

    // L'articolo scelto riempie il Testo Libero, che resta modificabile a mano (come in TEBE).
    function applyDescPreset() {
      const preset = document.getElementById('descPreset').value;
      if (!preset) return;
      document.getElementById('inp-desc').value = preset;
      onFieldInput('desc', preset);
    }


    function onPriceInput(input, field) {
      input.value = input.value.replace(/[^\d,.]/g, '');
      onFieldInput(field, input.value);
    }


    // Sconto: un numero da 1 a 99, con il % fisso nel campo; sul cartellino diventa -50%.
    function onDiscountInput() {
      const digits = document.getElementById('discountValue').value.replace(/\D/g, '').slice(0, 2);
      onFieldInput('sconto', digits);
    }


    function toggleCardEnabled(index, enabled) {
      cardsData[index].enabled = enabled;
      renderGrid();
    }

    function applySafariPrintFix() {
      const ua = navigator.userAgent;
      const isSafari = /^((?!chrome|android).)*safari/i.test(ua) && !/Edg|OPR|Brave/i.test(ua);
      if (!isSafari) return;

      const style = document.createElement('style');
      style.textContent = `
        @media print {
          /* Safari, a differenza di Chrome, spesso ignora la regola globale
             "@page { size: A4 landscape }" (parola chiave) e stampa in
             portrait di default: il foglio (282mm di larghezza) va quindi
             in overflow orizzontale e genera una seconda pagina fantasma
             vuota. Il foglio 282x196mm rientra già perfettamente nell'area
             stampabile di un A4 landscape (289x202mm con margine 4mm), per
             cui basta forzare l'orientamento corretto con dimensioni
             esplicite, senza scalare o tagliare nulla.
          */
          @page {
            size: 297mm 210mm;
            margin: 4mm;
          }
        }
      `;
      document.head.appendChild(style);
    }

    init();
    applySafariPrintFix();
  </script>
  <script src="../assets/js/cursore.js?v=20261010-35"></script>
  <script>
    // Cursore (come in Cartellini LXRY di TEBE): la linguetta lo porta sopra il cartellino scelto, i campi del pannello
    // sopra (o di lato) l'elemento del cartellino legato al campo in uso.
    const currentCardView = () => document.getElementById(`card-view-${cardsData[currentCardIdx].id}`);
    const inCurrentCard = selector => () => currentCardView()?.querySelector(selector);

    Cursore.create({
      panel: 'aside',
      watch: '#printable-grid',
      clip: 'main',
      sideGap: 96 / 25.4 + 5,   // nei cartellini di lato basta 1 mm + 5 px
      // di lato il cursore può uscire dal cartellino (restando sul foglio), purché non copra testi e loghi
      scope: '#printable-grid',
      obstacles: '#printable-grid .brand-box > *, #printable-grid .desc-box, #printable-grid .orig-discount .strike, #printable-grid .orig-discount .badge-sconto, #printable-grid .preset-label, #printable-grid .final-price, #printable-grid .card-footer-logo img',
      rules: [
        { controls: '.tab-item', target: currentCardView, placement: 'above' },
        { controls: '#modePromo, #inp-preset', target: inCurrentCard('.preset-label') },
        { controls: '#modeDoppioPrezzo', target: inCurrentCard('.orig-discount') },
        { controls: '#brandSelect, #customBrandSelect', target: inCurrentCard('.brand-box > *') },
        { controls: '#descPreset, #inp-desc', target: inCurrentCard('.desc-box') },
        { controls: '#inp-orig', target: inCurrentCard('.orig-discount .strike') },
        { controls: '#discountValue, #discountValue ~ .percent-stepper', target: inCurrentCard('.orig-discount .badge-sconto') },
        { controls: '#inp-final', target: inCurrentCard('.final-price') }
      ]
    }).point({ target: currentCardView, placement: 'above' });
  </script>
  <script src="../assets/js/strumenti-stampa.js?v=20261010-35" data-panel="#editorPanel" data-sheet="#printable-grid"></script>
