<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <script src="assets/js/negozi.js?v=20261019-03"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Pannello di controllo</title>
  <link rel="icon" href="assets/img/favicon-32.png">
  <script src="assets/js/operatore-sezione.js?v=20261019-03"></script>
  <!-- rimuovere i cloni creati da Gestione pacchetti (scrivendo nella cartella del progetto collegata) -->
  <script src="assets/js/pacchetti-associa.js?v=20261019-03"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    /* Struttura delle pagine (area operatore: non collegata, non copiata ai clienti). A ogni apertura legge le pagine di
       ogni negozio installato e mostra quali regole e moduli comuni usano e quali pezzi scritti a mano restano.
       Stesso aspetto da sito tecnico della guida dei componenti. */
    :root {
      --bg: #0d0c0b; --pannello: #151412; --bordo: #2a2723; --testo: #d9d3c7; --tenue: #8f877b;
      --oro: #d4a373; --oro-chiaro: #e5ba73; --ok: #8fbf7a; --no: #4b4740; --warn: #e07a5f;
      --mono: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--testo); font: 300 13px/1.65 var(--mono); letter-spacing: .01em; }
    a { color: var(--oro); }
    .pagina { max-width: 1120px; margin: 0 auto; padding: 18px 20px 60px; }
    .torna { display: inline-block; margin-bottom: 14px; color: var(--tenue); font-size: 11.5px; letter-spacing: .08em; text-decoration: none; }
    .torna:hover { color: var(--oro); }
    /* logo STORE // CRAFT e titolo come nella Guida tecnica (logo 104 px nell'oro chiaro, 22 px dal titolo) */
    header.testa { display: flex; align-items: center; gap: 22px; padding: 0 0 20px; margin-bottom: 42px; border-bottom: 1px solid var(--bordo); }
    header.testa img { width: 104px; filter: brightness(0) saturate(100%) invert(73%) sepia(29%) saturate(836%) hue-rotate(352deg) brightness(91%) contrast(87%); opacity: .9; }
    h1 { margin: 0; color: var(--oro-chiaro); font: 400 14px var(--mono); letter-spacing: .22em; text-transform: uppercase; white-space: nowrap; }
    h1::before { content: '> '; color: var(--oro); }
    @keyframes cursore { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    p { margin: 0 0 12px; }
    /* segnale "live update" nel titolo: scritta verde minuscola .live update e cursore che lampeggia */
    /* in fondo a destra della riga del titolo */
    .live { margin-left: auto; color: var(--ok); font-size: 15px; letter-spacing: .06em; text-transform: none; vertical-align: 1px; }
    .live::after { content: '_'; margin-left: 2px; animation: cursore 1s steps(1) infinite; }
    /* riga di stato: casella nera, "stato" e l'esito dell'ultima lettura tutti in verde (19 ottobre 2026), in JetBrains Mono */
    .riga-stato { display: flex; align-items: baseline; gap: 14px; margin: 14px 0 0; padding: 9px 14px; background: #0a0908;
      border: 1px solid var(--bordo); border-radius: 4px; font: 400 12px/1.6 'JetBrains Mono', var(--mono); }
    .stato-etichetta { flex: none; color: var(--ok); letter-spacing: .08em; }
    .stato-etichetta::after { content: ':'; }
    #stato { color: var(--ok); }
    /* insegne dei negozi: discrete (bianche e tenui), quella scelta più chiara; sotto il segnalino oro che segue il mouse */
    .insegne { position: relative; display: flex; align-items: center; gap: 34px; margin: 26px 0 30px; padding-bottom: 12px; }
    .insegna { display: flex; align-items: center; height: 46px; padding: 0; border: 0; background: none; cursor: pointer; }
    .insegna img { display: block; height: auto; max-height: 42px; filter: brightness(0) invert(1); opacity: .35; transition: opacity .2s; }
    .insegna:hover img, .insegna:focus-visible img, .insegna[aria-selected="true"] img { opacity: .9; }
    .insegna:focus-visible { outline: none; }
    .segnalino { position: absolute; bottom: -1px; left: 0; width: 0; height: 2px; background: var(--oro); transition: left .3s ease, width .3s ease; }
    /* tabella dello schema */
    .schema-negozio { margin: 18px 0; }
    .schema-negozio > h3 { display: none; }
    .schema-scroll { overflow-x: auto; border: 1px solid var(--bordo); border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th, td { text-align: left; vertical-align: top; padding: 7px 9px; border-bottom: 1px solid var(--bordo); }
    th { color: var(--oro); font-weight: 400; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; background: var(--pannello);
      white-space: nowrap; writing-mode: vertical-rl; transform: rotate(180deg); padding: 10px 6px; height: 150px; }
    th.pg { writing-mode: horizontal-tb; transform: none; height: auto; vertical-align: bottom; }
    /* Esito del negozio: colonna larga quanto gli avvisi, la scritta verticale sta al centro della colonna;
       verde con le pagine del negozio allineate, rossa se c'è qualcosa da sistemare */
    th.centro { writing-mode: horizontal-tb; transform: none; text-align: center; vertical-align: bottom; }
    th.centro span { display: inline-block; writing-mode: vertical-rl; transform: rotate(180deg); }
    th.centro.si { color: var(--ok); }
    th.centro.warn { color: var(--warn); }
    td { text-align: center; padding: 6px 4px; }
    td:first-child { color: var(--oro-chiaro); text-align: left; white-space: nowrap; }
    .si { color: var(--ok); }
    .no { color: var(--no); }
    .warn { color: var(--warn); }
    /* Ultima colonna, l'esito della riga (come un totale): staccata dalle altre con un fondo appena più chiaro
       e una linea a sinistra; la pagina allineata ha la spunta verde, più grande delle altre, senza alzare la riga */
    th.centro, td.esito { border-left: 1px solid #4a453d; background: rgba(255, 255, 255, .035); }
    /* il titolo ha il fondo pieno (stessa tinta): sul telefono resta fermo in alto e le righe gli scorrono sotto */
    th.centro { background: linear-gradient(rgba(255, 255, 255, .035), rgba(255, 255, 255, .035)), var(--pannello); }
    td.esito { text-align: center; vertical-align: middle; }
    .spunta-esito { color: var(--ok); font-size: 15px; line-height: 1; }
    /* clone creato da Gestione pacchetti (pagina con storecraft-origine): l'etichetta clone in oro e il pulsante ✕ rimuovi;
       le pagine di partenza dei negozi non hanno il pulsante */
    /* moduli sorgente in oro e cloni in azzurro, come in Gestione negozi (regola del 12 ottobre 2026) */
    .tipo.sorgente { border-color: rgba(212, 163, 115, .55); color: var(--oro); }
    .tipo.clone { border-color: #5fb3c9; color: #5fb3c9; }
    /* ghost: la pagina resta nel negozio ma la dashboard non la mostra (né widget né menu); riga attenuata */
    .ghost { margin-left: 8px; padding: 0 6px; border: 1px solid var(--bordo); border-radius: 3px; background: none; color: var(--tenue);
      font: 400 10px var(--mono); letter-spacing: .06em; cursor: pointer; }
    .ghost:hover, .ghost:focus-visible { border-color: var(--oro); color: var(--oro-chiaro); outline: none; }
    .ghost[aria-pressed="true"] { border-color: #9b8fd0; color: #b9aef0; }
    .ghost:disabled { opacity: .4; cursor: default; }
    tr.in-ghost td:not(:first-child), tr.in-ghost td:first-child a { opacity: .45; }
    .rimuovi { margin-left: 8px; padding: 0 6px; border: 1px solid #e07a5f; border-radius: 3px; background: none; color: #e07a5f;
      font: 400 10px var(--mono); letter-spacing: .06em; cursor: pointer; }
    .rimuovi:hover, .rimuovi:focus-visible { background: #e07a5f; color: #121110; outline: none; }
    .rimuovi:disabled { opacity: .4; cursor: default; }
    .tipo { display: inline-block; margin-left: 6px; padding: 0 5px; border: 1px solid var(--bordo); border-radius: 3px; color: var(--tenue); font-size: 10px; letter-spacing: .06em; }
    /* mentre la tabella scorre di lato, la prima colonna (i nomi delle pagine) resta ferma a sinistra */
    th.pg, td:first-child { position: sticky; left: 0; z-index: 1; box-shadow: 1px 0 0 var(--bordo); }
    th.pg { z-index: 3; }
    td:first-child { background: var(--bg); }
    /* Dentro la pagina operatore (?incorporata, operatore-sezione.js): niente intestazione propria (il titolo è quello
       della cornice) né fondo; sul computer la tabella non scorre nel suo riquadro ma allarga la cornice quanto serve */
    html.incorporata, html.incorporata body { overflow: hidden; background: transparent; }
    html.incorporata .pagina { max-width: none; padding: 0; }
    html.incorporata .torna, html.incorporata header.testa { display: none; }
    html.incorporata .riga-stato { margin-top: 0; }
    /* le colonne ferme prendono il fondo della pagina operatore, così non si vede una fascia più scura */
    html.incorporata { --bg: #121110; }
    @media (min-width: 701px) { html.incorporata .schema-scroll { overflow: visible; } }
    /* zoom della tabella (comandi − / + sopra la tabella, solo sul telefono) */
    .schema-scroll table { zoom: var(--zoom-tabella, 1); }
    .zoom-tabella { display: none; }
    /* Archivi dei dati (sotto la tabella delle pagine, comune a tutti i negozi): dove STORE // CRAFT conserva i dati,
       con un'etichetta colorata per tipo di archivio e la verifica dal vivo che la chiave sia ancora nel codice */
    /* Sezioni apribili come il menu laterale della dashboard: titolo con la freccia ⌄ (ruotata di 90° da chiusa),
       al passaggio del mouse un fondo oro tenue e la linea oro a sinistra; sotto il titolo una linea sottile */
    .blocco { margin-top: 30px; }
    .blocco > .label { display: flex; align-items: center; gap: 16px; padding: 12px 10px; border-bottom: 1px solid var(--bordo);
      cursor: pointer; transition: background .18s ease, box-shadow .18s ease; }
    .blocco > .label:hover { background: rgba(212, 163, 115, .08); box-shadow: inset 2px 0 var(--oro); }
    .blocco h2 { margin: 0; color: var(--oro-chiaro); font: 400 13px var(--mono); letter-spacing: .22em; }
    .blocco h2::before { content: '> '; color: var(--oro); }
    .blocco .riassunto { margin-left: auto; color: var(--tenue); font-size: 11px; letter-spacing: .04em; }
    .section-toggle { border: 0; background: transparent; color: var(--oro); padding: 2px 4px; font-size: 16px; line-height: 1;
      cursor: pointer; transition: transform .18s ease; }
    .section-toggle[aria-expanded="false"] { transform: rotate(-90deg); }
    .section-toggle:focus-visible { outline: 1px solid var(--oro); outline-offset: 2px; }
    .blocco-corpo { padding-top: 6px; }
    .blocco.is-collapsed .blocco-corpo { display: none; }
    .archivi .nota { margin-top: 14px; color: var(--tenue); font-size: 11.5px; }
    .archivi .nota::before { content: '// '; color: var(--oro); }
    .legenda { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 18px 0 22px; }
    /* riquadri cliccabili: portano al gruppo del loro tipo nella tabella */
    .legenda button { display: block; width: 100%; padding: 10px 12px; border: 1px solid var(--bordo); border-left: 3px solid var(--colore); border-radius: 4px;
      background: var(--pannello); color: inherit; font: inherit; font-size: 11px; text-align: left; cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease; }
    .legenda button:hover, .legenda button:focus-visible { border-color: var(--colore); background: #1c1a17; transform: translateY(-1px); outline: none; }
    .legenda button:active { transform: none; }
    /* il gruppo raggiunto si accende un attimo nel colore del suo tipo */
    .archivi tr.gruppo { scroll-margin-top: 16px; }
    @keyframes acceso { from { background: color-mix(in srgb, var(--colore) 22%, transparent); } to { background: transparent; } }
    .archivi tr.gruppo.acceso td { animation: acceso 1.6s ease-out; }
    @media (prefers-reduced-motion: reduce) { .legenda button { transition: none; } .archivi tr.gruppo.acceso td { animation: none; } }
    .legenda strong { display: block; margin-bottom: 3px; color: var(--colore); font-weight: 500; letter-spacing: .04em; }
    .legenda strong span { float: right; color: var(--testo); }
    .legenda p { margin: 0; color: var(--tenue); }
    .archivi .schema-scroll { overflow-x: auto; }
    .archivi table { font-size: 11.5px; }
    .archivi th { writing-mode: horizontal-tb; transform: none; height: auto; padding: 9px 10px; vertical-align: bottom; position: static; }
    .archivi td { text-align: left; padding: 9px 10px; position: static; box-shadow: none; background: none; }
    .archivi td:first-child { color: var(--testo); white-space: normal; min-width: 130px; font-weight: 400; }
    .archivi td:nth-child(2) { max-width: 240px; }
    /* il nome dell'archivio prende il colore del suo tipo, come la riga del gruppo */
    .archivi tr:not(.gruppo) td:first-child { border-left: 2px solid var(--colore); }
    .archivi tr.gruppo td { padding: 14px 10px 6px; color: var(--colore); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; border-bottom-color: var(--colore); }
    .archivi tr.storico td { opacity: .55; }
    .archivi code { color: var(--oro-chiaro); font: 400 11px var(--mono); word-break: break-word; }
    .archivi .file { color: var(--tenue); font-size: 10.5px; }
    .archivi td.verifica { text-align: center; white-space: nowrap; }
    .t-local { --colore: #d4a373; } .t-session { --colore: #7fb3d5; } .t-cookie { --colore: #e0a65f; }
    .t-idb { --colore: #8fbf7a; } .t-file { --colore: #b8b0a3; } .t-esterno { --colore: #b9aef0; }
    @media (max-width: 700px) {
      .blocco h2 { font-size: 12px; letter-spacing: .16em; }
      .blocco .riassunto { font-size: 10px; }
      .archivi table { min-width: 860px; }
      .archivi .schema-scroll { max-height: none; }
    }
    @media (prefers-reduced-motion: reduce) { .live::after { animation: none; } }
    /* Telefono: la pagina sta nella larghezza dello schermo; la tabella è un riquadro che scorre in tutte e due le
       direzioni, con la riga dei titoli e la colonna delle pagine ferme, e si ingrandisce o rimpicciolisce con − / +
       (il pizzico con due dita sulla pagina resta libero) */
    @media (max-width: 700px) {
      .pagina { padding: 14px 14px 40px; }
      header.testa { flex-wrap: wrap; gap: 10px 16px; margin-bottom: 26px; padding-bottom: 16px; }
      header.testa img { width: 72px; }
      h1 { font-size: 12px; letter-spacing: .16em; }
      .live { font-size: 13px; }
      .riga-stato { gap: 10px; font-size: 11px; }
      .insegne { gap: 22px; margin: 20px 0 18px; }
      .insegna { height: 34px; }
      .insegna img { max-height: 26px; max-width: 28vw; }
      /* alta al massimo il 72% dello schermo (dentro la pagina operatore l'altezza della sua finestra, --alto-schermo) */
      .schema-scroll { max-height: calc(var(--alto-schermo, 100vh) * .72); overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
      th { position: sticky; top: 0; z-index: 2; }
      /* anche l'ultima colonna, l'esito della riga, resta ferma a destra mentre la tabella scorre di lato (fondo pieno) */
      th.centro, td.esito { position: sticky; right: 0; box-shadow: -1px 0 0 #4a453d; }
      th.centro { z-index: 3; }
      td.esito { z-index: 1; background: linear-gradient(rgba(255, 255, 255, .035), rgba(255, 255, 255, .035)), var(--bg); }
      .zoom-tabella { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin: 0 0 10px; color: var(--tenue); font-size: 11px; }
      .zoom-tabella button { width: 36px; height: 32px; border: 1px solid var(--bordo); border-radius: 4px; background: var(--pannello);
        color: var(--oro); font: 400 16px var(--mono); cursor: pointer; }
      .zoom-tabella button:disabled { opacity: .35; }
      .zoom-tabella output { min-width: 44px; text-align: center; color: var(--oro-chiaro); }
    }
  </style>
</head>
<body>
<div class="pagina">
  <a class="torna" href="operatore.html">← Area operatore</a>
  <header class="testa">
    <img src="assets/img/storecraftlogo.png" alt="STORE // CRAFT">
    <h1>Pannello di controllo</h1>
    <span class="live" title="Lo schema si rifà a ogni apertura leggendo le pagine">.live update</span>
  </header>

  <!-- Sezioni apribili e richiudibili come quelle del menu laterale della dashboard: un clic sul titolo (o sulla
       freccia) apre o chiude; ripartono sempre chiuse -->
  <section class="blocco is-collapsed" data-blocco="pagine">
    <div class="label">
      <h2 id="pagine-titolo">PAGINE e MODULI</h2>
      <span class="riassunto" id="pagine-riassunto"></span>
      <button class="section-toggle" type="button" aria-expanded="false" aria-controls="pagine-corpo" aria-label="Espandi Pagine e moduli">⌄</button>
    </div>
    <div class="blocco-corpo" id="pagine-corpo">
      <!-- riga di stato dentro Pagine e moduli (dal 19 ottobre 2026) -->
      <p class="riga-stato"><span class="stato-etichetta">stato</span><span id="stato">Lettura in corso…</span></p>
      <div id="schema"></div>
    </div>
  </section>

  <section class="blocco archivi is-collapsed" id="archivi" data-blocco="archivi">
    <div class="label">
      <h2 id="archivi-titolo">ARCHIVI DEI DATI</h2>
      <span class="riassunto" id="archivi-riassunto"></span>
      <button class="section-toggle" type="button" aria-expanded="false" aria-controls="archivi-corpo" aria-label="Espandi Archivi dei dati">⌄</button>
    </div>
    <div class="blocco-corpo" id="archivi-corpo">
      <p class="nota">dove STORE // CRAFT conserva i dati, uguale per tutti i negozi. la colonna verifica controlla a ogni apertura che la chiave sia ancora nel codice</p>
      <div class="legenda" id="archivi-legenda"></div>
      <div class="schema-scroll"><table id="archivi-tabella"></table></div>
    </div>
  </section>
</div>

<script>
  // Ogni controllo: [titolo breve, descrizione, funzione che dal testo della pagina dà true/false o un numero]
  const conta = (testo, regex) => (testo.match(regex) || []).length;
  const CONTROLLI = [
    ['Pannello', 'pannello.css: pannello standard', t => /pannello\.css/.test(t)],
    ['Blocchi', 'quanti <div class="panel-block">', t => conta(t, /class="panel-block"/g)],
    ['Menu a cascata', 'menu-cascata.js', t => /menu-cascata\.js/.test(t)],
    ['Selettore', 'selettore.js e quanti data-selettore', t => /assets\/js\/selettore\.js/.test(t) ? Math.max(1, conta(t, /data-selettore[\s>]/g)) : false],
    ['Cartello sup./inf.', 'selettore-cartello.js', t => /selettore-cartello\.js/.test(t)],
    ['Modalità prezzo', 'selettore-modalita-prezzo.js', t => /selettore-modalita-prezzo\.js/.test(t)],
    ['N. articoli', 'selettore-numero-articoli.js', t => /selettore-numero-articoli\.js/.test(t)],
    ['2° brand', 'second-brand-toggle.js', t => /second-brand-toggle\.js/.test(t)],
    ['Copia cartello', 'copia-cartello.js', t => /copia-cartello\.js/.test(t)],
    ['Campi prezzo', 'campi-prezzo.js e quanti campi data-prezzo / data-percentuale', t => /campi-prezzo\.js/.test(t) ? Math.max(1, conta(t, /data-(prezzo|percentuale)[\s>]/g)) : false],
    ['Testi pronti', 'testi-pronti.js', t => /testi-pronti\.js/.test(t)],
    ['Fasce prezzo', 'fasce-prezzo.js', t => /fasce-prezzo\.js/.test(t)],
    ['Brand cartellini', 'menu-brand-cartellini.js', t => /menu-brand-cartellini\.js/.test(t)],
    ['Brand ufficiali', 'logos.js', t => /assets\/js\/logos\.js/.test(t)],
    ['Loghi personali', 'loghi-personalizzati.js', t => /loghi-personalizzati\.js/.test(t)],
    ['Cursore', 'cursore.js', t => /cursore\.js/.test(t)],
    ['Pulsantiera / lista', 'strumenti-stampa.js', t => /strumenti-stampa\.js/.test(t)],
    ['Stampa iPhone', 'stampa-ios.js', t => /stampa-ios\.js/.test(t)],
    ['Vista telefono', 'responsive.js (data-layout)', t => /responsive\.js/.test(t) ? ((t.match(/data-layout="([^"]+)"/) || [])[1] || true) : false],
    ['Made in Italy', 'madeinitaly.js', t => /madeinitaly\.js/.test(t) ? (/data-automatico/.test(t) ? 'auto' : true) : false],
    ['✕ / Torna', 'chiudi-pagina.css e torna-al-menu.css', t => /chiudi-pagina\.css/.test(t) && /torna-al-menu\.css/.test(t)],
    ['Tema', 'theme.js', t => /theme\.js/.test(t)]
  ];
  // Pezzi scritti a mano che dovrebbero venire dai moduli comuni
  const RESIDUI = [
    ['selettore a mano', t => /class="mode-switch/.test(t)],
    ['regola prezzi copiata', t => /function formatPriceValue|onPriceBlur\(/.test(t)],
    ['frecce sconto copiate', t => /function stepDiscount|function stepPercent/.test(t)],
    ['menu con stile proprio', t => /select-control|price-range-control/.test(t)],
    ['testo con innerHTML', t => /innerHTML\s*=\s*`[^`]*\$\{/.test(t)]
  ];
  const SERVIZIO = ['genera_loghi.html', 'gestisci_lista.html', 'lista-stampa.html', 'cronologia-stampa.html', 'bacheca.html', 'pdf-viewer.html'];

  async function testo(url) {
    const risposta = await fetch(url, { cache: 'no-store' });
    if (!risposta.ok) throw new Error(`${url}: ${risposta.status}`);
    return risposta.text();
  }

  const testiDashboard = {};
  async function pagineDelNegozio(id) {
    const contenuto = await testo(`assets/negozi/${id}-dashboard.js`);
    testiDashboard[id] = contenuto;   // per il ghost delle pagine
    const pagine = new Set();
    for (const m of contenuto.matchAll(/link:\s*'([^'?]+\.html)/g)) pagine.add(m[1]);
    const etichette = contenuto.match(/etichette:\s*'([^'?]+\.html)/);
    if (etichette) pagine.add(etichette[1]);
    return ['index.html', ...pagine, ...SERVIZIO];
  }

  function cella(valore) {
    const td = document.createElement('td');
    if (valore === false || valore === 0) { td.className = 'no'; td.textContent = '·'; }
    else if (valore === true) { td.className = 'si'; td.textContent = '✓'; }
    else { td.className = 'si'; td.textContent = String(valore); }
    return td;
  }

  // Dentro la pagina operatore: l'altezza dello schermo è quella della sua finestra (il riquadro cresce con il contenuto)
  const incorporata = document.documentElement.classList.contains('incorporata');
  if (incorporata) {
    const altoSchermo = () => document.documentElement.style.setProperty('--alto-schermo', `${window.parent.innerHeight}px`);
    altoSchermo();
    window.parent.addEventListener('resize', altoSchermo);
  }

  // Rimuovere un clone (solo le pagine create da Gestione pacchetti): la sua scheda esce dalla dashboard e la pagina si
  // cancella, con le immagini copiate per lui; la cartella del progetto la collega la pagina operatore (o questa pagina)
  let progettoLocale = null;
  async function progetto() {
    if (incorporata && typeof window.parent.collegaProgetto === 'function') return window.parent.collegaProgetto();
    if (!progettoLocale) progettoLocale = await Associa.scegliProgetto();
    return progettoLocale;
  }
  // Ghost: la pagina sparisce dalla dashboard del negozio (widget e menu laterale) ma resta nella cartella; di nuovo per
  // farla ricomparire. Scrive nascosta: true nelle schede della dashboard (cartella del progetto collegata)
  function pulsanteGhost(negozio, pagina, inGhost) {
    const pulsante = document.createElement('button');
    pulsante.type = 'button';
    pulsante.className = 'ghost';
    pulsante.textContent = inGhost ? 'ghost · mostra' : 'ghost';
    pulsante.setAttribute('aria-pressed', String(inGhost));
    pulsante.title = inGhost ? `${negozio}/${pagina} è nascosta nella dashboard: un clic per farla ricomparire`
      : `Nascondi ${negozio}/${pagina} nella dashboard (widget e menu); la pagina resta nella cartella`;
    pulsante.addEventListener('click', async () => {
      const stato = document.getElementById('stato');
      let cartella;
      try { cartella = await progetto(); } catch (errore) {
        stato.textContent = errore.name === 'AbortError' ? 'cartella non collegata: nessuna modifica' : `errore (${errore.name}): ${errore.message}`;
        return;
      }
      pulsante.disabled = true;
      try {
        const negozi = await (await cartella.getDirectoryHandle('assets')).getDirectoryHandle('negozi');
        const file = await negozi.getFileHandle(`${negozio}-dashboard.js`);
        const testoDashboard = await (await Associa.istantanea(file)).text();
        const scrittura = await file.createWritable();
        await scrittura.write(Associa.impostaFantasma(testoDashboard, pagina, !inGhost));
        await scrittura.close();
        stato.textContent = `${negozio}/${pagina} ${inGhost ? 'di nuovo visibile' : 'in ghost'} nella dashboard. ricorda il commit per pubblicarlo. rileggo…`;
        setTimeout(() => location.reload(), 900);
      } catch (errore) {
        pulsante.disabled = false;
        console.error(errore);
        stato.textContent = `errore (${errore.name}): ${errore.message}`;
      }
    });
    return pulsante;
  }

  function pulsanteRimuovi(negozio, pagina, origine) {
    const pulsante = document.createElement('button');
    pulsante.type = 'button';
    pulsante.className = 'rimuovi';
    pulsante.textContent = '✕ rimuovi';
    pulsante.title = `Rimuovi il clone ${negozio}/${pagina}`;
    pulsante.addEventListener('click', async () => {
      const stato = document.getElementById('stato');
      // prima la cartella (Chrome apre la finestra solo subito dopo il clic), poi la conferma
      let cartella;
      try { cartella = await progetto(); } catch (errore) {
        stato.textContent = errore.name === 'AbortError' ? 'cartella non collegata: nessuna modifica' : `errore (${errore.name}): ${errore.message}`;
        return;
      }
      if (!window.confirm(`Rimuovere il clone ${negozio}/${pagina} (copia di ${origine})?\n\nLa sua scheda esce dalla dashboard di ${Negozi.scheda(negozio)?.nome || negozio} e la pagina viene cancellata, con le immagini copiate per lui.`)) return;
      // regola del 12 ottobre 2026: se il clone non resta in nessun altro negozio sparisce dal catalogo, e si chiede due volte
      if (Associa.ultimoClone(Object.values(testiDashboard), origine)
        && !window.confirm(`Ultima conferma: ${negozio}/${pagina} non resta in nessun altro negozio.\n\nRimuovendolo sparisce anche dal catalogo dei moduli. Eliminarlo definitivamente?`)) return;
      pulsante.disabled = true;
      try {
        await Associa.eliminaClone(cartella, { negozio, nome: pagina, avviso: testo => { stato.textContent = testo; } });
        stato.textContent = `rimosso ${negozio}/${pagina}: ricorda il commit per pubblicarlo. rileggo…`;
        setTimeout(() => location.reload(), 900);
      } catch (errore) {
        pulsante.disabled = false;
        if (errore.name === 'AbortError') { stato.textContent = 'cartella non collegata: nessuna modifica'; return; }
        console.error(errore);
        stato.textContent = `errore (${errore.name}): ${errore.message}`;
      }
    });
    return pulsante;
  }

  async function schema() {
    const contenitore = document.getElementById('schema');
    let totPagine = 0, totResidui = 0;
    // insegne dei negozi sopra lo schema: una tabella alla volta, di partenza Luxury Outlet; il segnalino oro sotto le
    // insegne segue il mouse da un'insegna all'altra e torna sotto quella scelta
    const insegne = document.createElement('div');
    insegne.className = 'insegne';
    insegne.setAttribute('role', 'tablist');
    const segnalino = document.createElement('span');
    segnalino.className = 'segnalino';
    const sposta = tasto => { segnalino.style.left = `${tasto.offsetLeft}px`; segnalino.style.width = `${tasto.offsetWidth}px`; };
    const scelto = () => insegne.querySelector('[aria-selected="true"]');
    insegne.addEventListener('mouseleave', () => scelto() && sposta(scelto()));
    contenitore.append(insegne);
    // zoom della tabella sul telefono (dal 60 al 150 %, a passi di 10; di partenza 80 %, così si vedono più colonne)
    const zoom = document.createElement('div');
    zoom.className = 'zoom-tabella';
    const meno = document.createElement('button');
    const piu = document.createElement('button');
    const valore = document.createElement('output');
    meno.type = piu.type = 'button';
    meno.textContent = '−';
    piu.textContent = '+';
    meno.setAttribute('aria-label', 'Rimpicciolisci la tabella');
    piu.setAttribute('aria-label', 'Ingrandisci la tabella');
    let livello = 80;
    const applica = () => {
      contenitore.style.setProperty('--zoom-tabella', livello / 100);
      valore.textContent = `${livello}%`;
      meno.disabled = livello <= 60;
      piu.disabled = livello >= 150;
    };
    meno.addEventListener('click', () => { livello = Math.max(60, livello - 10); applica(); });
    piu.addEventListener('click', () => { livello = Math.min(150, livello + 10); applica(); });
    zoom.append('zoom', meno, valore, piu);
    contenitore.append(zoom);
    // sul computer la tabella resta al 100 %
    const telefono = window.matchMedia('(max-width: 700px)');
    const secondoSchermo = () => { if (telefono.matches) applica(); else contenitore.style.removeProperty('--zoom-tabella'); };
    telefono.addEventListener('change', secondoSchermo);
    secondoSchermo();
    for (const id of Negozi.installati) {
      const scheda = Negozi.scheda(id) || {};
      const tasto = document.createElement('button');
      tasto.type = 'button';
      tasto.className = 'insegna';
      tasto.setAttribute('role', 'tab');
      tasto.setAttribute('aria-selected', String(id === 'luxury'));
      tasto.dataset.negozio = id;
      if (scheda.logoSplash) {
        const logo = document.createElement('img');
        logo.src = `assets/${scheda.logoSplash}`;
        logo.alt = scheda.nome || id;
        // larghezza della splash page ridotta, così le insegne sembrano grandi uguale
        logo.style.width = `${Math.round((scheda.logoSplashLarghezza || 140) * .8)}px`;
        tasto.append(logo);
      } else tasto.textContent = scheda.nome || id;
      tasto.addEventListener('mouseenter', () => sposta(tasto));
      tasto.addEventListener('focus', () => sposta(tasto));
      tasto.addEventListener('click', () => {
        insegne.querySelectorAll('.insegna').forEach(t => { t.setAttribute('aria-selected', String(t === tasto)); t.tabIndex = t === tasto ? 0 : -1; });
        contenitore.querySelectorAll('.schema-negozio').forEach(s => { s.hidden = s.dataset.negozio !== id; });
        sposta(tasto);
      });
      insegne.append(tasto);
    }
    insegne.append(segnalino);
    // Tastiera: con Tab si arriva sull'insegna scelta, le frecce (e Home / Fine) passano al negozio accanto
    insegne.querySelectorAll('.insegna').forEach(t => { t.tabIndex = t.getAttribute('aria-selected') === 'true' ? 0 : -1; });
    insegne.addEventListener('keydown', evento => {
      const tasti = [...insegne.querySelectorAll('.insegna')];
      const ora = tasti.indexOf(document.activeElement);
      const passi = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
      let dove = null;
      if (evento.key in passi) dove = (ora + passi[evento.key] + tasti.length) % tasti.length;
      else if (evento.key === 'Home') dove = 0;
      else if (evento.key === 'End') dove = tasti.length - 1;
      if (dove === null || ora < 0) return;
      evento.preventDefault();
      tasti[dove].click();
      tasti[dove].focus();
    });
    requestAnimationFrame(() => scelto() && sposta(scelto()));
    // con la sezione chiusa le insegne non hanno misure: aprendola il segnalino torna sotto il negozio scelto
    window.segnalinoAlSuoPosto = () => scelto() && sposta(scelto());
    window.addEventListener('load', () => scelto() && sposta(scelto()));
    for (const id of Negozi.installati) {
      const sezione = document.createElement('div');
      sezione.className = 'schema-negozio';
      sezione.dataset.negozio = id;
      sezione.hidden = id !== 'luxury';
      const titolo = document.createElement('h3');
      titolo.textContent = Negozi.scheda(id)?.nome || id;
      sezione.append(titolo);
      const scorri = document.createElement('div');
      scorri.className = 'schema-scroll';
      const tabella = document.createElement('table');
      const intestazione = document.createElement('tr');
      const thPagina = document.createElement('th');
      thPagina.className = 'pg';
      thPagina.textContent = 'Pagina';
      intestazione.append(thPagina);
      CONTROLLI.forEach(([nome, descrizione]) => {
        const th = document.createElement('th');
        th.textContent = nome;
        th.title = descrizione;
        intestazione.append(th);
      });
      const thResidui = document.createElement('th');
      thResidui.className = 'centro';
      thResidui.title = 'pezzi scritti a mano nella pagina';
      const scrittaResidui = document.createElement('span');
      thResidui.append(scrittaResidui);
      let daSistemare = 0;   // pagine del negozio con pezzi da sistemare o non lette
      intestazione.append(thResidui);
      tabella.append(intestazione);
      let pagine = [];
      try { pagine = await pagineDelNegozio(id); } catch (errore) { titolo.textContent += ` · scheda della dashboard non letta (${errore.message})`; }
      for (const pagina of pagine) {
        const riga = document.createElement('tr');
        const tdPagina = document.createElement('td');
        const link = document.createElement('a');
        link.href = `${id}/${pagina}`;
        if (incorporata) link.target = '_top';   // dalla pagina operatore la pagina si apre a tutta finestra
        link.textContent = pagina.replace('.html', '');
        tdPagina.append(link);
        const tipo = document.createElement('span');
        tipo.className = pagina === 'index.html' || SERVIZIO.includes(pagina) ? 'tipo' : 'tipo sorgente';
        tipo.textContent = pagina === 'index.html' ? 'dashboard' : SERVIZIO.includes(pagina) ? 'servizio' : 'sorgente';   // modulo sorgente, salvo i cloni (sotto)
        tdPagina.append(tipo);
        riga.append(tdPagina);
        try {
          const t = await testo(`${id}/${pagina}`);
          // ghost: per le pagine con schede nella dashboard (non la dashboard stessa né le pagine di servizio)
          const dashboardNegozio = testiDashboard[id] || '';
          if (pagina !== 'index.html' && !SERVIZIO.includes(pagina) && dashboardNegozio.includes(`'${pagina}`)) {
            const inGhost = Associa.fantasma(dashboardNegozio, pagina);
            riga.classList.toggle('in-ghost', inGhost);
            tdPagina.append(pulsanteGhost(id, pagina, inGhost));
          }
          const origine = Associa.clone(t);
          if (origine) {
            tipo.textContent = 'clone';
            tipo.className = 'tipo clone';
            tipo.title = `clone di ${origine}, creato da Gestione pacchetti`;
            tdPagina.append(pulsanteRimuovi(id, pagina, origine));
          }
          CONTROLLI.forEach(([, , prova]) => riga.append(cella(prova(t))));
          const residui = RESIDUI.filter(([, prova]) => prova(t)).map(([nome]) => nome);
          const td = document.createElement('td');
          if (residui.length) { td.className = 'esito warn'; td.textContent = '! ' + residui.join(', '); totResidui += residui.length; daSistemare++; }
          else {   // pagina allineata ai moduli comuni
            td.className = 'esito';
            const spunta = document.createElement('span');
            spunta.className = 'spunta-esito';
            spunta.textContent = '✔\uFE0E';
            td.append(spunta);
          }
          riga.append(td);
        } catch (errore) {
          const td = document.createElement('td');
          td.colSpan = CONTROLLI.length + 1;
          td.className = 'warn';
          td.textContent = 'pagina non letta: ' + errore.message;
          riga.append(td);
          daSistemare++;
        }
        tabella.append(riga);
        totPagine++;
      }
      // Esito del negozio: pagine allineate (verde) o da sistemare (rosso)
      const esito = pagine.length && !daSistemare;
      thResidui.className = `centro ${esito ? 'si' : 'warn'}`;
      scrittaResidui.textContent = esito ? 'pagine allineate' : 'da sistemare';
      scorri.append(tabella);
      sezione.append(scorri);
      contenitore.append(sezione);
    }
    const ora = new Date().toLocaleString('it-IT');
    document.getElementById('stato').textContent = `Letto il ${ora}: ${totPagine} pagine in ${Negozi.installati.length} negozi, ` +
      (totResidui ? `${totResidui} ${totResidui === 1 ? 'pezzo' : 'pezzi'} da portare sui moduli comuni.` : 'nessun pezzo scritto a mano da sistemare.');
    const riassunto = document.getElementById('pagine-riassunto');
    riassunto.textContent = `${totPagine} pagine · ${Negozi.installati.length} negozi · ` + (totResidui ? `${totResidui} da sistemare` : 'tutte allineate');
    riassunto.classList.toggle('warn', totResidui > 0);
  }

    ['esterno', 'Caratteri', 'fonts.googleapis.com', 'comune', 'Cinzel, Plus Jakarta Sans, Fraunces, Caveat, IBM Plex Mono…', 'cache del browser', ['luxury/index.html'], 'fonts.googleapis.com'],
    ['esterno', 'Librerie', 'cdnjs.cloudflare.com', 'comune', 'html2canvas 1.4.1, qrcodejs 1.0.0', 'cache del browser', ['assets/js/lista-stampa.js', 'luxury/index.html'], 'cdnjs.cloudflare.com'],
    ['esterno', 'Stampante DYMO', '127.0.0.1:41951 (DYMO Connect)', 'comune', 'servizio sul computer del negozio per la stampa diretta delle etichette', 'nessun dato salvato', ['assets/js/dymo-direct.js'], '41951'],
    ['esterno', 'Città dalla rete', 'get.geojs.io', 'comune', 'città approssimata dall\'indirizzo IP, per il meteo (sola lettura)', 'nel meteo, un giorno', ['assets/js/meteo.js'], 'get.geojs.io'],
    ['esterno', 'Meteo', 'api.open-meteo.com', 'comune', 'tempo di adesso e nome della città in italiano (sola lettura, senza chiave)', 'nel meteo, 30 minuti', ['assets/js/meteo.js'], 'api.open-meteo.com'],
    ['esterno', 'Database in cloud', 'Supabase / Firebase', 'da decidere', 'per condividere la Bacheca tra computer e telefoni', 'in programma: non ancora usato', [], null]
  ];

  async function archivi() {
    const legenda = document.getElementById('archivi-legenda');
    for (const [tipo, [nome, descrizione]] of Object.entries(TIPI_ARCHIVIO)) {
      const quanti = ARCHIVI.filter(a => a[0] === tipo && !a[8]).length;
      // un clic sul riquadro porta al gruppo di quel tipo nella tabella, che si accende un attimo
      const box = document.createElement('button');
      box.type = 'button';
      box.className = `t-${tipo}`;
      box.title = `Vai agli archivi ${nome}`;
      const titolo = document.createElement('strong');
      titolo.textContent = nome;
      const numero = document.createElement('span');
      numero.textContent = quanti;
      titolo.append(numero);
      const testoBox = document.createElement('p');
      testoBox.textContent = descrizione;
      box.append(titolo, testoBox);
      box.addEventListener('click', () => {
        const gruppo = document.getElementById(`archivi-${tipo}`);
        if (!gruppo) return;
        const riduci = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        gruppo.scrollIntoView({ behavior: riduci ? 'auto' : 'smooth', block: 'start' });
        gruppo.classList.remove('acceso');
        void gruppo.offsetWidth;   // per far ripartire l'animazione
        gruppo.classList.add('acceso');
      });
      legenda.append(box);
    }
    const tabella = document.getElementById('archivi-tabella');
    const intestazione = document.createElement('tr');
    ['Archivio', 'Chiave / database / indirizzo', 'Negozi', 'Cosa contiene', 'Quanto resta', 'File', 'Verifica'].forEach(nome => {
      const th = document.createElement('th');
      th.textContent = nome;
      intestazione.append(th);
    });
    tabella.append(intestazione);
    // i file si leggono una volta sola, anche se più righe li usano
    const letti = {};
    const leggi = file => letti[file] ??= testo(file).catch(() => '');
    const verifiche = [];
    let tipoPrima = null;
    for (const [tipo, nome, chiave, negozi, contenuto, durata, file, cerca, storico] of ARCHIVI) {
      if (tipo !== tipoPrima) {   // riga di gruppo per ogni tipo di archivio
        const gruppo = document.createElement('tr');
        gruppo.className = `gruppo t-${tipo}`;
        gruppo.id = `archivi-${tipo}`;
        const td = document.createElement('td');
        td.colSpan = 7;
        td.textContent = TIPI_ARCHIVIO[tipo][0];
        gruppo.append(td);
        tabella.append(gruppo);
        tipoPrima = tipo;
      }
      const riga = document.createElement('tr');
      riga.className = `t-${tipo}${storico ? ' storico' : ''}`;
      const cellaTesto = (valore, classe) => {
        const td = document.createElement('td');
        if (classe) td.className = classe;
        td.textContent = valore;
        return td;
      };
      const tdChiave = document.createElement('td');
      const codice = document.createElement('code');
      codice.textContent = chiave;
      tdChiave.append(codice);
      const verifica = cellaTesto('…', 'verifica');
      riga.append(cellaTesto(nome), tdChiave, cellaTesto(negozi), cellaTesto(contenuto), cellaTesto(durata),
        cellaTesto(file.join(' · ') || '—', 'file'), verifica);
      tabella.append(riga);
      if (!cerca) { verifica.className = 'verifica no'; verifica.textContent = 'in programma'; continue; }
      verifiche.push(Promise.all(file.map(leggi)).then(testi => {
        const trovato = testi.some(t => t.includes(cerca));
        verifica.className = `verifica ${trovato ? 'si' : 'warn'}`;
        verifica.textContent = trovato ? '✔︎' : '! non trovata';
        verifica.title = trovato ? `«${cerca}» c'è nel codice` : `«${cerca}» non c'è più in ${file.join(', ')}: aggiorna la tabella`;
        return trovato;
      }));
    }
    // riassunto a destra del titolo della sezione, visibile anche da chiusa
    const esiti = await Promise.all(verifiche);
    const mancanti = esiti.filter(trovato => !trovato).length;
    const riassunto = document.getElementById('archivi-riassunto');
    riassunto.textContent = `${ARCHIVI.length} archivi · ${Object.keys(TIPI_ARCHIVIO).length} tipi · ` +
      (mancanti ? `${mancanti} da aggiornare` : 'chiavi verificate');
    riassunto.classList.toggle('warn', mancanti > 0);
  }
  archivi();

  // Apri / chiudi le sezioni: clic sul titolo o sulla freccia, come nel menu laterale della dashboard
  document.querySelectorAll('.blocco').forEach(blocco => {
    const titolo = blocco.querySelector('.label');
    const freccia = blocco.querySelector('.section-toggle');
    const nome = blocco.querySelector('h2').textContent;
    const cambia = () => {
      const chiusa = blocco.classList.toggle('is-collapsed');
      freccia.setAttribute('aria-expanded', String(!chiusa));
      freccia.setAttribute('aria-label', `${chiusa ? 'Espandi' : 'Chiudi'} ${nome}`);
      if (!chiusa && blocco.dataset.blocco === 'pagine') requestAnimationFrame(() => window.segnalinoAlSuoPosto?.());
    };
    titolo.addEventListener('click', cambia);
  });
</script>
