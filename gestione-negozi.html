<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <script src="assets/js/negozi.js?v=20261022-13"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Gestione negozi</title>
  <link rel="icon" href="assets/img/favicon-32.png">
  <script src="assets/js/operatore-sezione.js?v=20261022-13"></script>
  <!-- scrivere nella dashboard del negozio (ghost, ordine, copia ed eliminazione dei cloni) con la cartella del progetto collegata -->
  <script src="assets/js/pacchetti-associa.js?v=20261022-13"></script>
  <!-- MODULI (accanto ai negozi): il catalogo dei moduli, letto dai pacchetti di Gestione pacchetti -->
  <script src="assets/js/pacchetti.js?v=20261022-13"></script>
  <script src="assets/pacchetti/elenco.js?v=20261022-13"></script>
  <!-- + NUOVO NEGOZIO: il percorso a domande per aprire un negozio clone, con l'anteprima dal vivo della sua dashboard -->
  <link rel="stylesheet" href="assets/css/nuovo-negozio.css?v=20261022-13">
  <script src="assets/js/logo-negozio.js?v=20261022-13"></script>
  <script src="assets/js/nuovo-negozio.js?v=20261022-13"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=JetBrains+Mono:wght@400&family=Cinzel:wght@500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Gestione negozi (area operatore). Per il negozio scelto con le insegne, un diagramma orizzontale: il negozio, la sua
       dashboard (index.html) e le gallerie della dashboard (le sezioni dei caroselli), ognuna con i suoi moduli in un
       piccolo carosello. Un clic su un modulo apre la sua scheda: ghost, duplica nella stessa galleria, elimina (solo i
       cloni), sposta. I moduli si riordinano anche trascinandoli nel carosello; l'ordine si registra nella dashboard
       (ordine: [...] della sezione) e si può tornare a quello di partenza. Scrive solo nella cartella del progetto
       collegata (Chrome / Edge sul computer). Si apre dentro la cornice della pagina operatore (?incorporata) o da sola. */
    :root {
      --bg: #0d0c0b; --pannello: #151412; --bordo: #2a2723; --testo: #d9d3c7; --tenue: #8f877b;
      --oro: #d4a373; --oro-chiaro: #e5ba73; --oro-scuro: #8f6a1f;
      --filo: rgba(212, 163, 115, .42);
      --verde: #3ddc6e; --ghost: #b9aef0; --rosso: #e07a5f; --clone: #5fb3c9;
      --mono: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
      /* misure del diagramma e dei widget */
      --w-widget: 94px;
      --spazio-widget: 10px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--testo); font: 300 13px/1.65 var(--mono); letter-spacing: .01em; }
    a { color: var(--oro); }
    p { margin: 0; }
    .pagina { max-width: 1440px; margin: 0 auto; padding: 18px 20px 60px; }
    .torna { display: inline-block; margin-bottom: 14px; color: var(--tenue); font-size: 11.5px; letter-spacing: .08em; text-decoration: none; }
    .torna:hover { color: var(--oro); }
    /* niente logo, per dare spazio al diagramma: il titolo, poi i totali e i negozi */
    header.testa { display: flex; align-items: center; gap: 22px; padding: 0 0 20px; margin-bottom: 42px; border-bottom: 1px solid var(--bordo); }
    header.testa img { display: none; }
    header.testa img { width: 104px; filter: brightness(0) saturate(100%) invert(73%) sepia(29%) saturate(836%) hue-rotate(352deg) brightness(91%) contrast(87%); opacity: .9; }
    h1 { margin: 0; color: var(--oro-chiaro); font: 400 14px var(--mono); letter-spacing: .22em; text-transform: uppercase; white-space: nowrap; }
    h1::before { content: '> '; color: var(--oro); }

    /* totali del negozio scelto: piccola casella nera al centro, come in Gestione pacchetti */
    .riga-stato { width: fit-content; max-width: 100%; margin: 0 auto 6px; padding: 6px 12px; background: #0a0908; border: 1px solid var(--bordo);
      border-radius: 4px; font: 400 11px/1.6 'JetBrains Mono', var(--mono); letter-spacing: .1em; text-transform: uppercase; text-align: center; }
    #stato { color: #8fbf7a; }
    #stato.lavora, #stato.nota { color: var(--oro-chiaro); }
    #stato.err { color: var(--rosso); }

    /* insegne dei negozi, come nel Controllo codice: discrete, la scelta più chiara, il segnalino oro segue il mouse */
    .insegne { position: relative; display: flex; align-items: center; gap: 34px; margin: 34px 0 22px; padding-bottom: 12px; border-bottom: 1px solid var(--bordo); }
    .insegna { display: flex; align-items: center; height: 46px; padding: 0; border: 0; background: none; cursor: pointer; }
    .insegna img { display: block; height: auto; max-height: 42px; filter: brightness(0) invert(1); opacity: .35; transition: opacity .2s; }
    .insegna:hover img, .insegna:focus-visible img, .insegna[aria-selected="true"] img { opacity: .9; }
    .insegna:focus-visible { outline: none; }
    .segnalino { position: absolute; bottom: -1px; left: 0; width: 0; height: 2px; background: var(--oro); transition: left .3s ease, width .3s ease; }

    /* barra: solo il pulsante della cartella del progetto, a destra (gli esiti delle operazioni nella riga di stato) */
    .barra { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; margin-bottom: 26px; font-size: 11px; }
    .cartella { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
    .comando { padding: 6px 12px; border: 1px solid var(--oro); border-radius: 4px; background: none; color: var(--oro);
      font: 400 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; transition: background .15s, color .15s; }
    .comando:hover:not(:disabled), .comando:focus-visible { background: var(--oro); color: #121110; outline: none; }
    /* cartella del progetto collegata: il pulsante «✓ cartella collegata» diventa verde */
    .comando.collegata, .comando.collegata:hover, .comando.collegata:focus-visible { border-color: #3a9b5a; background: #3a9b5a; color: #f4f1ea; outline: none; }
    .comando:disabled { opacity: .35; cursor: default; }
    .comando.rosso { border-color: var(--rosso); color: var(--rosso); }
    .comando.rosso:hover:not(:disabled), .comando.rosso:focus-visible { background: var(--rosso); color: #121110; }
    .comando.ghost { border-color: #9b8fd0; color: var(--ghost); }
    .comando.ghost:hover:not(:disabled), .comando.ghost:focus-visible { background: var(--ghost); color: #121110; }
    .esito { color: var(--tenue); font-size: 11px; }
    .esito::before { content: '$ '; color: var(--oro); }
    .esito:empty::before { content: none; }
    .esito.ok { color: #8fbf7a; }
    .esito.err { color: var(--rosso); }

    /* ----- Spie: verde il modulo attivo, viola (il colore del ghost del Controllo codice) in ghost, spenta in arrivo ----- */
    .spia { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--verde);
      box-shadow: 0 0 0 2px rgba(61, 220, 110, .16), 0 0 7px rgba(61, 220, 110, .85); }
    .spia.ghost { background: var(--ghost); box-shadow: 0 0 0 2px rgba(185, 174, 240, .16), 0 0 7px rgba(185, 174, 240, .85); }
    .spia.arrivo { background: none; border: 1px solid #5d5850; box-shadow: none; }
    @media (prefers-reduced-motion: no-preference) {
      .spia:not(.arrivo) { animation: respira 2.6s ease-in-out infinite; }
      @keyframes respira { 50% { opacity: .55; } }
    }

    /* ----- Diagramma: negozio → index.html → gallerie, da sinistra a destra ----- */
    .diagramma { display: flex; align-items: center; min-width: 0; }
    .diagramma[hidden], .vista-modulo[hidden] { display: none; }
    .nodo { position: relative; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid var(--oro-scuro); background: #0a0908; text-align: center; }
    .nodo-sotto { color: var(--tenue); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    /* il negozio: cornice doppia come la splash page, logo bianco */
    .nodo-negozio { width: 132px; min-height: 124px; padding: 18px 10px; }
    .nodo-negozio::before { content: ''; position: absolute; inset: 4px; border: 1px solid rgba(143, 106, 31, .35); pointer-events: none; }
    .nodo-negozio img { display: block; max-width: 104px; max-height: 40px; filter: brightness(0) invert(1); opacity: .88; }
    .nodo-negozio .nodo-nome { color: var(--oro-chiaro); font: 500 10.5px 'Cinzel', serif; letter-spacing: .16em; }
    /* la dashboard: un foglio con l'angolo piegato, sotto index.html */
    .nodo-pagina { width: 92px; padding: 14px 6px 12px; border-radius: 6px; text-decoration: none; transition: border-color .2s, box-shadow .2s; }
    .nodo-pagina:hover, .nodo-pagina:focus-visible { border-color: var(--oro); box-shadow: 0 0 0 1px rgba(212, 163, 115, .25); outline: none; }
    .nodo-pagina svg { width: 34px; height: 42px; color: var(--oro); }
    .nodo-file { color: var(--oro-chiaro); font: 400 11.5px 'JetBrains Mono', var(--mono); letter-spacing: .02em; }
    /* fili: linea oro sottile con una luce che scorre verso destra */
    .filo { position: relative; flex: none; width: 26px; height: 1px; background: var(--filo); overflow: hidden; }
    .filo::after { content: ''; position: absolute; top: 0; left: -40%; width: 40%; height: 1px; background: linear-gradient(90deg, transparent, var(--oro-chiaro), transparent); }
    @media (prefers-reduced-motion: no-preference) {
      .filo::after { animation: luce 2.8s linear infinite; }
      @keyframes luce { to { left: 100%; } }
    }
    .filo.corto { width: 18px; }
    /* le gallerie: una per riga, appese a una linea verticale (il bus) */
    .rami { flex: 1; min-width: 0; margin: 0; padding: 0; list-style: none; }
    .ramo { position: relative; display: flex; align-items: center; min-width: 0; padding: 8px 0 8px 22px; }
    .ramo::before { content: ''; position: absolute; left: 0; top: 50%; width: 22px; height: 1px; background: var(--filo); }
    .ramo::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--filo); }
    /* anche sulla linea verticale da cui partono i rami scorre la luce, verso il basso, più tenue e più lenta di quella dei
       fili orizzontali: il flusso prosegue dopo la valvola aperta (i rami chiusi non si vedono, e con loro la luce) */
    @media (prefers-reduced-motion: no-preference) {
      .ramo::after { background: linear-gradient(to bottom, transparent, rgba(229, 186, 115, .55), transparent) 0 -56px / 1px 56px no-repeat, var(--filo);
        animation: luce-giu 3.6s linear infinite; }
      @keyframes luce-giu { from { background-position: 0 -56px, 0 0; } to { background-position: 0 calc(100% + 56px), 0 0; } }
      /* e sul raccordo da quella linea a ogni ramo, verso destra: il flusso alimenta tutti i moduli che vengono dopo */
      .ramo::before { background: linear-gradient(to right, transparent, rgba(229, 186, 115, .55), transparent) -14px 0 / 14px 1px no-repeat, var(--filo);
        animation: luce-destra 3.6s linear infinite; animation-delay: 1.2s; }
      @keyframes luce-destra { from { background-position: -14px 0, 0 0; } 30%, to { background-position: calc(100% + 14px) 0, 0 0; } }
    }
    .ramo:first-child::after { top: 50%; }
    .ramo:last-child::after { bottom: 50%; }
    .ramo:only-child::after { content: none; }
    /* un solo ramo: niente bivio, quindi niente raccordo; il filo che esce dalla maniglia va dritto fino al nodo dopo,
       senza la giuntura tra due tratti (che, arrotondati al pixel in modo diverso, si sfalsavano di un pixel) */
    .rami > .ramo:only-child { padding-left: 0; }
    .rami > .ramo:only-child::before { content: none; }
    /* nodo della galleria: il titolo, il numero di moduli e, se serve, i comandi dell'ordine */
    .nodo-galleria { width: 132px; min-height: 76px; padding: 10px 10px; border-color: var(--bordo); border-radius: 4px; gap: 3px; }
    .ramo[data-tipo="promo"] .nodo-galleria { border-color: var(--oro-scuro); background: radial-gradient(circle at 50% 0, #2a2218 0%, #0a0908 80%); }
    .galleria-nome { color: var(--oro-chiaro); font: 500 11.5px 'Cinzel', serif; letter-spacing: .1em; text-transform: uppercase; line-height: 1.35; }
    .galleria-comandi { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 8px; margin-top: 4px; }
    .galleria-comandi:empty { display: none; }
    .collegamento { padding: 0; border: 0; background: none; color: var(--tenue); font: 400 10px var(--mono); letter-spacing: .04em;
      text-decoration: underline; cursor: pointer; }
    .collegamento:hover:not(:disabled), .collegamento:focus-visible { color: var(--oro-chiaro); outline: none; }
    .collegamento.forte { color: var(--oro-chiaro); }
    .collegamento:disabled { opacity: .4; cursor: default; }
    .sospeso { color: var(--oro); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; }

    /* piccolo carosello dei moduli: il nastro scorre di lato (barra nascosta), frecce ‹ › se non entrano tutti */
    .carosello { position: relative; display: flex; align-items: center; flex: 1; min-width: 0; }
    .nastro { display: flex; gap: var(--spazio-widget); flex: 0 1 auto; min-width: 0; padding: 4px 2px; overflow-x: auto; scroll-snap-type: x mandatory;
      scroll-behavior: smooth; scrollbar-width: none; }
    .nastro::-webkit-scrollbar { display: none; }
    .freccia { position: absolute; top: 50%; z-index: 2; translate: 0 -50%; width: 24px; height: 24px; padding: 0; border: 1px solid var(--oro); border-radius: 50%; background: #0a0908; color: var(--oro);
      font: 400 15px/1 var(--mono); cursor: pointer; transition: background .15s, color .15s, opacity .2s; }
    .freccia:hover:not(:disabled), .freccia:focus-visible { background: var(--oro); color: #121110; outline: none; }
    .freccia:disabled { opacity: 0; pointer-events: none; }
    .freccia.prima { left: 2px; }
    .freccia.dopo { right: auto; }
    .carosello:not(.scorre) .freccia { visibility: hidden; }
    .vuota { color: var(--tenue); font-size: 11px; }

    /* ----- Widget del modulo, in piccolo (e in grande nella sua scheda) ----- */
    .widget { position: relative; flex: none; display: flex; flex-direction: column; width: var(--w-widget); padding: 0; border: 1px solid var(--bordo);
      border-radius: 6px; background: #121110; color: var(--testo); font: inherit; text-align: left; cursor: pointer; scroll-snap-align: start;
      transition: border-color .2s, transform .2s, opacity .2s, box-shadow .2s; }
    .widget:hover, .widget:focus-visible { border-color: var(--oro); transform: translateY(-2px); outline: none; box-shadow: 0 4px 10px rgba(0, 0, 0, .45); }
    /* Promo Stagionali come nella dashboard (.gold-bf-card): bordo oro, fondo bruno caldo con un alone oro, titolo oro (classe
       dorata: i moduli con stile: 'dorata', in qualunque galleria stiano);
       un clone resta con il bordo azzurro. MENU SPECIALE (badge della scheda) è l'etichetta dorata sull'anteprima */
    .widget.dorata:is(.sorgente, .clone) { border-color: #d4a373; background: linear-gradient(145deg, #1f1a14 0%, #2a2218 100%);
      box-shadow: 0 0 8px rgba(212, 163, 115, .25); }
    .widget.dorata:is(.sorgente, .clone):hover { border-color: #e5ba73; box-shadow: 0 0 14px rgba(229, 186, 115, .45); }
    .widget.dorata.clone { border-color: var(--clone); }
    .widget.dorata .w-titolo { color: #e5ba73; text-shadow: 0 0 6px rgba(212, 163, 115, .35); }
    .w-badge { position: absolute; right: 3px; bottom: 3px; z-index: 1; padding: 0 3px; border-radius: 2px;
      background: linear-gradient(135deg, #b88d4c, #f4e3c9, #b88d4c, #e5ba73); color: #000; box-shadow: 0 1px 2px rgba(0, 0, 0, .5);
      font: 800 6.5px/1.6 var(--mono); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; pointer-events: none; }
    .modulo-anteprima .w-badge { right: 6px; bottom: 6px; padding: 1px 6px; font-size: 10px; }
    /* con MENU SPECIALE i temi speciali passano in basso a sinistra */
    .w-badge ~ .w-temi { right: auto; left: 3px; }
    .modulo-anteprima .w-badge ~ .w-temi { left: 6px; }
    .w-testa { display: flex; align-items: center; justify-content: space-between; padding: 5px 7px 4px; }
    .w-num { color: var(--tenue); font: 400 9.5px 'JetBrains Mono', var(--mono); }
    .w-anteprima { display: flex; align-items: center; justify-content: center; aspect-ratio: 16 / 9; margin: 0 5px; overflow: hidden; border-radius: 3px;
      background: radial-gradient(circle, #1f1d1a 0%, #0a0908 100%); }
    .widget.dorata .w-anteprima { background: radial-gradient(circle, #2a2218 0%, #0a0908 100%); }
    .w-anteprima img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; }
    .w-anteprima .w-icona { color: var(--tenue); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
    .w-titolo { display: block; padding: 5px 7px 7px; overflow: hidden; color: var(--testo); font: 400 10px/1.3 var(--mono); letter-spacing: .02em;
      white-space: nowrap; text-overflow: ellipsis; }
    /* Moduli sorgente e moduli clone (regola del 12 ottobre 2026), riconoscibili a colpo d'occhio: bordo e etichetta
       in oro i sorgente (scritti a codice: in ghost e spostati, mai modificati né cancellati dalle utilità), in azzurro
       i cloni (creati dalle utilità: si modificano, si spostano, si cancellano) */
    .widget.sorgente { border-color: rgba(212, 163, 115, .55); }
    .widget.clone { border-color: rgba(95, 179, 201, .75); }
    .widget.sorgente:hover, .widget.sorgente:focus-visible { border-color: var(--oro); }
    .widget.clone:hover, .widget.clone:focus-visible { border-color: var(--clone); }
    .w-tipo { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); padding: 0 4px; border: 1px solid currentColor; border-radius: 3px;
      background: #0a0908; font-size: 8.5px; letter-spacing: .08em; line-height: 1.5; text-transform: uppercase; white-space: nowrap; }
    .widget.sorgente .w-tipo { color: var(--oro); }
    .widget.clone .w-tipo { color: var(--clone); }
    .widget.in-ghost .w-anteprima, .widget.in-ghost .w-titolo { opacity: .38; }
    .widget.in-ghost { border-style: dashed; }
    /* Temi speciali del modulo (Made in Italy, Black Friday, Natale): in sintesi sul widget le icone dei pulsanti veri,
       piccole e tonde, in basso a destra sull'anteprima; per esteso nella scheda del modulo */
    .w-anteprima { position: relative; }
    .w-temi { position: absolute; right: 3px; bottom: 3px; display: flex; gap: 2px; }
    .w-tema { display: inline-flex; flex: none; width: 14px; height: 14px; overflow: hidden; border-radius: 50%; box-shadow: 0 0 0 1px rgba(10, 9, 8, .85); }
    .w-tema img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .w-tema.t-italia { background: #fff; box-shadow: 0 0 0 1px var(--oro); }
    .w-tema.t-italia img { width: 70%; height: 70%; margin: 15%; object-fit: contain; }
    .w-tema.t-blackfriday { background: #000; }
    .w-tema.t-natale { background: #9e1b22; }
    .modulo-anteprima .w-temi { right: 6px; bottom: 6px; gap: 4px; }
    .modulo-anteprima .w-tema { width: 24px; height: 24px; }
    .temi-elenco { display: inline-flex; flex-wrap: wrap; gap: 6px 16px; }
    .tema-voce { display: inline-flex; align-items: center; gap: 7px; }
    .tema-voce .w-tema { width: 18px; height: 18px; }
    .legenda-moduli .l-temi { gap: 3px; }
    .legenda-moduli .l-temi b { margin-right: 5px; color: var(--oro-chiaro); }
    /* legenda sopra il diagramma */
    .legenda-moduli { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; color: var(--tenue); font-size: 10.5px; letter-spacing: .04em; }
    .legenda-moduli span { display: inline-flex; align-items: center; gap: 7px; }
    .legenda-moduli i { width: 18px; height: 12px; border: 1px solid; border-radius: 3px; }
    .legenda-moduli .l-sorgente i { border-color: var(--oro); }
    .legenda-moduli .l-clone i { border-color: var(--clone); }
    .legenda-moduli b { font-weight: 400; letter-spacing: .12em; text-transform: uppercase; }
    .legenda-moduli .l-sorgente b { color: var(--oro); }
    .legenda-moduli .l-clone b { color: var(--clone); }
    .widget.in-arrivo .w-anteprima, .widget.in-arrivo .w-titolo { opacity: .5; }
    /* trascinando per riordinare */
    .widget[draggable="true"] { cursor: grab; }

    /* ----- Modalità modifica: il lucchetto. Chiuso (di partenza) i moduli restano fermi; aperto (oro pieno, l'arco si
       solleva) si trascinano dentro la loro sezione e tremano appena, come le app dell'iPhone da spostare ----- */
    .modifica-riga { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
    .lucchetto { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 9px; border: 1px solid var(--oro); border-radius: 4px;
      background: none; color: var(--oro); font: 400 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
      transition: background .15s, color .15s; }
    .lucchetto svg { width: 17px; height: 17px; overflow: visible; }
    .lucchetto .arco { transform-box: fill-box; transform-origin: 0% 100%; transition: transform .35s cubic-bezier(.3, 1.6, .5, 1); }
    .lucchetto:hover, .lucchetto:focus-visible { background: rgba(212, 163, 115, .14); outline: none; }
    .lucchetto[aria-pressed="true"] { background: var(--oro); color: #121110; }
    .lucchetto[aria-pressed="true"] .arco { transform: translateY(-3px) rotate(-28deg); }
    .modifica-nota { color: var(--oro-chiaro); font-size: 11px; letter-spacing: .04em; }
    /* note dell'area operatore nascoste (decisione del 22 ottobre 2026) */
    .modifica-nota { display: none !important; }
    .modifica-nota[hidden] { display: none; }
    /* i moduli spostabili: bordo oro tratteggiato e un leggero tremolio, sfasato da uno all'altro */
    .diagramma.in-modifica .widget[data-chiave] { border-style: dashed; border-color: rgba(212, 163, 115, .75); }
    .diagramma.in-modifica .nastro { background: rgba(212, 163, 115, .05); border-radius: 6px; }
    @media (prefers-reduced-motion: no-preference) {
      .diagramma.in-modifica .widget[data-chiave]:not(.trascinato):not(:hover) { animation: trema .32s ease-in-out infinite alternate; }
      .diagramma.in-modifica .widget[data-chiave]:nth-child(2n) { animation-delay: -.16s; }
      .diagramma.in-modifica .widget[data-chiave]:nth-child(3n) { animation-duration: .36s; }
      @keyframes trema { from { transform: rotate(-.7deg); } to { transform: rotate(.7deg); } }
    }
    .widget.trascinato { opacity: .35; transform: none; box-shadow: none; }
    .nastro.riordina { outline: 1px dashed rgba(212, 163, 115, .5); outline-offset: 2px; border-radius: 6px; }

    /* ----- Aree del negozio: nodo a pillola (CREATOR, CASSIERE, SERVIZIO) con i suoi rami ----- */
    .nodo-area { width: 104px; min-height: 58px; padding: 9px 8px; border-color: var(--oro); border-radius: 29px; gap: 2px;
      background: radial-gradient(circle at 50% 0, #241d14 0%, #0a0908 85%); }
    .area-nome { color: var(--oro-chiaro); font: 400 10.5px var(--mono); letter-spacing: .22em; text-transform: uppercase; }
    .ramo-area { padding-top: 12px; padding-bottom: 12px; }
    .sotto { flex: 1; min-width: 0; }
    .ramo-area > .nodo { flex: none; }
    /* widget senza anteprima (strumenti di cassa, pagine di servizio): un segno grande al posto della miniatura */
    .w-segno { color: var(--oro); font: 400 17px 'JetBrains Mono', var(--mono); letter-spacing: .02em; }
    .widget.semplice { cursor: default; text-decoration: none; }
    a.widget.semplice { cursor: pointer; }
    div.widget.semplice:hover { transform: none; border-color: var(--bordo); box-shadow: none; }

    /* ----- Rami che si chiudono e si aprono ----- */
    .nodo.apribile { cursor: pointer; }
    /* maniglia sul raccordo: un cerchio con dentro una linea, come una valvola sul filo del diagramma. Linea orizzontale: il
       flusso prosegue e il ramo è aperto; linea verticale: il flusso si ferma e il ramo è chiuso (ruota di 90° cambiando) */
    .maniglia { position: absolute; top: 50%; right: -12px; z-index: 2; width: 23px; height: 23px; padding: 0; translate: 0 -50%;
      border: 1px solid var(--oro); border-radius: 50%; background: #0a0908; color: var(--oro); cursor: pointer;
      transition: background .15s, color .15s, transform .2s; }
    /* stanghetta sottile (1 px, posizionata senza traslazioni di mezzo pixel, così è netta), al centro del cerchio, che sta al centro del filo: il flusso entra
       nella maniglia e prosegue dritto */
    .maniglia::before { content: ""; position: absolute; top: calc(50% - .5px); left: calc(50% - 5.5px); width: 11px; height: 1px; border-radius: 1px;
      background: currentColor; transition: rotate .32s cubic-bezier(.3, 1.2, .5, 1); }
    .maniglia[aria-expanded="false"]::before { rotate: 90deg; }
    /* al passaggio del mouse (e con la tastiera) la stanghetta mostra la posizione che prenderà: da aperta (orizzontale)
       si alza in verticale, da chiusa (verticale) si abbassa in orizzontale; il cerchio resta scuro e si accende appena */
    .maniglia:hover, .maniglia:focus-visible { outline: none; transform: scale(1.12); border-color: var(--oro-chiaro); color: var(--oro-chiaro);
      box-shadow: 0 0 0 3px rgba(212, 163, 115, .14), 0 0 8px rgba(212, 163, 115, .35); }
    /* subito dopo il clic (classe appena, finché il mouse non esce) niente anteprima: la stanghetta resta nella posizione
       nuova invece di tornare a mostrare quella opposta */
    .maniglia[aria-expanded="true"]:not(.appena):is(:hover, :focus-visible)::before { rotate: 90deg; }
    .maniglia[aria-expanded="false"]:not(.appena):is(:hover, :focus-visible)::before { rotate: 0deg; }
    html.incorporata .maniglia { background: #0e0d0c; }
    .riassunto { display: none; align-items: center; gap: 10px; padding: 6px 12px; border: 1px dashed var(--bordo); border-radius: 20px;
      background: #0a0908; color: var(--tenue); font: 400 10.5px var(--mono); letter-spacing: .06em; cursor: pointer; transition: border-color .2s, color .2s; }
    .riassunto:hover, .riassunto:focus-visible { border-color: var(--oro); color: var(--oro-chiaro); outline: none; }
    .riassunto .punti { display: flex; flex-wrap: wrap; gap: 4px; max-width: 220px; }
    .riassunto .spia { width: 6px; height: 6px; animation: none; box-shadow: 0 0 4px rgba(61, 220, 110, .7); }
    .riassunto .spia.ghost { box-shadow: 0 0 4px rgba(185, 174, 240, .7); }
    .riassunto .spia.arrivo { box-shadow: none; }
    .ramo.chiuso > .carosello, .ramo.chiuso > .sotto { display: none; }
    /* valvola chiusa (come un rubinetto sul tubo): dopo la maniglia il flusso si ferma, il filo è tratteggiato e spento e la
       luce non scorre più; riaprendo il filo torna pieno e la luce riparte dalla maniglia */
    .ramo.chiuso > .filo, .filo.fermo { background: none; border-top: 1px dashed rgba(212, 163, 115, .3); height: 0; }
    .ramo.chiuso > .filo::after, .filo.fermo::after { content: none; }
    .ramo.chiuso > .riassunto { display: inline-flex; }

    /* ----- Animazioni: entrata del diagramma (nodi e widget compaiono da sinistra, i fili si tracciano, il bus cresce
       dall'alto), ramo che si apre (si srotola verso destra) o si chiude (il riassunto compare) ----- */
    @media (prefers-reduced-motion: no-preference) {
      .diagramma.entra .nodo, .diagramma.entra .widget, .diagramma.entra .riassunto {
        animation: compare .3s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--d, 0ms) * .3); }
      .diagramma.entra .filo { animation: traccia .25s ease-out backwards; animation-delay: calc(var(--d, 0ms) * .3); transform-origin: left; }
      .diagramma.entra .ramo::before { animation: traccia .22s ease-out backwards; animation-delay: calc(var(--d, 0ms) * .3); transform-origin: left; }
      .diagramma.entra .ramo::after { animation: cresce .28s ease-out backwards; animation-delay: calc(var(--d, 0ms) * .3 - 40ms); transform-origin: top; }
      .ramo.chiude > .riassunto { animation: compare .35s ease-out; }
      @keyframes compare { from { opacity: 0; transform: translateX(-12px) scale(.96); } }
      @keyframes traccia { from { transform: scaleX(0); } }
      @keyframes cresce { from { transform: scaleY(0); } }
      @keyframes srotola { from { opacity: 0; transform: translateX(-16px); clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    }

    /* tasto per tornare indietro, in fondo al diagramma, al centro */
    .indietro-fondo { display: flex; justify-content: center; margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--bordo); }
    .indietro-fondo[hidden] { display: none; }

    /* ----- Scheda del modulo ----- */
    /* una riga di spazio tra la barra con il lucchetto (modalità modifica) e la scheda del modulo */
    .vista-modulo { padding-top: 22px; }
    .torna-diagramma { margin: 0 0 16px; padding: 0; border: 0; background: none; color: var(--tenue); font: 400 11.5px var(--mono); letter-spacing: .08em; cursor: pointer; }
    .torna-diagramma:hover, .torna-diagramma:focus-visible { color: var(--oro); outline: none; }
    /* percorso del modulo, come in un terminale: negozio › index.html › galleria › modulo */
    .percorso { margin: 0 0 22px; color: var(--tenue); font: 400 11.5px 'JetBrains Mono', var(--mono); letter-spacing: .02em; }
    .percorso b { color: var(--oro-chiaro); font-weight: 400; }
    .percorso i { color: var(--oro-scuro); font-style: normal; margin: 0 6px; }
    .modulo-griglia { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px; align-items: start; }
    .modulo-anteprima .widget { --w-widget: 300px; cursor: default; transform: none; box-shadow: none; }
    .modulo-anteprima .widget .w-titolo { padding: 9px 12px 12px; font-size: 13px; }
    .modulo-anteprima .widget .w-testa { padding: 9px 12px 7px; }
    .modulo-anteprima .widget .w-num { font-size: 11px; }
    .modulo-anteprima .widget .w-anteprima { margin: 0 9px; }
    .modulo-anteprima .spia { width: 11px; height: 11px; }
    .modulo-anteprima .w-tipo { top: 7px; font-size: 10px; }
    .info { margin: 0; display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 7px 16px; font-size: 12px; }
    .info dt { color: var(--tenue); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; padding-top: 1px; }
    .info dd { margin: 0; color: var(--testo); overflow-wrap: anywhere; }
    .info dd .stato { display: inline-flex; align-items: center; gap: 8px; }
    /* menu a cascata dello stato (scheda del modulo): lo stato attuale con la freccina oro, e sotto l'elenco con l'altro
       valore (ghost con il pallino viola del ghost di Controllo codice, o attivo); come i menu del form in stile terminale */
    .stato-menu { position: relative; display: inline-block; }
    .stato-scelta { display: inline-flex; align-items: center; gap: 12px; padding: 3px 8px 3px 10px; border: 1px solid var(--bordo); border-radius: 3px;
      background: #0a0908; color: var(--testo); font: inherit; cursor: pointer; transition: border-color .15s; }
    .stato-scelta:hover:not(:disabled), .stato-scelta:focus-visible, .stato-menu.aperto .stato-scelta { border-color: var(--oro); outline: none; }
    .stato-scelta:disabled { cursor: default; }
    .stato-freccia { width: 7px; height: 7px; margin: -3px 2px 0 0; border-right: 1px solid var(--oro); border-bottom: 1px solid var(--oro);
      transform: rotate(45deg); transition: transform .2s, margin .2s; }
    .stato-menu.aperto .stato-freccia { margin-top: 3px; transform: rotate(-135deg); }
    .stato-elenco { position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; min-width: 100%; padding: 4px; border: 1px solid var(--oro-scuro);
      border-radius: 3px; background: #0a0908; box-shadow: 0 6px 16px rgba(0, 0, 0, .55); }
    .stato-elenco[hidden] { display: none; }
    .stato-opzione { display: flex; width: 100%; padding: 5px 8px; border: 0; border-radius: 2px; background: none; color: var(--testo); font: inherit;
      text-align: left; cursor: pointer; white-space: nowrap; }
    .stato-opzione:hover, .stato-opzione:focus-visible { background: rgba(212, 163, 115, .12); outline: none; }
    .sposta { display: inline-flex; align-items: center; gap: 8px; margin-left: 12px; vertical-align: 1px; }
    .sposta button { width: 26px; height: 22px; padding: 0; border: 1px solid var(--bordo); border-radius: 3px; background: #0a0908; color: var(--oro);
      font: 400 12px/1 var(--mono); cursor: pointer; }
    .sposta button:hover:not(:disabled), .sposta button:focus-visible { border-color: var(--oro); outline: none; }
    .sposta button:disabled { opacity: .3; cursor: default; }
    .azioni-modulo { margin-top: 26px; }
    /* pulsantiera delle azioni, sotto il divisorio dei dettagli: un pulsante per sezione; quello aperto è pieno */
    .pulsantiera-azioni { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 18px; border-top: 1px solid var(--bordo); }
    .azione-tasto { padding: 6px 14px; border: 1px solid var(--oro); border-radius: 4px; background: none; color: var(--oro); font: 400 10.5px var(--mono);
      letter-spacing: .14em; text-transform: uppercase; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
    .azione-tasto:hover, .azione-tasto:focus-visible, .azione-tasto[aria-selected="true"] { background: var(--oro); color: #121110; outline: none; }
    .azione-tasto.t-ghost { border-color: #9b8fd0; color: var(--ghost); }
    .azione-tasto.t-ghost:is(:hover, :focus-visible, [aria-selected="true"]) { background: var(--ghost); color: #121110; }
    .azione-tasto.t-modifica { border-color: var(--clone); color: var(--clone); }
    .azione-tasto.t-modifica:is(:hover, :focus-visible, [aria-selected="true"]) { background: var(--clone); color: #121110; }
    .azione-tasto.t-elimina { border-color: var(--rosso); color: var(--rosso); }
    .azione-tasto.t-elimina:is(:hover, :focus-visible, [aria-selected="true"]) { background: var(--rosso); color: #121110; }
    .azione[hidden] { display: none; }
    /* la sezione aperta, sotto la pulsantiera */
    .pulsantiera-azioni + .azione, .pulsantiera-azioni ~ .azione { border-top: 0; padding-top: 18px; }
    .azione { padding: 16px 0; border-top: 1px solid var(--bordo); }
    .azione h4 { margin: 0 0 8px; color: var(--oro); font: 400 11px var(--mono); letter-spacing: .24em; text-transform: uppercase; }
    .azione h4::before { content: '// '; }
    .azione.pericolo h4 { color: var(--rosso); }
    .azione p { margin: 0 0 12px; color: var(--tenue); font-size: 11.5px; line-height: 1.6; }

    /* ----- MODULI: l'insegna dopo i negozi (staccata da una linea sottile) apre il catalogo dei moduli: le sorgenti di
       Luxury Outlet e TEBE (i set di partenza) e i moduli nuovi, con i negozi in cui sono usati ----- */
    /* divisorio tra il catalogo e i negozi: // come nel marchio STORE // CRAFT, nell'oro scuro della cornice */
    .divisore { flex: none; color: var(--oro-scuro); font: 400 26px/1 'Cinzel', serif; letter-spacing: -.04em; user-select: none; }
    /* insegna del catalogo: il logo STORE // CRAFT (bianco e tenue come le altre insegne) e sotto, piccolo, CATALOGO */
    /* negozio nuovo ancora con il logo di STORE // CRAFT (nessun logo suo): come l'insegna del catalogo, il logo e sotto il
       nome del negozio in Cinzel */
    .insegna-predefinita { height: auto; flex-direction: column; justify-content: center; gap: 5px; }
    .insegna-predefinita img { max-height: 34px; }
    .insegna-predefinita span { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; opacity: .45;
      font: 500 10px/1 'Cinzel', serif; letter-spacing: .16em; margin-right: -.16em; transition: opacity .2s; }
    .insegna-predefinita:hover span, .insegna-predefinita:focus-visible span, .insegna-predefinita[aria-selected="true"] span { opacity: .9; }
    /* con tanti negozi le insegne si rimpiccioliscono per stare su una riga (--scala-insegne, da adattaInsegne) */
    .insegne { --scala-insegne: 1; }
    .insegne .insegna:not(.insegna-moduli) img { width: calc(var(--larghezza-insegna, 112px) * var(--scala-insegne)) !important; }
    .insegne .insegna-predefinita span { font-size: calc(10px * max(var(--scala-insegne), .8)); }
    /* + AGGIUNGI MODULO: pulsante tondo dorato in alto a sinistra del primo widget di una galleria; al passaggio del
       mouse si riempie d'oro, il + gira e compare «+ aggiungi modulo» */
    .aggiungi-modulo { position: absolute; top: -9px; left: -9px; z-index: 6; display: grid; place-items: center; width: 24px; height: 24px; padding: 0;
      border: 1px solid var(--oro); border-radius: 50%; background: var(--bg); color: var(--oro); cursor: pointer;
      box-shadow: 0 0 0 3px var(--bg); transition: background .22s, color .22s, transform .3s cubic-bezier(.2, .8, .2, 1), box-shadow .22s; }
    .aggiungi-modulo svg { width: 12px; height: 12px; transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
    .aggiungi-modulo:hover, .aggiungi-modulo:focus-visible { background: var(--oro); color: #121110; transform: scale(1.15); outline: none;
      box-shadow: 0 0 0 3px var(--bg), 0 0 14px rgba(212, 163, 115, .55); animation: aggiungi-pulsa 1.2s ease-in-out infinite; }
    .aggiungi-modulo:hover svg, .aggiungi-modulo:focus-visible svg { transform: rotate(90deg); }
    .aggiungi-modulo::after { content: '+ aggiungi modulo'; position: absolute; left: calc(100% + 8px); top: 50%; transform: translate(-4px, -50%); padding: 3px 9px;
      background: #0a0908; border: 1px solid var(--oro); color: var(--oro-chiaro); font: 400 10px var(--mono); letter-spacing: .1em; white-space: nowrap;
      text-transform: uppercase; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; }
    .aggiungi-modulo:hover::after, .aggiungi-modulo:focus-visible::after { opacity: 1; transform: translate(0, -50%); }
    @keyframes aggiungi-pulsa { 50% { box-shadow: 0 0 0 3px var(--bg), 0 0 22px rgba(212, 163, 115, .8); } }
    @media (prefers-reduced-motion: reduce) { .aggiungi-modulo, .aggiungi-modulo svg { transition: none; animation: none !important; } }
    /* la finestra per scegliere il modulo: il catalogo dei moduli adatti alla galleria, in un carosello */
    .scegli-modulo { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 16px; background: rgba(5, 5, 5, .72); }
    .scegli-modulo .finestra { box-sizing: border-box; width: min(980px, 100%); padding: 22px 24px 20px; background: var(--bg); border: 1px solid var(--oro-scuro);
      box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px rgba(143, 106, 31, .45), 0 20px 50px rgba(0, 0, 0, .6); animation: scegli-entra .28s cubic-bezier(.2, .8, .2, 1); }
    @keyframes scegli-entra { from { opacity: 0; transform: translateY(10px) scale(.98); } }
    .scegli-modulo h3 { margin: 0 0 4px; color: var(--oro-chiaro); font: 500 15px 'Cinzel', serif; letter-spacing: .24em; text-transform: uppercase; }
    .scegli-modulo .sotto { margin: 0 0 14px; color: var(--tenue); font-size: 11.5px; }
    .scegli-modulo .filtri { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .scegli-modulo .filtri button { padding: 4px 11px; background: none; border: 1px solid var(--bordo); border-radius: 12px; color: var(--tenue); font: 400 10.5px var(--mono);
      letter-spacing: .06em; cursor: pointer; }
    .scegli-modulo .filtri button[aria-pressed="true"] { border-color: var(--oro); color: var(--oro-chiaro); background: rgba(212, 163, 115, .1); }
    .scegli-modulo .striscia { position: relative; display: flex; align-items: center; gap: 8px; }
    .scegli-modulo .nastro-scelta { display: flex; gap: 12px; flex: 1; min-width: 0; padding: 6px 2px 10px; overflow-x: auto; scroll-snap-type: x mandatory;
      scrollbar-width: thin; scrollbar-color: var(--oro) #1a1816; }
    .scegli-modulo .freccia-scelta { flex: none; width: 30px; height: 30px; border: 1px solid var(--oro); border-radius: 50%; background: none; color: var(--oro); cursor: pointer; }
    .scegli-modulo .freccia-scelta:hover { background: var(--oro); color: #121110; }
    .scelta-modulo { flex: none; display: flex; flex-direction: column; gap: 6px; width: 168px; padding: 9px; text-align: left; scroll-snap-align: start; cursor: pointer;
      background: #0a0908; border: 1px solid var(--bordo); border-radius: 6px; color: var(--testo); font: inherit; transition: border-color .2s, transform .2s, box-shadow .2s; }
    .scelta-modulo:hover:not(:disabled) { border-color: rgba(212, 163, 115, .7); transform: translateY(-2px); }
    .scelta-modulo[aria-pressed="true"] { border-color: var(--oro); box-shadow: 0 0 0 1px var(--oro), 0 0 16px rgba(212, 163, 115, .3); }
    .scelta-modulo.dorata { background: radial-gradient(circle at 50% 0, #241d14 0%, #0a0908 80%); border-color: rgba(212, 163, 115, .55); }
    .scelta-modulo:disabled { opacity: .4; cursor: default; }
    .scelta-modulo .anteprima-scelta { aspect-ratio: 16 / 9; display: grid; place-items: center; overflow: hidden; background: #121110; border-radius: 3px; }
    .scelta-modulo .anteprima-scelta img { max-width: 100%; max-height: 100%; }
    .scelta-modulo b { overflow: hidden; color: var(--oro-chiaro); font: 600 11px 'Cinzel', serif; letter-spacing: .06em; text-overflow: ellipsis; white-space: nowrap; }
    .scelta-modulo small { color: var(--tenue); font-size: 9.5px; letter-spacing: .04em; line-height: 1.4; }
    .scelta-modulo .gia { color: var(--verde); }
    .scegli-modulo .vuota-scelta { padding: 26px 0; color: var(--tenue); font-size: 12px; }
    .scegli-modulo .piede { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--bordo); }
    .scegli-modulo .piede .nota-scelta { flex: 1; color: var(--tenue); font-size: 11px; line-height: 1.5; }
    .scegli-modulo .piede button { padding: 8px 18px; font: 400 11px var(--mono); letter-spacing: .1em; text-transform: lowercase; cursor: pointer; }
    .scegli-modulo .annulla-scelta { background: none; border: 1px solid var(--bordo); color: var(--tenue); }
    .scegli-modulo .conferma-scelta { background: var(--oro); border: 1px solid var(--oro); color: #121110; }
    .scegli-modulo .conferma-scelta:disabled { opacity: .35; cursor: default; }
    /* + NUOVO NEGOZIO, dopo le insegne dei negozi */
    .insegna-nuovo { flex: none; height: 34px; padding: 0 14px; border: 1px dashed rgba(212, 163, 115, .55); border-radius: 17px; background: none;
      color: var(--oro); font: 400 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; transition: all .2s; }
    .insegna-nuovo:hover, .insegna-nuovo:focus-visible { border-style: solid; border-color: var(--oro); background: rgba(212, 163, 115, .1); color: var(--oro-chiaro); outline: none; }
    /* negozio clone: etichetta CLONE azzurra sul riquadro del negozio e, con il lucchetto aperto, i suoi comandi */
    .nodo-negozio.negozio-clone { border-color: var(--clone); }
    .tag-negozio { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); padding: 1px 8px; background: var(--bg); border: 1px solid var(--clone);
      color: var(--clone); font-size: 9px; letter-spacing: .18em; }
    .comandi-negozio { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; width: 100%; }
    .comandi-negozio button { padding: 6px 8px; background: none; border: 1px solid var(--bordo); color: var(--tenue); font: 400 10px var(--mono);
      letter-spacing: .1em; text-transform: lowercase; cursor: pointer; }
    .comandi-negozio button:hover:not(:disabled) { border-color: var(--clone); color: var(--clone); }
    .comandi-negozio button.rosso:hover:not(:disabled) { border-color: var(--rosso); color: var(--rosso); }
    .comandi-negozio button:disabled { opacity: .4; cursor: default; }
    .modifica-negozio { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 16px; background: rgba(5, 5, 5, .7); }
    .modifica-negozio form { width: min(440px, 100%); padding: 22px; background: var(--bg); border: 1px solid var(--clone); box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px rgba(95, 179, 201, .4); }
    .modifica-negozio h3 { margin: 0 0 14px; color: var(--clone); font: 500 14px 'Cinzel', serif; letter-spacing: .2em; text-transform: uppercase; }
    .modifica-negozio label { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; color: var(--tenue); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
    .modifica-negozio input[type="text"] { padding: 8px 10px; background: #0a0908; border: 1px solid var(--bordo); color: var(--testo); font: 400 12.5px var(--mono); text-transform: uppercase; }
    .modifica-negozio input:focus { outline: none; border-color: var(--clone); }
    .modifica-negozio .comandi { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .vista-nuovo[hidden], .barra[hidden], .insegne[hidden] { display: none !important; }
    .insegna-moduli { height: auto; flex-direction: column; justify-content: center; gap: 5px; color: #fff; opacity: .55; transition: opacity .2s; }
    /* logo e scritta in oro, come il nodo CATALOGO del diagramma (logo nell'oro del marchio, CATALOGO in Cinzel oro chiaro) */
    .insegna-moduli img { max-height: 46px; opacity: 1;
      filter: brightness(0) saturate(100%) invert(73%) sepia(29%) saturate(836%) hue-rotate(352deg) brightness(91%) contrast(87%); }
    .insegna-moduli span { color: var(--oro-chiaro); font: 500 10px/1 'Cinzel', serif; letter-spacing: .16em; margin-right: -.16em; }
    .insegna-moduli:hover, .insegna-moduli:focus-visible, .insegna-moduli[aria-selected="true"] { opacity: .9; }
    .insegna-moduli:hover img, .insegna-moduli:focus-visible img, .insegna-moduli[aria-selected="true"] img { opacity: 1; }
    .modifica-riga[hidden] { display: none; }
    /* sorgenti di un negozio nel catalogo: la pillola un poco più larga, con sopra il logo del negozio piccolo e bianco */
    /* ----- Colonna di index come un menu a croce: al centro, sulla linea dei fili, la voce scelta (index o una regola
       comune), grande, con la sua maniglia; le altre voci piccole sopra e sotto, appese a un filo verticale ----- */
    .colonna-index { position: relative; flex: none; display: flex; flex-direction: column; align-items: center; }
    .indice-nodo { position: relative; }
    /* la colonna risponde alla rotella (con il mouse sopra): la voce al centro ha un leggero alone oro */
    .colonna-index:hover > .indice-nodo > .nodo { box-shadow: 0 0 0 1px rgba(212, 163, 115, .3), 0 0 14px rgba(212, 163, 115, .2); }
    /* le voci sopra e sotto la voce al centro, appese al filo verticale (fuori dalla colonna: la colonna è alta quanto la
       voce al centro, che così resta sulla linea dei fili) */
    .voci { position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
    .voci-sopra { bottom: 100%; }
    .voci-sotto { top: 100%; }
    .filo-v { display: block; flex: none; width: 1px; height: 14px; background: var(--filo); }
    /* la scritta «regole comuni» sul filo, come un'etichetta, con un tratto di filo sotto fino alla prima regola */
    .regole-titolo { padding-top: 3px; color: var(--tenue); font-size: 8.5px; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; text-align: center; }
    .regole-titolo::after { content: ''; display: block; width: 1px; height: 6px; margin: 4px auto 0; background: var(--filo); }
    /* index.html quando non è al centro: piccolo come le regole, nel carattere dei file */
    .nodo-regola.voce-index span { font: 400 10.5px 'JetBrains Mono', var(--mono); letter-spacing: .02em; text-transform: none; }
    /* la regola al centro: grande come index, con la sua icona */
    .nodo-regola-grande { cursor: default; }
    .nodo-regola-grande svg { width: 34px; height: 42px; color: var(--oro); }
    .nodo-regola { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; width: 104px; padding: 6px 8px;
      border: 1px solid var(--bordo); border-radius: 16px; background: #0a0908; color: var(--oro-chiaro); font: 400 10px var(--mono);
      letter-spacing: .16em; text-transform: uppercase; cursor: pointer; transition: border-color .2s, box-shadow .2s; }
    .nodo-regola small { color: var(--tenue); font-size: 9px; letter-spacing: .06em; text-transform: none; }
    .nodo-regola:hover, .nodo-regola:focus-visible { border-color: var(--oro); outline: none; }
    .nodo-regola[aria-pressed="true"] { border-color: var(--oro); background: radial-gradient(circle at 50% 0, #241d14 0%, #0a0908 85%);
      box-shadow: 0 0 0 1px rgba(212, 163, 115, .25), 0 0 10px rgba(212, 163, 115, .2); }
    /* catalogo: le aree piccole sopra e sotto quella scelta, con il logo del negozio piccolo e bianco */
    .nodo-area-piccola { width: 116px; padding: 7px 8px 6px; }
    .nodo-area-piccola .area-logo { max-width: 64px; max-height: 13px; margin-bottom: 3px; }
    .nodo-area-piccola.area-cloni { border-color: rgba(95, 179, 201, .5); }
    .nodo-area-piccola.area-cloni span { color: var(--clone); }
    .colonna-catalogo .indice-nodo.area-cloni > .nodo-area { border-color: var(--clone); background: radial-gradient(circle at 50% 0, #142328 0%, #0a0908 85%); }
    .colonna-catalogo .indice-nodo.area-cloni > .nodo-area .area-nome { color: var(--clone); }
    .colonna-catalogo .indice-nodo.area-cloni > .maniglia { border-color: var(--clone); color: var(--clone); }
    html.incorporata .nodo-regola { background: #0e0d0c; }
    html.incorporata .nodo-regola[aria-pressed="true"] { background: radial-gradient(circle at 50% 0, #241d14 0%, #0e0d0c 85%); }
    /* il diagramma della regola: nodo dorato del gruppo, un ramo per file (nome del file in mono) */
    .area-regola > .nodo-area { border-color: var(--oro); box-shadow: 0 0 10px rgba(212, 163, 115, .18); }
    .file-regola { color: var(--oro-chiaro); font: 400 11px 'JetBrains Mono', var(--mono); letter-spacing: .02em; overflow-wrap: anywhere; }
    /* il nome del file non arriva sotto la maniglia */
    .nodo-file-regola { padding-right: 16px; padding-left: 12px; }
    .riassunto.aperto-sempre { display: inline-flex; }

    /* area CLONI del catalogo: la pillola nell'azzurro dei cloni */
    .area-cloni > .nodo-area { border-color: var(--clone); background: radial-gradient(circle at 50% 0, #142328 0%, #0a0908 85%); }
    .area-cloni > .nodo-area .area-nome { color: var(--clone); }
    .area-cloni > .nodo-area .maniglia { border-color: var(--clone); color: var(--clone); }
    .nodo-area.con-logo { width: 124px; padding: 11px 10px 10px; gap: 4px; border-radius: 34px; }
    .area-logo { display: block; max-width: 78px; max-height: 18px; margin-bottom: 2px; filter: brightness(0) invert(1); opacity: .9; }
    /* MODULI SORGENTE in evidenza rispetto al numero dei moduli: Cinzel oro chiaro, più grande e marcato */
    .nodo-area.con-logo .area-nome { color: var(--oro-chiaro); font: 600 11px/1.25 'Cinzel', serif; letter-spacing: .12em; }
    /* il nodo del catalogo: come il negozio, con il logo STORE // CRAFT in oro */
    /* più grande del nodo di un negozio: è il totale del catalogo; titolo CATALOGO e sotto, piccolo, moduli */
    .diagramma .nodo-catalogo { width: 168px; min-height: 150px; gap: 8px; }
    .diagramma .nodo-catalogo img { max-width: 136px; max-height: 64px; }
    .diagramma .nodo-catalogo .nodo-nome { font-size: 14px; letter-spacing: .2em; }
    .diagramma .nodo-catalogo .nodo-sotto { font-size: 9px; letter-spacing: .14em; }
    .nodo-catalogo img { filter: brightness(0) saturate(100%) invert(73%) sepia(29%) saturate(836%) hue-rotate(352deg) brightness(91%) contrast(87%); opacity: .9; }
    /* modulo non associato a nessun negozio: spia rossa */
    .spia.libero { background: var(--rosso); box-shadow: 0 0 0 2px rgba(224, 122, 95, .16), 0 0 7px rgba(224, 122, 95, .85); }
    .riassunto .spia.libero { box-shadow: 0 0 4px rgba(224, 122, 95, .7); }
    /* sotto il titolo del widget: i negozi che lo usano (sigle), o «non associato» in rosso */
    .w-negozi { display: block; margin-top: -4px; padding: 0 7px 7px; overflow: hidden; color: var(--tenue); font: 400 8.5px var(--mono);
      letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; text-overflow: ellipsis; }
    .w-negozi.libero { color: var(--rosso); }
    .modulo-anteprima .w-negozi { padding: 0 12px 12px; font-size: 10.5px; }
    /* campi per modificare un clone (scheda del modulo) */
    .campi-modifica { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 16px; align-items: center; margin: 0 0 12px; font-size: 12px; }
    .campi-modifica label { color: var(--tenue); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; }
    .campi-modifica input[type="text"], .campi-modifica textarea { width: 100%; padding: 6px 9px; border: 1px solid var(--bordo); border-radius: 4px;
      background: #0a0908; color: var(--testo); font: 400 12px var(--mono); }
    .campi-modifica textarea { min-height: 70px; resize: vertical; line-height: 1.5; }
    .campi-modifica input:focus-visible, .campi-modifica textarea:focus-visible { border-color: var(--clone); outline: none; }
    .campi-modifica input[type="checkbox"] { justify-self: start; accent-color: var(--clone); width: 15px; height: 15px; }
    .campi-modifica input[type="file"] { color: var(--tenue); font: 400 11px var(--mono); }
    .comando.azzurro { border-color: var(--clone); color: var(--clone); }
    .comando.azzurro:hover:not(:disabled), .comando.azzurro:focus-visible { background: var(--clone); color: #121110; }
    .azione.sorgente h4 { color: var(--oro); }
    .azione.clone h4 { color: var(--clone); }
    /* spunte dei negozi nella scheda del modulo del catalogo */
    .spunte { display: grid; gap: 8px; margin: 0 0 12px; }
    .spunte label { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-size: 12px; cursor: pointer; }
    .spunte input { accent-color: var(--oro); width: 15px; height: 15px; margin: 0; align-self: center; cursor: pointer; }
    .spunte input:disabled { cursor: default; }
    .spunte .negozio-nome { color: var(--oro-chiaro); letter-spacing: .06em; }
    .spunte .negozio-nota { color: var(--tenue); font-size: 11px; }

    /* ----- Tema e aspetto dei widget: quattro quadratini sotto il riquadro del negozio (tema scuro e chiaro, aspetto
       STANDARD e COMPATTO con la A); cambiano i widget del diagramma e della scheda del modulo come nelle dashboard ----- */
    .colonna-negozio { position: relative; flex: none; }
    /* larghi al massimo quanto il riquadro del negozio (132 px), che sta sul bordo sinistro del diagramma: se sporgono,
       il primo quadratino resta tagliato; da 1400 px di pagina, con il riquadro più largo, tornano più distanziati */
    .stile-widget { position: absolute; top: calc(100% + 14px); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 5px; }
    .stile-sep { width: 1px; height: 18px; margin: 0 1px; background: var(--bordo); }
    @container pagina (min-width: 1400px) { .stile-widget { gap: 7px; } .stile-sep { margin: 0 4px; } }
    .stile-q { width: 26px; height: 26px; padding: 0; border: 1px solid #4a453d; border-radius: 4px; background: #0a0908; color: var(--oro-chiaro);
      font: 600 14px/1 'Cinzel', serif; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
    .stile-q.q-dark { background: #121110; }
    .stile-q.q-light { background: #f8f6f1; }
    .stile-q.q-standard { border-radius: 7px; }
    .stile-q.q-minimal { border-radius: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 500; }
    .stile-q:hover, .stile-q:focus-visible { border-color: var(--oro); outline: none; }
    .stile-q[aria-pressed="true"] { border-color: var(--oro-chiaro); box-shadow: 0 0 0 1px var(--oro-chiaro), 0 0 6px rgba(229, 186, 115, .45); }
    @media (max-width: 700px) { .stile-widget { position: static; transform: none; justify-content: center; margin-top: 12px; } }
    /* nella scheda del modulo: i quadratini sopra il widget, e il widget come nella dashboard (la vetrina), nel suo
       riquadro con il fondo della dashboard nel tema scelto */
    .modulo-anteprima .stile-widget { position: static; transform: none; justify-content: flex-start; margin: 0 0 10px; }
    .vetrina-modulo { overflow: hidden; border: 1px solid var(--bordo); border-radius: 4px; }
    .vetrina-modulo iframe { display: block; width: 100%; height: 320px; border: 0; background: transparent; }
    /* etichetta del tipo di modulo nei dettagli, come sui widget del diagramma: SORGENTE in oro, CLONE in azzurro */
    .tipo-modulo { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
    .tag-modulo { padding: 0 6px; border: 1px solid currentColor; border-radius: 3px; background: #0a0908; font-size: 10px; letter-spacing: .08em;
      line-height: 1.6; text-transform: uppercase; }
    .tag-modulo.sorgente { color: var(--oro); }
    .tag-modulo.clone { color: var(--clone); }
    /* campi della scheda che si cambiano con il lucchetto aperto: tipo e specifiche (con il pulsantino del divisorio |),
       galleria (menu e riquadro di conferma dello spostamento), temi speciali (un clic li accende o li spegne) */
    .campo-inline { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; width: 100%; }
    .campo-inline input, .galleria-menu select { min-width: 0; padding: 4px 8px; border: 1px solid var(--bordo); border-radius: 3px; background: #0a0908;
      color: var(--testo); font: 400 12px var(--mono); }
    .campo-inline input { flex: 1 1 200px; max-width: 420px; }
    .campo-specifiche input { max-width: 560px; }
    .campo-inline input:focus-visible, .galleria-menu select:focus-visible { border-color: var(--oro); outline: none; }
    .divisorio { width: 26px; height: 26px; padding: 0; border: 1px solid var(--oro); border-radius: 3px; background: none; color: var(--oro);
      font: 400 14px/1 var(--mono); cursor: pointer; }
    .divisorio:hover, .divisorio:focus-visible { background: var(--oro); color: #121110; outline: none; }
    /* stile del widget: in vista il pallino (oro se dorato), con il lucchetto aperto due pulsanti normale / dorato */
    .campo-stile { display: inline-flex; align-items: center; gap: 8px; }
    .stile-segno { width: 9px; height: 9px; border: 1px solid var(--tenue); border-radius: 50%; }
    .stile-segno.dorato { border-color: #e5ba73; background: linear-gradient(135deg, #b88d4c, #f4e3c9, #b88d4c); box-shadow: 0 0 5px rgba(212, 163, 115, .55); }
    .scelta-stile { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--bordo); border-radius: 4px; background: #0a0908; }
    .stile-voce { min-width: 78px; padding: 4px 10px; border: 1px solid transparent; border-radius: 3px; background: none; color: var(--tenue);
      font: 400 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
    .stile-voce:hover:not(:disabled), .stile-voce:focus-visible { color: var(--oro-chiaro); border-color: var(--oro-scuro); outline: none; }
    .stile-voce[aria-pressed="true"] { background: var(--oro); color: #121110; }
    .stile-voce.dorato[aria-pressed="true"] { background: linear-gradient(135deg, #b88d4c, #f4e3c9, #b88d4c, #e5ba73); color: #121110; }
    .stile-voce:disabled { cursor: default; }
    .galleria-menu { position: relative; display: inline-flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    .galleria-menu select { cursor: pointer; }
    .conferma-sposta { display: flex; flex-direction: column; gap: 10px; padding: 10px 12px; border: 1px solid var(--oro-scuro); border-radius: 4px;
      background: #0a0908; box-shadow: 0 6px 16px rgba(0, 0, 0, .5); }
    .conferma-sposta[hidden] { display: none; }
    .conferma-domanda b { color: var(--oro-chiaro); font-weight: 400; }
    .conferma-comandi { display: flex; gap: 8px; }
    .comando.pieno { background: var(--oro); color: #121110; }
    button.tema-voce { padding: 3px 9px 3px 4px; border: 1px solid var(--bordo); border-radius: 14px; background: none; color: var(--testo); font: inherit;
      cursor: pointer; transition: border-color .15s; }
    button.tema-voce:hover:not(:disabled), button.tema-voce:focus-visible { border-color: var(--oro); outline: none; }
    .tema-voce.spento { color: var(--tenue); }
    .tema-voce.spento .w-tema, .w-tema.spento { opacity: .35; filter: grayscale(1); }
    .tema-stato { margin-left: 4px; color: var(--tenue); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    /* campo MINIATURE: gli scatti (1-3) in fila, ognuno in un riquadro 16:9 come nella dashboard, con la sua misura; con il
       lucchetto aperto i pulsanti 1 2 3 (quanti scatti), carica o cambia immagine e salva */
    .miniature-campo { display: flex; flex-direction: column; gap: 10px; }
    .miniature-numero { display: flex; align-items: center; gap: 6px; color: var(--tenue); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; }
    .miniature-numero span { margin-right: 4px; }
    .miniature-numero .stile-q { width: 24px; height: 24px; font: 400 12px var(--mono); }
    .miniature-scatti { display: flex; flex-wrap: wrap; gap: 12px; }
    .miniatura-scatto { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; width: 170px; }
    .miniatura-nome { color: var(--tenue); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
    .miniatura-cornice { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
      border: 1px solid var(--bordo); border-radius: 4px; background: radial-gradient(circle, #1f1d1a 0%, #0a0908 100%); }
    .miniatura-cornice img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; }
    .miniatura-vuota { color: var(--tenue); font-size: 22px; }
    .miniatura-misura { color: var(--testo); font-size: 11px; }
    .miniature-info { margin: 0; color: var(--tenue); font-size: 11px; line-height: 1.55; }
    .miniature-avviso { color: var(--rosso); }
    .miniature-campo > .comando { align-self: flex-start; }

    /* ----- Il + delle specifiche, come nelle schede della dashboard: accanto al titolo; aperto ruota in × e sotto il
       titolo si apre la descrizione (le specifiche divise da |) in tutti i widget ----- */
    .w-riga { display: flex; align-items: center; min-width: 0; }
    .w-riga .w-titolo { flex: 1; min-width: 0; }
    .w-piu { position: relative; flex: none; width: 16px; height: 16px; margin-right: 5px; border-radius: 50%; color: var(--oro); cursor: pointer;
      transition: transform .3s ease, background .18s, color .18s; }
    .w-piu::before, .w-piu::after { content: ''; position: absolute; top: calc(50% - .5px); left: calc(50% - 4px); width: 8px; height: 1px; background: currentColor; }
    .w-piu::after { transform: rotate(90deg); }
    .w-piu:hover, .w-piu:focus-visible { background: var(--oro); color: #121110; outline: none; }
    body.specifiche-aperte .w-piu { transform: rotate(45deg); }
    .w-spec { display: grid; grid-template-rows: 0fr; grid-template-columns: minmax(0, 1fr); transition: grid-template-rows .3s ease; }
    .w-spec-testo { min-width: 0; overflow: hidden; overflow-wrap: anywhere; padding: 0 7px; color: var(--tenue); font: 400 8.5px/1.45 var(--mono); transition: padding .3s ease; }
    .w-spec-testo i { margin: 0 4px; color: #5b554c; font-style: normal; }
    body.specifiche-aperte .w-spec { grid-template-rows: 1fr; }
    body.specifiche-aperte .w-spec-testo { padding-bottom: 7px; }
    .modulo-anteprima .w-piu { width: 24px; height: 24px; margin-right: 10px; }
    .modulo-anteprima .w-piu::before, .modulo-anteprima .w-piu::after { left: calc(50% - 5.5px); width: 11px; }
    .modulo-anteprima .w-spec-testo { padding: 0 12px; font-size: 11px; }
    body.specifiche-aperte .modulo-anteprima .w-spec-testo { padding-bottom: 12px; }

    /* aspetto STANDARD: angoli tondi, titoli in Cinzel, il resto in Plus Jakarta Sans */
    body[data-widget-aspetto="standard"] .widget .w-titolo { font-family: 'Cinzel', serif; font-weight: 600; letter-spacing: .04em; }
    body[data-widget-aspetto="standard"] .widget :is(.w-num, .w-spec-testo, .w-negozi) { font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
    /* aspetto COMPATTO: squadrati, titoli in Fraunces, il resto in Arial */
    body[data-widget-aspetto="minimal"] .widget, body[data-widget-aspetto="minimal"] .widget .w-anteprima { border-radius: 0; }
    body[data-widget-aspetto="minimal"] .widget .w-titolo { font-family: 'Fraunces', Georgia, serif; font-weight: 400; letter-spacing: 0; }
    body[data-widget-aspetto="minimal"] .widget :is(.w-num, .w-spec-testo, .w-negozi) { font-family: Arial, Helvetica, sans-serif; }
    /* tema chiaro: fondo avorio, anteprima beige, titolo taupe, numero nell'oro dei cartelli, ombra corta; i bordi di
       sorgente e clone restano (oro più scuro e azzurro); le promo dorate come nella dashboard chiara */
    body[data-widget-tema="light"] .widget { background: #fffdfa; color: #282522; box-shadow: 0 1px 3px rgba(40, 34, 28, .24); }
    body[data-widget-tema="light"] .widget.sorgente { border-color: rgba(173, 138, 62, .6); }
    body[data-widget-tema="light"] .widget .w-anteprima { background: #eee8dd; }
    body[data-widget-tema="light"] .widget .w-titolo { color: #665e54; }
    body[data-widget-tema="light"] .widget .w-num { color: #b48b37; }
    body[data-widget-tema="light"] .widget :is(.w-negozi, .w-spec-testo) { color: #665e54; }
    body[data-widget-tema="light"] .widget .w-tipo { background: #fffdfa; }
    /* l'etichetta SORGENTE sul widget chiaro: oro scuro, altrimenti sul fondo avorio non si legge (CLONE resta azzurro, più scuro) */
    body[data-widget-tema="light"] .widget.sorgente .w-tipo { color: #8a6418; }
    body[data-widget-tema="light"] .widget.clone .w-tipo { color: #2f7f93; }
    body[data-widget-tema="light"] .widget .w-segno { color: #ad8a3e; }
    body[data-widget-tema="light"] .widget.dorata { background: #fbf5e7; border-color: #b48b37;
      box-shadow: 0 0 0 1px rgba(180, 139, 55, .35), 0 1px 3px rgba(40, 34, 28, .2); }
    body[data-widget-tema="light"] .widget.dorata .w-titolo { color: #b48b37; text-shadow: none; }
    body[data-widget-tema="light"] .widget.dorata .w-anteprima { background: #eee8dd; }

    /* Dentro la pagina operatore (?incorporata, operatore-sezione.js): niente intestazione propria né fondo */
    html.incorporata, html.incorporata body { overflow: hidden; background: transparent; }
    html.incorporata .pagina { max-width: none; padding: 0; }
    html.incorporata .torna, html.incorporata header.testa { display: none; }
    html.incorporata .riga-stato { margin-top: 8px; }
    html.incorporata .nodo, html.incorporata .freccia { background: #0e0d0c; }

    /* Schermi ultra larghi (21:9 e 32:9): la pagina aperta da sola si allarga come la cornice della pagina operatore, e
       quando la pagina (non la finestra) è così larga il diagramma si ingrandisce parecchio: widget, nodi, fili e scritte
       (oltre 1700 px e oltre 2600 px di pagina). Negli altri casi restano le misure di sempre */
    @media (min-width: 1800px) { .pagina { max-width: 1780px; } }
    @media (min-width: 2400px) { .pagina { max-width: 2300px; } }
    @media (min-aspect-ratio: 20/9) and (min-width: 2000px) { .pagina { max-width: 2700px; } }
    @media (min-aspect-ratio: 30/9) and (min-width: 3000px) { .pagina { max-width: 3400px; } }
    .pagina { container: pagina / inline-size; }
    /* i widget crescono senza scatti con la larghezza della pagina (cqi: centesimi della sua larghezza): 94 px fino a
       circa 1100 px di pagina, poi in proporzione, fino a 196 px sugli schermi 32:9; il titolo con loro */
    .diagramma { --w-widget: clamp(100px, calc(7.6cqi + 16px), 220px); }
    .diagramma .w-titolo { font-size: clamp(10px, calc(.3cqi + 7px), 15px); }
    @media (prefers-reduced-motion: no-preference) { .pagina { transition: max-width .55s cubic-bezier(.2, .8, .2, 1); } }
    /* un poco più grandi già da 1400 px di pagina (monitor 16:9 grandi) */
    @container pagina (min-width: 1400px) {
      .diagramma { --spazio-widget: 12px; }
      .nodo-negozio { width: 150px; }
      .nodo-galleria { width: 146px; }
      .filo { width: 32px; }
    }
    @container pagina (min-width: 1700px) {
      .diagramma { --spazio-widget: 14px; }
      .diagramma .w-titolo { padding: 7px 9px 9px; }
      .diagramma .w-num { font-size: 11px; }
      .diagramma .w-testa { padding: 7px 9px 5px; }
      .diagramma .spia { width: 10px; height: 10px; }
      .diagramma .w-segno { font-size: 24px; }
      .nodo-negozio { width: 200px; min-height: 180px; }
      .nodo-negozio img { max-width: 160px; max-height: 58px; }
      .nodo-negozio .nodo-nome { font-size: 13px; }
      .nodo-pagina { width: 132px; }
      .nodo-pagina svg { width: 44px; height: 54px; }
      .nodo-file { font-size: 14px; }
      .nodo-sotto { font-size: 11.5px; }
      .nodo-area { width: 150px; min-height: 72px; border-radius: 36px; }
      .area-nome { font-size: 13px; }
      .nodo-galleria { width: 190px; min-height: 96px; }
      .galleria-nome { font-size: 14.5px; }
      .filo { width: 44px; }
      .filo.corto { width: 26px; }
      .ramo { padding-left: 30px; }
      .ramo::before { width: 30px; }
      .maniglia { width: 28px; height: 28px; right: -15px; }
      .maniglia::before { width: 13px; left: calc(50% - 6.5px); }
      .freccia { width: 30px; height: 30px; font-size: 18px; }
    }
    @container pagina (min-width: 2600px) {
      .diagramma { --spazio-widget: 16px; }
      .diagramma .w-segno { font-size: 30px; }
      .nodo-negozio { width: 240px; min-height: 210px; }
      .nodo-negozio img { max-width: 190px; max-height: 70px; }
      .nodo-pagina { width: 156px; }
      .nodo-area { width: 176px; }
      .nodo-galleria { width: 220px; }
      .galleria-nome { font-size: 16px; }
      .filo { width: 56px; }
    }

    /* Telefono: il diagramma si sviluppa dall'alto in basso (negozio, index.html, gallerie una sotto l'altra) */
    @media (max-width: 700px) {
      .pagina { padding: 14px 14px 40px; }
      header.testa { gap: 16px; margin-bottom: 26px; }
      header.testa img { width: 72px; }
      h1 { font-size: 12px; letter-spacing: .16em; }
      .insegne { gap: 22px; margin: 26px 0 18px; }
      .insegna { height: 34px; }
      .insegna img { max-height: 26px; max-width: 28vw; }
      .diagramma { flex-direction: column; align-items: stretch; }
      .diagramma > .nodo { align-self: center; }
      .diagramma > .filo { align-self: center; width: 1px; height: 26px; }
      .diagramma > .filo::after { content: none; }
      .ramo { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 0 10px 18px; }
      .ramo::before { top: 34px; width: 18px; }
      .ramo:first-child::after { top: 34px; }
      .ramo:last-child::after { bottom: auto; height: 34px; }
      .nodo-galleria { width: auto; min-height: 0; flex-direction: row; flex-wrap: wrap; justify-content: space-between; text-align: left; }
      .ramo > .filo { display: none; }
      .modulo-griglia { grid-template-columns: 1fr; gap: 22px; }
      .modulo-anteprima .widget { --w-widget: min(300px, 100%); }
      .info { grid-template-columns: 1fr; gap: 2px; }
      .info dd { margin-bottom: 8px; }
      /* sul telefono le regole stanno sotto index nella colonna, senza posizione assoluta */
      .diagramma > .colonna-index { align-self: center; }
      .voci { position: static; transform: none; }
    }
    /* Avviso sui pulsanti che collegano la cartella del progetto: al passaggio del mouse (e con la tastiera) un riquadro
       sotto il pulsante dice che funziona solo in Chrome o Edge sul computer (File System Access API). Il riquadro parte dal bordo sinistro del pulsante. Stessa regola in
       operatore.html, gestione-negozi.html, pacchetti.html e assets/css/operatore.css (pagine dei loghi ufficiali) */
    [data-avviso] { position: relative; }
    [data-avviso]::after { content: '// ' attr(data-avviso); position: absolute; top: calc(100% + 9px); left: 0; z-index: 30; width: max-content;
      max-width: 270px; padding: 7px 10px; border: 1px solid #8f6a1f; border-radius: 4px; background: #0a0908; color: #d9d3c7;
      font: 400 10.5px/1.5 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: .02em; text-transform: none; text-align: left;
      white-space: normal; pointer-events: none; opacity: 0; transform: translateY(-4px); transition: opacity .15s, transform .15s;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .5); }
    [data-avviso]:hover::after, [data-avviso]:focus-visible::after { opacity: 1; transform: none; }
    /* il pulsante sta sul bordo destro: il riquadro si allinea a destra */
    #collega::after { left: auto; right: 0; }
  </style>
</head>
<body>
<div class="pagina">
  <a class="torna" href="operatore.html#negozi">← Area operatore</a>
  <header class="testa">
    <img src="assets/img/storecraftlogo.png" alt="STORE // CRAFT">
    <h1>Gestione negozi</h1>
  </header>

  <!-- totali del negozio scelto, sulla riga subito sotto il titolo -->
  <p class="riga-stato"><span id="stato">Lettura in corso…</span></p>
  <!-- insegne dei negozi: un diagramma alla volta -->
  <div class="insegne" role="tablist" aria-label="Negozi"><span class="segnalino"></span></div>
  <div class="barra">
    <!-- modalità modifica: con il lucchetto aperto i moduli si trascinano per cambiare l'ordine dentro la loro sezione -->
    <div class="modifica-riga">
      <button class="lucchetto" type="button" id="modifica" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="arco" d="M8 11V7.5a4 4 0 0 1 8 0V11"/><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M12 15v2.5"/></svg><span id="modifica-testo">modalità modifica</span></button>
      <span class="modifica-nota" id="modifica-nota" hidden>trascina i moduli dentro la loro sezione per cambiarne l'ordine, poi registra</span>
    </div>
    <!-- legenda: moduli sorgente (oro) e moduli clone (azzurro) -->
    <div class="legenda-moduli" aria-label="Legenda dei moduli">
      <span class="l-sorgente" tabindex="0" data-avviso="modulo sorgente, scritto a codice (Luxury Outlet, TEBE o derivato da loro): si mette in ghost e si sposta; si modifica e si cancella solo dal codice"><i></i><b>sorgente</b></span>
      <span class="l-clone" tabindex="0" data-avviso="modulo clone, creato con le utilità dell'area operatore: si mette in ghost, si sposta, si modifica e si cancella"><i></i><b>clone</b></span>
      <span class="l-temi" tabindex="0" data-avviso="i pulsanti dei temi speciali che il modulo ha: Made in Italy, Black Friday, Natale"><b>temi speciali</b><span class="w-tema t-italia"><img src="assets/img/luxury/madeinitaly.png" alt=""></span><span class="w-tema t-blackfriday"><img src="assets/img/luxury/tema_blackfriday_icon.png" alt=""></span><span class="w-tema t-natale"><img src="assets/img/luxury/tema_xmas_icon.png" alt=""></span></span>
    </div>
    <div class="cartella">
      <button class="comando" type="button" id="collega" data-avviso="solo chrome o edge sul computer: gli altri browser non possono collegare la cartella del progetto">collega la cartella del progetto</button>
    </div>
  </div>

  <div class="diagramma" id="diagramma" aria-label="Diagramma del negozio"></div>
  <!-- in fondo al diagramma: torna all'area operatore (dentro la pagina operatore chiude la sezione, come ← area operatore) -->
  <div class="indietro-fondo" id="indietro-fondo"><button class="comando" type="button" id="torna-operatore">← torna all'area operatore</button></div>
  <!-- + NUOVO NEGOZIO: il percorso a domande (assets/js/nuovo-negozio.js) al posto del diagramma -->
  <section class="vista-nuovo" id="vista-nuovo" hidden aria-label="Apri un nuovo negozio"></section>
  <section class="vista-modulo" id="vista-modulo" hidden aria-label="Scheda del modulo">
    <button class="torna-diagramma" type="button" id="torna-diagramma">← diagramma del negozio</button>
    <div id="modulo"></div>
  </section>
</div>

<script>
  // Negozi modello: per loro l'ordine di partenza è quello originale del negozio; per gli altri la sequenza in cui i
  // moduli sono stati aggiunti. In tutti e due i casi è l'ordine delle schede nel file della dashboard
  const MODELLI = ['luxury', 'tebe', 'ophilya'];
  const $ = id => document.getElementById(id);
  const nodo = (tag, classe, testo) => {
    const elemento = document.createElement(tag);
    if (classe) elemento.className = classe;
    if (testo !== undefined) elemento.textContent = testo;
    return elemento;
  };
  const due = n => String(n).padStart(2, '0');
  const pagina = link => String(link || '').split('?')[0];
  const chiave = scheda => scheda.link || scheda.pdf || scheda.titolo;
  const nomeNegozio = id => Negozi.scheda(id)?.nome || id;

  // ----- Cartella del progetto (per scrivere): dalla pagina operatore, o scelta qui -----
  const incorporata = document.documentElement.classList.contains('incorporata');
  const operatore = incorporata && typeof window.parent.collegaProgetto === 'function' ? window.parent : null;
  const SCRIVIBILE = typeof (operatore || window).showDirectoryPicker === 'function';
  let progetto = operatore?.progettoCollegato || null;
  // Esiti delle operazioni: nella riga di stato (oro mentre lavora, verde fatto, rosso errore), poi tornano i totali
  let totali = '';
  let attesaEsito = 0;
  function esito(testo, classe = '') {
    clearTimeout(attesaEsito);
    $('stato').textContent = testo;
    $('stato').className = classe || 'lavora';
    if (classe) attesaEsito = setTimeout(mostraTotali, classe === 'err' ? 12000 : 7000);
  }
  function mostraTotali() {
    clearTimeout(attesaEsito);
    attesaEsito = 0;
    $('stato').textContent = totali;
    $('stato').className = '';
  }
  function segnaCollegata() {
    $('collega').textContent = '✓ cartella collegata';
    $('collega').classList.add('collegata');
  }
  async function collega() {
    if (!progetto) progetto = operatore ? await operatore.collegaProgetto(esito) : await Associa.scegliProgetto(esito);
    segnaCollegata();
    return progetto;
  }
  $('collega').addEventListener('click', async () => {
    try {
      await collega();
      esito(`cartella del progetto collegata: ${progetto.name}`, 'ok');
      if (negozioScelto === MODULI) await caricaCatalogo(); else await carica(negozioScelto);
      disegna();
    } catch (errore) {
      if (errore.name === 'AbortError') esito('cartella non collegata', 'nota');
      else { console.error(errore); esito(`errore (${errore.name}): ${errore.message}`, 'err'); }
    }
  });
  if (progetto) segnaCollegata();
  // come nelle altre sezioni dell'area operatore: se la cartella è già collegata (o il browser dà ancora il permesso a
  // quella ricordata) il pulsante è subito «✓ cartella collegata»; altrimenti un clic la collega
  else if (operatore?.progettoSenzaChiedere) operatore.progettoSenzaChiedere().then(cartella => {
    if (!cartella || progetto) return;
    progetto = cartella;
    segnaCollegata();
  }).catch(() => {});
  if (!SCRIVIBILE) {
    $('collega').disabled = true;
    $('collega').title = 'questo browser non può collegare la cartella del progetto: per cambiare i moduli apri questa pagina in chrome o edge sul computer';
  }

  // ----- Modalità modifica (lucchetto): di partenza chiusa, i moduli non si spostano; aperta si trascinano dentro la loro
