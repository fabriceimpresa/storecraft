      if (errore.name === 'AbortError') esito('cartella non collegata: nessuna modifica', 'nota');
      else { console.error(errore); esito(`errore (${errore.name}): ${errore.message}`, 'err'); }
      return false;
    }
  }

  // Campo MINIATURE della scheda del modulo: le anteprime degli scatti della scheda (1, 2 o 3: nella dashboard si alternano
  // con una dissolvenza al passaggio del mouse), con la misura di ognuno; con il lucchetto aperto si sceglie quanti
  // scatti, si carica l'immagine di ogni scatto (con le misure consigliate, quelle dello scatto 1) e si salva: i file nuovi
  // in assets/thumbnail/<negozio>/ e l'elenco nella scheda della dashboard. Per sorgente e cloni (sorgente: con l'avviso)
  const MISURA_CONSIGLIATA = { larghezza: 1200, altezza: 675 };
  function campoMiniature(id, sezione, scheda, chiaveModulo, sorgente) {
    const campo = nodo('div', 'miniature-campo');
    const attuali = (scheda.miniature || []).slice(0, 3);
    let scatti = Math.max(1, attuali.length);
    const nuovi = [null, null, null];   // i file scelti per gli scatti
    const misure = [null, null, null];  // { larghezza, altezza } di ogni scatto mostrato
    const riga = nodo('div', 'miniature-scatti');
    const info = nodo('p', 'miniature-info');
    const nomeBase = scheda.link ? pagina(scheda.link).replace(/\.html$/, '') : scheda.titolo;
    let scelta = null, salva = null;
    const aggiornaInfo = () => {
      const base = misure[0] || MISURA_CONSIGLIATA;
      info.replaceChildren(`consigliato: ${base.larghezza} × ${base.altezza} px${misure[0] ? ' (come lo scatto 1)' : ''} a 96 dpi, PNG o JPG fino a circa 500 KB; `
        + 'nella dashboard l\'immagine si vede intera in un riquadro 16:9; con 2 o 3 scatti si alternano con una dissolvenza al passaggio del mouse');
      // proporzioni diverse dallo scatto 1: un avviso
      const diverse = misure.slice(1, scatti).some(m => m && misure[0] && Math.abs(m.larghezza / m.altezza - misure[0].larghezza / misure[0].altezza) > .03);
      if (diverse) info.append(nodo('span', 'miniature-avviso', ' · attenzione: uno scatto ha proporzioni diverse dallo scatto 1'));
      if (salva) {
        const cambiato = scatti !== attuali.length || nuovi.slice(0, scatti).some(Boolean);
        const completi = [...Array(scatti).keys()].every(i => nuovi[i] || attuali[i]);
        salva.disabled = !SCRIVIBILE || !cambiato || !completi;
      }
    };
    const disegna = () => {
      riga.replaceChildren();
      for (let i = 0; i < scatti; i++) {
        const slot = nodo('div', 'miniatura-scatto');
        const cornice = nodo('div', 'miniatura-cornice');
        const sorgenteImg = nuovi[i] ? URL.createObjectURL(nuovi[i]) : attuali[i] ? `assets/${attuali[i]}` : null;
        const testo = nodo('span', 'miniatura-misura', sorgenteImg ? '…' : 'da caricare');
        if (sorgenteImg) {
          const img = nodo('img');
          img.alt = `scatto ${i + 1}`;
          img.addEventListener('load', () => {
            misure[i] = { larghezza: img.naturalWidth, altezza: img.naturalHeight };
            testo.textContent = `${img.naturalWidth} × ${img.naturalHeight} px${nuovi[i] ? ' · nuovo' : ''}`;
            aggiornaInfo();
          });
          img.src = sorgenteImg;
          cornice.append(img);
        } else cornice.append(nodo('span', 'miniatura-vuota', '+'));
        slot.append(nodo('span', 'miniatura-nome', `scatto ${i + 1}`), cornice, testo);
        if (modifica) {
          const file = nodo('input');
          file.type = 'file';
          file.accept = 'image/png,image/jpeg,image/webp';
          file.hidden = true;
          const carica = nodo('button', 'collegamento forte', sorgenteImg ? 'cambia immagine' : 'carica immagine');
          carica.type = 'button';
          carica.disabled = !SCRIVIBILE;
          carica.addEventListener('click', () => file.click());
          file.addEventListener('change', () => { if (file.files[0]) { nuovi[i] = file.files[0]; misure[i] = null; disegna(); } });
          slot.append(carica, file);
        }
        riga.append(slot);
      }
      if (scelta) scelta.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.scatti) === scatti)));
      aggiornaInfo();
    };
    if (modifica) {
      // quanti scatti: 1, 2 o 3
      scelta = nodo('div', 'miniature-numero');
      scelta.append(nodo('span', '', 'scatti'));
      [1, 2, 3].forEach(n => {
        const pulsante = nodo('button', 'stile-q', String(n));
        pulsante.type = 'button';
        pulsante.dataset.scatti = n;
        pulsante.setAttribute('aria-label', `${n} ${n === 1 ? 'scatto' : 'scatti'}`);
        pulsante.addEventListener('click', () => { scatti = n; disegna(); });
        scelta.append(pulsante);
      });
      salva = nodo('button', 'comando', 'salva miniature');
      salva.type = 'button';
      salva.addEventListener('click', async () => {
        // prima la cartella, poi la conferma del sorgente (come scriviModulo)
        if (!await cartellaPronta()) return;
        if (!confermaSorgente(id, scheda, sorgente)) return;
        salva.disabled = true;
        try {
          const percorsi = [];
          for (let i = 0; i < scatti; i++) {
            if (nuovi[i]) { esito(`salvo lo scatto ${i + 1}…`); percorsi.push(await Associa.scriviMiniatura(progetto, id, nomeBase, nuovi[i])); }
            else percorsi.push(attuali[i]);
          }
          await scriviDashboard(id, testo => Associa.modificaScheda(testo, sezione.id, chiaveModulo, { miniature: percorsi }),
            `miniature di ${scheda.titolo} salvate (${scatti} ${scatti === 1 ? 'scatto' : 'scatti'})`);
        } catch (errore) {
          console.error(errore);
          esito(`errore (${errore.name}): ${errore.message}`, 'err');
          salva.disabled = false;
        }
      });
    }
    campo.append(...(scelta ? [scelta] : []), riga, info, ...(salva ? [salva] : []));
    disegna();
    return campo;
  }

  // ----- Campi della scheda del modulo che si cambiano in modalità modifica (lucchetto aperto) -----
  // un campo di testo con SALVA (spento finché non cambia; Invio salva)
  function campoModifica(valore, massimo, esempio, salva) {
    const campo = nodo('span', 'campo-inline');
    const input = nodo('input');
    input.type = 'text';
    input.value = valore;
    input.maxLength = massimo;
    input.placeholder = esempio;
    const pulsante = nodo('button', 'collegamento forte', 'salva');
    pulsante.type = 'button';
    pulsante.disabled = true;
    input.addEventListener('input', () => { pulsante.disabled = !SCRIVIBILE || input.value.trim() === valore; });
    const conferma = () => { if (!pulsante.disabled) { pulsante.disabled = true; salva(input.value.trim()); } };
    pulsante.addEventListener('click', conferma);
    input.addEventListener('keydown', evento => { if (evento.key === 'Enter') { evento.preventDefault(); conferma(); } });
    campo.append(input, pulsante);
    return campo;
  }
  // lo stile del widget: in vista «normale» o «dorato» (con il pallino oro); con il lucchetto aperto due pulsanti, NORMALE e
  // DORATO, e un clic sull'altro scrive la scheda (salva(true) per dorato)
  function campoStile(scheda, salva) {
    const dorato = scheda.stile === 'dorata';
    const campo = nodo('span', 'campo-stile');
    if (!modifica) {
      campo.append(nodo('span', `stile-segno${dorato ? ' dorato' : ''}`), dorato ? 'dorato, come le Promo Stagionali' : 'normale');
      return campo;
    }
    const scelta = nodo('span', 'scelta-stile');
    scelta.setAttribute('role', 'group');
    scelta.setAttribute('aria-label', 'Stile del widget');
    [[false, 'normale'], [true, 'dorato']].forEach(([valore, testo]) => {
      const pulsante = nodo('button', `stile-voce${valore ? ' dorato' : ''}`, testo);
      pulsante.type = 'button';
      pulsante.setAttribute('aria-pressed', String(valore === dorato));
      pulsante.disabled = !SCRIVIBILE;
      pulsante.addEventListener('click', () => { if (valore !== dorato) salva(valore); });
      scelta.append(pulsante);
    });
    campo.append(scelta);
    return campo;
  }
  // le specifiche in un campo solo, divise dal divisorio | delle descrizioni della dashboard; il pulsantino | lo inserisce
  // dove sta il cursore (anche nel testo scritto a mano); salvando si dividono sul | e diventano l'elenco della scheda
  function campoSpecifiche(valori, salva) {
    const iniziale = valori.join(' | ');
    const campo = nodo('span', 'campo-inline campo-specifiche');
    const input = nodo('input');
    input.type = 'text';
    input.value = iniziale;
    input.placeholder = 'es. Brand | Prezzo | Sconto';
    const divisorio = nodo('button', 'divisorio', '|');
    divisorio.type = 'button';
    divisorio.title = 'inserisci il divisorio | tra due specifiche';
    divisorio.setAttribute('aria-label', 'Inserisci il divisorio tra due specifiche');
    const pulsante = nodo('button', 'collegamento forte', 'salva');
    pulsante.type = 'button';
    pulsante.disabled = true;
    const aggiorna = () => { pulsante.disabled = !SCRIVIBILE || input.value.trim() === iniziale; };
    input.addEventListener('input', aggiorna);
    divisorio.addEventListener('click', () => {
      const inizio = input.selectionStart ?? input.value.length, fine = input.selectionEnd ?? inizio;
      input.value = `${input.value.slice(0, inizio).replace(/\s+$/, '')} | ${input.value.slice(fine).replace(/^\s+/, '')}`;
      const posto = input.value.indexOf(' | ', Math.max(0, inizio - 2)) + 3;
      input.focus();
      input.setSelectionRange(posto, posto);
      aggiorna();
    });
    const conferma = () => {
      if (pulsante.disabled) return;
      pulsante.disabled = true;
      salva(input.value.split('|').map(testo => testo.trim()).filter(Boolean));
    };
    pulsante.addEventListener('click', conferma);
    input.addEventListener('keydown', evento => { if (evento.key === 'Enter') { evento.preventDefault(); conferma(); } });
    campo.append(input, divisorio, pulsante);
    return campo;
  }
  // la galleria: un menu con le gallerie del negozio dove il modulo può stare (pagine: cartelli, promo e cartellini tra
  // loro; etichette con etichette; stampe con stampe); scegliendone una compare un piccolo riquadro di conferma
  // «Sposta modulo … in galleria …?» con ANNULLA e SPOSTA; spostato, la scheda resta aperta nella galleria nuova
  const famiglia = tipo => (['cartelli', 'promo', 'cartellini'].includes(tipo) ? 'pagine' : tipo);
  function menuGalleria(id, sezione, scheda, chiaveModulo, sorgente = false) {
    const contenitore = nodo('span', 'galleria-menu');
    const menu = nodo('select');
    menu.setAttribute('aria-label', 'Galleria del modulo');
    negozi[id].dati.sezioni.filter(s => famiglia(s.tipo) === famiglia(sezione.tipo)).forEach(s => {
      const voce = nodo('option', '', `${s.titolo.split(' // ')[0]} (${s.tipo})`);
      voce.value = s.id;
      voce.selected = s.id === sezione.id;
      menu.append(voce);
    });
    menu.disabled = !SCRIVIBILE;
    const riquadro = nodo('span', 'conferma-sposta');
    riquadro.hidden = true;
    menu.addEventListener('change', () => {
      const arrivo = negozi[id].dati.sezioni.find(s => s.id === menu.value);
      if (!arrivo || arrivo.id === sezione.id) { riquadro.hidden = true; return; }
      const annulla = nodo('button', 'comando', 'annulla');
      const sposta = nodo('button', 'comando pieno', 'sposta');
      annulla.type = sposta.type = 'button';
      const domanda = nodo('span', 'conferma-domanda');
      domanda.append('Sposta modulo ', nodo('b', '', scheda.titolo), ' in galleria ', nodo('b', '', arrivo.titolo.split(' // ')[0]), '?');
      const comandi = nodo('span', 'conferma-comandi');
      comandi.append(annulla, sposta);
      riquadro.replaceChildren(domanda, comandi);
      riquadro.hidden = false;
      annulla.addEventListener('click', () => { menu.value = sezione.id; riquadro.hidden = true; menu.focus(); });
      sposta.addEventListener('click', async () => {
        sposta.disabled = annulla.disabled = true;
        moduloAperto.sezione = arrivo.id;   // la scheda resta aperta, nella galleria nuova
        const ok = await scriviModulo(id, scheda, sorgente, testo => Associa.spostaScheda(testo, sezione.id, chiaveModulo, arrivo.id),
          `${scheda.titolo} spostato in ${arrivo.titolo.split(' // ')[0]}`);
        if (!ok) { moduloAperto.sezione = sezione.id; ridisegna(); }
      });
      sposta.focus();
    });
    contenitore.append(menu, riquadro);
    return contenitore;
  }

  // Pulsantiera delle azioni della scheda del modulo: un pulsante per sezione (ghost, duplica, modifica, elimina) in fila,
  // sotto i dettagli; le sezioni restano chiuse finché non si clicca il loro pulsante, che apre la sezione intera (titolo,
  // descrizione e comando); un altro clic la richiude, una sezione alla volta. La sezione aperta resta quando la scheda si
  // ridisegna (dopo un'azione)
  let azioneAperta = null;
  function pulsantieraAzioni(azioni) {
    const sezioni = [...azioni.querySelectorAll(':scope > .azione')];
    const fila = nodo('div', 'pulsantiera-azioni');
    fila.setAttribute('role', 'tablist');
    const pulsanti = sezioni.map((sezione, i) => {
      const titolo = sezione.querySelector('h4')?.textContent.replace(/ modulo$/, '') || `azione ${i + 1}`;
      const chiaveAzione = titolo.toLowerCase();
      sezione.id = `azione-${chiaveAzione.replace(/\W+/g, '-')}`;
      sezione.setAttribute('role', 'tabpanel');
      const pulsante = nodo('button', `azione-tasto t-${chiaveAzione.replace(/\W+/g, '-')}`, titolo);
      pulsante.type = 'button';
      pulsante.setAttribute('role', 'tab');
      pulsante.setAttribute('aria-controls', sezione.id);
      pulsante.addEventListener('click', () => { azioneAperta = azioneAperta === chiaveAzione ? null : chiaveAzione; mostra(); });
      fila.append(pulsante);
      return { pulsante, sezione, chiaveAzione };
    });
    const mostra = () => pulsanti.forEach(({ pulsante, sezione, chiaveAzione }) => {
      const aperta = azioneAperta === chiaveAzione;
      pulsante.setAttribute('aria-selected', String(aperta));
      sezione.hidden = !aperta;
    });
    mostra();
    azioni.prepend(fila);
  }

  function disegnaModulo() {
    if (moduloAperto.id === MODULI) { disegnaModuloCatalogo(); return; }
    const { id, sezione: sezioneId, chiave: chiaveModulo } = moduloAperto;
    const { dati, cloni } = negozi[id];
    const sezione = dati.sezioni.find(s => s.id === sezioneId);
    const schede = sezione ? ordinate(id, sezione) : [];
    const indice = schede.findIndex(s => chiave(s) === chiaveModulo);
    if (indice < 0) { chiudiModulo(false); return; }   // il modulo non c'è più (eliminato)
    const scheda = schede[indice];
    const stato = statoDi(scheda);
    const nomePagina = scheda.link ? pagina(scheda.link) : null;
    const origine = nomePagina ? cloni.get(nomePagina) : null;
    const galleria = sezione.titolo.split(' // ')[0];
    const contenitore = $('modulo');
    contenitore.replaceChildren();

    // percorso: negozio › index.html › galleria › modulo
    const percorso = nodo('p', 'percorso');
    [nomeNegozio(id), 'index.html', galleria, scheda.titolo].forEach((parte, i) => {
      if (i) percorso.append(nodo('i', '', '›'));
      percorso.append(i === 3 ? nodo('b', '', parte) : document.createTextNode(parte));
    });
    contenitore.append(percorso);

    const griglia = nodo('div', 'modulo-griglia');
    const anteprima = nodo('div', 'modulo-anteprima');
    anteprima.dataset.tipo = sezione.tipo;
    // il widget come nella pagina index del negozio (la vetrina con gli stili veri), con sopra i quadratini di tema e aspetto
    anteprima.append(selettoriStile(), vetrinaModulo({ ...scheda, cartella: id }, sezione.tipo, indice + 1));
    const dettagli = nodo('div');
    const info = nodo('dl', 'info');
    const voce = (titolo, ...contenuto) => { info.append(nodo('dt', '', titolo)); const dd = nodo('dd'); dd.append(...contenuto); info.append(dd); return dd; };
    // lo stato è un menu a cascata: lo stato attuale con la freccina; il menu ha l'altro valore (ghost, con il pallino
    // viola del ghost di Controllo codice, o attivo) e sceglierlo mette il modulo in ghost o lo fa ricomparire
    voce('stato', menuStato(id, sezione, scheda, chiaveModulo, stato, !origine));
    if (scheda.link) {
      const apri = nodo('a', '', `${id}/${scheda.link} ↗`);
      apri.href = `${id}/${scheda.link}`;
      apri.target = '_blank';
      apri.rel = 'noopener';
      voce('pagina', apri);
    } else if (scheda.pdf) {
      const apri = nodo('a', '', `assets/${scheda.pdf} ↗`);
      apri.href = `assets/${scheda.pdf}`;
      apri.target = '_blank';
      apri.rel = 'noopener';
      voce('pdf', apri);
    }
    // In modalità modifica (lucchetto aperto) alcuni campi si cambiano, per tutti i moduli, sorgente e cloni: stato, tipo,
    // galleria, posizione, specifiche e temi speciali (accesi o spenti); scrivono la scheda nella dashboard, non la pagina
    // (un modulo sorgente: prima l'avviso; scriviModulo)
    const scriviCampi = (campi, fatto) => scriviModulo(id, scheda, !origine, testo => Associa.modificaScheda(testo, sezione.id, chiaveModulo, campi), fatto);
    if (modifica) voce('tipo', campoModifica(scheda.tipo || '', 30, 'es. CARTELLO', valore => scriviCampi({ tipo: valore }, `tipo di ${scheda.titolo}: ${valore || 'nessuno'}`)));
    else if (scheda.tipo) voce('tipo', scheda.tipo);
    // stile del widget (cartelli, promo e cartellini): normale o dorato come le Promo Stagionali. È del widget, non della
    // galleria (stile: 'dorata' nella scheda; normale: niente stile); con il lucchetto aperto si cambia con i due pulsanti
    if (ASSOCIABILI.includes(sezione.tipo)) voce('stile', campoStile(scheda, dorata => scriviCampi({ stile: dorata ? 'dorata' : null },
      `${scheda.titolo}: widget ${dorata ? 'dorato' : 'normale'} nella dashboard di ${nomeNegozio(id)}`)));
    if (modifica) voce('galleria', menuGalleria(id, sezione, scheda, chiaveModulo, !origine));
    else voce('galleria', `${sezione.titolo} (${sezione.tipo})`);
    // posizione nel carosello, con i comandi per spostarlo
    const posizione = voce('posizione', `${due(indice + 1)} di ${due(schede.length)}`);
    const comandi = nodo('span', 'sposta');
    [['◀', -1, 'Sposta a sinistra'], ['▶', 1, 'Sposta a destra']].forEach(([segno, passo, nome]) => {
      const pulsante = nodo('button', '', segno);
      pulsante.type = 'button';
      pulsante.setAttribute('aria-label', nome);
      pulsante.disabled = !modifica || indice + passo < 0 || indice + passo >= schede.length;
      if (!modifica) pulsante.title = 'apri il lucchetto (modalità modifica) per spostarlo';
      pulsante.addEventListener('click', () => muovi(id, sezione, chiaveModulo, passo));
      comandi.append(pulsante);
    });
    posizione.append(comandi);
    if (sospesi[id]?.[sezione.id]) {
      const registra = nodo('button', 'collegamento forte', 'registra l\'ordine');
      registra.type = 'button';
      registra.disabled = !SCRIVIBILE;
      registra.addEventListener('click', () => registraOrdine(id, sezione));
      posizione.append(' ', nodo('span', 'sospeso', 'ordine cambiato'), ' ', registra);
    }
    const derivataDa = nomePagina ? negozi[id].derivate.get(nomePagina) : null;
    // il tipo di modulo con la sua etichetta: SORGENTE in oro o CLONE in azzurro, come sui widget del diagramma
    const tipoModulo = nodo('span', 'tipo-modulo');
    tipoModulo.append(nodo('span', `tag-modulo ${origine ? 'clone' : 'sorgente'}`, origine ? 'clone' : 'sorgente'),
      origine ? 'si modifica tutto, si sposta, si cancella' : 'con il lucchetto aperto si cambiano stato, tipo, stile, galleria, posizione, specifiche, temi e miniature; il resto e la cancellazione solo dal codice');
    voce('modulo', tipoModulo);
    voce('origine', origine ? `clone di ${origine}` : derivataDa ? `scritto a codice, derivato da ${derivataDa}` : nomePagina ? 'pagina originale del negozio' : scheda.pdf ? 'stampa pronta (PDF)' : 'scheda della dashboard');
    if (modifica) voce('specifiche', campoSpecifiche(scheda.specifiche || [], valori => scriviCampi({ specifiche: valori }, `specifiche di ${scheda.titolo} salvate`)));
    else if (scheda.specifiche?.length) voce('specifiche', scheda.specifiche.join(' | '));
    // i temi speciali, per esteso: icona del pulsante e nome di ognuno; uno spento è attenuato. In modalità modifica ogni
    // tema si accende o si spegne con un clic (temiSpenti nella scheda: la dashboard apre la pagina con ?senza-temi=…)
    const temiModulo = temiDelModulo(id, scheda);
    if (temiModulo.length) {
      const elenco = nodo('span', 'temi-elenco');
      const spenti = scheda.temiSpenti || [];
      temiModulo.forEach(tema => {
        const voceTema = nodo(modifica ? 'button' : 'span', `tema-voce${tema.spento ? ' spento' : ''}`);
        const tondo = nodo('span', `w-tema t-${tema.id}`);
        if (tema.icona) { const img = nodo('img'); img.src = tema.icona; img.alt = ''; tondo.append(img); }
        voceTema.append(tondo, tema.nome, tema.spento ? nodo('span', 'tema-stato', 'spento') : '');
        if (modifica) {
          voceTema.type = 'button';
          voceTema.disabled = !SCRIVIBILE;
          voceTema.setAttribute('aria-pressed', String(!tema.spento));
          voceTema.title = tema.spento ? `riaccendi ${tema.nome}: il pulsante torna nella pagina` : `spegni ${tema.nome}: il pulsante non compare nella pagina`;
          voceTema.addEventListener('click', () => scriviCampi({ temiSpenti: tema.spento ? spenti.filter(t => t !== tema.id) : [...spenti, tema.id] },
            `${tema.nome} ${tema.spento ? 'riacceso' : 'spento'} in ${scheda.titolo}`));
        }
        elenco.append(voceTema);
      });
      voce('temi speciali', elenco);
    }
    // le miniature della scheda (1, 2 o 3 scatti): anteprime e misure; con il lucchetto aperto si cambiano
    if (scheda.link || scheda.miniature?.length) voce('miniature', campoMiniature(id, sezione, scheda, chiaveModulo, !origine));
    dettagli.append(info);

    // azioni: ghost, duplica, elimina
    const azioni = nodo('div', 'azioni-modulo');
    const azione = (titolo, testo, pulsante, pericolo = false) => {
      const blocco = nodo('div', `azione${pericolo ? ' pericolo' : ''}`);
      blocco.append(nodo('h4', '', titolo), nodo('p', '', testo), pulsante);
      azioni.append(blocco);
    };
    const comando = (testo, classe = '') => { const p = nodo('button', `comando ${classe}`.trim(), testo); p.type = 'button'; p.disabled = !SCRIVIBILE; return p; };

    const inGhost = stato === 'ghost';
    const ghost = comando(inGhost ? 'ghost · mostra' : 'ghost', 'ghost');
    ghost.addEventListener('click', () => scriviDashboard(id, testo => Associa.impostaFantasmaScheda(testo, sezione.id, chiaveModulo, !inGhost),
      `${scheda.titolo} ${inGhost ? 'di nuovo visibile' : 'in ghost'} nella dashboard di ${nomeNegozio(id)}`));
    azione('ghost', inGhost ? 'il modulo è nascosto nella dashboard (né widget né voce del menu); la pagina resta nella cartella. un clic per farlo ricomparire'
      : 'nasconde il modulo nella dashboard del negozio, né widget né voce del menu, senza cancellare la pagina: serve quando ci si lavora e i clienti non devono usarlo', ghost);

    const duplicabile = Boolean(scheda.link) && !scheda.prossimamente;
    const duplica = comando('⧉ duplica');
    duplica.disabled = !SCRIVIBILE || !duplicabile;
    duplica.addEventListener('click', async () => {
      try { await collega(); } catch (errore) {
        esito(errore.name === 'AbortError' ? 'cartella non collegata: nessuna modifica' : `errore (${errore.name}): ${errore.message}`, errore.name === 'AbortError' ? 'nota' : 'err');
        return;
      }
      duplica.disabled = true;
      try {
        const copia = await Associa.duplica(progetto, { negozio: id, sezione: sezione.id, chiave: chiaveModulo, avviso: esito });
        await carica(id);
        esito(`creata la copia ${copia.pagina} in ${galleria}, subito dopo l'originale. ricorda il commit per pubblicarlo`, 'ok');
        apriModulo(id, sezione.id, copia.chiave);
        disegna();
      } catch (errore) {
        console.error(errore);
        esito(`errore (${errore.name}): ${errore.message}`, 'err');
        duplica.disabled = false;
      }
    });
    azione('duplica', duplicabile
      ? `copia la pagina in ${id}/${nomePagina.replace(/\.html$/, '-copia.html')} (un clone, che si può cancellare) e mette il modulo in ${galleria}, subito dopo l'originale, con il titolo «${scheda.titolo} (copia)»`
      : 'si duplicano solo i moduli con una pagina: non le stampe pronte (PDF) né i moduli in arrivo', duplica);

    // modifica: solo i cloni (titolo, MENU SPECIALE); gli altri campi nei dettagli, con il lucchetto aperto
    azioni.append(bloccoModifica(id, sezione, scheda, chiaveModulo, Boolean(origine), comando));

    // sorgente: un modulo clone diventa sorgente (la pagina dice da quale deriva, storecraft-derivata): da qui non si
    // cancella più, si cambia dal codice
    const sorgenteB = comando('rendi sorgente');
    sorgenteB.disabled = !SCRIVIBILE || !origine;
    sorgenteB.addEventListener('click', async () => {
      try { await collega(); } catch (errore) {
        esito(errore.name === 'AbortError' ? 'cartella non collegata: nessuna modifica' : `errore (${errore.name}): ${errore.message}`, errore.name === 'AbortError' ? 'nota' : 'err');
        return;
      }
      if (!window.confirm(`Rendere sorgente ${scheda.titolo}?\n\nLa pagina ${id}/${nomePagina} non è più un clone di ${origine}: diventa un modulo sorgente derivato da lui e da qui non si cancella più.`)) return;
      try {
        await Associa.rendiSorgenteModulo(progetto, { negozio: id, nome: nomePagina });
        await carica(id);
        esito(`${scheda.titolo} ora è un modulo sorgente (derivato da ${origine}). ricorda il commit per pubblicarlo`, 'ok');
        disegna(); disegnaModulo();
      } catch (errore) { console.error(errore); esito(`errore (${errore.name}): ${errore.message}`, 'err'); }
    });
    azione('sorgente', origine ? `il modulo è un clone di ${origine}: rendendolo sorgente la pagina perde il segno del clone e prende quello del modulo da cui deriva; da qui non si cancella più`
      : 'il modulo è già sorgente', sorgenteB);

    const elimina = comando('✕ elimina modulo', 'rosso');
    elimina.disabled = !SCRIVIBILE || !origine;
    elimina.addEventListener('click', async () => {
      try { await collega(); } catch (errore) {
        esito(errore.name === 'AbortError' ? 'cartella non collegata: nessuna modifica' : `errore (${errore.name}): ${errore.message}`, errore.name === 'AbortError' ? 'nota' : 'err');
        return;
      }
      if (!window.confirm(`Eliminare ${scheda.titolo} da ${nomeNegozio(id)}?\n\nLa sua scheda esce dalla dashboard e il clone ${id}/${nomePagina} viene cancellato, con le immagini copiate per lui che nessun'altra pagina usa.\nNon si può annullare (solo dal commit precedente).`)) return;
      // seconda conferma se il clone non resta in nessun altro negozio: sparisce anche dal catalogo
      try { await Promise.all(Negozi.installati.filter(n => !negozi[n]).map(carica)); } catch { /* si controlla con i negozi letti */ }
      if (Associa.ultimoClone(Negozi.installati.map(n => negozi[n]?.testo || ''), origine)
        && !window.confirm(`Ultima conferma: ${scheda.titolo} non è associato a nessun altro negozio.\n\nEliminandolo sparisce anche dal catalogo dei moduli. Eliminarlo definitivamente?`)) return;
      elimina.disabled = true;
      try {
        await Associa.eliminaClone(progetto, { negozio: id, nome: nomePagina, avviso: esito });
        await carica(id);
        esito(`eliminato ${scheda.titolo} (${id}/${nomePagina}). ricorda il commit per pubblicarlo`, 'ok');
        chiudiModulo(false);
        disegna();
      } catch (errore) {
        console.error(errore);
        esito(`errore (${errore.name}): ${errore.message}`, 'err');
        elimina.disabled = false;
      }
    });
    azione('elimina modulo', origine
      ? `il modulo è un clone di ${origine}: eliminandolo la scheda esce dalla dashboard e la pagina ${id}/${nomePagina} si cancella${schede.filter(s => s.link && pagina(s.link) === nomePagina).length > 1 ? ', con tutti i moduli della galleria che la aprono' : ''}`
      : 'si cancellano solo i cloni, mai i moduli originali del negozio: questo si può mettere in ghost', elimina, true);
    // le azioni dietro una pulsantiera: GHOST · DUPLICA · MODIFICA · ELIMINA; un clic apre la sezione del pulsante
    pulsantieraAzioni(azioni);
    dettagli.append(azioni);
    griglia.append(anteprima, dettagli);
    contenitore.append(griglia);
  }
  // Blocco «modifica» della scheda del modulo (il resto dei campi, per tutti i moduli, si cambia nei dettagli con il
  // lucchetto aperto: stato, tipo, galleria, posizione, specifiche, temi, miniature). Cloni: in più titolo e MENU SPECIALE
  // (scrive la scheda nella dashboard, Associa.modifica). Sorgente: solo la nota (il resto dal codice)
  // Sorgente: niente campi, solo la nota (si modifica dal codice)
  function bloccoModifica(id, sezione, scheda, chiaveModulo, clone, comando) {
    const blocco = nodo('div', `azione ${clone ? 'clone' : 'sorgente'}`);
    blocco.append(nodo('h4', '', 'modifica'));
    if (!clone) {
      blocco.append(nodo('p', '', 'modulo sorgente: con il lucchetto aperto si cambiano nei dettagli stato, tipo, stile, galleria, posizione, specifiche, temi speciali e miniature; titolo e pagina solo dal codice (assets/negozi/'
        + `${id}-dashboard.js e la sua pagina)`));
      return blocco;
    }
    blocco.append(nodo('p', '', 'modulo clone: oltre ai campi dei dettagli (lucchetto aperto, anche le miniature) cambia titolo e MENU SPECIALE del suo widget nella dashboard. la pagina si modifica dal codice'));
    const campi = nodo('div', 'campi-modifica');
    let n = 0;
    const riga = (etichetta, controllo) => {
      controllo.id = `modifica-${++n}`;
      const label = nodo('label', '', etichetta);
      label.htmlFor = controllo.id;
      campi.append(label, controllo);
      return controllo;
    };
    const testo = (valore, massimo) => { const c = nodo('input'); c.type = 'text'; c.value = valore || ''; c.maxLength = massimo; return c; };
    const titolo = riga('titolo', testo(scheda.titolo, 60));
    const speciale = nodo('input');
    speciale.type = 'checkbox';
    speciale.checked = Boolean(scheda.badge);
    riga('menu speciale', speciale);
    blocco.append(campi);
    const salva = comando('salva le modifiche', 'azzurro');
    salva.addEventListener('click', async () => {
      if (!titolo.value.trim()) { esito('il titolo non può essere vuoto', 'err'); titolo.focus(); return; }
      try { await collega(); } catch (errore) {
        esito(errore.name === 'AbortError' ? 'cartella non collegata: nessuna modifica' : `errore (${errore.name}): ${errore.message}`, errore.name === 'AbortError' ? 'nota' : 'err');
        return;
      }
      salva.disabled = true;
      try {
        await Associa.modifica(progetto, { negozio: id, sezione: sezione.id, chiave: chiaveModulo, avviso: esito,
          campi: {
            titolo: titolo.value.trim(),
            badge: speciale.checked ? (scheda.badge || 'MENU SPECIALE') : null
          } });
        await carica(id);
        esito(`${titolo.value.trim()} modificato nella dashboard di ${nomeNegozio(id)}. ricorda il commit per pubblicarlo`, 'ok');
        ridisegna();
      } catch (errore) {
        console.error(errore);
        esito(`errore (${errore.name}): ${errore.message}`, 'err');
        salva.disabled = false;
      }
    });
    blocco.append(salva);
    return blocco;
  }

  // ----- MODULI: il catalogo dei moduli -----
  // Le gallerie sono i pacchetti di Gestione pacchetti (assets/pacchetti/): i set di partenza di un negozio (sorgenti,
  // le schede lette dalla sua dashboard) e i moduli nuovi (gallerie create da Nuovo modulo e moduli aggiunti ai set),
  // anche quelli non ancora associati a nessun negozio. Per ogni modulo, i negozi la cui dashboard lo usa (sua scheda o
  // clone, Associa.usato). Utilità Cassa resta fuori: gli strumenti sono comuni a tutti i negozi.
  const ASSOCIABILI = ['cartelli', 'promo', 'cartellini'];
  // il catalogo usa i dati di tutti i negozi (dashboard, cloni, pagine derivate), riletti a ogni apertura
  const catalogo = { letto: false };
  async function caricaCatalogo() {
    await Promise.all(Negozi.installati.map(carica));
    catalogo.letto = true;
  }
  const testoDi = n => negozi[n]?.testo || '';
  const galleriaCatalogo = id => { try { return Pacchetti.pacchetto(id); } catch (errore) { console.error(errore); return null; } };
  const gallerieCatalogo = () => Pacchetti.elenco.map(galleriaCatalogo).filter(p => p && p.tipo !== 'cassa');
  const cartellaDi = (pacchetto, modulo) => modulo.cartella || pacchetto.cartella;
  const nuovoModulo = (pacchetto, modulo) => !pacchetto.negozio || Boolean(modulo.aggiunto);
  // i negozi che usano il modulo (la sua scheda nella dashboard, o un suo clone)
  function negoziDel(pacchetto, modulo) {
    if (!modulo.link) return [];
    const cartella = cartellaDi(pacchetto, modulo);
    // con il link intero: le etichette (etichette.html?label=…) contano una per una
    return Negozi.installati.filter(n => testoDi(n) && Associa.usato(testoDi(n), n, cartella, modulo.link));
  }
  const statoCatalogo = (pacchetto, modulo) => (negoziDel(pacchetto, modulo).length ? 'attivo' : 'libero');
  const sigla = n => Negozi.scheda(n)?.sigla || n.toUpperCase();

  function widgetCatalogo(pacchetto, modulo, indice, numero, grande = false) {
    const usatoIn = negoziDel(pacchetto, modulo);
    const stato = usatoIn.length ? 'attivo' : 'libero';
    // i moduli dei set di partenza sono sorgente; i moduli nuovi (creati dalle utilità) sono cloni
    const nuovo = nuovoModulo(pacchetto, modulo);
    const elemento = nodo('div', `widget in-attivo ${nuovo ? 'clone' : 'sorgente'}${dorato(modulo) ? ' dorata' : ''}`);
    if (!grande) {
      premibile(elemento);
      elemento.dataset.chiave = `${pacchetto.id}:${indice}`;
      elemento.setAttribute('aria-label', `${modulo.titolo}, ${usatoIn.length ? `usato in ${usatoIn.map(nomeNegozio).join(', ')}` : 'non associato a nessun negozio'}. Apri la scheda del modulo`);
    }
    const testa = nodo('span', 'w-testa');
    const spia = nodo('span', `spia${stato === 'attivo' ? '' : ' libero'}`);
    spia.title = usatoIn.length ? `usato in ${usatoIn.map(nomeNegozio).join(', ')}` : 'non associato: non è in nessuna dashboard';
    testa.append(nodo('span', 'w-num', due(numero)), spia);
    const anteprima = nodo('span', 'w-anteprima');
    const miniatura = (modulo.miniature || [])[0];
    if (miniatura) {
      const immagine = nodo('img');
      immagine.src = `assets/${miniatura}`;
      immagine.alt = '';
      immagine.loading = 'lazy';
      immagine.draggable = false;
      anteprima.append(immagine);
    } else anteprima.append(nodo('span', 'w-icona', modulo.prossimamente ? 'coming soon' : modulo.pdf ? 'pdf' : '—'));
    // temi speciali, dalla pagina del modulo nella cartella del suo negozio
    const cartellaModulo = cartellaDi(pacchetto, modulo);
    if (modulo.badge) anteprima.append(nodo('span', 'w-badge', modulo.badge));   // MENU SPECIALE, come nella dashboard
    const temi = modulo.link ? iconeTemi(temiSpeciali(negozi[cartellaModulo]?.testi.get(pagina(modulo.link)), cartellaModulo)) : null;
    if (temi) anteprima.append(temi);
    elemento.append(testa, anteprima, nodo('span', 'w-titolo', modulo.titolo),
      nodo('span', `w-negozi${usatoIn.length ? '' : ' libero'}`, usatoIn.length ? usatoIn.map(sigla).join(' · ') : 'non associato'));
    specificheWidget(elemento, modulo.specifiche);
    const etichetta = nodo('span', 'w-tipo', nuovo ? 'clone · nuovo' : 'sorgente');
    etichetta.title = nuovo ? 'modulo nuovo, creato con Nuovo modulo: un clone (si modifica e si cancella)'
      : 'modulo sorgente: si mette in ghost e si sposta; si modifica e si cancella solo dal codice';
    elemento.append(etichetta);
    return elemento;
  }

  // una galleria del catalogo: il nodo con il titolo e i suoi moduli in un piccolo carosello
  function ramoCatalogo(pacchetto, voci, titolo, chiaveRamo, scorrimento, ritardo) {
    const elemento = nodo('li', 'ramo');
    elemento.dataset.tipo = pacchetto?.tipo || '';
    elemento.dataset.sezione = `catalogo-${chiaveRamo}`;
    elemento.dataset.stato = `${MODULI}:${chiaveRamo}`;
    elemento.style.setProperty('--d', `${ritardo}ms`);
    const galleria = nodo('div', 'nodo nodo-galleria');
    galleria.append(nodo('span', 'galleria-nome', titolo),
      nodo('span', 'nodo-sotto', `${voci.length} ${voci.length === 1 ? 'modulo' : 'moduli'}${pacchetto ? ` · ${pacchetto.tipo}` : ''}`));
    if (pacchetto) galleria.title = pacchetto.nome;
    const carosello = nodo('div', 'carosello');
    const nastro = nodo('div', 'nastro');
    nastro.setAttribute('role', 'list');
    nastro.setAttribute('aria-label', `Moduli di ${titolo}`);
    voci.forEach(({ pacchetto: p, modulo, indice }, i) => {
      const w = widgetCatalogo(p, modulo, indice, i + 1);
      w.style.setProperty('--d', `${ritardo + 140 + Math.min(i, 6) * 45}ms`);
      w.addEventListener('click', () => apriModulo(MODULI, elemento.dataset.sezione, `${p.id}:${indice}`));
      nastro.append(w);
    });
    if (!voci.length) nastro.append(nodo('span', 'vuota', 'nessun modulo'));
    frecce(carosello, nastro, scorrimento);
    const filo = nodo('span', 'filo corto');
    filo.style.setProperty('--d', `${ritardo + 100}ms`);
    const riassunto = chiudibile(elemento, galleria, elemento.dataset.stato, titolo, voci.map(v => statoCatalogo(v.pacchetto, v.modulo)));
    elemento.append(galleria, filo, carosello, riassunto);
    return elemento;
  }

  // una galleria di moduli che stanno nella dashboard di un negozio (sorgenti derivati di OPHILYA, cloni): gli stessi
  // widget del diagramma del negozio (un clic apre la sua scheda, con ghost, modifica, elimina), con sotto il titolo da
  // dove vengono
  function ramoNegozioCatalogo(n, sezione, schede, titolo, chiaveRamo, scorrimento, ritardo) {
    const elemento = nodo('li', 'ramo');
    elemento.dataset.tipo = sezione.tipo;
    elemento.dataset.sezione = `catalogo-${chiaveRamo}`;
    elemento.dataset.stato = `${MODULI}:${chiaveRamo}`;
    elemento.style.setProperty('--d', `${ritardo}ms`);
    const galleria = nodo('div', 'nodo nodo-galleria');
    galleria.append(nodo('span', 'galleria-nome', titolo),
      nodo('span', 'nodo-sotto', `${schede.length} ${schede.length === 1 ? 'modulo' : 'moduli'} · ${sezione.tipo}`));
    const carosello = nodo('div', 'carosello');
    const nastro = nodo('div', 'nastro');
    nastro.setAttribute('role', 'list');
    nastro.setAttribute('aria-label', `Moduli di ${titolo}`);
    schede.forEach((scheda, i) => {
      const w = widget(n, sezione, scheda, i + 1);
      w.draggable = false;
      w.style.setProperty('--d', `${ritardo + 140 + Math.min(i, 6) * 45}ms`);
      const nome = pagina(scheda.link);
      const da = negozi[n].cloni.get(nome) || negozi[n].derivate.get(nome);
      const sotto = nodo('span', 'w-negozi', da ? `${sigla(n)} · da ${da.replace(/\.html$/, '')}` : sigla(n));
      sotto.title = da ? `${nomeNegozio(n)}: ${negozi[n].cloni.has(nome) ? 'clone' : 'derivato'} di ${da}` : nomeNegozio(n);
      (w.querySelector('.w-riga') || w.querySelector('.w-titolo')).after(sotto);
      nastro.append(w);
    });
    frecce(carosello, nastro, scorrimento);
    const filo = nodo('span', 'filo corto');
    filo.style.setProperty('--d', `${ritardo + 100}ms`);
    const riassunto = chiudibile(elemento, galleria, elemento.dataset.stato, titolo, schede.map(statoDi));
    elemento.append(galleria, filo, carosello, riassunto);
    return elemento;
  }
  // i moduli con una pagina di un negozio, galleria per galleria: { sezione, schede } (per scelta: sorgenti o cloni)
  const TIPI_CATALOGO = ['cartelli', 'promo', 'cartellini', 'etichette'];
  function moduliDelNegozio(n, scegli) {
    return negozi[n].dati.sezioni.filter(s => TIPI_CATALOGO.includes(s.tipo))
      .map(sezione => ({ sezione, schede: sezione.schede.filter(s => s.link && !s.prossimamente && scegli(pagina(s.link), s)) }))
      .filter(g => g.schede.length);
  }

  // ----- Colonna a croce del catalogo: le aree (moduli sorgente di ogni negozio, cloni) come index e le regole comuni
  // nel diagramma di un negozio. Al centro l'area scelta, grande, con la sua maniglia (chiude e riapre le sue gallerie);
  // le altre piccole sopra e sotto, appese al filo verticale: un clic, o la rotella con il mouse sopra la colonna, la
  // porta al centro -----
  let areaCatalogo = null;   // chiave dell'area al centro (null: la prima)
  let areeCatalogo = [];     // chiavi delle aree, nell'ordine della colonna
  function scegliArea(chiave, veloce = false) {
    cambiaSviluppo(() => { areaCatalogo = chiave; chiusi.delete(`${MODULI}:area:${chiave}`); }, veloce);
  }
  function colonnaCatalogo(elencoAree, scelta, aperta, chiaveArea) {
    const qui = elencoAree.indexOf(scelta);
    const colonna = nodo('div', 'colonna-index colonna-catalogo');
    colonna.title = 'rotella del mouse: passa da un\'area all\'altra';
    const centro = nodo('div', 'indice-nodo');
    centro.dataset.voce = scelta.chiave;
    const grande = nodo('div', `nodo nodo-area${scelta.logo ? ' con-logo' : ''}`);
    if (scelta.logo) { const immagine = nodo('img', 'area-logo'); immagine.src = scelta.logo; immagine.alt = ''; grande.append(immagine); }
    grande.append(nodo('span', 'area-nome', scelta.nome), nodo('span', 'nodo-sotto', scelta.sotto));
    if (scelta.classe) centro.classList.add(scelta.classe);
    const maniglia = nodo('button', 'maniglia');
    maniglia.type = 'button';
    maniglia.dataset.nome = `le gallerie dell'area ${scelta.chiave === 'cloni' ? 'Cloni' : `moduli sorgente di ${nomeNegozio(scelta.negozio)}`}`;
    aggiornaManiglia(maniglia, aperta);
    maniglia.addEventListener('click', () => {
      if (colonnaInCambio) return;
      aggiornaManiglia(maniglia, !aperta);
      if (manigliaCliccata) manigliaCliccata.aperta = !aperta;
      cambiaSviluppo(() => { if (aperta) chiusi.add(chiaveArea); else chiusi.delete(chiaveArea); });
    });
    centro.append(grande, maniglia);
    const piccola = area => {
      const pulsante = nodo('button', `nodo-regola nodo-area-piccola${area.classe ? ` ${area.classe}` : ''}`);
      pulsante.type = 'button';
      pulsante.dataset.voce = area.chiave;
      if (area.logo) { const immagine = nodo('img', 'area-logo'); immagine.src = area.logo; immagine.alt = ''; pulsante.append(immagine); }
      pulsante.append(nodo('span', '', area.logo ? area.nome : area.nome), nodo('small', '', area.sotto));
      pulsante.title = area.chiave === 'cloni' ? 'apri l\'area dei cloni' : `apri i moduli sorgente di ${nomeNegozio(area.negozio)}`;
      pulsante.setAttribute('aria-label', pulsante.title);
      pulsante.addEventListener('click', () => scegliArea(area.chiave));
      return pulsante;
    };
    const sopra = elencoAree.slice(0, qui), sotto = elencoAree.slice(qui + 1);
    if (sopra.length) {
      const elenco = nodo('div', 'voci voci-sopra');
      sopra.forEach(area => elenco.append(piccola(area), nodo('span', 'filo-v')));
      colonna.append(elenco);
    }
    colonna.append(centro);
    if (sotto.length) {
      const elenco = nodo('div', 'voci voci-sotto');
      sotto.forEach(area => elenco.append(nodo('span', 'filo-v'), piccola(area)));
      colonna.append(elenco);
    }
    return colonna;
  }

  function disegnaCatalogo() {
    const scorrimenti = {};
    document.querySelectorAll('.ramo').forEach(ramo => { scorrimenti[ramo.dataset.sezione] = ramo.querySelector('.nastro')?.scrollLeft || 0; });
    const diagramma = $('diagramma');
    diagramma.replaceChildren();
    const gallerie = gallerieCatalogo();
    const voci = pacchetto => pacchetto.moduli.map((modulo, indice) => ({ pacchetto, modulo, indice }));

    // il catalogo: logo STORE // CRAFT in oro, come il nodo del negozio
    const radice = nodo('div', 'nodo nodo-negozio nodo-catalogo');
    const logo = nodo('img');
    logo.src = 'assets/img/storecraftlogo.png';
    logo.alt = '';
    radice.append(logo, nodo('span', 'nodo-nome', 'Catalogo'), nodo('span', 'nodo-sotto', 'moduli'));

    // un'area per negozio con set di partenza (le sorgenti), poi gli altri negozi e l'area dei cloni. Dal 19 ottobre 2026
    // le aree non si aprono tutte insieme: stanno in una colonna a croce, come index e le regole comuni nel diagramma di
    // un negozio (al centro l'area scelta, con le sue gallerie a destra; le altre piccole sopra e sotto, con un clic o la
    // rotella del mouse sopra la colonna). Qui si raccolgono: { chiave, nome, sotto, logo, classe, rami(ritardo), stati }
    const elencoAree = [];
    const ritardo = 300;
    const negoziSorgente = [...new Set(gallerie.map(p => p.negozio).filter(Boolean))];
    // i moduli dei set di partenza (sorgente): non i moduli aggiunti né i cloni entrati nella dashboard (hanno origine)
    const sorgenteDelSet = v => !v.modulo.aggiunto && !v.modulo.origine;
    negoziSorgente.forEach(n => {
      const sue = gallerie.filter(p => p.negozio === n);
      const rami = r0 => sue.map((p, i) => ramoCatalogo(p, voci(p).filter(sorgenteDelSet), p.titolo || p.nome, p.id,
        scorrimenti[`catalogo-${p.id}`] || 0, r0 + i * 110));
      const tutte = sue.flatMap(p => voci(p).filter(sorgenteDelSet));
      // il negozio con il suo logo, piccolo e bianco, la scritta MODULI SORGENTE e sotto il numero dei moduli
      const scheda = Negozi.scheda(n) || {};
      const logo = scheda.logoMenu || scheda.logoSplash;
      elencoAree.push({ chiave: `sorgenti-${n}`, negozio: n, nome: logo ? 'Moduli sorgente' : `Sorgenti ${sigla(n)}`, sotto: `${tutte.length} moduli`,
        logo: logo ? `assets/${logo}` : null, rami, stati: tutte.map(v => statoCatalogo(v.pacchetto, v.modulo)) });
    });
    // gli altri negozi (es. OPHILYA): i loro moduli sorgente, scritti a codice partendo da un negozio sorgente
    // (storecraft-derivata), con il logo del negozio e MODULI SORGENTE · DA TEBE
    let sorgentiDerivati = 0;
    Negozi.installati.filter(n => negozi[n] && !negoziSorgente.includes(n)).forEach(n => {
      const gruppi = moduliDelNegozio(n, nome => !negozi[n].cloni.has(nome));
      if (!gruppi.length) return;
      const quanti = gruppi.reduce((t, g) => t + g.schede.length, 0);
      sorgentiDerivati += quanti;
      const da = [...new Set(gruppi.flatMap(g => g.schede).map(s => negozi[n].derivate.get(pagina(s.link))).filter(Boolean).map(d => d.split('/')[0]))];
      const rami = r0 => gruppi.map((g, i) => ramoNegozioCatalogo(n, g.sezione, g.schede, g.sezione.titolo.split(' // ')[0], `${n}-${g.sezione.id}`,
        scorrimenti[`catalogo-${n}-${g.sezione.id}`] || 0, r0 + i * 110));
      const scheda = Negozi.scheda(n) || {};
      const logo = scheda.logoMenu || scheda.logoSplash;
      elencoAree.push({ chiave: `sorgenti-${n}`, negozio: n, nome: logo ? 'Moduli sorgente' : `Sorgenti ${sigla(n)}`,
        sotto: `${quanti} moduli${da.length ? ` · da ${da.map(sigla).join(', ')}` : ''}`, logo: logo ? `assets/${logo}` : null, rami,
        stati: gruppi.flatMap(g => g.schede).map(statoDi) });
    });

    // CLONI: i moduli creati dalle utilità. Nei negozi (copie fatte con duplica o moduli associati a un altro negozio;
    // quelli che vengono da un modulo nuovo stanno con lui, qui sotto) e i moduli nuovi delle gallerie di Gestione
    // pacchetti, anche non associati a nessun negozio
    const ramiCloni = [];   // funzioni: ognuna fa un ramo, dal ritardo di partenza e dalla sua posizione
    let cloniNeiNegozi = 0;
    Negozi.installati.filter(n => negozi[n]).forEach(n => {
      moduliDelNegozio(n, nome => negozi[n].cloni.has(nome) && !negozi[n].cloni.get(nome).startsWith('moduli/')).forEach(g => {
        cloniNeiNegozi += g.schede.length;
        ramiCloni.push((r0, i) => ramoNegozioCatalogo(n, g.sezione, g.schede, `${sigla(n)} · ${g.sezione.titolo.split(' // ')[0]}`, `cloni-${n}-${g.sezione.id}`,
          scorrimenti[`catalogo-cloni-${n}-${g.sezione.id}`] || 0, r0 + i * 110));
      });
    });
    const nuovi = [];
    gallerie.forEach(p => {
      const sue = voci(p).filter(v => nuovoModulo(p, v.modulo));
      if (sue.length) nuovi.push({ p, sue, titolo: p.negozio ? `${p.titolo || p.nome} · aggiunti` : (p.titolo || p.nome) });
    });
    const tuttiNuovi = nuovi.flatMap(g => g.sue);
    nuovi.forEach(g => ramiCloni.push((r0, i) => ramoCatalogo(g.p, g.sue, g.titolo, `nuovi-${g.p.id}`, scorrimenti[`catalogo-nuovi-${g.p.id}`] || 0,
      r0 + i * 110)));
    if (!ramiCloni.length) ramiCloni.push(r0 => ramoCatalogo(null, [], 'In attesa', 'cloni', 0, r0));
    const liberi = tuttiNuovi.filter(v => statoCatalogo(v.pacchetto, v.modulo) === 'libero').length;
    const totaleCloni = cloniNeiNegozi + tuttiNuovi.length;
    elencoAree.push({ chiave: 'cloni', nome: 'Cloni', sotto: liberi ? `${totaleCloni} moduli · ${liberi} non associati` : `${totaleCloni} moduli`,
      classe: 'area-cloni', rami: r0 => ramiCloni.map((fai, i) => fai(r0, i)),
      stati: [...Array(cloniNeiNegozi).fill('attivo'), ...tuttiNuovi.map(v => statoCatalogo(v.pacchetto, v.modulo))] });

    // l'area al centro: quella scelta (di partenza la prima, il primo negozio)
    areeCatalogo = elencoAree.map(a => a.chiave);
    if (!areeCatalogo.includes(areaCatalogo)) areaCatalogo = areeCatalogo[0];
    const scelta = elencoAree.find(a => a.chiave === areaCatalogo);
    const chiaveArea = `${MODULI}:area:${scelta.chiave}`;
    const aperta = !chiusi.has(chiaveArea);
    const colonna = colonnaCatalogo(elencoAree, scelta, aperta, chiaveArea);
    // a destra le gallerie dell'area scelta (chiusa: un riassunto, che la riapre)
    const aree = nodo('ol', 'rami');
    aree.setAttribute('aria-label', `Gallerie di ${scelta.chiave === 'cloni' ? 'Cloni' : `${nomeNegozio(scelta.negozio)}, moduli sorgente`}`);
    if (aperta) aree.append(...scelta.rami(ritardo + 260));
    else {
      const riassunto = nodo('button', 'riassunto aperto-sempre');
      riassunto.type = 'button';
      riassunto.append(nodo('span', '', `${scelta.sotto} · espandi ›`));
      riassunto.addEventListener('click', () => cambiaSviluppo(() => chiusi.delete(chiaveArea)));
      const voce = nodo('li', 'ramo');
      voce.append(riassunto);
      aree.append(voce);
    }

    const fili = [nodo('span', 'filo'), nodo('span', `filo${aperta ? '' : ' fermo'}`)];
    radice.style.setProperty('--d', '0ms');
    fili[0].style.setProperty('--d', '160ms');
    fili[1].style.setProperty('--d', '400ms');
    const colonnaRadice = nodo('div', 'colonna-negozio');
    colonnaRadice.append(radice, selettoriStile());
    diagramma.append(colonnaRadice, fili[0], colonna, fili[1], aree);
    // le voci sopra e sotto escono dalla colonna: il diagramma tiene lo spazio, come nel diagramma del negozio
    const centro = colonna.querySelector('.indice-nodo');
    const altezza = classe => colonna.querySelector(classe)?.offsetHeight || 0;
    const spazio = Math.max(altezza('.voci-sopra'), altezza('.voci-sotto'));
    diagramma.style.minHeight = spazio && centro.offsetHeight ? `${Math.ceil((centro.offsetHeight / 2 + spazio + 14) * 2)}px` : '';

    // totali
    const sorgenti = gallerie.filter(p => p.negozio).flatMap(p => voci(p).filter(sorgenteDelSet)).length + sorgentiDerivati;
    totali = `Catalogo · ${sorgenti} sorgenti · ${totaleCloni} cloni · ${liberi} non associati`;
    if (!attesaEsito && $('stato').className !== 'lavora') mostraTotali();
  }

  // Scheda di un modulo del catalogo: il widget in grande, dove sta, e i negozi con le spunte (come in Gestione
  // pacchetti: spuntando il modulo entra nella dashboard del negozio, se serve come clone; togliendo la spunta a un
  // clone il clone si cancella)
  function disegnaModuloCatalogo() {
    const [idGalleria, n] = moduloAperto.chiave.split(':');
    const pacchetto = galleriaCatalogo(idGalleria);
    const indice = Number(n);
    const modulo = pacchetto?.moduli[indice];
    if (!modulo) { chiudiModulo(false); return; }
    const cartellaModulo = cartellaDi(pacchetto, modulo);
    const nuovo = nuovoModulo(pacchetto, modulo);
    const usatoIn = negoziDel(pacchetto, modulo);
    const contenitore = $('modulo');
    contenitore.replaceChildren();

    const percorso = nodo('p', 'percorso');
    ['Catalogo', nuovo ? 'Cloni' : `Sorgenti ${sigla(pacchetto.negozio)}`, pacchetto.titolo || pacchetto.nome, modulo.titolo].forEach((parte, i) => {
      if (i) percorso.append(nodo('i', '', '›'));
      percorso.append(i === 3 ? nodo('b', '', parte) : document.createTextNode(parte));
    });
    contenitore.append(percorso);

    const griglia = nodo('div', 'modulo-griglia');
    const anteprima = nodo('div', 'modulo-anteprima');
    anteprima.dataset.tipo = pacchetto.tipo;
    anteprima.append(widgetCatalogo(pacchetto, modulo, indice, indice + 1, true));
    const dettagli = nodo('div');
    const info = nodo('dl', 'info');
    const voce = (titolo, ...contenuto) => { info.append(nodo('dt', '', titolo)); const dd = nodo('dd'); dd.append(...contenuto); info.append(dd); return dd; };
    const statoTesto = nodo('span', 'stato');
    statoTesto.append(nodo('span', `spia${usatoIn.length ? '' : ' libero'}`),
      usatoIn.length ? `usato in ${usatoIn.map(nomeNegozio).join(', ')}` : 'non associato: non è in nessuna dashboard');
    voce('stato', statoTesto);
    if (modulo.link) {
      const apri = nodo('a', '', `${cartellaModulo}/${modulo.link} ↗`);
      apri.href = `${cartellaModulo}/${modulo.link}`;
      apri.target = '_blank';
      apri.rel = 'noopener';
      voce('pagina', apri);
    }
    if (modulo.tipo) voce('tipo', modulo.tipo);
    voce('galleria', `${pacchetto.nome} (${pacchetto.tipo})`);
    voce('origine', nuovo ? (cartellaModulo === 'moduli' ? 'nuovo modulo, in lavorazione nella cartella moduli/' : 'modulo aggiunto al set')
      : `sorgente: set di partenza di ${nomeNegozio(pacchetto.negozio)}`);
    if (modulo.specifiche?.length) voce('specifiche', modulo.specifiche.join(' · '));
    const temiModulo = modulo.link ? temiSpeciali(negozi[cartellaModulo]?.testi.get(pagina(modulo.link)), cartellaModulo) : [];
    if (temiModulo.length) {
      const elenco = nodo('span', 'temi-elenco');
      temiModulo.forEach(tema => {
        const voceTema = nodo('span', 'tema-voce');
        const tondo = nodo('span', `w-tema t-${tema.id}`);
        if (tema.icona) { const img = nodo('img'); img.src = tema.icona; img.alt = ''; tondo.append(img); }
        voceTema.append(tondo, tema.nome);
        elenco.append(voceTema);
      });
      voce('temi speciali', elenco);
    }
    dettagli.append(info);

    // i negozi, con le spunte
    const azioni = nodo('div', 'azioni-modulo');
    const blocco = nodo('div', 'azione');
    const associabile = ASSOCIABILI.includes(pacchetto.tipo) && Boolean(modulo.link) && !modulo.prossimamente;
    const spunte = nodo('div', 'spunte');
    Negozi.installati.forEach(negozio => {
      const usato = usatoIn.includes(negozio);
      // il negozio del set di partenza resta: il set legge le sue schede da quella dashboard (non per i moduli aggiunti)
      const partenza = negozio === pacchetto.negozio && !modulo.aggiunto;
      const riga = nodo('label');
      const spunta = nodo('input');
      spunta.type = 'checkbox';
      spunta.checked = usato;
      spunta.disabled = !associabile || partenza || !SCRIVIBILE;
      const nota = !associabile ? 'non associabile da qui'
        : partenza ? 'set di partenza: il modulo resta nella sua dashboard'
        : usato ? (negozio === cartellaModulo ? 'nella dashboard' : 'clone nella cartella del negozio: togliendo la spunta si cancella')
        : (negozio === cartellaModulo ? 'spuntando: scheda nella dashboard' : `spuntando: clone in ${negozio}/ e scheda nella dashboard`);
      riga.append(spunta, nodo('span', 'negozio-nome', nomeNegozio(negozio)), nodo('span', 'negozio-nota', nota));
      spunta.addEventListener('change', () => associaCatalogo(pacchetto, modulo, cartellaModulo, negozio, spunta));
      spunte.append(riga);
    });
    blocco.append(nodo('h4', '', 'negozi'),
      nodo('p', '', associabile ? 'spunta un negozio per mettere il modulo nella sua dashboard (scrive nella cartella del progetto collegata, poi commit)'
        : 'etichette DYMO e moduli senza pagina per ora non si associano da qui'), spunte);
    azioni.append(blocco);
    dettagli.append(azioni);
    griglia.append(anteprima, dettagli);
    contenitore.append(griglia);
  }

  async function associaCatalogo(pacchetto, modulo, cartellaModulo, negozio, spunta) {
    const voglio = spunta.checked;
    spunta.checked = !voglio;   // finché non è scritto
    try { await collega(); } catch (errore) {
      esito(errore.name === 'AbortError' ? 'cartella non collegata: nessuna modifica' : `errore (${errore.name}): ${errore.message}`, errore.name === 'AbortError' ? 'nota' : 'err');
      return;
    }
    if (!voglio && negozio !== cartellaModulo
      && !window.confirm(`Togliere ${modulo.titolo} da ${nomeNegozio(negozio)}?\n\nLa sua scheda esce dalla dashboard e il clone della pagina nella cartella ${negozio}/ viene cancellato, con le immagini copiate per lui.`)) return;
    // seconda conferma se il clone sparisce dal catalogo (nessun'altra copia in nessun negozio)
    if (!voglio && negozio !== cartellaModulo
      && Associa.ultimoClone(Negozi.installati.map(testoDi), `${cartellaModulo}/${pagina(modulo.link)}`)
      && !window.confirm(`Ultima conferma: il clone di ${modulo.titolo} in ${nomeNegozio(negozio)} non resta in nessun altro negozio.\n\nTogliendolo sparisce anche dal catalogo dei moduli. Eliminarlo definitivamente?`)) return;
    try {
      const dati = { modulo, tipo: pacchetto.tipo, cartella: cartellaModulo, negozio, avviso: esito };
      if (voglio) {
        // la galleria del negozio dove va il widget e, per un modulo import, il logo del .psd
        const scelte = await Associa.chiediAssociazione({ progetto, ...dati, nomeNegozio: nomeNegozio(negozio) });
        if (!scelte) { esito('annullato: nessuna modifica', 'nota'); return; }
        await Associa.associa(progetto, { ...dati, ...scelte });
      }
      else await Associa.togli(progetto, dati);
      await carica(negozio);   // il negozio si rilegge (anche il suo diagramma)
      esito(`${modulo.titolo} ${voglio ? 'aggiunto alla' : 'tolto dalla'} dashboard di ${nomeNegozio(negozio)}. ricorda il commit per pubblicarlo`, 'ok');
    } catch (errore) {
      if (errore.name === 'AbortError') esito('cartella non collegata: nessuna modifica', 'nota');
      else { console.error(errore); esito(`errore (${errore.name}): ${errore.message}`, 'err'); }
    }
    ridisegna();
  }

  // si parte dal negozio ricordato in questa scheda del browser (o dal primo); dopo + NUOVO NEGOZIO, dal negozio nuovo
  try {
    const nuovo = sessionStorage.getItem('storecraft_gestione_negozio');
    sessionStorage.removeItem('storecraft_gestione_negozio');
    if (nuovo && Negozi.installati.includes(nuovo)) negozioScelto = nuovo;
  } catch { /* sessionStorage spento */ }
  scegli(negozioScelto);
  window.addEventListener('load', () => scelta() && sposta(scelta()));
  window.addEventListener('resize', () => scelta() && sposta(scelta()));
</script>
</body>
