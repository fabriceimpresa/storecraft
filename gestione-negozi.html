  // sezione (o Alt + ← / →, o ◀ ▶ nella scheda del modulo); il nuovo ordine si registra dal nodo della galleria -----
  let modifica = false;
  // apre o chiude il lucchetto (di partenza chiuso: la pagina si ricarica a ogni apertura della sezione)
  function impostaModifica(aperto) {
    modifica = aperto;
    $('modifica').setAttribute('aria-pressed', String(modifica));
    $('modifica').title = modifica ? 'chiudi il lucchetto: i moduli restano fermi' : 'apri il lucchetto per spostare i moduli';
    $('modifica-testo').textContent = modifica ? 'modifica attiva' : 'modalità modifica';
    $('modifica-nota').hidden = !modifica;
    $('diagramma').classList.toggle('in-modifica', modifica);
    ridisegna();
  }
  // aprendo il lucchetto con la cartella non ancora collegata si apre subito la finestra per sceglierla (il clic sul
  // lucchetto vale per Chrome, che apre la finestra solo subito dopo un clic); chiusa senza scegliere, il lucchetto si
  // apre lo stesso, con l'avviso che le modifiche non si possono salvare
  $('modifica').addEventListener('click', async () => {
    if (modifica || progetto || !SCRIVIBILE) { impostaModifica(!modifica); return; }
    try {
      await collega();
      esito(`cartella del progetto collegata: ${progetto.name}`, 'ok');
      if (negozioScelto === MODULI) await caricaCatalogo(); else await carica(negozioScelto);
    } catch (errore) {
      if (errore.name === 'AbortError') esito('cartella non collegata: le modifiche non si possono salvare', 'nota');
      else { console.error(errore); esito(`errore (${errore.name}): ${errore.message}`, 'err'); }
    }
    impostaModifica(true);
  });
  $('modifica').title = 'apri il lucchetto per spostare i moduli';

  // testo di un file: dalla cartella collegata (dopo una modifica è già quello nuovo) o dal sito
  async function testoFile(percorso) {
    if (progetto) {
      let cartella = progetto;
      const parti = percorso.split('/');
      for (const parte of parti.slice(0, -1)) cartella = await cartella.getDirectoryHandle(parte);
      return (await Associa.istantanea(await cartella.getFileHandle(parti.at(-1)))).text();
    }
    const risposta = await fetch(percorso, { cache: 'no-store' });
    if (!risposta.ok) throw new Error(`${percorso}: ${risposta.status}`);
    return risposta.text();
  }
  async function scriviFile(percorso, contenuto) {
    let cartella = progetto;
    const parti = percorso.split('/');
    for (const parte of parti.slice(0, -1)) cartella = await cartella.getDirectoryHandle(parte);
    const scrittura = await (await cartella.getFileHandle(parti.at(-1))).createWritable();
    await scrittura.write(contenuto);
    await scrittura.close();
  }

  // ----- Dati dei negozi: la dashboard (testo e contenuto) e quali pagine sono cloni -----
  const negozi = {};      // id → { testo, dati, cloni: Map(pagina → origine) }
  const sospesi = {};     // id → { sezione → [chiavi] }: ordini cambiati e non ancora registrati
  async function carica(id) {
    const testo = await testoFile(`assets/negozi/${id}-dashboard.js`);
    let dati = null;
    // il file chiama Dashboard.contenuto({...}): qui lo si raccoglie, senza la dashboard
    new Function('Dashboard', testo)({ contenuto: contenuto => { dati = contenuto; } });
    if (!dati) throw new Error(`assets/negozi/${id}-dashboard.js non ha il contenuto della dashboard`);
    const pagine = [...new Set(dati.sezioni.flatMap(s => s.schede).filter(s => s.link).map(s => pagina(s.link)))];
    // cloni (storecraft-origine, creati dalle utilità) e pagine sorgente derivate da un'altra (storecraft-derivata)
    const cloni = new Map();
    const derivate = new Map();
    const testi = new Map();   // testo delle pagine: quali regole comuni usano
    await Promise.all(pagine.map(async nome => {
      try {
        const html = await testoFile(`${id}/${nome}`);
        testi.set(nome, html);
        const origine = Associa.clone(html);
        if (origine) cloni.set(nome, origine);
        else if (Associa.derivata(html)) derivate.set(nome, Associa.derivata(html));
      } catch { /* pagina mancante */ }
    }));
    // pagine di servizio che il negozio ha davvero
    const servizio = (await Promise.all(SERVIZIO.map(async voce => {
      try { await testoFile(`${id}/${voce.file}`); return voce; } catch { return null; }
    }))).filter(Boolean);
    negozi[id] = { testo, dati, cloni, derivate, testi, servizio, strumenti: await strumentiCassa() };
  }

  // Pagine di servizio dei negozi (non sono schede della dashboard: ci si arriva dal menu, dalla pulsantiera o dai widget)
  const SERVIZIO = [
    { file: 'lista-stampa.html', titolo: 'Lista di Stampa', segno: '⎙' },
    { file: 'cronologia-stampa.html', titolo: 'Cronologia', segno: '⟲' },
    { file: 'bacheca.html', titolo: 'Bacheca', segno: '✎' },
    { file: 'genera_loghi.html', titolo: 'Genera Loghi', segno: '✦' },
    { file: 'gestisci_lista.html', titolo: 'Loghi Personali', segno: '☰' },
    { file: 'pdf-viewer.html', titolo: 'Visualizzatore PDF', segno: 'PDF' }
  ];
  // Strumenti di cassa, letti da assets/js/cassa.js (id del widget e titolo), comuni a tutti i negozi
  const SEGNI_CASSA = { 'widget-sconto': '%', 'widget-aliquota': '÷', 'widget-valuta': '€ ⇄ $', 'widget-iva': 'IVA', 'widget-qrcode': 'QR', 'widget-bacheca': '✎' };
  let strumentiLetti = null;
  function strumentiCassa() {
    strumentiLetti = strumentiLetti || testoFile('assets/js/cassa.js').then(testo =>
      [...testo.matchAll(/id="(widget-[\w-]+)"[^>]*>[\s\S]*?<h3[^>]*>([^<]+)<\/h3>/g)].map(([, id, titolo]) => ({ id, titolo: titolo.trim(), segno: SEGNI_CASSA[id] || '◇' })))
      .catch(() => []);
    return strumentiLetti;
  }

  // le schede di una galleria nell'ordine scelto (ancora da registrare, scritto nella dashboard o di partenza)
  function ordinate(id, sezione, conSospesi = true) {
    const chiavi = (conSospesi && sospesi[id]?.[sezione.id]) || sezione.ordine;
    if (!Array.isArray(chiavi)) return sezione.schede.slice();
    const posto = (scheda, i) => { const n = chiavi.indexOf(chiave(scheda)); return n < 0 ? chiavi.length + i : n; };
    return sezione.schede.map((scheda, i) => [scheda, posto(scheda, i)]).sort((a, b) => a[1] - b[1]).map(([scheda]) => scheda);
  }
  const statoDi = scheda => (scheda.prossimamente ? 'arrivo' : scheda.nascosta ? 'ghost' : 'attivo');
  const STATI = { attivo: 'attivo: si vede nella dashboard', ghost: 'in ghost: nascosto nella dashboard, la pagina resta', arrivo: 'in arrivo (Coming Soon): scheda spenta' };

  // ----- Insegne dei negozi (e, dopo, MODULI: il catalogo dei moduli) -----
  const MODULI = 'moduli';
  let negozioScelto = Negozi.installati[0];
  // a ogni apertura si riparte dal primo negozio (la scelta non si ricorda tra un'apertura e l'altra)
  const insegne = document.querySelector('.insegne');
  const segnalino = insegne.querySelector('.segnalino');
  const sposta = tasto => { segnalino.style.left = `${tasto.offsetLeft}px`; segnalino.style.width = `${tasto.offsetWidth}px`; };
  const scelta = () => insegne.querySelector('[aria-selected="true"]');
  insegne.addEventListener('mouseleave', () => scelta() && sposta(scelta()));
  Negozi.installati.forEach(id => {
    const scheda = Negozi.scheda(id) || {};
    const tasto = nodo('button', 'insegna');
    tasto.type = 'button';
    tasto.setAttribute('role', 'tab');
    tasto.dataset.negozio = id;
    if (scheda.logoSplash) {
      const logo = nodo('img');
      logo.src = `assets/${scheda.logoSplash}`;
      logo.alt = scheda.nome || id;
      // la larghezza di partenza; con tanti negozi si rimpicciolisce (adattaInsegne)
      tasto.style.setProperty('--larghezza-insegna', `${Math.round((scheda.logoSplashLarghezza || 140) * .8)}px`);
      tasto.append(logo);
      // ancora con il logo di STORE // CRAFT (negozio nuovo senza logo suo): sotto il nome del negozio, come il catalogo
      if (scheda.logoSplash === 'img/storecraftlogo.png') {
        tasto.classList.add('insegna-predefinita');
        tasto.style.setProperty('--larghezza-insegna', '78px');
        logo.alt = '';
        tasto.setAttribute('aria-label', scheda.nome || id);
        tasto.append(nodo('span', '', scheda.nome || id));
      }
    } else tasto.textContent = scheda.nome || id;
    tasto.addEventListener('mouseenter', () => sposta(tasto));
    tasto.addEventListener('focus', () => sposta(tasto));
    tasto.addEventListener('click', () => scegli(id));
    insegne.insertBefore(tasto, segnalino);
  });
  // + NUOVO NEGOZIO: dopo le insegne dei negozi; apre il percorso a domande al posto del diagramma
  {
    const tasto = nodo('button', 'insegna-nuovo', '+ nuovo negozio');
    tasto.type = 'button';
    tasto.title = 'apri un nuovo negozio: tipo, nome, logo, aspetto e gallerie, con l\'anteprima dal vivo';
    tasto.addEventListener('click', apriNuovo);
    insegne.insertBefore(tasto, segnalino);
  }
  function apriNuovo() {
    chiudiModulo(false);
    $('diagramma').hidden = true;
    $('indietro-fondo').hidden = true;
    document.querySelector('.barra').hidden = true;
    insegne.hidden = true;
    const vista = $('vista-nuovo');
    vista.hidden = false;
    avvisaOperatore('diagramma dei negozi');
    NuovoNegozio.apri({
      contenitore: vista,
      collega,
      alChiudi: chiudiNuovo,
      // aperto il negozio: la pagina si rilegge (l'elenco dei negozi installati è cambiato) e mostra il suo diagramma
      alFatto: nuovo => {
        try { sessionStorage.setItem('storecraft_gestione_negozio', nuovo); } catch { /* si riparte dal primo */ }
        location.reload();
      }
    });
    window.scrollTo(0, 0);
  }
  function chiudiNuovo() {
    const vista = $('vista-nuovo');
    if (vista.hidden) return;
    vista.hidden = true;
    vista.replaceChildren();
    avvisaOperatore(null);
    $('diagramma').hidden = false;
    $('indietro-fondo').hidden = false;
    document.querySelector('.barra').hidden = false;
    insegne.hidden = false;
  }
  // Catalogo dei moduli: per primo, prima dei negozi, staccato da //
  {
    const divisore = nodo('span', 'divisore', '//');
    divisore.setAttribute('aria-hidden', 'true');
    const tasto = nodo('button', 'insegna insegna-moduli');
    const logo = nodo('img');
    logo.src = 'assets/img/storecraftlogo.png';
    logo.alt = '';
    logo.style.width = '96px';
    tasto.append(logo, nodo('span', '', 'CATALOGO'));
    tasto.setAttribute('aria-label', 'Catalogo dei moduli');
    tasto.type = 'button';
    tasto.setAttribute('role', 'tab');
    tasto.dataset.negozio = MODULI;
    tasto.title = 'catalogo dei moduli: le sorgenti di Luxury Outlet e TEBE e i moduli nuovi, anche non associati a un negozio';
    tasto.addEventListener('mouseenter', () => sposta(tasto));
    tasto.addEventListener('focus', () => sposta(tasto));
    tasto.addEventListener('click', () => scegli(MODULI));
    insegne.prepend(tasto, divisore);
  }
  // Con tanti negozi le insegne devono stare su una riga: se non entrano, i loghi dei negozi si rimpiccioliscono quanto
  // serve (non sotto la metà) e lo spazio tra loro si stringe
  function adattaInsegne() {
    insegne.style.setProperty('--scala-insegne', '1');
    insegne.style.gap = '';
    const disponibile = insegne.clientWidth;
    const usato = () => [...insegne.children].filter(e => !e.classList.contains('segnalino')).reduce((t, e) => t + e.offsetWidth, 0)
      + parseFloat(getComputedStyle(insegne).columnGap || 0) * (insegne.children.length - 2);
    if (usato() <= disponibile) return;
    insegne.style.gap = '20px';
    for (let scala = .95; scala >= .5 && usato() > disponibile; scala -= .05) insegne.style.setProperty('--scala-insegne', scala.toFixed(2));
    if (scelta()) sposta(scelta());
  }
  window.addEventListener('resize', adattaInsegne);
  window.addEventListener('load', adattaInsegne);
  insegne.addEventListener('keydown', evento => {
    const tasti = [...insegne.querySelectorAll('.insegna')];
    const ora = tasti.indexOf(document.activeElement);
    const passi = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
    let dove = null;
    if (evento.key in passi) dove = (ora + passi[evento.key] + tasti.length) % tasti.length;
    else if (evento.key === 'Home') dove = 0;
    else if (evento.key === 'End') dove = tasti.length - 1;
    if (dove === null || ora < 0) return;
    evento.preventDefault();
    tasti[dove].click();
    tasti[dove].focus();
  });
  async function scegli(id) {
    negozioScelto = id;
    insegne.querySelectorAll('.insegna').forEach(t => {
      const sì = t.dataset.negozio === id;
      t.setAttribute('aria-selected', String(sì));
      t.tabIndex = sì ? 0 : -1;
    });
    if (scelta()) sposta(scelta());
    // tema e aspetto dei widget: di partenza quelli del negozio (il catalogo: scuro e STANDARD)
    stileDiPartenza(id);
    chiudiModulo(false);
    // nel catalogo niente modalità modifica: i moduli si riordinano nei negozi
    document.querySelector('.modifica-riga').hidden = id === MODULI;
    $('diagramma').setAttribute('aria-label', id === MODULI ? 'Catalogo dei moduli' : 'Diagramma del negozio');
    if (id === MODULI) {
      if (!catalogo.letto) {
        $('stato').textContent = 'Lettura in corso…';
        try { await caricaCatalogo(); } catch (errore) {
          console.error(errore);
          $('stato').textContent = `catalogo dei moduli non letto (${errore.message})`;
          $('diagramma').replaceChildren();
          return;
        }
      }
    } else if (!negozi[id]) {
      $('stato').textContent = 'Lettura in corso…';
      try { await carica(id); } catch (errore) {
        console.error(errore);
        $('stato').textContent = `${nomeNegozio(id)}: dashboard non letta (${errore.message})`;
        $('diagramma').replaceChildren();
        return;
      }
    }
    if (id !== negozioScelto) return;
    // entrata animata: i nodi e i fili compaiono da sinistra a destra, ramo dopo ramo (solo cambiando negozio, non a
    // ogni ridisegno)
    const diagramma = $('diagramma');
    clearTimeout(entrata);
    diagramma.classList.remove('entra');
    void diagramma.offsetWidth;
    diagramma.classList.add('entra');
    disegna();
    entrata = setTimeout(() => diagramma.classList.remove('entra'), 1600);
  }
  let entrata = 0;

  // ----- Diagramma -----
  // foglio della dashboard, con l'angolo piegato e qualche riga
  const ICONA_PAGINA = '<svg viewBox="0 0 34 42" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M3 1.5h20l9 9v30H3z"/><path d="M23 1.5v9h9"/><path d="M8 18h18M8 23h18M8 28h12M8 33h15" stroke-opacity=".55"/></svg>';

  // modulo clone (pagina con storecraft-origine, creata dalle utilità) o sorgente (scritto a codice: le pagine di
  // partenza, comprese quelle derivate da un altro negozio, le stampe pronte e i moduli in arrivo)
  const eClone = (id, scheda) => Boolean(scheda.link && negozi[id].cloni.has(pagina(scheda.link)));
  // Temi speciali della pagina di un modulo: i pulsanti Made in Italy (modulo comune madeinitaly.js), Black Friday e
  // Natale (le icone dei pulsanti, tema_blackfriday_icon e tema_xmas_icon); per ognuno il nome e l'icona del pulsante
  // vero, letta dalla pagina (il negozio della pagina: Made in Italy ha la bandiera del suo negozio)
  function temiSpeciali(html, negozio) {
    if (!html) return [];
    const icona = nome => ((html.match(new RegExp(`(?:\\.\\./)?(assets/img/[^"')\\s]*${nome})`)) || [])[1]) || null;
    const temi = [];
    if (/madeinitaly\.js/.test(html)) temi.push({ id: 'italia', nome: 'Made in Italy', icona: `assets/img/${negozio}/madeinitaly.png` });
    if (/tema_blackfriday_icon/.test(html)) temi.push({ id: 'blackfriday', nome: 'Black Friday', icona: icona('tema_blackfriday_icon.png') });
    if (/tema_xmas_icon/.test(html)) temi.push({ id: 'natale', nome: 'Natale', icona: icona('tema_xmas_icon.png') });
    return temi;
  }
  // (con spento: i temi spenti per questo modulo in Gestione negozi, temiSpenti nella scheda)
  const temiDelModulo = (id, scheda) => (scheda.link ? temiSpeciali(negozi[id]?.testi.get(pagina(scheda.link)), id) : [])
    .map(tema => ({ ...tema, spento: Boolean(scheda.temiSpenti?.includes(tema.id)) }));
  // in sintesi sul widget: le icone dei pulsanti, piccole e tonde, in basso a destra sull'anteprima
  function iconeTemi(temi) {
    if (!temi.length) return null;
    const riga = nodo('span', 'w-temi');
    riga.title = `temi speciali: ${temi.map(t => `${t.nome}${t.spento ? ' (spento)' : ''}`).join(', ')}`;
    temi.forEach(tema => {
      const tondo = nodo('span', `w-tema t-${tema.id}${tema.spento ? ' spento' : ''}`);
      if (tema.icona) { const img = nodo('img'); img.src = tema.icona; img.alt = ''; img.loading = 'lazy'; img.draggable = false; tondo.append(img); }
      riga.append(tondo);
    });
    return riga;
  }
  function etichettaTipo(id, scheda) {
    const clone = eClone(id, scheda);
    const nome = scheda.link ? pagina(scheda.link) : null;
    const etichetta = nodo('span', 'w-tipo', clone ? 'clone' : 'sorgente');
    etichetta.title = clone ? `clone di ${negozi[id].cloni.get(nome)}: si modifica, si sposta, si cancella`
      : nome && negozi[id].derivate.has(nome) ? `modulo sorgente, derivato da ${negozi[id].derivate.get(nome)}: si mette in ghost e si sposta`
      : 'modulo sorgente: si mette in ghost e si sposta; si modifica e si cancella solo dal codice';
    return etichetta;
  }

  // Un widget si apre con un clic (la scheda del modulo): è un elemento premibile (non un pulsante, perché dentro ha il
  // + delle specifiche), raggiungibile con Tab e che si preme con Invio o spazio
  function premibile(elemento) {
    elemento.setAttribute('role', 'button');
    elemento.tabIndex = 0;
    elemento.addEventListener('keydown', evento => {
      if (evento.target !== elemento || !['Enter', ' '].includes(evento.key)) return;
      evento.preventDefault();
      elemento.click();
    });
  }
  // Il + delle specifiche, come nelle schede della dashboard: un clic su un widget qualsiasi apre le specifiche di tutti
  // (il + ruota in ×), un altro le richiude; funziona anche sul widget grande della scheda del modulo, per vedere come si
  // aprirà la descrizione una volta montato in un negozio
  function specificheWidget(elemento, specifiche) {
    if (!specifiche?.length) return;
    const elenco = nodo('span', 'w-spec');
    const dentro = nodo('span', 'w-spec-testo');
    specifiche.forEach((testo, i) => { if (i) dentro.append(nodo('i', '', '|')); dentro.append(nodo('span', '', testo)); });
    elenco.append(dentro);
    const piu = nodo('span', 'w-piu');
    piu.setAttribute('role', 'button');
    piu.tabIndex = 0;
    const aggiorna = () => {
      const aperte = document.body.classList.contains('specifiche-aperte');
      piu.setAttribute('aria-expanded', String(aperte));
      piu.setAttribute('aria-label', `${aperte ? 'Nascondi' : 'Mostra'} specifiche`);
      piu.title = `${aperte ? 'nascondi' : 'mostra'} specifiche`;
    };
    aggiorna();
    const premi = evento => {
      evento.stopPropagation();
      evento.preventDefault();
      document.body.classList.toggle('specifiche-aperte');
      document.querySelectorAll('.w-piu').forEach(p => p.dispatchEvent(new Event('aggiorna')));
    };
    piu.addEventListener('aggiorna', aggiorna);
    piu.addEventListener('click', premi);
    piu.addEventListener('keydown', evento => { if (['Enter', ' '].includes(evento.key)) premi(evento); });
    elemento.classList.add('con-specifiche');
    // il titolo e il + sulla stessa riga, sotto la descrizione che si apre
    const titolo = elemento.querySelector('.w-titolo');
    if (!titolo) return;
    const riga = nodo('span', 'w-riga');
    titolo.replaceWith(riga);
    riga.append(titolo, piu);
    riga.after(elenco);
  }

  // Tema e aspetto dei widget, come nelle dashboard: quattro quadratini sotto il riquadro del negozio (tema scuro e
  // chiaro, aspetto STANDARD e COMPATTO, la A); cambiano forma (tonda o squadrata), fondo e caratteri dei widget del
  // diagramma e della scheda del modulo. Di partenza l'aspetto iniziale del negozio (interfaccia della sua scheda)
  const stileWidget = { tema: 'dark', aspetto: 'standard' };
  function applicaStile() {
    document.body.dataset.widgetTema = stileWidget.tema;
    document.body.dataset.widgetAspetto = stileWidget.aspetto;
    document.querySelectorAll('.stile-widget button').forEach(pulsante => {
      pulsante.setAttribute('aria-pressed', String(stileWidget[pulsante.dataset.chiave] === pulsante.dataset.valore));
    });
    // il widget della scheda del modulo (la vetrina con gli stili veri della dashboard) cambia senza ricaricarsi
    document.querySelectorAll('.vetrina-modulo iframe').forEach(riquadro => riquadro.contentWindow?.impostaStile?.(stileWidget.tema, stileWidget.aspetto));
  }
  // Il widget nella scheda del modulo, esattamente come nella dashboard del negozio: la vetrina di Gestione pacchetti
  // (pacchetto-vetrina.html, con dashboard.css, theme.css e la struttura delle schede di dashboard.js) con il solo
  // modulo (window.anteprimaNuovoModulo, letto dalla vetrina), il suo numero nella galleria, nel tema e nell'aspetto scelti
  function vetrinaModulo(modulo, tipo, numero) {
    window.anteprimaNuovoModulo = { tipo, modulo };
    const cornice = nodo('div', 'vetrina-modulo');
    const riquadro = nodo('iframe');
    riquadro.title = `${modulo.titolo}: il widget come nella dashboard`;
    riquadro.src = `pacchetto-vetrina.html?anteprima=1&numero=${numero}&tema=${stileWidget.tema}&aspetto=${stileWidget.aspetto}`;
    // alto quanto la scheda, anche quando si aprono le specifiche
    const adatta = () => {
      const zona = riquadro.contentDocument?.querySelector('main');
      if (zona) riquadro.style.height = `${Math.ceil(zona.offsetHeight)}px`;
    };
    riquadro.addEventListener('load', () => {
      adatta();
      const zona = riquadro.contentDocument?.querySelector('main');
      if (zona) new ResizeObserver(adatta).observe(zona);
    });
    cornice.append(riquadro);
    return cornice;
  }
  function stileDiPartenza(id) {
    const interfaccia = Negozi.scheda(id)?.interfaccia || {};
    stileWidget.tema = interfaccia.tema === 'light' ? 'light' : 'dark';
    stileWidget.aspetto = interfaccia.aspetto === 'minimal' ? 'minimal' : 'standard';
    applicaStile();
  }
  function selettoriStile() {
    const barra = nodo('div', 'stile-widget');
    barra.setAttribute('aria-label', 'Aspetto dei widget');
    [['tema', 'dark', 'tema scuro'], ['tema', 'light', 'tema chiaro'], ['aspetto', 'standard', 'aspetto STANDARD'], ['aspetto', 'minimal', 'aspetto COMPATTO']]
      .forEach(([chiaveStile, valore, nome], i) => {
        if (i === 2) barra.append(nodo('span', 'stile-sep'));
        const pulsante = nodo('button', `stile-q q-${valore}`, chiaveStile === 'aspetto' ? 'A' : '');
        pulsante.type = 'button';
        pulsante.dataset.chiave = chiaveStile;
        pulsante.dataset.valore = valore;
        pulsante.title = `widget con il ${nome}`;
        pulsante.setAttribute('aria-label', `Widget con il ${nome}`);
        pulsante.setAttribute('aria-pressed', String(stileWidget[chiaveStile] === valore));
        pulsante.addEventListener('click', () => { stileWidget[chiaveStile] = valore; applicaStile(); });
        barra.append(pulsante);
      });
    return barra;
  }

  // widget dorato (come le Promo Stagionali): lo decide il modulo (stile: 'dorata'), non la galleria, come nella dashboard
  const dorato = scheda => scheda.stile === 'dorata';

  function widget(id, sezione, scheda, numero, grande = false) {
    const stato = statoDi(scheda);
    const elemento = nodo('div', `widget in-${stato} ${eClone(id, scheda) ? 'clone' : 'sorgente'}${dorato(scheda) ? ' dorata' : ''}`);
    if (!grande) {
      premibile(elemento);
      elemento.draggable = modifica;   // si trascinano solo con il lucchetto aperto (modalità modifica)
      elemento.dataset.chiave = chiave(scheda);
      elemento.setAttribute('aria-label', `${scheda.titolo}, ${due(numero)}, ${stato === 'attivo' ? 'attivo' : stato === 'ghost' ? 'in ghost' : 'in arrivo'}. Apri la scheda del modulo${modifica ? '; trascinalo, o Alt e frecce, per spostarlo' : ''}`);
      elemento.addEventListener('click', () => apriModulo(id, sezione.id, chiave(scheda)));
    }
    const testa = nodo('span', 'w-testa');
    const spia = nodo('span', `spia${stato === 'attivo' ? '' : ` ${stato}`}`);
    spia.title = STATI[stato];
    testa.append(nodo('span', 'w-num', due(numero)), spia);
    const anteprima = nodo('span', 'w-anteprima');
    const miniatura = (scheda.miniature || [])[0];
    if (miniatura) {
      const immagine = nodo('img');
      immagine.src = `assets/${miniatura}`;
      immagine.alt = '';
      immagine.loading = 'lazy';
      immagine.draggable = false;
      anteprima.append(immagine);
    } else anteprima.append(nodo('span', 'w-icona', scheda.prossimamente ? 'coming soon' : scheda.pdf ? 'pdf' : '—'));
    if (scheda.badge) anteprima.append(nodo('span', 'w-badge', scheda.badge));   // MENU SPECIALE, come nella dashboard
    const temi = iconeTemi(temiDelModulo(id, scheda));
    if (temi) anteprima.append(temi);
    elemento.append(testa, anteprima, nodo('span', 'w-titolo', scheda.titolo), etichettaTipo(id, scheda));
    specificheWidget(elemento, scheda.specifiche);
    return elemento;
  }

  // ----- Regole comuni centralizzate, sotto index.html: i file comuni (assets/css, assets/js) che le pagine del negozio
  // usano, in gruppi. Ogni gruppo ha il suo diagramma: un ramo per file, con i moduli del negozio che lo usano -----
  const REGOLE = [
    { id: 'pannello', nome: 'Pannello', file: ['assets/css/pannello.css', 'assets/js/menu-cascata.js', 'assets/js/campi-prezzo.js', 'assets/js/testi-pronti.js', 'assets/js/fasce-prezzo.js'] },
    { id: 'selettori', nome: 'Selettori', file: ['assets/js/selettore.js', 'assets/js/selettore-cartello.js', 'assets/js/selettore-modalita-prezzo.js', 'assets/js/selettore-numero-articoli.js', 'assets/js/second-brand-toggle.js', 'assets/js/copia-cartello.js'] },
    { id: 'loghi', nome: 'Loghi', file: ['assets/js/logos.js', 'assets/js/loghi-personalizzati.js', 'assets/js/menu-brand-cartellini.js', 'assets/js/print-logo-colors.js', 'assets/js/print-white-logos.js'] },
    { id: 'stampa', nome: 'Stampa', file: ['assets/js/strumenti-stampa.js', 'assets/js/stampa-ios.js', 'assets/js/cursore.js', 'assets/js/dymo-direct.js'] },
    { id: 'aspetto', nome: 'Aspetto', file: ['assets/js/theme.js', 'assets/js/responsive.js', 'assets/js/madeinitaly.js', 'assets/css/chiudi-pagina.css', 'assets/css/torna-al-menu.css', 'assets/css/font-arial.css'] }
  ];
  const regoleAperte = {};   // negozio → id della regola aperta (null: lo sviluppo di index)
  // i gruppi usati dal negozio: per ogni file le pagine dei moduli che lo usano (solo i file usati)
  function regoleDelNegozio(id) {
    const { testi } = negozi[id];
    return REGOLE.map(gruppo => ({
      ...gruppo,
      usati: gruppo.file.map(file => ({ file, pagine: [...testi].filter(([, html]) => html.includes(file)).map(([nome]) => nome) }))
        .filter(voce => voce.pagine.length)
    })).filter(gruppo => gruppo.usati.length);
  }
  // ----- Colonna di index come un menu a croce: la voce scelta (index.html o una regola comune) sta al centro, sulla
  // linea del diagramma, grande come index, con la sua maniglia e il suo sviluppo a destra; le altre voci, piccole,
  // stanno sopra e sotto, appese al filo verticale. Scegliendo un'altra voce la colonna scorre: index sale, la regola
  // scelta prende il suo posto e le sue dimensioni, con la maniglia aperta e il suo ramo che si srotola -----
  const sviluppo = () => $('diagramma').querySelector(':scope > .rami');
  const chiaveSviluppo = (id, voce) => (voce ? `${id}:sviluppo-regola:${voce}` : `${id}:index`);
  const posizioniColonna = () => new Map([...document.querySelectorAll('.colonna-index [data-voce]')]
    .map(elemento => [elemento.dataset.voce, elemento.getBoundingClientRect()]));
  // ogni voce scivola dalla posizione (e dalla grandezza) di prima alla nuova
  function scorriColonna(prima, veloce = false) {
    if (riduciAnimazioni()) return;
    document.querySelectorAll('.colonna-index [data-voce]').forEach(elemento => {
      const da = prima.get(elemento.dataset.voce);
      const a = elemento.getBoundingClientRect();
      if (!da || !a.width || !a.height) return;
      const dx = da.left - a.left, dy = da.top - a.top, sx = da.width / a.width, sy = da.height / a.height;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(sx - 1) < .01 && Math.abs(sy - 1) < .01) return;
      elemento.animate([
        { transformOrigin: 'top left', transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})` },
        { transformOrigin: 'top left', transform: 'none' }
      ], { duration: veloce ? 200 : 420, easing: 'cubic-bezier(.2, .8, .2, 1)' });
    });
  }
  // lo sviluppo a destra si riavvolge, la colonna cambia (e scorre), il nuovo sviluppo si srotola; veloce (con la rotella)
  // tutto in circa un terzo del tempo, perché si passa da una voce all'altra di seguito; con un clic l'animazione piena
  // (mentre cambia, la rotella aspetta: due scatti ravvicinati non leggono la voce di prima)
  let colonnaInCambio = false;
  async function cambiaSviluppo(cambia, veloce = false) {
    colonnaInCambio = true;
    try {
      await riavvolgi(sviluppo(), veloce);
      const prima = posizioniColonna();
      cambia();
      disegna();
      scorriColonna(prima, veloce);
      ritrovaManiglia();
      srotola(sviluppo(), veloce);
    } finally {
      colonnaInCambio = false;
    }
  }
  // sceglie una voce della colonna (null: index), che va al centro con il suo sviluppo aperto
  function scegliVoce(id, voce, veloce = false) {
    cambiaSviluppo(() => { regoleAperte[id] = voce; chiusi.delete(chiaveSviluppo(id, voce)); }, veloce);
  }
  // Rotella del mouse sulla colonna di index: solo con il mouse sopra la colonna (index e regole) la rotella non scorre la
  // pagina ma passa da una voce all'altra (giù: la voce sotto, su: quella sopra), una voce per scatto, con l'animazione
  // veloce; appena il mouse esce dalla colonna la rotella torna subito a scorrere la pagina, e anche oltre la prima e
  // l'ultima voce
  let rotellaFerma = 0;
  window.addEventListener('wheel', evento => {
    if (!$('vista-modulo').hidden || !evento.target.closest?.('.colonna-index')) return;
    const verso = Math.sign(evento.deltaY);
    if (!verso) return;
    // nel catalogo: da un'area all'altra
    if (negozioScelto === MODULI) {
      const dove = areeCatalogo.indexOf(areaCatalogo ?? areeCatalogo[0]) + verso;
      if (dove < 0 || dove >= areeCatalogo.length) return;
      evento.preventDefault();
      if (colonnaInCambio || Date.now() < rotellaFerma) return;
      rotellaFerma = Date.now() + 260;
      scegliArea(areeCatalogo[dove], true);
      return;
    }
    if (!negozi[negozioScelto]) return;
    const id = negozioScelto;
    const voci = [null, ...regoleDelNegozio(id).map(gruppo => gruppo.id)];
    const dove = voci.indexOf(regoleAperte[id] ?? null) + verso;
    if (dove < 0 || dove >= voci.length) return;   // oltre la prima o l'ultima voce scorre la pagina
    evento.preventDefault();
    if (colonnaInCambio || Date.now() < rotellaFerma) return;   // uno scatto alla volta, finché la colonna scorre
    rotellaFerma = Date.now() + 260;
    scegliVoce(id, voci[dove], true);
  }, { passive: false });
  // la maniglia della voce al centro: chiude o riapre il suo sviluppo
  function alternaSviluppo(id, voce, aperto) {
    cambiaSviluppo(() => {
      if (aperto) chiusi.add(chiaveSviluppo(id, voce)); else chiusi.delete(chiaveSviluppo(id, voce));
    });
  }
  // icona di una regola comune: tre fogli sovrapposti (un file condiviso da più pagine)
  const ICONA_REGOLA = '<svg viewBox="0 0 34 42" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M9 9h18v28H9z"/><path d="M5.5 5.5h18" stroke-opacity=".55"/><path d="M5.5 5.5v28" stroke-opacity=".55"/><path d="M2 2h18M2 2v28" stroke-opacity=".3"/><path d="M13 17h10M13 22h10M13 27h7" stroke-opacity=".55"/></svg>';
  function colonnaIndex(id, dashboard, gruppi, attiva, aperto) {
    const voci = [null, ...gruppi.map(gruppo => gruppo.id)];
    const qui = voci.indexOf(attiva ? attiva.id : null);
    const colonna = nodo('div', 'colonna-index');
    colonna.title = 'rotella del mouse: passa da index alle regole comuni';
    // la voce al centro: index (la dashboard) o la regola scelta, grande come index, con la maniglia
    const centro = nodo('div', 'indice-nodo');
    centro.dataset.voce = attiva ? attiva.id : 'index';

    if (attiva) {

      grande.append(nodo('span', 'nodo-file', attiva.nome), nodo('span', 'nodo-sotto', `${attiva.usati.length} file`));

    const maniglia = nodo('button', 'maniglia');

    aggiornaManiglia(maniglia, aperto);
    maniglia.addEventListener('click', () => {
      if (colonnaInCambio) return;   // un clic alla volta: il cambio di prima non è ancora finito
      // la stanghetta gira subito, mentre il ramo si riavvolge; ridisegnata, la maniglia nuova è già nella posizione giusta
      aggiornaManiglia(maniglia, !aperto);
      if (manigliaCliccata) manigliaCliccata.aperta = !aperto;
      alternaSviluppo(id, attiva ? attiva.id : null, aperto);
    });
    centro.append(grande, maniglia);
    // le altre voci, piccole: un clic le porta al centro
    const titolo = () => nodo('span', 'regole-titolo', 'regole comuni');
    const piccola = voce => {
      const gruppo = gruppi.find(g => g.id === voce);
      const pulsante = nodo('button', `nodo-regola${voce ? '' : ' voce-index'}`);
      pulsante.type = 'button';

        pulsante.append(nodo('span', '', gruppo.nome), nodo('small', '', `${gruppo.usati.length} file`));
        pulsante.title = `regola comune ${gruppo.nome}: ${gruppo.usati.map(v => v.file.split('/').pop()).join(', ')}`;
      } else {
        pulsante.append(nodo('span', '', 'index.html'), nodo('small', '', 'dashboard'));
        pulsante.title = 'torna a index: creator, cassiere, servizio';
      }
      pulsante.addEventListener('click', () => scegliVoce(id, voce));
      return pulsante;
    };
    const sopra = voci.slice(0, qui), sotto = voci.slice(qui + 1);
    if (sopra.length) {
      const elenco = nodo('div', 'voci voci-sopra');
      sopra.forEach(voce => {
        if (voce && voce === voci[1]) elenco.append(titolo());
        elenco.append(piccola(voce), nodo('span', 'filo-v'));
      });
      colonna.append(elenco);
    }
    colonna.append(centro);
    if (sotto.length) {
      const elenco = nodo('div', 'voci voci-sotto');
      sotto.forEach(voce => {
        elenco.append(nodo('span', 'filo-v'));
        if (voce === voci[1]) elenco.append(titolo());
        elenco.append(piccola(voce));
      });
      colonna.append(elenco);
    }
    return colonna;
  }
  // il diagramma di una regola: il nodo del gruppo e un ramo per file, con i moduli del negozio che lo usano
  function ramoRegola(id, gruppo, scorrimenti, ritardo) {
    const { dati } = negozi[id];

      // per ogni pagina il primo modulo che la apre (le etichette hanno un modulo per layout, una sola pagina)
      const moduli = pagine.map(nome => {
        for (const sezione of dati.sezioni) {
          const scheda = sezione.schede.find(s => s.link && pagina(s.link) === nome);
          if (scheda) return { sezione, scheda };

      const elemento = nodo('li', 'ramo');
      elemento.dataset.sezione = `regola-${gruppo.id}-${i}`;

      testa.append(nodo('span', 'file-regola', file.split('/').pop()), nodo('span', 'nodo-sotto', `${moduli.length} ${moduli.length === 1 ? 'modulo' : 'moduli'}`));
      testa.title = file;

      const nastro = nodo('div', 'nastro');
      nastro.setAttribute('role', 'list');
      nastro.setAttribute('aria-label', `Moduli che usano ${file}`);

        const w = widget(id, sezione, scheda, n + 1);

        w.style.setProperty('--d', `${ritardo + 400 + i * 110 + Math.min(n, 6) * 45}ms`);
        nastro.append(w);

      const filo = nodo('span', 'filo corto');
      const riassunto = chiudibile(elemento, testa, elemento.dataset.stato, file.split('/').pop(), moduli.map(m => statoDi(m.scheda)));
      elemento.append(testa, filo, carosello, riassunto);

    });
    const area = ramoArea(id, `regola-${gruppo.id}`, gruppo.nome, `${gruppo.usati.length} file comuni`, rami, ritardo,
      gruppo.usati.flatMap(v => v.pagine).map(() => 'attivo'));

    return area;

    const aperto = !chiusi.has(chiaveSviluppo(id, regolaAperta ? regolaAperta.id : null));

    ritardo += 480;

  // ----- Negozio clone: modifica (nome, indirizzo, indirizzo breve, descrizione breve, logo; la sigla segue il nome), rendi sorgente, elimina (con doppia conferma:
  // si porta via la cartella del negozio con le sue pagine, le sue risorse, la scheda e la voce in installati.js) -----
  function comandiNegozio(id, scheda) {
    const box = nodo('div', 'comandi-negozio');
    const comando = (testo, classe, azione) => { const b = nodo('button', classe, testo); b.type = 'button'; b.disabled = !SCRIVIBILE; b.addEventListener('click', azione); box.append(b); };
    const pronto = async () => {
      try { await collega(); return true; } catch (errore) {
        esito(errore.name === 'AbortError' ? 'cartella non collegata: nessuna modifica' : `errore (${errore.name}): ${errore.message}`, errore.name === 'AbortError' ? 'nota' : 'err');
        return false;
      }
    };

      if (!await pronto()) return;

Da negozio clone diventa negozio sorgente, come Luxury Outlet e TEBE: da qui non si modifica e non si cancella più, solo dal codice.`)) return;

        await Associa.rendiSorgenteNegozio(progetto, { negozio: id });

        ricarica(id);

    comando('✕ elimina negozio', 'rosso', async () => {
      if (!await pronto()) return;
      if (!window.confirm(`Eliminare il negozio ${scheda.nome}?

Si cancellano la cartella ${id}/ con tutte le sue pagine (anche i moduli clone), le sue risorse (assets/img, logos, thumbnail… /${id}/), la scheda e la voce in installati.js.`)) return;
      if (!window.confirm(`Ultima conferma: ${scheda.nome} sparisce dalla splash page, dai menu e da Gestione negozi, con tutti i suoi file.

Non si può annullare (solo dal commit precedente). Eliminarlo definitivamente?`)) return;
      try {
        await Associa.eliminaNegozio(progetto, { negozio: id, avviso: esito });
        esito(`${scheda.nome} eliminato. ricorda il commit per pubblicarlo. rileggo…`, 'ok');

  // la pagina si rilegge (schede e negozi installati sono cambiati), sul negozio indicato
  function ricarica(id) {
    try { if (id) sessionStorage.setItem('storecraft_gestione_negozio', id); else sessionStorage.removeItem('storecraft_gestione_negozio'); } catch { /* si riparte dal primo */ }
    setTimeout(() => location.reload(), 900);
  }
  function modificaNegozio(id, scheda) {
    const velo = nodo('div', 'modifica-negozio');
    const form = nodo('form');
    form.append(nodo('h3', '', `modifica ${scheda.nome}`));
    const identita = negozi[id]?.dati.identita || [];
    const campo = (etichetta, valore, massimo) => {
      const l = nodo('label', '', etichetta);
      const input = nodo('input'); input.type = 'text'; input.value = valore || ''; input.maxLength = massimo;
      l.append(input); form.append(l); return input;
    };
    const nome = campo('nome', scheda.nome, 40), indirizzo = campo('indirizzo', scheda.indirizzo, 40),
      breve = campo('indirizzo breve (menu dei negozi)', scheda.indirizzoBreve, 24), descrizione = campo('descrizione breve (banner della dashboard)', identita[1], 50);
    const l = nodo('label', '', 'logo (png, svg, webp, jpg: vuoto lascia quello di adesso)');
    const logo = nodo('input'); logo.type = 'file'; logo.accept = 'image/png,image/svg+xml,image/webp,image/jpeg';
    l.append(logo); form.append(l);
    const comandi = nodo('div', 'comandi');
    const annulla = nodo('button', 'comando', 'annulla'); annulla.type = 'button';
    const salva = nodo('button', 'comando', 'salva'); salva.type = 'submit';
    comandi.append(annulla, salva); form.append(comandi);
    velo.append(form);
    document.body.append(velo);
    nome.focus();
    const chiudi = () => velo.remove();
    annulla.addEventListener('click', chiudi);
    velo.addEventListener('click', e => { if (e.target === velo) chiudi(); });
    velo.addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); chiudi(); } });
    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (!nome.value.trim()) { nome.focus(); return; }
      salva.disabled = true;
      try {
        await Associa.modificaNegozio(progetto, { negozio: id, nome: nome.value.trim().toUpperCase(),
          indirizzo: indirizzo.value.trim().toUpperCase(), indirizzoBreve: breve.value.trim().toUpperCase(), descrizione: descrizione.value.trim().toUpperCase(), logoFile: logo.files[0] || null, logoNome: logo.files[0]?.name || '' });
        chiudi();
        esito(`${nome.value.trim().toUpperCase()} aggiornato. ricorda il commit per pubblicarlo. rileggo…`, 'ok');
        ricarica(id);
      } catch (errore) { console.error(errore); esito(`errore (${errore.name}): ${errore.message}`, 'err'); salva.disabled = false; }
    });
  }

  // ----- Rami che si chiudono e si aprono (maniglia sul raccordo, un cerchio con la linea orizzontale da aperto e verticale da chiuso, o un clic sul nodo); chiusi mostrano un riassunto
  // con una spia per modulo. Lo stato vale finché si resta nella pagina: a ogni apertura tutto aperto -----
  let chiusi = new Set();
  // a ogni apertura tutto aperto: i rami chiusi valgono finché si resta nella pagina
  // Animazioni dei rami (Web Animations API; niente con «riduci animazioni»): aprendo, nodi, fili e moduli si srotolano
  // verso destra uno dopo l'altro, nell'ordine in cui stanno; chiudendo si riavvolgono al contrario, dall'ultimo
  const riduciAnimazioni = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DA_ANIMARE = '.nodo, .filo, .widget, .riassunto, .vuota';
  // Il ritardo di ogni pezzo dipende da dove sta: un'onda che va da sinistra a destra (SROTOLA_MS_PX millisecondi per
  // pixel, circa un secondo da un capo all'altro del diagramma), così i moduli di una galleria si vedono srotolare uno
  // dopo l'altro; un poco anche dall'alto in basso, come una cascata. Il riavvolgimento va al contrario, più svelto
  // ogni pezzo esce da sotto quello prima (parte spostato a sinistra di quasi tutta la sua larghezza, un poco storto e
  // più piccolo), scivola fuori, si raddrizza con un piccolo rimbalzo e subito parte il successivo
  const SROTOLA_MS_PX = .62, SROTOLA_DURATA = 340, RIAVVOLGI_MS_PX = .32, RIAVVOLGI_DURATA = 190;
  const ESCE = [
    { opacity: 0, transform: 'translateX(-85%) rotate(-8deg) scale(.82)', transformOrigin: 'left center', offset: 0 },
    { opacity: 1, transform: 'translateX(3%) rotate(2deg) scale(1.02)', transformOrigin: 'left center', offset: .62 },
    { opacity: 1, transform: 'none', transformOrigin: 'left center', offset: 1 }
  ];
  const RIENTRA = [
    { opacity: 1, transform: 'none', transformOrigin: 'left center' },
    { opacity: 0, transform: 'translateX(-80%) rotate(-7deg) scale(.84)', transformOrigin: 'left center' }
  ];
  function pezziVisibili(contenitore) {
    const pezzi = [...contenitore.querySelectorAll(DA_ANIMARE)].filter(p => p.offsetParent !== null);
    const posti = pezzi.map(p => p.getBoundingClientRect());
    const sinistra = Math.min(...posti.map(r => r.left)), destra = Math.max(...posti.map(r => r.left)), alto = Math.min(...posti.map(r => r.top));
    return pezzi.map((pezzo, i) => ({ pezzo, x: posti[i].left - sinistra, daDestra: destra - posti[i].left, y: posti[i].top - alto }));
  }
  // veloce (con la rotella sulla colonna di index): tutto in circa un terzo del tempo (VELOCE)
  const VELOCE = .35;
  function srotola(contenitore, veloce = false) {
    const k = veloce ? VELOCE : 1;
    if (riduciAnimazioni() || !contenitore) return;
    // i fili non si spostano: si tracciano dalla maniglia verso destra, dritti, così il flusso resta allineato
    pezziVisibili(contenitore).forEach(({ pezzo, x, y }) => pezzo.animate(pezzo.classList.contains('filo') ? [
      { transform: 'scaleX(0)', transformOrigin: 'left center' },
      { transform: 'scaleX(1)', transformOrigin: 'left center' }
    ] : ESCE, { duration: SROTOLA_DURATA * k, delay: (x * SROTOLA_MS_PX + y * .08) * k, easing: 'cubic-bezier(.25, .8, .3, 1)', fill: 'backwards' }));
  }
  function riavvolgi(contenitore, veloce = false) {
    const k = veloce ? VELOCE : 1;
    if (riduciAnimazioni() || !contenitore) return Promise.resolve();
    const pezzi = pezziVisibili(contenitore);
    const piuLontano = Math.max(0, ...pezzi.map(p => p.daDestra));
    const fatto = Promise.all(pezzi.map(({ pezzo, daDestra }) => pezzo.animate(pezzo.classList.contains('filo') ? [
      { transform: 'scaleX(1)', transformOrigin: 'left center' },
      { transform: 'scaleX(0)', transformOrigin: 'left center' }
    ] : RIENTRA, { duration: RIAVVOLGI_DURATA * k, delay: daDestra * RIAVVOLGI_MS_PX * k, easing: 'ease-in', fill: 'forwards' }).finished.catch(() => {})));
    // al più il tempo dell'animazione (se il browser la sospende, es. scheda in secondo piano, si va avanti lo stesso)
    return Promise.race([fatto, new Promise(fine => setTimeout(fine, (piuLontano * RIAVVOLGI_MS_PX + RIAVVOLGI_DURATA) * k + 80))]);
  }
  // le parti di un ramo che si aprono e si chiudono (il carosello o i rami sotto un'area)
  const contenutoRamo = elemento => [...elemento.querySelectorAll(':scope > .carosello, :scope > .sotto')];

  function alterna(elemento, chiaveStato, aperto) {
    const chiudi = aperto === undefined ? !elemento.classList.contains('chiuso') : !aperto;
    if (chiudi === elemento.classList.contains('chiuso') && !elemento.dataset.chiude) return;
    if (elemento.dataset.chiude && !chiudi) {
      // riaperto mentre si riavvolgeva: si ferma il riavvolgimento
      delete elemento.dataset.chiude;
      contenutoRamo(elemento).forEach(parte => parte.getAnimations({ subtree: true }).forEach(a => a.cancel()));
    } else if (chiudi === elemento.classList.contains('chiuso')) return;
    if (chiudi) chiusi.add(chiaveStato); else chiusi.delete(chiaveStato);
    const maniglia = elemento.querySelector(':scope > .nodo > .maniglia');
    if (maniglia) aggiornaManiglia(maniglia, !chiudi);
    elemento.classList.remove('apre', 'chiude');
    if (chiudi) {
      // prima i moduli si riavvolgono, poi il ramo si chiude e compare il riassunto
      elemento.dataset.chiude = '1';
      Promise.all(contenutoRamo(elemento).map(riavvolgi)).then(() => {
        if (!elemento.dataset.chiude) return;
        delete elemento.dataset.chiude;
        contenutoRamo(elemento).forEach(parte => parte.getAnimations({ subtree: true }).forEach(a => a.cancel()));
        elemento.classList.add('chiuso');
        void elemento.offsetWidth;
        elemento.classList.add('chiude');
      });
      return;
    }
    elemento.classList.remove('chiuso');
    // la valvola si riapre: il filo dopo la maniglia si riempie dalla maniglia in avanti
    const filo = elemento.querySelector(':scope > .filo');
    if (filo && !riduciAnimazioni()) filo.animate([{ transform: 'scaleX(0)', transformOrigin: 'left center' },
      { transform: 'scaleX(1)', transformOrigin: 'left center' }], { duration: 320, easing: 'ease-out' });
    // il carosello riaperto ricalcola le sue frecce, poi i moduli si srotolano
    elemento.querySelectorAll('.nastro').forEach(nastro => nastro.dispatchEvent(new Event('scroll')));
    contenutoRamo(elemento).forEach(srotola);
  }
  // La maniglia appena cliccata: finché il mouse non esce (o il fuoco non va altrove) niente anteprima (classe appena),
  // così la stanghetta resta nella posizione nuova. Se il diagramma si ridisegna (maniglia di index, regole), la maniglia
  // nuova riparte dalla posizione di prima e ruota fino a quella nuova, invece di comparire già girata
  let manigliaCliccata = null;   // { nome, aperta: com'era prima del clic }
  document.addEventListener('click', evento => {
    const maniglia = evento.target.closest?.('.maniglia');
    if (!maniglia) return;
    manigliaCliccata = { nome: maniglia.dataset.nome, aperta: maniglia.getAttribute('aria-expanded') === 'true' };
    maniglia.classList.add('appena');
  }, true);
  const lasciaManiglia = evento => {
    const maniglia = evento.target.closest?.('.maniglia');
    if (maniglia && !maniglia.contains(evento.relatedTarget)) maniglia.classList.remove('appena');
  };
  document.addEventListener('pointerout', lasciaManiglia);
  document.addEventListener('focusout', lasciaManiglia);
  function ritrovaManiglia() {
    if (!manigliaCliccata) return;
    const maniglia = [...document.querySelectorAll('.maniglia')].find(m => m.dataset.nome === manigliaCliccata.nome);
    const prima = manigliaCliccata;
    manigliaCliccata = null;
    if (!maniglia) return;
    if (maniglia.matches(':hover')) maniglia.classList.add('appena');
    const aperta = maniglia.getAttribute('aria-expanded') === 'true';
    if (aperta === prima.aperta || riduciAnimazioni()) return;
    maniglia.animate([{ rotate: prima.aperta ? '0deg' : '90deg' }, { rotate: aperta ? '0deg' : '90deg' }],
      { pseudoElement: '::before', duration: 320, easing: 'cubic-bezier(.3, 1.2, .5, 1)' });
  }
  function aggiornaManiglia(maniglia, aperto) {
    // niente testo: la linea dentro il cerchio (CSS) è orizzontale da aperto, verticale da chiuso
    maniglia.setAttribute('aria-expanded', String(aperto));
    maniglia.setAttribute('aria-label', `${aperto ? 'Riduci' : 'Espandi'} ${maniglia.dataset.nome}`);
  }
  // rende chiudibile un ramo: la maniglia sul nodo, il clic sul nodo (non sui suoi comandi) e il riassunto chiuso
  function chiudibile(elemento, nodoRamo, chiaveStato, nome, stati) {
    const maniglia = nodo('button', 'maniglia');
    maniglia.type = 'button';
    maniglia.dataset.nome = nome;
    const aperto = !chiusi.has(chiaveStato);
    elemento.classList.toggle('chiuso', !aperto);
    aggiornaManiglia(maniglia, aperto);
    maniglia.addEventListener('click', evento => { evento.stopPropagation(); alterna(elemento, chiaveStato); });
    nodoRamo.append(maniglia);
    nodoRamo.classList.add('apribile');
    nodoRamo.addEventListener('click', evento => { if (!evento.target.closest('button, a')) alterna(elemento, chiaveStato); });
    // riassunto del ramo chiuso: una spia per modulo (al massimo 24) e quanti sono
    const riassunto = nodo('button', 'riassunto');
    riassunto.type = 'button';
    riassunto.setAttribute('aria-label', `Espandi ${nome}`);
    const punti = nodo('span', 'punti');
    stati.slice(0, 24).forEach(stato => punti.append(nodo('span', `spia${stato === 'attivo' ? '' : ` ${stato}`}`)));
    riassunto.append(punti, nodo('span', '', `${stati.length}${stati.length > 24 ? ' (+)' : ''} · espandi ›`));
    riassunto.addEventListener('click', () => alterna(elemento, chiaveStato, true));
    return riassunto;
  }

  // Un'area del negozio: il nodo a pillola (CREATOR, CASSIERE, SERVIZIO) e i suoi rami
  function ramoArea(id, area, nome, sotto, rami, ritardo, stati, logo) {
    const elemento = nodo('li', 'ramo ramo-area');
    elemento.dataset.area = area;
    elemento.dataset.stato = `${id}:area:${area}`;
    elemento.style.setProperty('--d', `${ritardo}ms`);
    const testa = nodo('div', 'nodo nodo-area');
    // nel catalogo le sorgenti di un negozio hanno sopra il suo logo, piccolo e bianco
    if (logo) { const immagine = nodo('img', 'area-logo'); immagine.src = logo; immagine.alt = ''; testa.classList.add('con-logo'); testa.append(immagine); }
    testa.append(nodo('span', 'area-nome', nome), nodo('span', 'nodo-sotto', sotto));
    const elenco = nodo('ol', 'rami');
    elenco.append(...rami);
    const sottoRami = nodo('div', 'sotto');
    sottoRami.append(elenco);
    const filo = nodo('span', 'filo corto');
    filo.style.setProperty('--d', `${ritardo + 120}ms`);
    const riassunto = chiudibile(elemento, testa, elemento.dataset.stato, `area ${nome}`, stati);
    elemento.append(testa, filo, sottoRami, riassunto);
    return elemento;
  }

  // Una galleria senza riordino né scheda del modulo (strumenti di cassa, pagine di servizio): widget con un segno
  function ramoSemplice(id, chiaveRamo, titolo, sotto, voci, ritardo) {
    const elemento = nodo('li', 'ramo');
    elemento.dataset.tipo = chiaveRamo;
    elemento.dataset.sezione = chiaveRamo;
    elemento.dataset.stato = `${id}:${chiaveRamo}`;
    elemento.style.setProperty('--d', `${ritardo}ms`);
    const testa = nodo('div', 'nodo nodo-galleria');
    testa.append(nodo('span', 'galleria-nome', titolo), nodo('span', 'nodo-sotto', sotto));
    const carosello = nodo('div', 'carosello');
    const nastro = nodo('div', 'nastro');
    nastro.setAttribute('role', 'list');
    voci.forEach((voce, i) => {
      const w = nodo(voce.href ? 'a' : 'div', 'widget in-attivo semplice');
      w.setAttribute('role', 'listitem');
      w.title = voce.nota;
      w.style.setProperty('--d', `${ritardo + 140 + Math.min(i, 6) * 45}ms`);
      if (voce.href) { w.href = voce.href; w.target = '_blank'; w.rel = 'noopener'; }
      const testaW = nodo('span', 'w-testa');
      testaW.append(nodo('span', 'w-num', due(i + 1)), nodo('span', 'spia'));
      const anteprima = nodo('span', 'w-anteprima');
      anteprima.append(nodo('span', 'w-segno', voce.segno));
      w.append(testaW, anteprima, nodo('span', 'w-titolo', voce.titolo));
      nastro.append(w);
    });
    frecce(carosello, nastro, 0);
    const filo = nodo('span', 'filo corto');
    filo.style.setProperty('--d', `${ritardo + 100}ms`);
    const riassunto = chiudibile(elemento, testa, elemento.dataset.stato, titolo, voci.map(() => 'attivo'));
    elemento.append(testa, filo, carosello, riassunto);
    return elemento;
  }

  // frecce ‹ › di un piccolo carosello (nascoste se i widget entrano tutti)
  function frecce(carosello, nastro, scorrimento) {
    const prima = nodo('button', 'freccia prima', '‹');
    const dopo = nodo('button', 'freccia dopo', '›');
    prima.type = dopo.type = 'button';
    prima.setAttribute('aria-label', 'Moduli precedenti');
    dopo.setAttribute('aria-label', 'Moduli successivi');
    // un passo: i widget interi che si vedono
    const passo = () => {
      const spazio = parseFloat(getComputedStyle(nastro).columnGap) || 10;
      const largo = (nastro.querySelector('.widget')?.offsetWidth || 94) + spazio;
      return Math.max(1, Math.floor((nastro.clientWidth + spazio) / largo)) * largo;
    };
    prima.addEventListener('click', () => nastro.scrollBy({ left: -passo() }));
    dopo.addEventListener('click', () => nastro.scrollBy({ left: passo() }));
    // il nastro largo quanti widget interi entrano nello spazio (niente widget tagliati a metà); la freccia › sul suo bordo destro
    const misura = () => {
      const spazio = parseFloat(getComputedStyle(nastro).columnGap) || 10;
      const largo = (nastro.querySelector('.widget')?.offsetWidth || 94) + spazio;
      const widget = nastro.querySelectorAll('.widget').length;
      if (!widget || !carosello.clientWidth) { aggiorna(); return; }
      const quanti = Math.max(1, Math.floor((carosello.clientWidth - 4 + spazio) / largo));
      const larghezza = Math.min(quanti, widget) * largo - spazio + 4;
      nastro.style.width = `${larghezza}px`;
      dopo.style.left = `${larghezza - 10}px`;
      aggiorna();
    };
    const aggiorna = () => {
      carosello.classList.toggle('scorre', nastro.scrollWidth > nastro.clientWidth + 2);
      prima.disabled = nastro.scrollLeft <= 2;
      dopo.disabled = nastro.scrollLeft + nastro.clientWidth >= nastro.scrollWidth - 2;
    };
    nastro.addEventListener('scroll', aggiorna, { passive: true });
    // si rimisura quando cambia lo spazio del carosello e quando cambiano i widget (pagina più o meno larga: misure più grandi o più piccole)
    const osserva = new ResizeObserver(misura);
    osserva.observe(carosello);
    const primo = nastro.querySelector(".widget");
    if (primo) osserva.observe(primo);
    carosello.append(prima, nastro, dopo);
    requestAnimationFrame(() => {
      nastro.style.scrollBehavior = 'auto';
      nastro.scrollLeft = scorrimento;
      nastro.style.scrollBehavior = '';
      misura();
    });
  }

  function ramo(id, sezione, scorrimento, ritardo = 0) {
    const elemento = nodo('li', 'ramo');
    elemento.dataset.tipo = sezione.tipo;
    elemento.dataset.sezione = sezione.id;
    elemento.dataset.stato = `${id}:${sezione.id}`;
    elemento.style.setProperty('--d', `${ritardo}ms`);
    const schede = ordinate(id, sezione);
    // nodo della galleria
    const galleria = nodo('div', 'nodo nodo-galleria');
    galleria.append(nodo('span', 'galleria-nome', sezione.titolo.split(' // ')[0]),
      nodo('span', 'nodo-sotto', `${schede.length} ${schede.length === 1 ? 'modulo' : 'moduli'} · ${sezione.tipo}`));
    galleria.title = sezione.titolo;
    galleria.append(comandiOrdine(id, sezione));
    // il carosello dei moduli
    const carosello = nodo('div', 'carosello');
    const nastro = nodo('div', 'nastro');
    nastro.setAttribute('role', 'list');
    nastro.setAttribute('aria-label', `Moduli di ${sezione.titolo}`);
    schede.forEach((scheda, i) => {
      const w = widget(id, sezione, scheda, i + 1);
      w.style.setProperty('--d', `${ritardo + 140 + Math.min(i, 6) * 45}ms`);
      nastro.append(w);
    });
    if (!schede.length) nastro.append(nodo('span', 'vuota', 'nessun modulo'));
    frecce(carosello, nastro, scorrimento);
    // + aggiungi modulo, in alto a sinistra del primo widget (cartelli, promo e cartellini: le gallerie che si associano)
    if (['cartelli', 'promo', 'cartellini'].includes(sezione.tipo)) {
      const piu = nodo('button', 'aggiungi-modulo');
      piu.type = 'button';
      piu.setAttribute('aria-label', `Aggiungi un modulo a ${sezione.titolo.split(' // ')[0]}`);
      piu.insertAdjacentHTML('afterbegin', '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>');
      piu.addEventListener('click', evento => { evento.stopPropagation(); scegliModulo(id, sezione); });
      carosello.prepend(piu);
    }
    riordinabile(id, sezione, nastro);
    const filo = nodo('span', 'filo corto');
    filo.style.setProperty('--d', `${ritardo + 100}ms`);
    const riassunto = chiudibile(elemento, galleria, elemento.dataset.stato, sezione.titolo.split(' // ')[0], schede.map(statoDi));
    elemento.append(galleria, filo, carosello, riassunto);
    return elemento;
  }

  // ----- + AGGIUNGI MODULO: i moduli del catalogo adatti alla galleria (cartelli e promo tra loro, cartellini con
  // cartellini), da tutte le gallerie di Gestione pacchetti, in un carosello; scelto, entra nella galleria come le spunte
  // (Associa.associa: in un altro negozio come clone); un modulo import con il logo del .psd passa dalla sua domanda -----
  function moduliPerGalleria(id, sezione) {
    const tipi = sezione.tipo === 'cartellini' ? ['cartellini'] : ['cartelli', 'promo'];
    const voci = [];
    gallerieCatalogo().filter(p => tipi.includes(p.tipo)).forEach(p => p.moduli.forEach(modulo => {
      // i cloni già entrati in una dashboard (origine) li rappresenta il loro modulo di partenza
      if (!modulo.link || modulo.prossimamente || modulo.origine) return;
      const cartella = cartellaDi(p, modulo);
      if (!cartella) return;
      voci.push({ pacchetto: p, modulo, cartella, gia: Associa.usato(testoDi(id), id, cartella, modulo.link) });
    }));
    return voci;
  }
  function scegliModulo(id, sezione) {
    const voci = moduliPerGalleria(id, sezione);
    const galleria = sezione.titolo.split(' // ')[0];
    const velo = nodo('div', 'scegli-modulo');
    const finestra = nodo('div', 'finestra');
    finestra.setAttribute('role', 'dialog');
    finestra.setAttribute('aria-modal', 'true');
    finestra.setAttribute('aria-label', `Aggiungi un modulo a ${galleria}`);
    finestra.append(nodo('h3', '', '+ aggiungi modulo'),
      nodo('p', 'sotto', `// in «${galleria}» di ${nomeNegozio(id)}: scorri i moduli del catalogo e scegline uno. Da un altro negozio entra come clone, nella cartella ${id}/`));
    // filtri: tutti o una galleria del catalogo
    const filtri = nodo('div', 'filtri');
    const gruppi = [...new Map(voci.map(v => [v.pacchetto.id, v.pacchetto])).values()];
    let filtro = null, scelta = null;
    const nastro = nodo('div', 'nastro-scelta');
    nastro.setAttribute('role', 'listbox');
    const conferma = nodo('button', 'conferma-scelta', 'aggiungi');
    conferma.type = 'button';
    conferma.disabled = true;
    const nota = nodo('p', 'nota-scelta', 'scegli un modulo');
    const etichettaDi = p => (p.negozio ? `${p.titolo || p.nome} · ${sigla(p.negozio)}` : `${p.titolo || p.nome} · nuovo`);
    const disegnaVoci = () => {
      nastro.replaceChildren();
      const mostrate = voci.filter(v => !filtro || v.pacchetto.id === filtro);
      if (!mostrate.length) nastro.append(nodo('p', 'vuota-scelta', 'nessun modulo in questa galleria del catalogo'));
      mostrate.forEach(voce => {
        const { modulo, pacchetto } = voce;
        const carta = nodo('button', `scelta-modulo${modulo.stile === 'dorata' ? ' dorata' : ''}`);
        carta.type = 'button';
        carta.setAttribute('role', 'option');
        carta.disabled = voce.gia;
        carta.setAttribute('aria-pressed', String(scelta === voce));
        const anteprima = nodo('span', 'anteprima-scelta');
        const miniatura = (modulo.miniature || [])[0];
        if (miniatura) { const img = nodo('img'); img.src = `assets/${miniatura}`; img.alt = ''; img.loading = 'lazy'; anteprima.append(img); }
        else anteprima.append(nodo('small', '', '—'));
        carta.append(anteprima, nodo('b', '', modulo.titolo), nodo('small', voce.gia ? 'gia' : '', voce.gia ? '✓ già in questo negozio' : etichettaDi(pacchetto)));
        carta.title = `${modulo.titolo}: ${voce.cartella}/${pagina(modulo.link)}`;
        carta.addEventListener('click', () => {
          scelta = voce;
          nastro.querySelectorAll('.scelta-modulo').forEach(c => c.setAttribute('aria-pressed', String(c === carta)));
          conferma.disabled = !SCRIVIBILE;
          nota.textContent = voce.cartella === id ? `${modulo.titolo}: la sua pagina è già nella cartella ${id}/, entra nella galleria`
            : `${modulo.titolo}: la pagina ${voce.cartella}/${pagina(modulo.link)} si copia in ${id}/ (un clone) ed entra in fondo a «${galleria}»`;
        });
        nastro.append(carta);
      });
    };
    const filtroB = (testo, valore) => {
      const b = nodo('button', '', testo);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(filtro === valore));
      b.addEventListener('click', () => { filtro = valore; filtri.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); disegnaVoci(); nastro.scrollLeft = 0; });
      filtri.append(b);
    };
    filtroB(`tutti · ${voci.length}`, null);
    gruppi.forEach(p => filtroB(etichettaDi(p), p.id));
    disegnaVoci();
    // il carosello: frecce e rotella (giù va avanti)
    const striscia = nodo('div', 'striscia');
    const freccia = (testo, verso) => { const b = nodo('button', 'freccia-scelta', testo); b.type = 'button'; b.setAttribute('aria-label', verso < 0 ? 'Moduli precedenti' : 'Moduli successivi');
      b.addEventListener('click', () => nastro.scrollBy({ left: verso * nastro.clientWidth * .8, behavior: 'smooth' })); return b; };
    nastro.addEventListener('wheel', evento => { if (Math.abs(evento.deltaY) > Math.abs(evento.deltaX)) { evento.preventDefault(); nastro.scrollLeft += evento.deltaY; } }, { passive: false });
    striscia.append(freccia('‹', -1), nastro, freccia('›', 1));
    const annulla = nodo('button', 'annulla-scelta', 'annulla');
    annulla.type = 'button';
    const piede = nodo('div', 'piede');
    piede.append(nota, annulla, conferma);
    finestra.append(filtri, striscia, piede);
    velo.append(finestra);
    document.body.append(velo);
    // dentro la pagina operatore (riquadro alto quanto il contenuto) la finestra va nella parte che si vede
    try {
      const riquadro = window.frameElement?.getBoundingClientRect();
      if (riquadro) finestra.style.marginTop = `${Math.max(16, -riquadro.top + 40)}px`;
      else finestra.style.marginTop = '8vh';
    } catch { finestra.style.marginTop = '8vh'; }
    const chiudi = () => { velo.remove(); document.removeEventListener('keydown', tasti, true); };
    const tasti = evento => { if (evento.key === 'Escape') { evento.preventDefault(); evento.stopImmediatePropagation(); chiudi(); } };
    document.addEventListener('keydown', tasti, true);
    annulla.addEventListener('click', chiudi);
    velo.addEventListener('click', evento => { if (evento.target === velo) chiudi(); });
    (nastro.querySelector('.scelta-modulo:not(:disabled)') || annulla).focus();
    conferma.addEventListener('click', async () => {
      if (!scelta) return;
      try { await collega(); } catch (errore) {
        nota.textContent = errore.name === 'AbortError' ? 'cartella del progetto non collegata: nessuna modifica' : `errore: ${errore.message}`;
        return;
      }
      const { modulo, pacchetto, cartella } = scelta;
      const dati = { modulo, tipo: pacchetto.tipo, cartella, negozio: id, sezione: sezione.id, avviso: esito };
      conferma.disabled = true;
      try {
        // un modulo import con il logo del .psd: la domanda sul logo (la galleria è già scelta)
        let logo = null;
        if (cartella !== id) {
          const html = await testoFile(`${cartella}/${pagina(modulo.link)}`).catch(() => '');
          if (/<meta name="storecraft-import"/.test(html) && /-grafiche\/logo-brand\.png/.test(html)) {
            chiudi();
            const scelte = await Associa.chiediAssociazione({ progetto, ...dati, nomeNegozio: nomeNegozio(id), sezione: sezione.id });
            if (!scelte) { esito('annullato: nessuna modifica', 'nota'); return; }
            logo = scelte.logo;
            dati.sezione = scelte.sezione;
            dati.nuovaGalleria = scelte.nuovaGalleria;
          }
        }
        if (velo.isConnected) chiudi();
        await Associa.associa(progetto, { ...dati, logo });
        await carica(id);
        esito(`${modulo.titolo} aggiunto a ${galleria} di ${nomeNegozio(id)}. ricorda il commit per pubblicarlo`, 'ok');
        disegna();
      } catch (errore) {
        console.error(errore);
        esito(`errore (${errore.name}): ${errore.message}`, 'err');
        conferma.disabled = false;
      }
    });
  }

  // comandi dell'ordine nel nodo della galleria: registra / annulla un ordine cambiato, o torna a quello di partenza
  function comandiOrdine(id, sezione) {
    const comandi = nodo('span', 'galleria-comandi');
    if (sospesi[id]?.[sezione.id]) {
      comandi.append(nodo('span', 'sospeso', 'ordine cambiato'));
      const registra = nodo('button', 'collegamento forte', 'registra');
      registra.type = 'button';
      registra.disabled = !SCRIVIBILE;
      registra.title = 'scrivi il nuovo ordine nella dashboard del negozio';
      registra.addEventListener('click', () => registraOrdine(id, sezione));
      const annulla = nodo('button', 'collegamento', 'annulla');
      annulla.type = 'button';
      annulla.addEventListener('click', () => { delete sospesi[id][sezione.id]; ridisegna(); });
      comandi.append(registra, annulla);
    } else if (Array.isArray(sezione.ordine)) {
      const partenza = nodo('button', 'collegamento', '↺ ordine di partenza');
      partenza.type = 'button';
      partenza.disabled = !SCRIVIBILE;
      partenza.title = MODELLI.includes(id) ? 'torna all\'ordine originale del negozio modello' : 'torna alla sequenza in cui i moduli sono stati aggiunti al negozio';
      partenza.addEventListener('click', () => ordineDiPartenza(id, sezione));
      comandi.append(partenza);
    }
    return comandi;
  }

  // un ordine cambiato (trascinando o con i comandi): resta da registrare; se torna quello scritto non c'è più niente da fare
  function cambiaOrdine(id, sezione, chiavi) {
    const scritto = ordinate(id, sezione, false).map(chiave);
    sospesi[id] = sospesi[id] || {};
    if (chiavi.join('\n') === scritto.join('\n')) delete sospesi[id][sezione.id];
    else sospesi[id][sezione.id] = chiavi;
  }
  const ridisegna = () => { disegna(); if (!$('vista-modulo').hidden && moduloAperto) disegnaModulo(); };

  // Riordinare trascinando i widget nel loro carosello (con il mouse); da tastiera Alt + ← / → sul widget
  function riordinabile(id, sezione, nastro) {
    let trascinato = null;
    nastro.addEventListener('dragstart', evento => {
      if (!modifica) { evento.preventDefault(); return; }
      trascinato = evento.target.closest('.widget');
      if (!trascinato) return;
      evento.dataTransfer.effectAllowed = 'move';
      evento.dataTransfer.setData('text/plain', trascinato.dataset.chiave);
      requestAnimationFrame(() => { trascinato?.classList.add('trascinato'); nastro.classList.add('riordina'); });
    });
    nastro.addEventListener('dragover', evento => {
      if (!trascinato || trascinato.parentNode !== nastro) return;
      evento.preventDefault();
      // vicino ai bordi il nastro scorre da solo
      const bordi = nastro.getBoundingClientRect();
      if (evento.clientX < bordi.left + 30) nastro.scrollLeft -= 8;
      else if (evento.clientX > bordi.right - 30) nastro.scrollLeft += 8;
      const prossimo = [...nastro.querySelectorAll('.widget:not(.trascinato)')].find(w => {
        const r = w.getBoundingClientRect();
        return evento.clientX < r.left + r.width / 2;
      });
      if (prossimo) { if (trascinato.nextElementSibling !== prossimo) nastro.insertBefore(trascinato, prossimo); }
      else if (nastro.lastElementChild !== trascinato) nastro.append(trascinato);
    });
    nastro.addEventListener('drop', evento => evento.preventDefault());
    nastro.addEventListener('dragend', () => {
      if (!trascinato) return;
      trascinato.classList.remove('trascinato');
      nastro.classList.remove('riordina');
      const spostato = trascinato.dataset.chiave;
      trascinato = null;
      cambiaOrdine(id, sezione, [...nastro.querySelectorAll('.widget')].map(w => w.dataset.chiave));
      ridisegna();
      document.querySelector(`.ramo[data-sezione="${sezione.id}"] .widget[data-chiave="${CSS.escape(spostato)}"]`)?.focus({ preventScroll: true });
    });
    nastro.addEventListener('keydown', evento => {
      const w = evento.target.closest('.widget');
      if (!modifica || !w || !evento.altKey || !['ArrowLeft', 'ArrowRight'].includes(evento.key)) return;
      evento.preventDefault();
      muovi(id, sezione, w.dataset.chiave, evento.key === 'ArrowLeft' ? -1 : 1);
      document.querySelector(`.ramo[data-sezione="${sezione.id}"] .widget[data-chiave="${CSS.escape(w.dataset.chiave)}"]`)?.focus();
    });
  }
  function muovi(id, sezione, chiaveModulo, passo) {
    const chiavi = ordinate(id, sezione).map(chiave);
    const da = chiavi.indexOf(chiaveModulo), a = da + passo;
    if (da < 0 || a < 0 || a >= chiavi.length) return;
    [chiavi[da], chiavi[a]] = [chiavi[a], chiavi[da]];
    cambiaOrdine(id, sezione, chiavi);
    ridisegna();
  }

  // ----- Scrittura nella dashboard del negozio -----
  // cambia(testo) → nuovo testo; poi si rilegge il negozio e si ridisegna
  async function scriviDashboard(id, cambia, fatto) {
    try { await collega(); } catch (errore) {
      if (errore.name === 'AbortError') esito('cartella non collegata: nessuna modifica', 'nota');
      else { console.error(errore); esito(`errore (${errore.name}): ${errore.message}`, 'err'); }
      return false;
    }
    try {
      const file = `assets/negozi/${id}-dashboard.js`;
      await scriviFile(file, cambia(await testoFile(file)));
      await carica(id);
      esito(`${fatto}. ricorda il commit per pubblicarlo`, 'ok');
      ridisegna();
      return true;
    } catch (errore) {
      console.error(errore);
      esito(`errore (${errore.name}): ${errore.message}`, 'err');
      return false;
    }
  }
  async function registraOrdine(id, sezione) {
    const chiavi = sospesi[id]?.[sezione.id];
    if (!chiavi) return;
    const ok = await scriviDashboard(id, testo => Associa.impostaOrdine(testo, sezione.id, chiavi),
      `nuovo ordine di ${sezione.titolo.split(' // ')[0]} registrato nella dashboard di ${nomeNegozio(id)}`);
    if (ok) { delete sospesi[id][sezione.id]; ridisegna(); }
  }
  function ordineDiPartenza(id, sezione) {
    scriviDashboard(id, testo => Associa.impostaOrdine(testo, sezione.id, null),
      `${sezione.titolo.split(' // ')[0]} di ${nomeNegozio(id)} di nuovo nell'ordine di partenza`);
  }

  // ----- Scheda del modulo -----
  let moduloAperto = null;   // { id, sezione (id), chiave }
  // dentro la pagina operatore: con la scheda di un modulo aperta, il suo pulsante in alto (← diagramma del negozio) e Esc
  // tornano al diagramma invece che al menu (la pagina operatore manda { torna: true })
  const avvisaOperatore = sottoVista => { if (incorporata) window.parent.postMessage({ sottoVista }, location.origin); };
  window.addEventListener('message', evento => {
    if (evento.origin === location.origin && evento.source === window.parent && evento.data?.torna) { chiudiModulo(); chiudiNuovo(); }
  });
  function apriModulo(id, sezioneId, chiaveModulo) {
    moduloAperto = { id, sezione: sezioneId, chiave: chiaveModulo };
    azioneAperta = null;   // un modulo nuovo: la pulsantiera delle azioni riparte chiusa
    $('diagramma').hidden = true;
    $('indietro-fondo').hidden = true;
    $('vista-modulo').hidden = false;
    const ritorno = negozioScelto === MODULI ? 'catalogo dei moduli' : 'diagramma del negozio';
    $('torna-diagramma').textContent = `← ${ritorno}`;
    avvisaOperatore(ritorno);
    disegnaModulo();
    $('torna-diagramma').focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }
  function chiudiModulo(fuoco = true) {
    if ($('vista-modulo').hidden) return;
    const aperto = moduloAperto;
    moduloAperto = null;
    avvisaOperatore(null);
    $('vista-modulo').hidden = true;
    $('diagramma').hidden = false;
    $('indietro-fondo').hidden = false;
    $('modulo').replaceChildren();
    if (fuoco && aperto) document.querySelector(`.ramo[data-sezione="${aperto.sezione}"] .widget[data-chiave="${CSS.escape(aperto.chiave)}"]`)?.focus();
  }
  $('torna-diagramma').addEventListener('click', () => chiudiModulo());
  // ← torna all'area operatore: dentro la pagina operatore chiude la sezione (come Esc), da sola apre la pagina operatore
  $('torna-operatore').addEventListener('click', () => {
    if (incorporata) window.parent.postMessage({ esc: true }, location.origin);
    else location.href = 'operatore.html';
  });
  // Esc nella scheda del modulo torna al diagramma (prima che arrivi alla pagina operatore, che chiuderebbe la sezione)
  window.addEventListener('keydown', evento => {
    // Esc con il menu dello stato aperto: chiude solo il menu
    const menuAperto = document.querySelector('.stato-menu.aperto');
    if (evento.key === 'Escape' && menuAperto) {
      evento.preventDefault();
      evento.stopImmediatePropagation();
      chiudiMenuStato(menuAperto);
      menuAperto.querySelector('.stato-scelta').focus();
      return;
    }
    if (evento.key === 'Escape' && !$('vista-modulo').hidden) {
      evento.preventDefault();
      evento.stopImmediatePropagation();
      chiudiModulo();
    }
  }, true);

  // Menu a cascata dello stato nella scheda del modulo: in vista lo stato attuale (pallino e scritta) con la freccina; un
  // clic apre l'elenco con l'altro valore: ghost (pallino viola, «ghost: nascosto dalla dashboard») per un modulo
  // visibile, attivo («attivo: si vede nella dashboard») per uno in ghost; sceglierlo scrive nella dashboard
  const ETICHETTE_STATO = { attivo: 'attivo: si vede nella dashboard', ghost: 'ghost: nascosto dalla dashboard', arrivo: STATI.arrivo };
  function chiudiMenuStato(menu) {
    menu.classList.remove('aperto');
    menu.querySelector('.stato-elenco').hidden = true;
    menu.querySelector('.stato-scelta').setAttribute('aria-expanded', 'false');
  }
  document.addEventListener('click', evento => document.querySelectorAll('.stato-menu.aperto').forEach(menu => { if (!menu.contains(evento.target)) chiudiMenuStato(menu); }));
  function menuStato(id, sezione, scheda, chiaveModulo, stato, sorgente = false) {
    const contenitore = nodo('span', 'stato-menu');
    const voceStato = s => {
      const riga = nodo('span', 'stato');
      riga.append(nodo('span', `spia${s === 'attivo' ? '' : ` ${s}`}`), ETICHETTE_STATO[s]);
      return riga;
    };
    const scelta = nodo('button', 'stato-scelta');
    scelta.type = 'button';
    // si cambia solo in modalità modifica (lucchetto aperto)
    scelta.disabled = !SCRIVIBILE || !modifica;
    if (!modifica) scelta.title = 'apri il lucchetto (modalità modifica) per cambiare lo stato';
    scelta.setAttribute('aria-haspopup', 'listbox');
    scelta.setAttribute('aria-expanded', 'false');
    scelta.append(voceStato(stato), nodo('span', 'stato-freccia'));
    // l'altro valore: in ghost si torna attivi, altrimenti (anche in arrivo) si mette in ghost
    const altro = scheda.nascosta ? 'attivo' : 'ghost';
    const elenco = nodo('span', 'stato-elenco');
    elenco.setAttribute('role', 'listbox');
    elenco.hidden = true;
    const opzione = nodo('button', 'stato-opzione');
    opzione.type = 'button';
    opzione.setAttribute('role', 'option');
    opzione.append(voceStato(altro));
    elenco.append(opzione);
    const apri = aperto => {
      elenco.hidden = !aperto;
      scelta.setAttribute('aria-expanded', String(aperto));
      contenitore.classList.toggle('aperto', aperto);
    };
    scelta.addEventListener('click', () => { apri(elenco.hidden); if (!elenco.hidden) opzione.focus(); });
    opzione.addEventListener('click', () => {
      apri(false);
      scriviModulo(id, scheda, sorgente, testo => Associa.impostaFantasmaScheda(testo, sezione.id, chiaveModulo, !scheda.nascosta),
        `${scheda.titolo} ${scheda.nascosta ? 'di nuovo visibile' : 'in ghost'} nella dashboard di ${nomeNegozio(id)}`);
    });
    // si chiude con un clic fuori (chiudiMenuStato) o con Esc, che lo chiude prima di chiudere la scheda
    contenitore.append(scelta, elenco);
    return contenitore;
  }

  // Scrive una modifica della scheda di un modulo. Per un modulo sorgente prima avvisa che si sta modificando un modulo
  // sorgente e chiede se procedere. Il lucchetto resta aperto per altre modifiche: lo richiude l'utente (e riparte chiuso
  // a ogni apertura della pagina o della sezione)
  const confermaSorgente = (id, scheda, sorgente) => !sorgente || window.confirm(`Stai per modificare un modulo sorgente: ${scheda.titolo} (${nomeNegozio(id)}).\n\n`
    + 'I moduli sorgente sono scritti a codice: la modifica cambia la sua scheda nella dashboard del negozio. Procedere?');
  async function scriviModulo(id, scheda, sorgente, cambia, fatto) {
    // prima la cartella: Chrome apre la finestra di scelta solo subito dopo il clic, e la conferma del sorgente in mezzo
    // gli farebbe perdere il clic («clicca di nuovo il pulsante»)
    if (!await cartellaPronta()) return false;
    if (!confermaSorgente(id, scheda, sorgente)) return false;
    return scriviDashboard(id, cambia, fatto);
  }
  async function cartellaPronta() {
    try { await collega(); return true; } catch (errore) {
