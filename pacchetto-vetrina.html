<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <!-- Vetrina di un pacchetto di moduli (area operatore, Gestione pacchetti): il carosello del pacchetto con le schede
       esattamente come nella dashboard del cliente (stessi file di stile e stessa struttura delle schede di
       assets/js/dashboard.js), nel tema e nell'aspetto scelti. Si apre dentro pacchetti.html, che ne sceglie la larghezza:
       pacchetto-vetrina.html?pacchetto=<id>&tema=dark|light&aspetto=standard|minimal. La usa anche Gestione negozi, nella
       scheda del modulo, per mostrare il widget come nella dashboard (?anteprima=1&numero=<n>). Non va ai clienti. -->
  <script>
    const parametri = new URLSearchParams(location.search);
    const radice = document.documentElement;
    radice.dataset.interfaceTheme = parametri.get('tema') === 'light' ? 'light' : 'dark';
    radice.dataset.interfaceLook = parametri.get('aspetto') === 'minimal' ? 'minimal' : 'standard';
  </script>
  <script src="assets/js/negozi.js?v=20261023-2"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Vetrina del pacchetto</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/caroselli.css?v=20261023-2">
  <script src="assets/js/caroselli.js?v=20261023-2"></script>
  <link rel="stylesheet" href="assets/css/dashboard.css?v=20261023-2">
  <link rel="stylesheet" href="assets/css/theme.css?v=20261023-2">
  <!-- Utilità Cassa: gli strumenti veri della dashboard (cassa.js, con qrcode.js per il QR) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="assets/js/cassa.js?v=20261023-2"></script>
  <script src="assets/js/pacchetti.js?v=20261023-2"></script>
  <script>
    // il file del pacchetto scelto, durante la lettura della pagina
    if (parametri.get('pacchetto')) Pacchetti.carica([parametri.get('pacchetto')]);
  </script>
  <style>
    /* Solo la zona dei caroselli della dashboard: la pagina scorre per intero (niente altezza fissa di dashboard.css) e
       la zona centrale è larga al massimo come in una dashboard vista a 1440 px (1440 − menu laterale 245 px); la pagina
       Gestione pacchetti apre la vetrina a 1440 px e la rimpicciolisce per la sua cornice */
    html, body { height: auto; }
    body { display: block; overflow: visible; }
    main { width: min(100%, 1195px); overflow: visible; padding-top: 18px; padding-bottom: 18px; }
    main > * { margin-bottom: 0 !important; }
    /* Utilità Cassa: le tre colonne della dashboard anche con pochi strumenti visibili (la griglia della dashboard, auto-fit,
       allargherebbe uno strumento da solo a tutta la riga); sul telefono una colonna, come nella dashboard */
    @media (min-width: 721px) { #tools { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; } }
    /* un modulo solo (scheda del modulo in Gestione negozi e in Gestione pacchetti, anteprima del nuovo modulo): niente
       barra di scorrimento né frecce del carosello, che con un widget solo non servono (comparivano cambiando aspetto) */
    html.solo-modulo .carousel-arrow { display: none !important; }
    html.solo-modulo .carousel-container { overflow: hidden !important; scrollbar-width: none; }
    html.solo-modulo .carousel-container::-webkit-scrollbar { display: none; }
    /* Gestione pacchetti (catalogo e scheda del modulo): moduli sorgente e moduli clone, come in Gestione negozi: bordo
       ed etichetta SORGENTE in oro, CLONE in azzurro, accanto al numero (le schede dorate tengono il loro bordo oro, i cloni no) */
    .carousel-card.modulo-sorgente { border-color: rgba(212, 163, 115, .55) !important; }
    .carousel-card.modulo-sorgente.gold-bf-card { border-color: var(--gold-border) !important; }
    .carousel-card.modulo-clone { border-color: rgba(95, 179, 201, .75) !important; }
    .carousel-card.modulo-sorgente:hover { border-color: var(--accent) !important; }
    .carousel-card.modulo-clone:hover { border-color: #5fb3c9 !important; }
    .card-top .tag-modulo { align-self: center; margin-right: auto; padding: 0 6px; border: 1px solid currentColor; border-radius: 3px; background: #0a0908;
      font: 400 9px/1.6 'JetBrains Mono', monospace; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
    .modulo-sorgente .tag-modulo { color: #d4a373; }
    .modulo-clone .tag-modulo { color: #5fb3c9; }
    :root[data-interface-theme="light"] .carousel-card.modulo-sorgente { border-color: rgba(173, 138, 62, .6) !important; }
    :root[data-interface-theme="light"] .carousel-card.modulo-sorgente.gold-bf-card { border-color: #b48b37 !important; }
    :root[data-interface-theme="light"] .card-top .tag-modulo { background: #fffdfa; }
    :root[data-interface-theme="light"] .modulo-sorgente .tag-modulo { color: #ad8a3e; }
    :root[data-interface-theme="light"] .modulo-clone .tag-modulo { color: #3d8ea3; }
    /* Utilità Cassa nel catalogo: il comando che apre la scheda del modulo (lo strumento resta vivo) */
    .apri-scheda-modulo { position: absolute; top: 8px; right: 8px; z-index: 2; padding: 1px 7px; border: 1px solid #d4a373; border-radius: 3px;
      background: #0a0908; color: #d4a373; font: 400 10px/1.6 'JetBrains Mono', monospace; letter-spacing: .06em; cursor: pointer; }
    .apri-scheda-modulo:hover, .apri-scheda-modulo:focus-visible { background: #d4a373; color: #121110; outline: none; }
    :root[data-interface-theme="light"] .apri-scheda-modulo { background: #fffdfa; border-color: #b48b37; color: #8f6a1f; }
  </style>
</head>
<body>
  <main id="main-content"></main>
  <script>
    // Stessa struttura delle schede di assets/js/dashboard.js (scheda, anteprima, sezione): le regole di stile sono quelle
    // della dashboard, così i widget si vedono come li vedrà il cliente
    function el(tag, attributi = {}, ...figli) {
      const nodo = document.createElement(tag);
      Object.entries(attributi).forEach(([nome, valore]) => {
        if (valore === false || valore === null || valore === undefined) return;
        if (nome === 'class') nodo.className = valore;
        else if (nome === 'text') nodo.textContent = valore;
        else if (nome.startsWith('on')) nodo.addEventListener(nome.slice(2), valore);
        else nodo.setAttribute(nome, valore === true ? '' : valore);
      });
      figli.flat().forEach(figlio => {
        if (figlio === null || figlio === undefined || figlio === false) return;
        nodo.append(typeof figlio === 'string' ? document.createTextNode(figlio) : figlio);
      });
      return nodo;
    }
    const due = numero => String(numero).padStart(2, '0');
    // anteprima=1: un modulo non ancora salvato ({ tipo, modulo } in window.parent.anteprimaNuovoModulo, Nuovo modulo in
    // Gestione pacchetti; la miniatura può essere un'immagine generata, data:…)
    const anteprimaModulo = parametri.get('anteprima') === '1' ? (window.parent?.anteprimaNuovoModulo || null) : null;
    const pacchetto = anteprimaModulo
      ? { id: 'anteprima', tipo: anteprimaModulo.tipo, moduli: anteprimaModulo.moduli || [anteprimaModulo.modulo] }
      : Pacchetti.pacchetto(parametri.get('pacchetto'));
    // cartella delle pagine del modulo: la sua (gallerie con moduli di negozi diversi) o quella del pacchetto
    const cartellaDi = modulo => modulo.cartella || pacchetto.cartella;
    // modulo=<n>: solo quel modulo (scheda del modulo in Gestione pacchetti)
    const soloModulo = parametri.has('modulo') ? Number(parametri.get('modulo')) : null;
    if (soloModulo !== null || (anteprimaModulo && !anteprimaModulo.moduli)) radice.classList.add('solo-modulo');
    // nel catalogo un clic su una scheda apre la scheda del modulo (Gestione pacchetti); altrimenti apre la pagina
    const apriScheda = !anteprimaModulo && soloModulo === null && typeof window.parent?.apriModulo === 'function' && window.parent !== window;

    function anteprima(scheda) {
      const immagini = (scheda.miniature || []).map((src, i) => el('img', {
        class: 'preview-image', src: src.startsWith('data:') ? src : `assets/${src}`, alt: i === 0 ? (scheda.alt || scheda.titolo) : '', 'aria-hidden': i ? 'true' : false
      }));
      return el('div', { class: `preview${immagini.length > 1 ? ' slideshow' : ''}${immagini.length > 2 ? ' tre' : ''}`,
        style: scheda.stile === 'dorata' ? 'background: radial-gradient(circle, #2a2218 0%, #0a0908 100%);' : false },
        immagini, scheda.badge ? el('span', { class: 'card-badge', text: scheda.badge }) : null);
    }

    // Gestione pacchetti: modulo sorgente (scritto a codice: le schede dei set di partenza) o clone (creato dalle utilità:
    // moduli di una galleria nuova, aggiunti a un set, schede con origine nella dashboard), come in Gestione negozi;
    // non nell'anteprima (Nuovo modulo, scheda del modulo di Gestione negozi), che mostra il widget come nella dashboard
    const marca = !anteprimaModulo && pacchetto?.tipo !== 'cassa';
    const eClone = s => !pacchetto.negozio || Boolean(s.aggiunto || s.origine);

    function scheda(s, numero) {
      const cima = el('div', { class: 'card-top' },
        el('span', { class: 'number', text: due(numero) }),
        marca ? el('span', { class: `tag-modulo`, text: eClone(s) ? 'clone' : 'sorgente' }) : null,
        s.tipo ? el('span', { class: 'card-type', text: s.tipo }) : null);
      const titolo = el('h3', { class: s.compatto ? 'compact-title' : false, text: s.titolo });
      // scheda dorata: la decide il modulo (stile: 'dorata'), non la galleria, come nella dashboard
      const dorata = s.stile === 'dorata';
      const classi = `carousel-card${dorata ? ' gold-bf-card' : ''}${marca ? (eClone(s) ? ' modulo-clone' : ' modulo-sorgente') : ''}${s.prossimamente ? ' is-soon' : ''}`;
      const specifiche = s.specifiche?.length
        ? el('div', { class: 'card-desc' }, el('div', {}, el('p', {}, el('span', { class: 'spec-list' },
            s.specifiche.flatMap((testo, i) => [i ? ' ' : null, el('span', { class: 'spec', text: testo })])))))
        : null;
      // il modulo si apre in un'altra scheda del browser, la vetrina resta
      return el('a', { href: s.prossimamente || !s.link ? false : `${cartellaDi(s)}/${s.link}`, target: '_blank', class: classi,
        onclick: apriScheda ? evento => { evento.preventDefault(); window.parent.apriModulo(pacchetto.id, numero - 1); } : null,
        'aria-disabled': s.prossimamente ? 'true' : false, 'aria-label': s.prossimamente ? `${s.titolo}, prossimamente` : false },
        cima, anteprima(s),
        el('div', { class: 'card-body' }, titolo, specifiche ? el('span', { class: 'spec-toggle' }) : null),
        specifiche);
    }

    // Specifiche: il + apre e chiude le specifiche di tutte le schede insieme, come nella dashboard
    function specifiche() {
      const tasti = [...document.querySelectorAll('.card-body .spec-toggle')];
      const apri = aperto => tasti.forEach(tasto => {
        tasto.closest('.carousel-card').classList.toggle('desc-open', aperto);
        tasto.setAttribute('aria-expanded', String(aperto));
        tasto.setAttribute('aria-label', aperto ? 'Nascondi specifiche' : 'Mostra specifiche');
        tasto.nextElementSibling.textContent = aperto ? 'Nascondi specifiche' : 'Mostra specifiche';
      });
      tasti.forEach(tasto => {
        tasto.after(el('span', { class: 'spec-tip', 'aria-hidden': 'true' }));
        tasto.setAttribute('role', 'button');
        tasto.setAttribute('tabindex', '0');
        const cambia = evento => {
          evento.preventDefault();
          evento.stopPropagation();
          apri(tasto.getAttribute('aria-expanded') !== 'true');
        };
        tasto.addEventListener('click', cambia);
        tasto.addEventListener('keydown', evento => { if (evento.key === 'Enter' || evento.key === ' ') cambia(evento); });
      });
      apri(false);
    }

    if (pacchetto?.tipo === 'cassa') {
      // Utilità Cassa: la griglia degli strumenti della dashboard, solo quelli del pacchetto, vivi e funzionanti (il QR
      // parte dal sito di STORE // CRAFT; nella dashboard parte dal collegamento del negozio)
      const strumenti = el('div', { class: 'tools-grid', id: 'tools' });
      document.getElementById('main-content').append(strumenti);
      Cassa.crea(strumenti, { qr: 'https://fabriceimpresa.github.io/storecraft/', bacheca: 'luxury/bacheca.html' });
      // gli strumenti fuori dal pacchetto si nascondono (non si tolgono: cassa.js li usa ancora, es. il cambio quando arrivano i tassi)
      const originali = [...strumenti.querySelectorAll(':scope > .widget')];
      originali.forEach(widget => { widget.style.display = 'none'; });
      // ogni modulo con il suo nome, nell'ordine del pacchetto: il primo di uno strumento è lo strumento vero, un clone dello
      // stesso strumento (Nuovo modulo) è una sua copia da vedere, senza id, da lavorare poi di codice
      const usati = new Set();
      pacchetto.moduli.forEach((modulo, indice) => {
        if (soloModulo !== null && indice !== soloModulo) return;   // scheda del modulo: solo il suo strumento
        const originale = originali.find(widget => widget.id === modulo.strumento);
        if (!originale) return;
        let widget = originale;
        if (usati.has(modulo.strumento)) {
          widget = originale.cloneNode(true);
          widget.removeAttribute('id');
          widget.querySelectorAll('[id]').forEach(elemento => elemento.removeAttribute('id'));
          // il comando «scheda ›» dell'originale si copia senza la sua funzione: via, la copia ha il suo
          widget.querySelectorAll('.apri-scheda-modulo').forEach(comando => comando.remove());
        }
        usati.add(modulo.strumento);
        widget.style.display = '';
        widget.querySelector('h3').textContent = modulo.titolo;
        // nel catalogo: lo strumento resta vivo (un clic lo usa), la sua scheda del modulo si apre da «scheda ›»
        if (apriScheda) {
          widget.style.position = 'relative';
          widget.append(el('button', { type: 'button', class: 'apri-scheda-modulo', text: 'scheda ›', 'aria-label': `Apri la scheda del modulo ${modulo.titolo}`,
            onclick: evento => { evento.preventDefault(); evento.stopPropagation(); window.parent.apriModulo(pacchetto.id, indice); } }));
        }
        strumenti.append(widget);
      });
    } else if (pacchetto) {
      // un modulo solo (scheda del modulo): una riga, senza lo spazio della seconda
      const classi = `carousel-container${pacchetto.tipo === 'cartelli' && soloModulo === null && !anteprimaModulo ? ' two-rows' : ''}${pacchetto.tipo === 'etichette' ? ' dymo' : ''}`;
      // numero=<n>: il numero del modulo nella sua galleria (scheda del modulo in Gestione negozi), invece della posizione
      const numero = i => (anteprimaModulo && parametri.has('numero') ? Number(parametri.get('numero')) : i + 1);
      const carosello = el('div', { class: classi, id: 'carosello' }, pacchetto.moduli.map((modulo, i) => scheda(modulo, numero(i)))
        .filter((carta, i) => soloModulo === null || i === soloModulo));
      document.getElementById('main-content').append(el('div', { id: 'vetrina' },
        el('div', { class: 'carousel-wrapper' },
          el('button', { class: 'carousel-arrow prev', type: 'button', 'aria-label': 'Scorri a sinistra', text: '‹', onclick: () => Caroselli.scroll(carosello, -1) }),
          carosello,
          el('button', { class: 'carousel-arrow next', type: 'button', 'aria-label': 'Scorri a destra', text: '›', onclick: () => Caroselli.scroll(carosello, 1) }))));
      specifiche();
      Caroselli.init();
    }

    // Tema e aspetto cambiati dalla pagina Gestione pacchetti, senza ricaricare
    window.impostaStile = (tema, aspetto) => {
      radice.dataset.interfaceTheme = tema;
      radice.dataset.interfaceLook = aspetto;
      Caroselli.refresh();
    };
  </script>
</body>
</html>
