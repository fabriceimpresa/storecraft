<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>GENERATORE CARTELLI OUTLET by Fabrice</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* Sfondo principale */
    body {
      font-family: Arial, sans-serif;
      background-color: #212529;
      padding: 20px;
      display: flex;
      gap: 20px;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    /* Filigrana di sfondo: loghi più distanziati */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('assets/img/LUXURYOUTLET_BACK.png');
      background-repeat: repeat;
      background-size: 650px auto; /* Aumentato per allontanare i loghi tra loro */
      background-position: center;
      opacity: 0.18;
      filter: contrast(1.1);
      pointer-events: none;
      z-index: 0;
    }

    /* Elementi sopra la filigrana */
    .controls, .print-sheet {
      position: relative;
      z-index: 1;
    }

    /* Pannello di Controllo */
    .controls {
      width: 380px;
      background: #181a1d;
      color: #f1f1f1;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      border: 1px solid #d4a373;
      height: fit-content;
      max-height: 95vh;
      overflow-y: auto;
    }

    .controls h2 {
      font-size: 1.1rem;
      color: #e5ba73;
      border-bottom: 2px solid #d4a373;
      padding-bottom: 5px;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #f3d5a3;
      background-color: rgba(212, 163, 115, 0.15);
      border-left: 3px solid #d4a373;
      padding: 4px 8px;
      border-radius: 2px;
      margin-top: 12px;
      margin-bottom: 8px;
    }

    .form-group { margin-bottom: 8px; }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 3px;
      color: #dddddd;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #4a4237;
      border-radius: 4px;
      font-size: 0.85rem;
      background-color: #26292e;
      color: #ffffff;
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #d4a373;
      box-shadow: 0 0 4px rgba(212, 163, 115, 0.5);
    }

    select option:first-child {
      color: #e5ba73 !important;
      font-weight: bold !important;
    }

    .btn-copy {
      width: 100%;
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin: 10px 0;
    }

    .btn-copy:hover { background-color: #218838; }

    /* PULSANTI STAMPA */
    .btn-print {
      width: 100%;
      background-color: #e00000;
      color: #ffffff;
      border: 1px solid #b30000;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .btn-print:hover { background-color: #cc0000; }

    .btn-print-single {
      width: 100%;
      background-color: #0056b3;
      color: #ffffff;
      border: 1px solid #004085;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 6px;
      transition: background-color 0.2s;
    }

    .btn-print-single:hover { background-color: #003d80; }

    .print-sheet {
      width: 210mm;
      height: 297mm;
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      padding: 10mm 12mm;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
    }

    .print-sheet.double-mode {
      justify-content: space-between;
    }

    .card {
      width: 100%;
      height: 128mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4mm 0;
      flex-shrink: 0;
    }

    .card.disabled {
      display: none !important;
    }

    .cut-line {
      width: 100%;
      border-top: 1px dashed #ccc;
      margin: 2mm 0;
      flex-shrink: 0;
    }

    .header-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5mm;
      flex-shrink: 0;
    }

    .header-text {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 1.1rem;
      color: #e00000;
      text-align: center;
      line-height: 1.1;
      text-transform: uppercase;
      width: 20%;
    }

    .red-box {
      width: 56%;
      height: 29mm;
      background-color: #e00000 !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2mm;
      flex-shrink: 0;
    }

    .red-box img {
      max-width: 94%;
      max-height: 94%;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    .price-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 1mm 0;
      flex-shrink: 0;
    }

    .price-row-old {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 1.5rem;
      margin-bottom: 2px;
    }

    .price-original {
      font-family: "Bodoni MT", "Bodoni 72", "Bodoni STD", "Didot", serif;
      font-weight: normal;
      color: #333;
      text-decoration: line-through;
    }

    .discount-tag {
      font-family: "Bodoni MT", "Bodoni 72", "Bodoni STD", "Didot", serif;
      font-style: italic;
      color: #e00000;
      font-weight: 800;
    }

    .price-final {
      font-family: "Bodoni MT", "Bodoni 72", "Bodoni STD", "Didot", serif;
      font-size: 7.8rem;
      font-weight: normal;
      color: #000;
      line-height: 0.82;
      text-align: center;
      letter-spacing: -3.5px;
    }

    .card-footer {
      height: 19.2mm;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1mm;
      flex-shrink: 0;
    }

    .card-footer img {
      max-height: 100%;
      max-width: 264px;
      object-fit: contain;
      filter: invert(13%) sepia(94%) saturate(7465%) hue-rotate(356deg) brightness(91%) contrast(115%);
    }

    @page {
      size: A4 portrait;
      margin: 0mm !important;
    }

    @media print {
      html, body {
        width: 210mm;
        height: 297mm;
        background: white !important;
        padding: 0 !important;
        margin: 0 !important;
        overflow: hidden !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      body::before { display: none !important; }

      .controls { display: none !important; }

      .print-sheet {
        box-shadow: none;
        padding: 8mm 10mm;
        width: 210mm;
        height: 297mm;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
        break-after: avoid !important;
        break-inside: avoid !important;
      }

      .red-box { 
        background-color: #e00000 !important; 
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body>

  <div class="controls">
    <h2>Pannello di Controllo</h2>

    <div class="section-title">CARTELLO 1 (Superiore)</div>
    <div class="form-group">
      <label>Brand</label>
      <select id="brandSelect1" onchange="updateCards()"></select>
    </div>
    <div class="form-group">
      <label>Claim SX 1 / DX 1:</label>
      <div style="display:flex; gap:5px;">
        <input type="text" id="left1" value="SALDI 2026" oninput="updateCards()">
        <input type="text" id="right1" value="SHOP NOW" oninput="updateCards()">
      </div>
    </div>
    <div class="form-group">
      <label>Prezzi (Originale / Sconto / Finale):</label>
      <div style="display:flex; gap:5px;">
        <input type="text" id="pOld1" value="395,00" placeholder="395,00" oninput="updateCards()">
        <input type="text" id="disc1" value="-75%" placeholder="-75%" oninput="updateCards()">
        <input type="text" id="pNew1" value="99,00" placeholder="99,00" oninput="updateCards()">
      </div>
    </div>

    <button class="btn-copy" id="btnCopy" onclick="copyCard1ToCard2()">📋 COPIA CARTELLO 1 ➔ CARTELLO 2</button>

    <div id="sectionCard2">
      <div class="section-title">CARTELLO 2 (Inferiore)</div>
      <div class="form-group">
        <label>Brand</label>
        <select id="brandSelect2" onchange="updateCards()"></select>
      </div>
      <div class="form-group">
        <label>Claim SX 2 / DX 2:</label>
        <div style="display:flex; gap:5px;">
          <input type="text" id="left2" value="SALDI 2026" oninput="updateCards()">
          <input type="text" id="right2" value="SHOP NOW" oninput="updateCards()">
        </div>
      </div>
      <div class="form-group">
        <label>Prezzi (Originale / Sconto / Finale):</label>
        <div style="display:flex; gap:5px;">
          <input type="text" id="pOld2" value="395,00" placeholder="395,00" oninput="updateCards()">
          <input type="text" id="disc2" value="-75%" placeholder="-75%" oninput="updateCards()">
          <input type="text" id="pNew2" value="99,00" placeholder="99,00" oninput="updateCards()">
        </div>
      </div>
    </div>

    <div class="section-title">IMPOSTAZIONI STAMPA</div>
    <div class="form-group">
      <label>Modalità Cartelli da Stampare:</label>
      <select id="modeSelect" onchange="toggleCardMode()">
        <option value="2">2 Cartelli (Foglio Intero A4)</option>
        <option value="1">1 Solo Cartello (Superiore)</option>
      </select>
    </div>

    <button class="btn-print" onclick="printSheet(2)">🖨️ Stampa 2 Cartelli (A4)</button>
    <button class="btn-print-single" onclick="printSheet(1)">🖨️ Stampa SOLO 1 Cartello</button>
  </div>

  <div class="print-sheet double-mode" id="printSheet">
    <!-- CARTELLO 1 -->
    <div class="card" id="card1">
      <div class="header-row">
        <div class="header-text" id="headLeft1">SALDI<br>2026</div>
        <div class="red-box"><img id="cardLogo1" src="" alt="Logo Brand"></div>
        <div class="header-text" id="headRight1">SHOP<br>NOW</div>
      </div>

      <div class="price-block">
        <div class="price-row-old">
          <span class="price-original" id="priceOldDisplay1">€ 395,00</span>
          <span class="discount-tag" id="discountDisplay1">-75%</span>
        </div>
        <div class="price-final" id="priceNewDisplay1">€ 99,00</div>
      </div>

      <div class="card-footer"><img class="luxuryLogo" src="assets/img/LUXURYOUTLET_BACK.png" alt="Luxury Outlet"></div>
    </div>

    <!-- LINEA TRATTEGGIATA PER IL RITAGLIO -->
    <div class="cut-line"></div>

    <!-- CARTELLO 2 -->
    <div class="card" id="card2">
      <div class="header-row">
        <div class="header-text" id="headLeft2">SALDI<br>2026</div>
        <div class="red-box"><img id="cardLogo2" src="" alt="Logo Brand"></div>
        <div class="header-text" id="headRight2">SHOP<br>NOW</div>
      </div>

      <div class="price-block">
        <div class="price-row-old">
          <span class="price-original" id="priceOldDisplay2">€ 395,00</span>
          <span class="discount-tag" id="discountDisplay2">-75%</span>
        </div>
        <div class="price-final" id="priceNewDisplay2">€ 99,00</div>
      </div>

      <div class="card-footer"><img class="luxuryLogo" src="assets/img/LUXURYOUTLET_BACK.png" alt="Luxury Outlet"></div>
    </div>
  </div>

  <script>
    const LOGO_FILES = [
      "269TEBE.PNG","ABIDDIKKIA.png","AFTERLABEL.png","AIRWALK.png","ALESSANDRODELLACQUA.png",
      "ALEXANDERMCQUEEN.png","ARMANI.png","ARMANI_COLLEZIONI.png","ARMANI_EXCHANGE.png",
      "ARMANI_GIORGIO.png","ARMANI_JEANS.png","ARNALDIMILANO.PNG","AVIREX.png","AYLIE.png",
      "BAGUTTA.png","BALDININI.png","BALMAIN.PNG","BASTONCINO.png","BCBG.png","BEATRICE.png",
      "BELSTAF.png","BENSHERMAN.png","BIKKENBERGS.png","BLAUER.png","BLKER.png","BLUGIRL.png",
      "BLUMARINE.png","BRICS.png","BURBERRY.png","BYBLOS.png","CALVINKLEIN.png","CARHARTT.png",
      "CAVALLI_CLASS.png","CAVALLI_ROBERTO.png","CHIARABONI.png","CIESSEPIUMINI.png","COCACOLA.png",
      "COCCINELLE.png","COSTUMENATIONAL.png","DAINESE.png","DEVORE.png","DIADORA.png","DICKIES.png",
      "DIESEL.png","DIOR.png","DIXIE.png","DOLCEANDGABBANA.png","DRSCHOLL.png","DSQUARED2.png",
      "DUCAHOMME.png","EASTPAK.png","EGONVONFURSTENBERG.png","ELISAFANTI.png","EMMAANDGAIA.png",
      "ENTREAMIS.png","ERMANNOSCERVINO.png","ERMENEGILDOZEGNA.png","EVERLAST.png","FACCONABLE.png",
      "FELEPPA.png","FERRARI.png","FERRE.png","FILA.png","FRANKLINMARSHALL.png","GAELLE.png",
      "GANT.png","GARMENT.png","GATTINONI.png","GCDS.png","GERMANS.png","GIVENCHY.png","GOORIN.png",
      "GUESS.png","GUYLAROCHE.png","H953.png","HACKETTLONDON.png","HARMONT&BLAINE.png","HAVEONE.png",
      "HERSCHELL.png","HOPPER.png","HUSKY.png","IMPERIAL.png","IMPURE.png","INVICTA.png",
      "ISABELMARANT.png","JACKDANIELS.png","JEIO.PNG","JEREMYSCOTT.png","JIJIL.png",
      "JOHNGALLIANO.png","JOHNRICHMOND.png","JUSTCAVALLI.png","KARLLAGERFELD.png","KENZO.png",
      "KRIZIA.png","KWAY.png","LACOSTE.png","LAMARTHE.png","LAPERLA.png","LASTCHANCE.png",
      "LAURABIAGIOTTI.png","LEE.png","LESARTEDELSOLE.png","LEVIS.png","LIUJO.png","LONSDALE.png",
      "LOVE.png","LUCKYLU.png","LUXURY_GOLD.png","LXRY.png","LXRY_BRAND.png","MADEINITALY.png",
      "MAISONMARGIELA.png","MAJE.png","MALIPARNI.png","MALONESOULIERS.png","MARCJACOBS.png",
      "MARELLA.png","MARIOVALENTINO.png","MARLBORO.png","MARNI.png","MASSIMOREBECCHI.png",
      "MAXMARA.png","MEIMEIJ.png","MELISSA.png","MICHAELKORS.png","MIRONCE.png","MISSONI.png",
      "MIZUNO.png","MODFITTERS.png","MONCLER.png","MONTECERVINO.png","MOSCHINO.png","MOTEL.png",
      "MSGM.png","NAPAPIJRI.png","NENETTE.png","NEWBALANCE.png","OBAG.png","OFFICINA36.png",
      "ONLY.png","OTTODROM.png","PACIOTTI_4US.png","PACIOTTI_CESARE.png","PATRIZIAPEPE.png",
      "PAULANDSHARK.png","PEOPLEOFSHIBUYA.png","PHILIPPPLEIN.png","PIERRECARDIN.png","PINKO.png",
      "PIQUADRO.png","POLAROID.png","RALPHLAUREN.png","RANSOM.png","REFRIGIWEAR.png","REFRIGUE.png",
      "RICHMOND.png","ROCCOBAROCCO.png","ROYROGERS.png","RUEBISQUIT.png","RUSSEL.png",
      "SALVATOREFERRAGAMO.png","SERGIOTACCHINI.png","SFIZIO.png","SIMONACORSELLINI.png","SKYWARD.png",
      "SOUVENIR.png","STEVEMADDEN.png","SUPERDRY.png","TEBE.png","TENSIONEIN.png","TOMMYHILFIGER.png",
      "TOMMYJEANS.png","TOYG.png","TRUSSARDI.png","TRUSSARDI_JEANS.png","TWINSET.png","UNGARO.png",
      "UNIFORM.png","USPOLOASSN.png","VERSACE.png","VERSACE_VERSUS.png","VICBEE.png","VIONNET.png",
      "WEILIZHENG.png","WRANGLER.png"
    ];

    const LOGO_PATH = "assets/logos/";
    const DEFAULT_LOGO = "LUXURY_GOLD.png";
    const PLACEHOLDER_TEXT = "🔴 ━━━  𝐒𝐄𝐋𝐄𝐙𝐈𝐎𝐍𝐀 𝐋𝐎𝐆𝐎  ━━━ 🔴";

    function cleanBrandName(filename) {
      return filename.replace(/\.(png|jpg|jpeg|webp|svg)$/i, '').replace(/[-_]/g, ' ');
    }

    function loadLocalLogos() {
      const select1 = document.getElementById('brandSelect1');
      const select2 = document.getElementById('brandSelect2');

      select1.innerHTML = `<option value="">${PLACEHOLDER_TEXT}</option>`;
      select2.innerHTML = `<option value="">${PLACEHOLDER_TEXT}</option>`;

      LOGO_FILES.forEach(fileName => {
        const displayName = cleanBrandName(fileName);
        
        const option1 = document.createElement('option');
        option1.value = fileName;
        option1.textContent = displayName;
        select1.appendChild(option1);

        const option2 = document.createElement('option');
        option2.value = fileName;
        option2.textContent = displayName;
        select2.appendChild(option2);
      });

      updateCards();
    }

    function copyCard1ToCard2() {
      document.getElementById('brandSelect2').value = document.getElementById('brandSelect1').value;
      document.getElementById('left2').value = document.getElementById('left1').value;
      document.getElementById('right2').value = document.getElementById('right1').value;
      document.getElementById('pOld2').value = document.getElementById('pOld1').value;
      document.getElementById('disc2').value = document.getElementById('disc1').value;
      document.getElementById('pNew2').value = document.getElementById('pNew1').value;
      updateCards();
    }

    function toggleCardMode() {
      const count = document.getElementById('modeSelect').value;
      const card2 = document.getElementById('card2');
      const section2 = document.getElementById('sectionCard2');
      const btnCopy = document.getElementById('btnCopy');
      const sheet = document.getElementById('printSheet');

      if (count === "1") {
        card2.classList.add('disabled');
        section2.style.display = 'none';
        btnCopy.style.display = 'none';
        sheet.classList.remove('double-mode');
      } else {
        card2.classList.remove('disabled');
        section2.style.display = 'block';
        btnCopy.style.display = 'block';
        sheet.classList.add('double-mode');
      }
    }

    function printSheet(count) {
      document.getElementById('modeSelect').value = count.toString();
      toggleCardMode();
      window.print();
    }

    function updateCards() {
      // Cartello 1
      const b1 = document.getElementById('brandSelect1').value;
      document.getElementById('cardLogo1').src = LOGO_PATH + (b1 ? b1 : DEFAULT_LOGO);
      document.getElementById('headLeft1').innerHTML = document.getElementById('left1').value.replace(' ', '<br>');
      document.getElementById('headRight1').innerHTML = document.getElementById('right1').value.replace(' ', '<br>');
      
      const po1 = document.getElementById('pOld1').value;
      document.getElementById('priceOldDisplay1').innerText = po1 ? '€ ' + po1 : '';
      document.getElementById('discountDisplay1').innerText = document.getElementById('disc1').value;
      const pn1 = document.getElementById('pNew1').value;
      document.getElementById('priceNewDisplay1').innerText = pn1 ? '€ ' + pn1 : '';

      // Cartello 2
      const b2 = document.getElementById('brandSelect2').value;
      document.getElementById('cardLogo2').src = LOGO_PATH + (b2 ? b2 : DEFAULT_LOGO);
      document.getElementById('headLeft2').innerHTML = document.getElementById('left2').value.replace(' ', '<br>');
      document.getElementById('headRight2').innerHTML = document.getElementById('right2').value.replace(' ', '<br>');
      
      const po2 = document.getElementById('pOld2').value;
      document.getElementById('priceOldDisplay2').innerText = po2 ? '€ ' + po2 : '';
      document.getElementById('discountDisplay2').innerText = document.getElementById('disc2').value;
      const pn2 = document.getElementById('pNew2').value;
      document.getElementById('priceNewDisplay2').innerText = pn2 ? '€ ' + pn2 : '';
    }

    window.onload = loadLocalLogos;
  </script>
</body>
</html>
