<title>Layout Studio · STORE // CRAFT</title>
<!--
  Layout Studio (area operatore, dal 19 ottobre 2026): l'editor a pagina intera di Import layout, stile Photoshop
  semplificato. Si apre dalla pagina generata di Import layout (APRI L'EDITOR) in una scheda nuova e lavora sui dati della
  conversione (window.opener.ImportLayout): il foglio A4 con i due cartelli, gli elementi del .psd e quelli aggiunti qui.
  Strumenti: seleziona (V), trasforma (T: maniglie, ridimensiona in proporzione, con Maiuscolo stirando, ruota), sposta la
  vista (H), zoom (Z), testo (X), forme (U: rettangolo, quadrato, cerchio, triangolo, linea), immagine (I), guida (G),
  bacchetta magica (W: scontorna la grafica). Righelli in cm (o mm), guide da trascinare dai righelli o da aggiungere con
  la posizione, guide magnetiche. Finestre mobili Proprietà (testo, aspetto, posizione) e Funzione (modulo comune);
  livelli per cartello. APPLICA e ← TORNA INDIETRO riportano le modifiche nella pagina generata (ImportLayout.applicaEditor).
  Solo nel progetto madre: fuori dalle copie per i clienti.
-->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=IBM+Plex+Mono:wght@400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #121110; --area: #1a1917; --pannello: #1f1d1b; --pannello-2: #262421; --bordo: #34312c; --bordo-tenue: #2a2824;
    --testo: #e8e2d6; --tenue: #8f877b; --oro: #d4a373; --oro-chiaro: #e5ba73; --oro-scuro: #8f6a1f;
    --guida: #3fc1d9; --selezione: #3a9b5a; --righello: #171614; --errore: #e07a5f;
    --ui: 'Plus Jakarta Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { display: grid; grid-template-rows: 52px 38px 1fr 30px; grid-template-columns: 56px 1fr 280px; background: var(--fondo); color: var(--testo); font: 400 12.5px var(--ui); }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---- barra in alto ---- */
  .barra { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--bordo); background: #0e0d0c; }
  .marchio { font: 600 15px 'Cinzel', serif; letter-spacing: .08em; color: var(--oro); white-space: nowrap; }
  .marchio span { color: var(--tenue); font-weight: 500; }
  .titolo-file { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
  .titolo-file strong { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .titolo-file small { color: var(--tenue); font-size: 11px; white-space: nowrap; }
  .gruppo { display: flex; align-items: center; gap: 4px; }
  .sep { width: 1px; height: 24px; background: var(--bordo); }
  .tasto { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; min-width: 32px; padding: 0 10px; border: 1px solid transparent;
    border-radius: 6px; background: none; color: var(--testo); cursor: pointer; transition: background .15s, border-color .15s, color .15s; white-space: nowrap; }
  .tasto:hover:not(:disabled) { background: var(--pannello-2); border-color: var(--bordo); }
  .tasto:disabled { opacity: .35; cursor: default; }
  .tasto svg { width: 16px; height: 16px; }
  .zoom { min-width: 54px; font: 400 12px var(--mono); color: var(--oro-chiaro); }
  .spazio { flex: 1; }
  .tasto-oro { border-color: var(--oro); color: var(--oro-chiaro); letter-spacing: .08em; font-weight: 600; font-size: 11px; text-transform: uppercase; }
  .tasto-oro:hover { background: var(--oro) !important; color: #121110; }
  .tasto-pieno { background: var(--oro); border-color: var(--oro); color: #121110; letter-spacing: .08em; font-weight: 600; font-size: 11px; text-transform: uppercase; }
  .tasto-pieno:hover { background: var(--oro-chiaro) !important; }

  /* ---- barra delle opzioni dello strumento ---- */
  .opzioni-strumento { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--bordo); background: #151413; color: var(--tenue); font-size: 11.5px; }
  .opzioni-strumento .nome-strumento { color: var(--oro-chiaro); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: 10.5px; min-width: 120px; }
  .opzioni-strumento label { display: inline-flex; align-items: center; gap: 6px; }
  .opzioni-strumento input[type="number"], .opzioni-strumento select { height: 26px; padding: 0 7px; border: 1px solid var(--bordo); border-radius: 5px; background: #141311; color: var(--testo); font: 400 11.5px var(--ui); }
  .opzioni-strumento input[type="number"] { width: 70px; }
  .opzioni-strumento input[type="range"] { width: 120px; accent-color: #d4a373; }
  .opzioni-strumento .tasto { height: 26px; font-size: 11px; }
  .opzioni-strumento .scelte-forma { display: inline-flex; gap: 3px; }
  .opzioni-strumento .scelte-forma button { width: 30px; height: 26px; border: 1px solid var(--bordo); border-radius: 5px; background: #141311; color: var(--tenue); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .opzioni-strumento .scelte-forma button[aria-pressed="true"] { border-color: var(--oro); color: var(--oro-chiaro); background: rgba(212,163,115,.12); }
  .opzioni-strumento .scelte-forma svg { width: 15px; height: 15px; }
  .opzioni-strumento .suggerimento { color: var(--tenue); }
  .opzioni-strumento .suggerimento::before { content: '// '; color: var(--oro); }

  /* ---- strumenti a sinistra ---- */
  .strumenti { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; border-right: 1px solid var(--bordo); background: #0e0d0c; }
  .strumento { position: relative; width: 38px; height: 38px; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--tenue); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .strumento svg { width: 18px; height: 18px; }
  .strumento:hover { color: var(--testo); background: var(--pannello-2); }
  .strumento[aria-pressed="true"] { color: #121110; background: var(--oro); }
  .strumento::after { content: attr(data-nome); position: absolute; left: 48px; top: 50%; transform: translateY(-50%); padding: 5px 8px; border: 1px solid var(--oro-scuro);
    border-radius: 4px; background: #0a0908; color: var(--testo); font-size: 11px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 60; }
  .strumento:hover::after { opacity: 1; }
  .strumenti .sep { width: 24px; height: 1px; margin: 6px 0; }

  /* ---- area di lavoro con i righelli ---- */
  .lavoro { position: relative; overflow: hidden; background: var(--area); }
  .righello { position: absolute; background: var(--righello); z-index: 8; }
  .righello canvas { display: block; }
  .righello.alto { left: 22px; right: 0; top: 0; height: 22px; border-bottom: 1px solid var(--bordo); cursor: s-resize; }
  .righello.sinistro { top: 22px; bottom: 0; left: 0; width: 22px; border-right: 1px solid var(--bordo); cursor: e-resize; }
  .angolo { position: absolute; left: 0; top: 0; width: 22px; height: 22px; background: var(--righello); border-right: 1px solid var(--bordo); border-bottom: 1px solid var(--bordo); z-index: 9;
    color: var(--tenue); font: 400 8.5px var(--mono); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .scrivania { position: absolute; inset: 22px 0 0 22px; overflow: hidden; touch-action: none; }
  .scrivania[data-strumento="mano"] { cursor: grab; }
  .scrivania[data-strumento="zoom"] { cursor: zoom-in; }
  .scrivania[data-strumento="zoom"].indietro { cursor: zoom-out; }
  .scrivania[data-strumento="testo"] { cursor: text; }
  .scrivania[data-strumento="forma"], .scrivania[data-strumento="guida"] { cursor: crosshair; }
  .scrivania[data-strumento="bacchetta"] { cursor: cell; }
  .foglio { position: absolute; background: #fff; color: #000; box-shadow: 0 6px 30px rgba(0,0,0,.55); }
  .taglio { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed #c9c4bb; pointer-events: none; }
  .el { position: absolute; transform-origin: center center; }
  .el-testo { white-space: nowrap; }
  .el img, .el canvas { display: block; width: 100%; height: 100%; pointer-events: none; }
  .el.bloccato { pointer-events: none; }
  .sopra { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .cornice-sel { position: absolute; outline: 1.5px solid var(--selezione); transform-origin: center center; }
  .cornice-sel.leggera { outline-style: dashed; }
  .maniglia { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border: 1.5px solid var(--selezione); background: #fff; pointer-events: auto; }
  .maniglia[data-m="nw"], .maniglia[data-m="se"] { cursor: nwse-resize; } .maniglia[data-m="ne"], .maniglia[data-m="sw"] { cursor: nesw-resize; }
  .maniglia[data-m="n"], .maniglia[data-m="s"] { cursor: ns-resize; } .maniglia[data-m="e"], .maniglia[data-m="w"] { cursor: ew-resize; }
  .maniglia.ruota { border-radius: 50%; cursor: grab; }
  .stelo { position: absolute; left: 50%; top: -22px; height: 22px; border-left: 1.5px solid var(--selezione); }
  .misura { position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%); padding: 2px 7px; border-radius: 3px; background: var(--selezione); color: #fff; font: 400 10px var(--mono); white-space: nowrap; }
  .modulo-tag { position: absolute; right: -2px; top: -20px; padding: 2px 6px; border-radius: 3px; background: var(--oro); color: #121110; font: 600 9px var(--ui); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .modulo-tag.no { background: #3a3631; color: var(--testo); }
  .disegno { position: absolute; border: 1px dashed var(--oro); background: rgba(212,163,115,.08); pointer-events: none; }
  .guida { position: absolute; z-index: 6; }
  .guida.v { top: 0; bottom: 0; width: 0; border-left: 1px solid var(--guida); cursor: col-resize; }
  .guida.o { left: 0; right: 0; height: 0; border-top: 1px solid var(--guida); cursor: row-resize; }
  .guida::before { content: ''; position: absolute; inset: -4px; }
  .guida.attiva { border-color: #ff5ad1; }
  .aggancio { position: absolute; z-index: 6; pointer-events: none; }
  .aggancio.v { top: 0; bottom: 0; border-left: 1px solid #ff5ad1; }
  .aggancio.o { left: 0; right: 0; border-top: 1px solid #ff5ad1; }
  .avviso-vuoto { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--tenue); font-size: 13px; line-height: 1.7; }
  .avviso-vuoto strong { color: var(--oro-chiaro); }

  /* ---- finestre mobili (proprietà, funzione) ---- */
  .finestra { position: absolute; z-index: 20; width: 292px; max-height: calc(100% - 40px); display: flex; flex-direction: column; border: 1px solid var(--bordo); border-radius: 10px;
    background: rgba(31, 29, 27, .97); box-shadow: 0 14px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(212,163,115,.08); }
  .finestra-testa { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--bordo-tenue); cursor: grab; user-select: none; flex: none; }
  .finestra-testa:active { cursor: grabbing; }
  .finestra-testa h2 { flex: 1; font: 600 11px var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--oro-chiaro); }
  .finestra-testa .punto { width: 7px; height: 7px; border-radius: 50%; background: var(--oro); }
  .finestra-testa button { width: 22px; height: 22px; border: 0; border-radius: 4px; background: none; color: var(--tenue); cursor: pointer; }
  .finestra-testa button:hover { background: var(--pannello-2); color: var(--testo); }
  .finestra.ridotta .schede, .finestra.ridotta .corpo { display: none; }
  .schede { display: flex; gap: 2px; padding: 8px 10px 0; flex: none; }
  .schede button { flex: 1; padding: 6px 0; border: 0; border-radius: 6px 6px 0 0; background: none; color: var(--tenue); font-size: 11px; font-weight: 600; letter-spacing: .06em; cursor: pointer; }
  .schede button[aria-selected="true"] { background: var(--pannello-2); color: var(--oro-chiaro); }
  .schede button:disabled { opacity: .3; cursor: default; }
  .corpo { padding: 12px; background: var(--pannello-2); border-radius: 0 0 10px 10px; display: flex; flex-direction: column; gap: 11px; overflow: auto; min-height: 0; }
  .riga { display: grid; gap: 8px; }
  .riga.due { grid-template-columns: 1fr 1fr; }
  .riga.tre { grid-template-columns: 1fr 1fr 1fr; }
  .campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .campo > span { color: var(--tenue); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
  .campo input, .campo select, .campo textarea { height: 30px; padding: 0 9px; border: 1px solid var(--bordo); border-radius: 6px; background: #141311; color: var(--testo); font: 400 12px var(--ui); width: 100%; }
  .campo textarea { height: auto; min-height: 52px; padding: 7px 9px; resize: vertical; line-height: 1.4; }
  .campo input:focus, .campo select:focus, .campo textarea:focus { outline: none; border-color: var(--oro); }
  .con-unita { position: relative; }
  .con-unita input { padding-right: 30px; }
  .con-unita i { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: var(--tenue); font: normal 400 10.5px var(--mono); pointer-events: none; }
  .allinea { display: flex; gap: 4px; }
  .allinea button { flex: 1; height: 30px; border: 1px solid var(--bordo); border-radius: 6px; background: #141311; color: var(--tenue); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .allinea button[aria-pressed="true"] { border-color: var(--oro); color: var(--oro-chiaro); background: rgba(212,163,115,.1); }
  .allinea svg { width: 14px; height: 14px; }
  .campioni { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .campioni button { aspect-ratio: 1; border: 1px solid rgba(255,255,255,.12); border-radius: 4px; cursor: pointer; }
  .campioni button.trasparente { background: repeating-conic-gradient(#8a857c 0% 25%, #c9c4bb 0% 50%) 50% / 8px 8px !important; }
  .hex { display: grid; grid-template-columns: 32px 1fr 30px; gap: 6px; }
  .hex input[type="color"] { width: 32px; height: 30px; padding: 0; border: 1px solid var(--bordo); border-radius: 6px; background: none; cursor: pointer; }
  .hex input[type="text"] { font-family: var(--mono); text-transform: uppercase; }
  .contagocce { border: 1px solid var(--bordo); border-radius: 6px; background: #141311; color: var(--tenue); cursor: pointer; }
  .contagocce:hover { color: var(--oro-chiaro); border-color: var(--oro); }
  .nota { color: var(--tenue); font-size: 10.5px; line-height: 1.5; }
  .gruppo-colore { display: flex; flex-direction: column; gap: 6px; }
  .vuoto-prop { color: var(--tenue); font-size: 11.5px; line-height: 1.6; text-align: center; padding: 18px 6px; }
  .ordine { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .ordine button, .elimina { height: 30px; border: 1px solid var(--bordo); border-radius: 6px; background: #141311; color: var(--tenue); cursor: pointer; font-size: 11px; }
  .ordine button:hover { color: var(--oro-chiaro); border-color: var(--oro); }
  .elimina { border-color: rgba(224,122,95,.5); color: var(--errore); }
  .elimina:hover { background: var(--errore); color: #121110; }

  .modulo-scelto { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--oro); border-radius: 8px; background: rgba(212,163,115,.08); }
  .modulo-scelto.vuoto { border-color: var(--bordo); background: #141311; }
  .modulo-scelto .icona { flex: none; width: 32px; height: 32px; border-radius: 6px; background: var(--oro); color: #121110; display: flex; align-items: center; justify-content: center; font: 700 14px var(--ui); }
  .modulo-scelto.vuoto .icona { background: #3a3631; color: var(--testo); }
  .modulo-scelto strong { display: block; font-size: 12.5px; }
  .modulo-scelto small { color: var(--tenue); font-size: 10.5px; }
  .scelte-liste { display: flex; gap: 6px; }
  .scelte-liste .tasto { flex: 1; }
  .scelte-liste .tasto[aria-pressed="true"] { background: var(--oro); border-color: var(--oro); color: #121110; }
  .opzione { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; }
  .interr { position: relative; width: 34px; height: 19px; border: 0; border-radius: 10px; background: #3a3631; flex: none; cursor: pointer; }
  .interr::after { content: ''; position: absolute; left: 2px; top: 2px; width: 15px; height: 15px; border-radius: 50%; background: #cfc8bc; transition: left .15s; }
  .interr[aria-pressed="true"] { background: #3a9b5a; }
  .interr[aria-pressed="true"]::after { left: 17px; background: #fff; }
  .anteprima-campo { padding: 10px; border: 1px dashed var(--bordo); border-radius: 8px; background: #141311; }
  .anteprima-campo > span { display: block; margin-bottom: 5px; color: var(--oro); font-size: 10px; font-weight: 600; letter-spacing: .04em; }
  .anteprima-campo .finto { display: flex; height: 28px; border: 1px solid #3a3631; border-radius: 4px; overflow: hidden; }
  .anteprima-campo .finto b { padding: 0 9px; display: flex; align-items: center; background: #181715; color: var(--oro); border-right: 1px solid #3a3631; font-weight: 400; }
  .anteprima-campo .finto em { padding: 0 9px; display: flex; align-items: center; font-style: normal; flex: 1; }

  /* ---- livelli a destra ---- */
  .livelli { grid-row: 3; grid-column: 3; display: flex; flex-direction: column; border-left: 1px solid var(--bordo); background: var(--pannello); min-height: 0; }
  .livelli-testa { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 10px; border-bottom: 1px solid var(--bordo-tenue); }
  .livelli-testa h2 { font: 600 11px var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--oro-chiaro); }
  .elenco-livelli { flex: 1; overflow: auto; padding: 6px 8px 12px; }
  .gruppo-livelli { margin-top: 8px; }
  .gruppo-livelli > button { width: 100%; padding: 4px 6px; border: 0; background: none; color: var(--tenue); font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; text-align: left; cursor: pointer; }
  .livello { display: grid; grid-template-columns: 18px 18px 22px 1fr auto; align-items: center; gap: 5px; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
  .livello:hover { background: var(--pannello-2); }
  .livello.sel { background: rgba(58,155,90,.16); box-shadow: inset 2px 0 0 var(--selezione); }
  .livello.spento { opacity: .45; }
  .livello .occhio, .livello .lucchetto { border: 0; background: none; color: var(--tenue); font-size: 11px; cursor: pointer; padding: 0; }
  .livello .lucchetto.chiuso { color: var(--oro); }
  .livello .tipo { width: 20px; height: 20px; border-radius: 4px; background: #141311; border: 1px solid var(--bordo); color: var(--tenue); display: flex; align-items: center; justify-content: center; font: 600 10px var(--mono); }
  .livello .nome { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .livello .mod { padding: 1px 6px; border-radius: 10px; background: rgba(212,163,115,.14); color: var(--oro); font-size: 9.5px; font-weight: 600; white-space: nowrap; }
  .livello .mod.no { background: #2c2a27; color: var(--tenue); }
  .pannello-mini { border-top: 1px solid var(--bordo-tenue); padding: 12px 14px; }
  .pannello-mini h3 { margin-bottom: 8px; font: 600 10.5px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--tenue); }
  .blocchi { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .blocchi div { padding: 7px 8px; border: 1px solid var(--bordo); border-radius: 6px; font-size: 10.5px; color: var(--tenue); }
  .blocchi div b { display: block; color: var(--oro-chiaro); font-size: 10px; letter-spacing: .08em; margin-bottom: 2px; font-weight: 600; }

  /* ---- barra in basso ---- */
  .stato { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding: 0 14px; border-top: 1px solid var(--bordo); background: #0e0d0c; color: var(--tenue); font: 400 11px var(--mono); }
  .stato b { color: var(--testo); font-weight: 400; }
  .stato button { border: 0; background: none; color: var(--tenue); font: inherit; cursor: pointer; }
  .stato button[aria-pressed="true"] { color: var(--guida); }
  .stato .spazio { flex: 1; }
  .stato .messaggio { color: var(--oro); }
  .stato .messaggio.ok { color: #8fbf7a; }

  /* finestra dei font: elenco con l'anteprima del carattere */
  .menu-font { position: absolute; z-index: 40; width: 280px; max-height: 360px; overflow: auto; border: 1px solid var(--oro-scuro); border-radius: 8px; background: #141311; box-shadow: 0 12px 30px rgba(0,0,0,.6); padding: 6px; }
  .menu-font h4 { padding: 8px 8px 4px; color: var(--tenue); font: 600 9.5px var(--ui); letter-spacing: .14em; text-transform: uppercase; }
  .menu-font button { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 5px; background: none; color: var(--testo); cursor: pointer; text-align: left; }
  .menu-font button:hover, .menu-font button.scelto { background: rgba(212,163,115,.12); }
  .menu-font button span { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu-font button small { color: var(--tenue); font: 400 10px var(--ui); flex: none; }
  .scelta-font { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 9px; border: 1px solid var(--bordo); border-radius: 6px; background: #141311; color: var(--testo); cursor: pointer; width: 100%; }
  .scelta-font b { font-weight: 400; font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .scelta-font small { color: var(--tenue); font-size: 10px; flex: none; }
  /* frecce dei campi numerici in stile STORE // CRAFT, come lo sconto dei pannelli: al posto di quelle del browser una
     colonna a destra con ▲ ▼ oro, piena d'oro al passaggio del mouse */
  input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  .con-unita input { padding-right: 50px; }
  .con-unita i { right: 29px; }
  .frecce-num { position: absolute; top: 1px; right: 1px; bottom: 1px; display: flex; flex-direction: column; width: 20px; overflow: hidden;
    border-left: 1px solid var(--bordo); border-radius: 0 5px 5px 0; background: #1a1816; }
  .frecce-num button { flex: 1; display: grid; place-items: center; padding: 0; border: 0; background: none; color: var(--oro); font-size: 7px; line-height: 1; cursor: pointer; }
  .frecce-num button + button { border-top: 1px solid var(--bordo); }
  .frecce-num button:hover { background: var(--oro); color: #121110; }
  .num-guida { position: relative; display: inline-flex; }
  .num-guida input { padding-right: 26px !important; }
  /* barre di scorrimento (menu dei font, finestre, livelli): colonna scura e maniglia oro squadrata, come i menu a cascata */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: #141311; }
  ::-webkit-scrollbar-thumb { background: var(--oro); border: 2px solid #141311; border-radius: 0; }
  ::-webkit-scrollbar-thumb:hover { background: var(--oro-chiaro); }
  ::-webkit-scrollbar-button { display: none; }
  @supports not selector(::-webkit-scrollbar) { * { scrollbar-width: thin; scrollbar-color: var(--oro) #141311; } }
  /* slider (tolleranza della bacchetta e gli altri): linea scura e maniglia tonda oro */
  input[type="range"] { -webkit-appearance: none; appearance: none; height: 18px; background: transparent; cursor: pointer; }
  input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: #3a352e; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px; border-radius: 50%; background: var(--oro); box-shadow: 0 0 0 3px #141311; }
  input[type="range"]:hover::-webkit-slider-thumb { background: var(--oro-chiaro); }
  input[type="range"]::-moz-range-track { height: 3px; border-radius: 2px; background: #3a352e; }
  input[type="range"]::-moz-range-thumb { width: 13px; height: 13px; border: 0; border-radius: 50%; background: var(--oro); }
  input[type="range"]:focus-visible { outline: 1px solid var(--oro-chiaro); outline-offset: 3px; }
</style>
</head>

<script>
(() => {
  'use strict';
  const MM = 96 / 25.4;            // pixel dello schermo per mm a zoom 1
  const PT = 96 / 72;              // pixel per punto tipografico a zoom 1
  const $ = id => document.getElementById(id);
  const el = (tag, classe, testo) => { const n = document.createElement(tag); if (classe) n.className = classe; if (testo != null) n.textContent = testo; return n; };
  const num = (v, d = 1) => Number(v).toLocaleString('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d });
  const NOMI_CARTELLO = { 'cartello-superiore': 'cartello superiore', 'cartello-inferiore': 'cartello inferiore', foglio: 'foglio' };

  // Google Fonts gratuiti anche per uso commerciale (licenza SIL Open Font o Apache), i più usati nella grafica di negozio
  const GOOGLE = ['Playfair Display', 'Cormorant Garamond', 'DM Serif Display', 'Libre Baskerville', 'Bodoni Moda', 'Abril Fatface', 'Cinzel',
    'Montserrat', 'Poppins', 'Inter', 'Roboto', 'Open Sans', 'Lato', 'Raleway', 'Work Sans', 'Josefin Sans', 'Oswald', 'Bebas Neue', 'Anton',
    'Archivo Black', 'Great Vibes', 'Dancing Script', 'Caveat', 'Pacifico', 'Lobster', 'Permanent Marker'];

  // ---- documento ----
  const doc = {
    larghezza: 210, altezza: 297, taglio: 148.5, meta: 148.5, elementi: [], guide: [],
    font: [],               // { nome, etichetta, famiglia, origine: 'progetto' | 'google' | 'importato', file, url, dati }
    nome: 'Layout', file: ''
  };
  const vista = { z: 1, x: 40, y: 30, strumento: 'seleziona', forma: 'rettangolo', sel: null, unita: 'cm', magnetiche: true, guideVisibili: true,
    tolleranza: 32, contiguo: true, nuovaGuida: { asse: 'o', pos: 0 } };
  let REGOLE = null, sorgente = null, prossimoId = 1;
  const nuovoId = () => `n${prossimoId++}`;

  // ---- storia (annulla / ripeti) ----
  const storia = [], futuro = [];
  const fotografia = () => JSON.stringify({ e: doc.elementi, g: doc.guide });
  function ricorda() {
    storia.push(fotografia());
    if (storia.length > 80) storia.shift();
    futuro.length = 0;
    tastiStoria();
  }
  function ripristina(testo) {
    const s = JSON.parse(testo);
    doc.elementi = s.e;
    doc.guide = s.g;
    if (vista.sel && !trova(vista.sel)) vista.sel = null;
    tutto();
  }
  function annulla() { if (!storia.length) return; futuro.push(fotografia()); ripristina(storia.pop()); tastiStoria(); }
  function ripeti() { if (!futuro.length) return; storia.push(fotografia()); ripristina(futuro.pop()); tastiStoria(); }
  function tastiStoria() { $('annulla').disabled = !storia.length; $('ripeti').disabled = !futuro.length; }
  $('annulla').onclick = annulla;
  $('ripeti').onclick = ripeti;

  const trova = id => doc.elementi.find(e => e.id === id);
  const selezionato = () => vista.sel && trova(vista.sel);

  // ---- caricamento: dai dati della conversione di Import layout ----
  async function carica() {
    REGOLE = await (await fetch('modelli/import-regole.json', { cache: 'no-store' })).json();
    (REGOLE.lettura.font.catalogo || []).forEach(f => doc.font.push({ nome: f.nome, etichetta: f.etichetta, famiglia: `PSD ${f.nome}`, origine: 'progetto', file: f.file }));
    GOOGLE.forEach(g => doc.font.push({ nome: `G:${g}`, etichetta: g, famiglia: g, origine: 'google' }));
    // i font del progetto si dichiarano subito (si scaricano solo se usati); i Google Fonts quando servono
    const stile = el('style');
    stile.textContent = doc.font.filter(f => f.origine === 'progetto').map(f => `@font-face { font-family: '${f.famiglia}'; src: url('assets/fonts/${f.file}'); font-display: swap; }`).join('\n');
    document.head.append(stile);

    // i dati: dalla finestra di Import layout che ha aperto l'editor (o, nelle prove, dalla pagina che lo contiene)
    sorgente = (window.opener && !window.opener.closed && window.opener.ImportLayout) || (window.parent !== window && window.parent.ImportLayout) || null;
    const r = sorgente && sorgente.risultato;
    if (!r) {
      $('scrivania').append(Object.assign(el('div', 'avviso-vuoto'), { innerHTML: '<div><strong>Nessun documento aperto</strong><br>apri Layout Studio dalla pagina generata di Import layout<br>(pulsante APRI L\'EDITOR)</div>' }));
      return;
    }
    const mm = r.mm;
    doc.larghezza = mm(r.psd.width);
    doc.altezza = mm(r.psd.height);
    doc.meta = mm(r.meta || r.psd.height / 2);
    doc.taglio = mm(r.taglio || r.psd.height / 2);
    doc.file = sorgente.nomeFile ? sorgente.nomeFile() : '';
    doc.nome = doc.file.replace(/\.psd$/i, '') || 'Layout';
    // font del .psd e font importati prima
    Object.entries(r.fileFont || {}).forEach(([nome, file]) => {
      if (!doc.font.some(f => f.nome === nome) && file) doc.font.push({ nome, etichetta: `${nome} (dal .psd)`, famiglia: `PSD ${nome}`, origine: 'progetto', file });
    });
    Object.entries(r.fontUrl || {}).forEach(([nome, url]) => {
      const f = doc.font.find(x => x.nome === nome);
      if (f) { f.url = url; f.origine = 'importato'; }
    });
    doc.font.filter(f => f.origine === 'importato').forEach(f => caricaFontImportato(f));

    // elementi del .psd: misure in mm dal bordo sinistro e dal bordo alto del foglio
    r.elementi.forEach((e, i) => {
      if (!e.chiave && e.stato === 'manca' && e.tipo !== 'immagine' && e.tipo !== 'testo' && e.tipo !== 'forma') return;
      if (e.chiave === 'background' || e.chiave === 'tratteggio-ritaglio') return;
      const n = e.cartello === 'cartello-superiore' ? 1 : e.cartello === 'cartello-inferiore' ? 2 : 0;
      const t = (n && e.chiave && r.ritocchi && r.ritocchi[n] && r.ritocchi[n][e.chiave]) || { x: 0, y: 0 };
      const dy = n === 2 ? doc.meta : 0;
      const base = { id: `p${i}`, origine: i, nome: e.nome, cartello: e.cartello, chiave: e.chiave || null, tipo: e.tipo,
        x: e.mm.x + t.x, y: e.mm.y + dy + t.y, w: e.mm.w, h: e.mm.h, rotazione: 0, opacita: 1, visibile: !e.rimosso, bloccato: false, gemello: false, liste: e.liste || null };   // stile solo di questo cartello (19 ottobre 2026)
      if (e.tipo === 'testo') Object.assign(base, { testo: e.testo, font: e.font, pt: e.pt || 12, spaziatura: e.spaziatura || 0, interlinea: e.interlinea || null,
        allineamento: e.allineamento || 'sinistra', colore: e.colore || '#000000', grassetto: !!e.grassettoFinto, corsivo: !!e.corsivoFinto, maiuscolo: !!e.maiuscolo });
      else if (e.tipo === 'forma') {
        if (e.chiave === 'sbarra' || e.rotazione) {
          // forma ruotata (la barra): lunghezza e spessore dal riquadro ruotato, al centro del riquadro
          const a = (e.rotazione || 0) * Math.PI / 180, c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a)), den = c * c - s * s;
          const L = e.lungo || (Math.abs(den) > .05 ? (e.mm.w * c - e.mm.h * s) / den : Math.max(e.mm.w, e.mm.h));
          const T = e.spesso || Math.max(.2, Math.abs(den) > .05 ? (e.mm.h * c - e.mm.w * s) / den : Math.min(e.mm.w, e.mm.h));
          const cx = base.x + e.mm.w / 2, cy = base.y + e.mm.h / 2;
          Object.assign(base, { forma: 'linea', x: cx - L / 2, y: cy - T / 2, w: L, h: T, rotazione: e.rotazione || 0, traccia: e.colore || '#000000', riempimento: e.colore || '#000000' });
        } else Object.assign(base, { forma: 'rettangolo', riempimento: e.colore || '#000000', traccia: '#000000', spessoreTraccia: 0, raggio: 0 });
      } else if (e.tipo === 'immagine') {
        base.src = e.livello && e.livello.canvas ? e.livello.canvas.toDataURL('image/png') : '';
        base.srcOriginale = base.src;
      }
      doc.elementi.push(base);
    });
    // elementi aggiunti in una sessione di prima (senza modulo)
    (r.extra || []).forEach(x => doc.elementi.push({ ...x, id: x.id || nuovoId(), visibile: !x.rimosso }));
    doc.elementi.forEach(e => { const m = String(e.id).match(/^n(\d+)$/); if (m) prossimoId = Math.max(prossimoId, +m[1] + 1); });
    $('nomeDoc').textContent = doc.nome;
    $('infoDoc').textContent = `${doc.file || 'documento'} · A4 · 2 cartelli · modulo import`;
    document.title = `${doc.nome} · Layout Studio`;
    adatta();
    tutto();
  }

  // ---- disegno del foglio ----
  const foglio = $('foglio'), scrivania = $('scrivania'), sopra = $('sopra');
  const font = nome => doc.font.find(f => f.nome === nome);
  const famiglia = nome => { const f = font(nome); return f ? f.famiglia : `PSD ${nome}`; };
  const googleCaricati = new Set();
  function usaGoogle(nome) {
    const f = font(nome);
    if (!f || f.origine !== 'google' || googleCaricati.has(f.famiglia)) return;
    googleCaricati.add(f.famiglia);
    const l = el('link');
    l.rel = 'stylesheet';
    l.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(f.famiglia).replace(/%20/g, '+')}:ital,wght@0,400;0,700;1,400&display=swap`;
    l.onload = () => setTimeout(tutto, 300);
    document.head.append(l);
  }
  function caricaFontImportato(f) {
    if (!f.url) return;
    const ff = new FontFace(f.famiglia, `url(${f.url})`);
    ff.load().then(x => { document.fonts.add(x); disegna(); }).catch(() => messaggio(`font ${f.etichetta} non leggibile`));
  }

  function nodoElemento(e) {
    const s = MM * vista.z;
    const d = el('div', 'el');
    d.dataset.id = e.id;
    if (!e.visibile) d.style.display = 'none';
    if (e.bloccato) d.classList.add('bloccato');
    d.style.opacity = e.opacita == null ? 1 : e.opacita;
    const ruota = e.rotazione ? ` rotate(${e.rotazione}deg)` : '';
    if (e.tipo === 'testo') {

  // ridimensionare con le maniglie: in proporzione, con Maiuscolo stirando; l'angolo opposto resta fermo
  function scala(a, p, libero) {
    const e = a.e, s0 = a.start, m = a.m;
    const sx = m.includes('e') ? 1 : m.includes('w') ? -1 : 0, sy = m.includes('s') ? 1 : m.includes('n') ? -1 : 0;
    const ang = (s0.rotazione || 0) * Math.PI / 180, c = Math.cos(ang), s = Math.sin(ang);
    const dx = p.x - a.p0.x, dy = p.y - a.p0.y;
    const lx = dx * c + dy * s, ly = -dx * s + dy * c;   // spostamento negli assi dell'elemento
    let nw = s0.w + sx * lx, nh = s0.h + sy * ly;
    if (!sx) nw = s0.w;
    if (!sy) nh = s0.h;
    if (!libero || e.tipo === 'testo') {
      const k = sx && sy ? Math.max(nw / s0.w, nh / s0.h) : sx ? nw / s0.w : nh / s0.h;
      nw = s0.w * k; nh = s0.h * k;
    }
    nw = Math.max(nw, .5); nh = Math.max(nh, e.forma === 'linea' ? .1 : .5);
    // il punto opposto alla maniglia resta fermo
    const o = { x: -sx * s0.w / 2, y: -sy * s0.h / 2 }, o2 = { x: -sx * nw / 2, y: -sy * nh / 2 };
    const ddx = o.x - o2.x, ddy = o.y - o2.y;
    const cx = s0.x + s0.w / 2 + ddx * c - ddy * s, cy = s0.y + s0.h / 2 + ddx * s + ddy * c;
    if (e.tipo === 'testo') e.pt = Math.max(2, Math.round(s0.pt * nw / s0.w * 10) / 10);
    Object.assign(e, { w: nw, h: nh, x: cx - nw / 2, y: cy - nh / 2 });
  }

  // guide magnetiche: bordi e centro dell'elemento su guide, bordi e centro del foglio, linea di taglio
  function aggancia(e, x, y) {
    if (!vista.magnetiche) return { x, y, linee: [] };
    const soglia = 5 / (MM * vista.z), linee = [];
    const vert = [0, doc.larghezza / 2, doc.larghezza, ...doc.guide.filter(g => g.asse === 'v').map(g => g.pos)];
    const oriz = [0, doc.meta, doc.altezza, doc.meta / 2, doc.meta + (doc.altezza - doc.meta) / 2, ...doc.guide.filter(g => g.asse === 'o').map(g => g.pos)];
    const prova = (val, dim, bersagli) => {
      let meglio = null;
      [0, dim / 2, dim].forEach(scarto => bersagli.forEach(b => {
        const d = b - (val + scarto);
        if (Math.abs(d) < soglia && (!meglio || Math.abs(d) < Math.abs(meglio.d))) meglio = { d, b };
      }));
      return meglio;
    };
    const ax = prova(x, e.w, vert), ay = prova(y, e.h, oriz);
    if (ax) { x += ax.d; linee.push({ asse: 'v', pos: ax.b }); }
    if (ay) { y += ay.d; linee.push({ asse: 'o', pos: ay.b }); }
    return { x, y, linee };
  }

  // ---- bacchetta magica: i pixel del colore cliccato (vicini, o tutti) diventano trasparenti ----
  function bacchetta(e, p) {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      // punto cliccato nelle coordinate dell'immagine (tenendo conto della rotazione)
      const cx = e.x + e.w / 2, cy = e.y + e.h / 2, a = -(e.rotazione || 0) * Math.PI / 180;
      const lx = (p.x - cx) * Math.cos(a) - (p.y - cy) * Math.sin(a) + e.w / 2, ly = (p.x - cx) * Math.sin(a) + (p.y - cy) * Math.cos(a) + e.h / 2;
      const px = Math.floor(lx / e.w * c.width), py = Math.floor(ly / e.h * c.height);
      if (px < 0 || py < 0 || px >= c.width || py >= c.height) return;
      const dati = ctx.getImageData(0, 0, c.width, c.height), d = dati.data, W = c.width, H = c.height;
      const i0 = (py * W + px) * 4, r0 = d[i0], g0 = d[i0 + 1], b0 = d[i0 + 2], a0 = d[i0 + 3], t = vista.tolleranza;
      if (a0 === 0) { messaggio('lì è già trasparente'); return; }
      const simile = i => d[i + 3] > 0 && Math.max(Math.abs(d[i] - r0), Math.abs(d[i + 1] - g0), Math.abs(d[i + 2] - b0)) <= t;
      let tolti = 0;
      if (vista.contiguo) {
        const visti = new Uint8Array(W * H), pila = [py * W + px];
        visti[py * W + px] = 1;
        while (pila.length) {
          const q = pila.pop(), i = q * 4;
          if (!simile(i)) continue;
          d[i + 3] = 0; tolti++;
          const x = q % W, y = (q - x) / W;
          if (x > 0 && !visti[q - 1]) { visti[q - 1] = 1; pila.push(q - 1); }
          if (x < W - 1 && !visti[q + 1]) { visti[q + 1] = 1; pila.push(q + 1); }
          if (y > 0 && !visti[q - W]) { visti[q - W] = 1; pila.push(q - W); }
          if (y < H - 1 && !visti[q + W]) { visti[q + W] = 1; pila.push(q + W); }
        }
      } else for (let i = 0; i < d.length; i += 4) if (simile(i)) { d[i + 3] = 0; tolti++; }
      ctx.putImageData(dati, 0, 0);
      ricorda();
      if (!e.srcOriginale) e.srcOriginale = e.src;
      e.src = c.toDataURL('image/png');
      messaggio(`scontornati ${tolti.toLocaleString('it-IT')} pixel`, true);
      tutto();
    };
    img.src = e.src;
  }

          if (e.forma === 'rettangolo' || e.forma === 'quadrato') riga.append(campoNumero('angoli arrotondati', e.raggio || 0, 'mm', v => cambiaStile(e, 'raggio', v || 0), .5));
          corpo.append(riga);
          const forma = el('label', 'campo');
          forma.append(el('span', '', 'forma'));
          const sel = el('select');
          ['rettangolo', 'quadrato', 'cerchio', 'triangolo'].forEach(f => { const o = el('option', '', f); o.value = f; sel.append(o); });
          sel.value = e.forma;
          sel.onchange = () => { ricorda(); e.forma = sel.value; if (sel.value === 'quadrato' || sel.value === 'cerchio') { const m = Math.max(e.w, e.h); e.w = m; e.h = m; } tutto(); };
          forma.append(sel);
          corpo.append(forma);
        }
      }
      if (e.tipo === 'immagine') {
        corpo.append(el('p', 'nota', 'per scontornare: strumento bacchetta magica (W) e clic sul colore da togliere'));
        const b = el('button', 'tasto tasto-oro', 'bacchetta magica');
        b.onclick = () => scegliStrumento('bacchetta');
        corpo.append(b);
      }
      corpo.append(campoNumero('opacità', Math.round((e.opacita == null ? 1 : e.opacita) * 100), '%', v => { e.opacita = Math.min(1, Math.max(0, (v == null ? 100 : v) / 100)); disegna(); }, 5));
    }
    if (schedaAperta === 'posizione') {
      const fattore = vista.unita === 'cm' ? 10 : 1, u = vista.unita;
      const r1 = el('div', 'riga due'), r2 = el('div', 'riga due');
      r1.append(campoNumero('x', e.x / fattore, u, v => { if (v != null) { e.x = v * fattore; disegna(); } }),
        campoNumero('y', e.y / fattore, u, v => { if (v != null) { e.y = v * fattore; disegna(); } }));
      r2.append(campoNumero('larghezza', e.w / fattore, u, v => { if (v) { const k = v * fattore / e.w; if (e.tipo === 'testo') e.pt *= k; e.w = v * fattore; if (e.tipo === 'testo') e.h *= k; disegna(); } }),
        campoNumero('altezza', e.h / fattore, u, v => { if (v) { e.h = v * fattore; disegna(); } }));
      corpo.append(r1, r2, campoNumero('rotazione', e.rotazione || 0, '°', v => { e.rotazione = v || 0; disegna(); }, 1));
      const c = el('label', 'campo');
      c.append(el('span', '', 'cartello'));
      const sel = el('select');
      Object.entries(NOMI_CARTELLO).forEach(([v, t]) => { const o = el('option', '', t); o.value = v; sel.append(o); });
      sel.value = e.cartello;
      sel.onchange = () => { ricorda(); e.cartello = sel.value; tutto(); };
      c.append(sel);
      corpo.append(c);
      const ord = el('div', 'campo');
      ord.append(el('span', '', 'ordine dei livelli'));
      const tasti = el('div', 'ordine');
      [['in cima', 'cima'], ['su', 'su'], ['giù', 'giu'], ['in fondo', 'fondo']].forEach(([t, v]) => { const b = el('button', '', t); b.onclick = () => ordina(e, v); tasti.append(b); });
      ord.append(tasti);
      const via = el('button', 'elimina', 'elimina elemento');
      via.onclick = () => elimina(e);
      corpo.append(ord, via);
    }
  }
  function ordina(e, verso) {
    ricorda();
    const i = doc.elementi.indexOf(e);
    doc.elementi.splice(i, 1);
    const j = verso === 'cima' ? doc.elementi.length : verso === 'fondo' ? 0 : verso === 'su' ? Math.min(doc.elementi.length, i + 1) : Math.max(0, i - 1);
    doc.elementi.splice(j, 0, e);
    tutto();
  }
  function elimina(e) {
    ricorda();
    if (e.origine != null) { e.visibile = false; e.eliminato = true; messaggio(`${e.nome} tolto dalla pagina (annulla per riaverlo)`); }
    else doc.elementi.splice(doc.elementi.indexOf(e), 1);
    vista.sel = null;
    tutto();
  }

  // ---- funzione: il modulo comune dell'elemento ----
  const ICONE_MODULO = { 'prezzo-finale': '€', 'prezzo-originario': '€', percentuale: '%', descrizione: 'T', 'claim-sx': 'C', 'claim-dx': 'C', 'logo-brand': 'B', 'logo-brand-2': 'B', 'riquadro-brand': '▭', sbarra: '/', footer: '▣' };
  const ADATTI = { testo: ['descrizione', 'claim-sx', 'claim-dx', 'prezzo-originario', 'percentuale', 'prezzo-finale'], forma: ['riquadro-brand', 'sbarra'], immagine: ['logo-brand', 'logo-brand-2', 'footer'] };
  // le liste dei testi pronti (testi-pronti.js) e il menu che ne nasce: titolo e voce di partenza come nelle pagine
  const LISTE = ['Promozioni', 'Articoli'];
  const listeDi = e => (e.liste && e.liste.length ? e.liste : LISTE);
  const menuListe = liste => liste.length > 1 ? { titolo: 'TESTI PRONTI', partenza: '-- Seleziona Testo Pronto --' }
    : liste[0] === 'Articoli' ? { titolo: 'Articoli', partenza: '-- Seleziona un articolo --' } : { titolo: 'Promozioni', partenza: '-- Seleziona Promozione --' };
  // i moduli per un testo, nell'ordine che il suo contenuto suggerisce: con il % prima lo Sconto, con una cifra e un
  // segno di valuta prima Prezzo Originario e Prezzo Finale (il prezzo outlet), altrimenti prima i testi
  function ordinePerTesto(testo) {
    const t = String(testo || '');
    const cifra = /\d/.test(t), valuta = /[€$£¥]|\b(eur|euro|usd|chf|gbp)\b/i.test(t);
    const primi = /%/.test(t) ? ['percentuale', 'prezzo-originario', 'prezzo-finale']
      : cifra && valuta ? ['prezzo-originario', 'prezzo-finale', 'percentuale']
      : ['descrizione', 'claim-sx', 'claim-dx'];
    return [...primi, ...ADATTI.testo.filter(k => !primi.includes(k))];
  }
  function funzione() {
    const corpo = $('corpoFunzione');
    corpo.replaceChildren();
    const e = selezionato();
    if (!e) { corpo.append(el('p', 'vuoto-prop', 'seleziona un elemento per assegnargli un modulo comune: un campo del pannello del negozio')); return; }
    const m = e.chiave && REGOLE.livelli.elenco[e.chiave];
    const scelto = el('div', `modulo-scelto${m ? '' : ' vuoto'}`);
    const testi = el('div');
    testi.append(el('strong', '', m ? m.breve : 'nessuna funzione'), el('small', '', m ? `${m.file}${m.blocco ? ` · blocco ${m.blocco}` : ' · grafica della pagina'}` : 'grafica fissa: si stampa com\'è, senza campo nel pannello'));
    scelto.append(el('span', 'icona', m ? (ICONE_MODULO[e.chiave] || '◆') : '—'), testi);
    corpo.append(scelto);
    const c = el('label', 'campo');
    c.append(el('span', '', 'modulo comune'));
    const sel = el('select');
    const nessuno = el('option', '', 'grafica fissa · nessun campo');
    nessuno.value = '';
    sel.append(nessuno);
    // i moduli adatti al tipo di elemento; quelli già usati da un altro elemento dello stesso cartello sono spenti
    const usati = new Set(doc.elementi.filter(o => o !== e && o.visibile && o.cartello === e.cartello && o.chiave).map(o => o.chiave));
    const adatti = e.tipo === 'testo' ? ordinePerTesto(e.testo) : (ADATTI[e.tipo] || []);
    // consigliato: il modulo che ha già, se è tra quelli che il testo suggerisce, altrimenti il primo libero
    const consigliato = e.tipo === 'testo' && (adatti.slice(0, 3).includes(e.chiave) ? e.chiave : adatti.find(k => !usati.has(k) && REGOLE.livelli.elenco[k]));
    adatti.forEach(k => {
      const mod = REGOLE.livelli.elenco[k];
      if (!mod) return;
      const o = el('option', '', `${mod.breve}${usati.has(k) ? ' · già nel cartello' : k === consigliato ? ' · consigliato' : ''}`);
      o.value = k;
      o.disabled = usati.has(k);
      sel.append(o);
    });
    const nuovo = el('option', '', '+ chiedi un modulo nuovo…');
    nuovo.value = '__nuovo';
    sel.append(nuovo);
    sel.value = e.richiesta != null ? '__nuovo' : (e.chiave || '');
    sel.onchange = () => {
      ricorda();
      if (sel.value === '__nuovo') { e.chiave = null; e.richiesta = e.richiesta || ''; }
      else { e.chiave = sel.value || null; delete e.richiesta; if (e.chiave) e.nome = e.chiave; }
      tutto();
    };
    c.append(sel);
    corpo.append(c);
    if (e.richiesta != null) {
      const r = el('label', 'campo');
      r.append(el('span', '', 'cosa deve fare il modulo nuovo'));
      const area = el('textarea');
      area.value = e.richiesta;
      area.placeholder = 'es. una data di fine promozione che si sceglie dal calendario';
      area.oninput = () => { e.richiesta = area.value; };
      r.append(area);
      corpo.append(r, el('p', 'nota', 'la richiesta resta con l\'elemento: il modulo comune nuovo si costruisce a codice; intanto l\'elemento è grafica fissa'));
    }
    // TESTI PRONTI: quali liste ha il menu sopra il Testo Libero, Promozioni, Articoli o tutte e due (almeno una);
    // il menu è uno solo nel pannello, quindi la scelta vale per la descrizione di tutti e due i cartelli
    if (e.chiave === 'descrizione') {
      const liste = listeDi(e);
      const r = el('div', 'campo');
      r.append(el('span', '', 'testi pronti nel menu'));
      const scelte = el('div', 'scelte-liste');
      LISTE.forEach(nome => {
        const b = el('button', 'tasto', nome);
        b.setAttribute('aria-pressed', String(liste.includes(nome)));
        b.onclick = () => {
          const nuove = liste.includes(nome) ? liste.filter(x => x !== nome) : LISTE.filter(x => x === nome || liste.includes(x));
          if (!nuove.length) { messaggio('serve almeno una lista: Promozioni o Articoli'); return; }
          ricorda();
          doc.elementi.forEach(o => { if (o.chiave === 'descrizione') o.liste = nuove; });
          tutto();
        };
        scelte.append(b);
      });
      r.append(scelte);
      corpo.append(r);
    }
    if (e.chiave) {
      const op = el('div', 'opzione');
      op.append(document.createTextNode('stile uguale nei due cartelli'));
      const i = el('button', 'interr');
      i.setAttribute('aria-pressed', String(!!e.gemello));
      i.onclick = () => { ricorda(); e.gemello = !e.gemello; doc.elementi.forEach(o => { if (o.chiave === e.chiave && o.tipo === e.tipo) o.gemello = e.gemello; }); tutto(); };
      op.append(i);
      corpo.append(op);
      // il campo come lo vedrà il negozio nel pannello
      const ant = el('div', 'anteprima-campo');
      ant.append(el('span', '', `${e.chiave === 'descrizione' ? `${menuListe(listeDi(e)).titolo} · Testo Libero` : m.breve} · nel pannello`));
      const finto = el('div', 'finto');
      if (/prezzo/.test(e.chiave)) finto.append(el('b', '', '€'), el('em', '', (e.testo || '').replace(/[^\d,.]/g, '') || '0,00'));
      else if (e.chiave === 'percentuale') finto.append(el('em', '', (e.testo || '').replace(/\D/g, '') || '50'), el('b', '', '%'));
      else if (/logo/.test(e.chiave)) finto.append(el('em', '', '-- Seleziona Brand --'));
      else if (e.chiave === 'descrizione') finto.append(el('em', '', menuListe(listeDi(e)).partenza));
      else if (e.tipo === 'testo') finto.append(el('em', '', (e.testo || '').replace(/\n/g, ' ')));
      else finto.append(el('em', '', 'nessun campo: grafica della pagina'));
      ant.append(finto);
      corpo.append(ant);
    }
  }

  // ---- livelli ----
  const chiusi = new Set();
  function livelli() {
    const box = $('elencoLivelli');
    box.replaceChildren();
    $('contoLivelli').textContent = `${doc.elementi.filter(e => !e.eliminato).length} elementi`;
    Object.entries(NOMI_CARTELLO).forEach(([c, titolo]) => {
      const suoi = doc.elementi.filter(e => e.cartello === c && !e.eliminato).reverse();   // in cima il livello più in alto
      if (!suoi.length) return;
      const g = el('div', 'gruppo-livelli');
      const t = el('button', '', `${chiusi.has(c) ? '▸' : '▾'} ${titolo} · ${suoi.length}`);
      t.onclick = () => { chiusi.has(c) ? chiusi.delete(c) : chiusi.add(c); livelli(); };
      g.append(t);
      if (!chiusi.has(c)) suoi.forEach(e => {
        const r = el('div', `livello${e.id === vista.sel ? ' sel' : ''}${e.visibile ? '' : ' spento'}`);
        const occhio = el('button', 'occhio', e.visibile ? '◉' : '○');
        occhio.title = e.visibile ? 'nascondi' : 'mostra';
        occhio.onclick = ev => { ev.stopPropagation(); ricorda(); e.visibile = !e.visibile; tutto(); };
        const lucchetto = el('button', `lucchetto${e.bloccato ? ' chiuso' : ''}`, e.bloccato ? '🔒︎' : '·');
        lucchetto.title = e.bloccato ? 'sblocca' : 'blocca';
        lucchetto.onclick = ev => { ev.stopPropagation(); e.bloccato = !e.bloccato; tutto(); };
        const tipo = el('span', 'tipo', e.tipo === 'testo' ? 'T' : e.tipo === 'immagine' ? '▣' : e.forma === 'linea' ? '/' : e.forma === 'cerchio' ? '○' : e.forma === 'triangolo' ? '△' : '▭');
        const m = e.chiave && REGOLE.livelli.elenco[e.chiave];
        r.append(occhio, lucchetto, tipo, el('span', 'nome', e.nome), el('span', `mod${m ? '' : ' no'}`, m ? m.breve.split(' · ')[0] : (e.richiesta != null ? 'modulo nuovo' : 'fissa')));
        r.onclick = () => { vista.sel = e.id; tutto(); };
        g.append(r);
      });
      box.append(g);
    });
    // il pannello della pagina: i quattro blocchi con i moduli usati
    const chiavi = new Set(doc.elementi.filter(e => e.visibile && e.chiave).map(e => e.chiave));
    const nome = k => (REGOLE.livelli.elenco[k] || {}).breve;
    const blocco = n => [...chiavi].filter(k => (REGOLE.livelli.elenco[k] || {}).blocco === n).map(nome).join(' · ');
    const doppia = (chiavi.has('prezzo-originario') || chiavi.has('percentuale')) && chiavi.has('descrizione');
    $('blocchiPannello').replaceChildren(...[
      ['1 · selettori', ['cartello sup / inf', doppia ? 'doppia cifra / descrizione' : '', blocco(1)].filter(Boolean).join(' · ')],
      ['2 · brand e claim', blocco(2) || 'vuoto'], ['3 · campi', blocco(3) || 'vuoto'], ['4 · stampa', 'copia · 2 / 1 cartelli · stampa']
    ].map(([t, v]) => { const d = el('div'); d.append(el('b', '', t), document.createTextNode(v)); return d; }));
  }

  function tutto() { disegna(); proprieta(); funzione(); livelli(); }

  // ---- i due cartelli uguali: il cartello di arrivo prende posizioni (spostate di mezzo foglio), misure, stile, testi e
  // grafiche di quello di partenza. Gli elementi con lo stesso modulo si aggiornano; quelli che il cartello di arrivo ha
  // in più si nascondono; le grafiche e i testi aggiunti (senza modulo) si copiano. Si annulla con Ctrl+Z ----
  function rendiUguali(da, a) {
    if (!doc) return;
    ricorda();
    const sposta = da === 'cartello-superiore' ? doc.meta : -doc.meta;
    const copia = e => JSON.parse(JSON.stringify(e));
    const partenza = doc.elementi.filter(e => e.cartello === da);
    const arrivo = doc.elementi.filter(e => e.cartello === a);
    const CAMPI_FISSI = ['id', 'origine', 'cartello', 'nome'];
    partenza.forEach(e => {
      const gemello = e.chiave && arrivo.find(o => o.chiave === e.chiave && o.tipo === e.tipo);
      if (gemello) {
        Object.entries(copia(e)).forEach(([campo, valore]) => { if (!CAMPI_FISSI.includes(campo)) gemello[campo] = valore; });
        gemello.y = e.y + sposta;
      } else {
        doc.elementi.push({ ...copia(e), id: nuovoId(), origine: null, cartello: a, y: e.y + sposta, nome: `${e.nome}` });
      }
    });
    // quello che c'era solo nel cartello di arrivo: nascosto (i livelli del .psd) o tolto (gli aggiunti)
    arrivo.forEach(o => {
      if (partenza.some(e => e.chiave && e.chiave === o.chiave && e.tipo === o.tipo)) return;
      if (o.origine != null) o.visibile = false;
      else doc.elementi.splice(doc.elementi.indexOf(o), 1);
    });
    vista.sel = null;
    tutto();
    messaggio(`${a === 'cartello-inferiore' ? 'cartello inferiore' : 'cartello superiore'} uguale al ${da === 'cartello-superiore' ? 'superiore' : 'inferiore'} · Ctrl+Z annulla`, true);
  }
  $('copiaGiu').addEventListener('click', () => rendiUguali('cartello-superiore', 'cartello-inferiore'));
  $('copiaSu').addEventListener('click', () => rendiUguali('cartello-inferiore', 'cartello-superiore'));

  // ---- finestre mobili ----
  document.querySelectorAll('.finestra').forEach(f => {
    const testa = f.querySelector('.finestra-testa');
    testa.addEventListener('pointerdown', ev => {
      if (ev.target.closest('button')) return;
      const r = f.getBoundingClientRect(), p = f.offsetParent.getBoundingClientRect();
      const dx = ev.clientX - r.left, dy = ev.clientY - r.top;
      testa.setPointerCapture(ev.pointerId);
      const muovi = e => {
        f.style.right = 'auto'; f.style.bottom = 'auto';
        f.style.left = `${Math.min(Math.max(0, e.clientX - p.left - dx), p.width - 60)}px`;
        f.style.top = `${Math.min(Math.max(0, e.clientY - p.top - dy), p.height - 40)}px`;
      };
      testa.addEventListener('pointermove', muovi);
      testa.addEventListener('pointerup', () => testa.removeEventListener('pointermove', muovi), { once: true });
    });
    f.querySelector('.riduci').addEventListener('click', () => f.classList.toggle('ridotta'));
  });

  // ---- tastiera ----
  const SCORCIATOIE = { v: 'seleziona', t: 'trasforma', h: 'mano', z: 'zoom', x: 'testo', u: 'forma', i: 'immagine', g: 'guida', w: 'bacchetta' };
  document.addEventListener('keydown', ev => {
    const scrive = /input|textarea|select/i.test(ev.target.tagName);
    if ((ev.ctrlKey || ev.metaKey) && !scrive) {
      const k = ev.key.toLowerCase();
      if (k === 'z' && !ev.shiftKey) { ev.preventDefault(); annulla(); return; }
      if (k === 'y' || (k === 'z' && ev.shiftKey)) { ev.preventDefault(); ripeti(); return; }
      if (k === 's') { ev.preventDefault(); applica(); return; }
      if (k === '0') { ev.preventDefault(); adatta(); return; }
      if (k === '+' || k === '=') { ev.preventDefault(); zoomA(vista.z * 1.25); return; }
      if (k === '-') { ev.preventDefault(); zoomA(vista.z / 1.25); return; }
      if (k === ';') { ev.preventDefault(); vista.guideVisibili = !vista.guideVisibili; $('mostraGuide').setAttribute('aria-pressed', String(vista.guideVisibili)); disegnaSopra(); return; }
      if (k === 'd') { ev.preventDefault(); vista.sel = null; tutto(); return; }
      if (k === 'j') { ev.preventDefault(); duplica(); return; }
    }
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); applica(); return; }
    if (scrive) return;
    if (ev.key === ' ' && !spazio) { spazio = true; scrivania.style.cursor = 'grab'; ev.preventDefault(); return; }
    if (ev.altKey && vista.strumento === 'zoom') scrivania.classList.add('indietro');
    const e = selezionato();
    const frecce = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[ev.key];
    if (frecce && e && !e.bloccato) {
      ev.preventDefault();
      ricordaUnaVolta();
      const passo = ev.shiftKey ? .1 : .5;
      e.x += frecce[0] * passo; e.y += frecce[1] * passo;
      disegna();
      proprieta();
      return;
    }
    if ((ev.key === 'Delete' || ev.key === 'Backspace') && e) { ev.preventDefault(); elimina(e); return; }
    if (ev.key === 'Escape') { vista.sel = null; document.querySelectorAll('.menu-font').forEach(m => m.remove()); tutto(); return; }
    if (!ev.ctrlKey && !ev.metaKey && !ev.altKey && SCORCIATOIE[ev.key.toLowerCase()]) scegliStrumento(SCORCIATOIE[ev.key.toLowerCase()]);
  });
  document.addEventListener('keyup', ev => {
    if (ev.key === ' ') { spazio = false; scrivania.style.cursor = ''; }
    if (ev.key === 'Alt') scrivania.classList.remove('indietro');
  });
  function duplica() {
    const e = selezionato();
    if (!e) return;
    ricorda();
    const copia = { ...JSON.parse(JSON.stringify(e)), id: nuovoId(), origine: null, chiave: null, nome: `${e.nome} copia`, x: e.x + 3, y: e.y + 3, gemello: false };
    doc.elementi.push(copia);
    vista.sel = copia.id;
    tutto();
  }

  $('magnetiche').onclick = () => { vista.magnetiche = !vista.magnetiche; $('magnetiche').setAttribute('aria-pressed', String(vista.magnetiche)); };
  $('mostraGuide').onclick = () => { vista.guideVisibili = !vista.guideVisibili; $('mostraGuide').setAttribute('aria-pressed', String(vista.guideVisibili)); disegnaSopra(); };
  let attesaMessaggio = 0;
  function messaggio(t, ok = false) {
    const m = $('messaggio');
    m.textContent = t;
    m.className = `messaggio${ok ? ' ok' : ''}`;
    clearTimeout(attesaMessaggio);
    attesaMessaggio = setTimeout(() => { m.textContent = ''; }, 4000);
  }

  // ---- applica: le modifiche nella pagina generata di Import layout ----
  function applica() {
    if (!sorgente || (window.opener && window.opener.closed)) { messaggio('import layout non è più aperto: le modifiche non si possono portare'); return false; }
    const fontNuovi = doc.font.filter(f => f.origine === 'importato' && f.dati).map(f => ({ nome: f.nome, file: f.file, dati: f.dati, famiglia: f.famiglia }));
    sorgente.applicaEditor({ elementi: JSON.parse(JSON.stringify(doc.elementi)), fontNuovi, fontGoogle: doc.font.filter(f => f.origine === 'google').map(f => f.nome) });
    messaggio('modifiche portate nella pagina generata', true);
    return true;
  }
  $('applica').onclick = applica;
  $('tornaIndietro').onclick = () => {
    if (sorgente && !applica()) return;
    if (window.opener && !window.opener.closed) window.opener.focus();
    window.close();
  };

  // per le prove: l'editor si può pilotare da un'altra pagina dello stesso sito
  window.LayoutStudio = { doc, vista, tutto, scegliStrumento, applica, cambiaStile, rendiUguali, seleziona: id => { vista.sel = id; tutto(); }, carica };

  opzioniStrumento();
  carica().catch(errore => { console.error(errore); messaggio(`errore: ${errore.message || errore}`); });
})();
</script>
</body>
</html>
